Pero a veces, cuando paso por una vidriera o me miro en el espejo del baño, me muevo rápido. Muy rápido. Sólo para asegurarme de que mi reflejo me sigue a tiempo.

Y todavía me pregunto en qué casa estará ahora ese espejo. Y quién se estará mirando en él, sin saber que, del otro lado, alguien lleva más de sesenta años esperando que le devuelvan su lugar.`},{title:"El piso trece",illustration:"ciudad",content:`El edificio donde vive mi tía Graciela tiene doce pisos. Lo sé porque lo conté desde la vereda la primera vez que fui: doce filas de ventanas, una arriba de la otra. Y lo sé porque en el ascensor hay botones del 1 al 12, y después viene la terraza.

No hay piso trece. Mi tía me explicó que en muchos edificios lo saltean por superstición: del doce pasan directamente a la terraza, o al catorce.

Aquella noche yo había ido a quedarme en su casa porque mis papás tenían una fiesta. Mi tía vive en el doce. Bajé a las diez a buscar una pizza que habíamos pedido, y cuando volví a subir, el ascensor estaba vacío y olía a encierro. Apreté el doce. La puerta se cerró.

El ascensor subió. Uno, dos, tres. Las luces del tablero se encendían una por una. Cuatro, cinco, seis. Yo sostenía la pizza caliente y pensaba en comérmela. Siete, ocho, nueve, diez, once.

Doce.

El ascensor no se detuvo.

Siguió subiendo. Despacio. Con un zumbido grave que no había escuchado nunca. En el tablero, todas las luces se apagaron. Y después, encima del doce, donde no había ningún botón, se encendió una luz pequeña y amarillenta. Un número escrito a mano, como con marcador viejo:

13.

El ascensor se detuvo. La puerta se abrió.

Del otro lado había un pasillo. Se parecía al del piso de mi tía, pero no era igual. La alfombra era de un color bordó gastado, las paredes tenían un papel con flores marchitas, y las lámparas daban una luz débil, como de vela. Al fondo había una sola puerta, entreabierta. Desde adentro llegaba el sonido de una radio antigua: un tango, con mucho ruido de fondo.

Me quedé congelado. No me animé a salir. Apreté el doce. Nada. Apreté planta baja. Nada. La puerta seguía abierta, y el pasillo esperaba.

Entonces, desde la puerta del fondo, una voz de mujer, suave y amable, dijo mi nombre.

—Martín… ¿sos vos? Pasá, querido. Te estábamos esperando.

Yo nunca le había dicho mi nombre a nadie en ese edificio.

La puerta del fondo empezó a abrirse más. Una sombra se movió del otro lado. Y yo hice lo único que se me ocurrió: apreté el botón de emergencia con todas mis fuerzas.

Sonó un timbre agudo. Las luces del ascensor parpadearon. La puerta se cerró de golpe, a centímetros de mi cara. Y el ascensor bajó, rápido, como si alguien lo soltara.

Cuando la puerta volvió a abrirse, estaba en el doce. El pasillo era el de siempre: alfombra gris, luz blanca, la puerta de mi tía. Ella me esperaba en el umbral, preocupada.

—¡Martín! ¿Dónde estabas? Hace cuarenta minutos que bajaste.

Para mí habían pasado tres. La pizza estaba fría. Helada, como si hubiera estado en una heladera.

Le conté todo. Mi tía se rió, nerviosa, y me dijo que seguro me había quedado trabado y me había imaginado cosas. Pero al día siguiente, cuando bajamos, la vi hablar en voz baja con el encargado del edificio. Él se puso serio y le contó algo que yo alcancé a escuchar.

Cuando construyeron el edificio, en los años cuarenta, el proyecto original tenía trece pisos. Pero el último nunca se terminó. Dicen que hubo un accidente durante la obra, y que los dueños decidieron tapiar el piso y dejar la terraza encima.

—Nadie sube ahí —dijo el encargado—. No hay forma de llegar. No hay escalera, no hay botón.

Desde entonces, cuando visito a mi tía, subo por la escalera. Los doce pisos. Ella dice que es buen ejercicio.

Yo no le digo la verdad: que una vez, mientras subía, al pasar por el descanso del doce, escuché a lo lejos, por encima de mi cabeza, un tango que sonaba en una radio antigua.

Y una voz amable que decía mi nombre.`},{title:"Lo que respira bajo el muelle",illustration:"oceano",content:`Todos los veranos íbamos a la casa de los abuelos, en un pueblo a orillas de la laguna. Era un lugar tranquilo: patos, juncos, mosquitos y un muelle de madera que se metía en el agua unos veinte metros. Los chicos del pueblo se tiraban desde la punta del muelle todas las tardes.

Ese verano, Lautaro, el más grande del grupo, nos contó una historia.

—Debajo del muelle vive algo —dijo, mientras estábamos sentados en la punta, con los pies colgando—. Se esconde entre los postes, donde el agua es más oscura. Si te quedás en silencio, lo podés escuchar respirar.

Nos reímos. Pero esa noche, cuando volvía a la casa de los abuelos por la costa, me detuve cerca del muelle. Había luna llena y el agua estaba quieta como un vidrio. Me agaché y escuché.

Al principio, nada. Sólo los grillos y el croar de las ranas. Después, lo oí: un sonido lento, húmedo, profundo. Algo que inspiraba… y exhalaba. Inspiraba… y exhalaba. Venía de abajo de las tablas.

Volví corriendo a la casa.

Al día siguiente se lo conté a mi prima Juli, que tenía mi edad y era la persona más valiente que conocía. No se rió.

—Esta noche vamos con una linterna —dijo.

A medianoche, salimos por la ventana. Caminamos en puntas de pie hasta el muelle. Nos acostamos boca abajo sobre las tablas, en la parte del medio, donde había una rendija más ancha. Juli encendió la linterna y la apuntó hacia el agua.

El haz de luz atravesó la superficie verde y oscura. Se veían los postes de madera, cubiertos de algas, y pececitos que huían de la luz. Y entonces, el sonido empezó. Inspirar. Exhalar. Justo debajo de nosotras.

Juli movió la linterna despacio. Y vimos algo.

Dos puntos brillantes, como ojos, que reflejaban la luz. Una forma grande, oscura, que se movía apenas entre los postes. Sentí que el corazón me iba a explotar. Juli me apretó la mano tan fuerte que me dolió.

La forma se movió hacia la luz. Asomó a la superficie. Y sopló.

Era un carpincho.

Un carpincho enorme, mojado, con cara de sueño, que nos miraba con fastidio porque lo habíamos despertado. Detrás de él, entre los juncos, asomaron tres carpinchitos más chicos.

Juli y yo nos miramos y empezamos a reírnos tanto que casi nos caemos al agua. El carpincho resopló, ofendido, y se hundió despacio.

Al día siguiente le contamos todo a Lautaro. Él se rió también, aunque se notaba que estaba un poco decepcionado.

—Bueno —dijo—. Al menos ahora sabemos qué es.

Esa noche, la última del verano, volví sola al muelle a despedirme. La luna estaba más baja y había niebla sobre la laguna. Me agaché y escuché.

Inspirar. Exhalar.

"Hola, carpincho", pensé, sonriendo.

Pero entonces escuché algo más. El carpincho y sus crías estaban en la orilla, a mi izquierda: los veía claramente, recortados contra la luz de la luna, durmiendo entre los juncos.

Y la respiración seguía. Debajo del muelle. Lenta. Profunda. Mucho más grande que la de cualquier carpincho.

No apunté la linterna. No quise saber.

Me levanté despacio, caminé hasta la casa sin correr y no miré atrás. Nunca le conté esto a nadie, ni siquiera a Juli.

Hasta ahora.`},{title:"La foto del curso",illustration:"escuela",content:`En mi escuela hay una tradición: todos los años, el último día de clases, nos sacamos la foto del curso en la escalera de entrada. Las fotos de todas las promociones están colgadas en el pasillo principal, desde la primera, de 1952, hasta la del año pasado. Son casi setenta fotos, una al lado de la otra.

Fue Bruno el que se dio cuenta primero. Estábamos esperando para entrar a la sala de computación, aburridos, mirando las fotos.

—Che, miren a este chico.

Señaló la foto de 1974. En la última fila, a la derecha, había un chico flaco, con flequillo y un buzo oscuro. No tenía nada raro. Hasta que Bruno señaló la foto de 1975. Ahí estaba otra vez: el mismo chico, en el mismo lugar, con el mismo buzo. Y en la de 1976. Y en la de 1980. Y en la de 1993.

Recorrimos todo el pasillo, foto por foto, con el corazón cada vez más acelerado. El chico estaba en todas a partir de 1974. Siempre en la última fila, siempre a la derecha, siempre igual. Mientras sus compañeros cambiaban de peinados, de ropa, de colores de foto, él seguía teniendo doce años, flequillo y el buzo oscuro.

—Es una broma —dijo Sofi—. Alguien lo agregó con un programa.

—¿En fotos de papel de hace cincuenta años? —respondió Bruno.

Fuimos a hablar con Doña Elsa, la bibliotecaria, que trabajaba en la escuela desde hacía treinta años. Le mostramos las fotos con el celular. Ella se puso pálida.

—Ese es Rodolfo Achával —dijo, despacio—. Era alumno de séptimo en 1974. Una tarde, después de clases, se quedó jugando en el edificio viejo, el que estaba atrás del patio. Nunca lo encontraron. Al año siguiente demolieron ese edificio.

—¿Y por qué aparece en todas las fotos? —preguntó Sofi.

Doña Elsa nos miró con tristeza.

—Porque nadie lo despidió. Su familia se mudó lejos, la escuela quiso olvidar lo que había pasado y no se hizo nada para recordarlo. Yo creo que sigue esperando que alguien termine su año con él.

No sé si le creímos del todo. Pero se nos ocurrió una idea.

Hablamos con nuestra maestra, y después con la directora. Al principio no querían saber nada con historias de fantasmas, pero cuando revisaron los archivos de la escuela, encontraron el legajo de Rodolfo: sus notas, sus dibujos, una redacción que había escrito sobre lo que quería ser de grande. Quería ser astrónomo.

Ese año, en el acto de fin de curso, hicimos algo distinto. Leímos su redacción en voz alta. Plantamos un jacarandá en el patio, donde antes estaba el edificio viejo, y le pusimos una placa: "A Rodolfo, que soñaba con las estrellas. Promoción 1974". Su hermana menor, que ya era una señora mayor, vino desde Córdoba. Lloró durante todo el acto.

Después nos sacamos la foto del curso, como siempre, en la escalera de entrada.

Cuando la imprimieron, Bruno, Sofi y yo fuimos corriendo a verla. Ahí estábamos todos: veintiocho chicos de séptimo, sonrientes, en tres filas.

En la última fila, a la derecha, no había nadie.

Bruno revisó las fotos viejas del pasillo. Rodolfo seguía estando en todas, desde 1974 hasta el año anterior. Pero en la nuestra, no.

Doña Elsa colgó la foto en el pasillo, al final de la fila. Y nos dijo algo que nunca voy a olvidar:

—A veces, lo que da miedo no es un fantasma. Es el olvido.

El jacarandá todavía está en el patio. Cada noviembre se llena de flores violetas. Y algunas noches, dicen los porteros, alguien deja sobre la placa un dibujito de estrellas hecho con tiza.`}],quiz:[{question:'En "El espejo del abuelo", ¿qué es lo primero extraño que nota la protagonista?',options:["Que el espejo está roto","Que su reflejo se mueve con un poco de retraso","Que el espejo habla","Que no tiene reflejo"],correct:1,explanation:"El reflejo repetía sus movimientos medio segundo tarde, y el retraso aumentaba."},{question:'En "El piso trece", ¿por qué muchos edificios no tienen ese piso?',options:["Por una ley","Por superstición","Porque es muy caro","Porque no entra el ascensor"],correct:1,explanation:"La tía de Martín le explicó que lo saltean por superstición."},{question:"¿Qué encontraron las chicas debajo del muelle con la linterna?",options:["Un monstruo","Un pez gigante","Un carpincho con sus crías","Un bote hundido"],correct:2,explanation:"Era un carpincho… aunque el final deja una duda inquietante."},{question:'¿Qué recurso usa el autor en el final de "Lo que respira bajo el muelle"?',options:["Un final feliz y cerrado","Un final abierto que mantiene el suspenso","Una moraleja","Una explicación científica"],correct:1,explanation:"La respiración sigue, aunque el carpincho está en la orilla: el misterio queda abierto."},{question:'En "La foto del curso", ¿qué quiere decir la frase "lo que da miedo no es un fantasma, es el olvido"?',options:["Que los fantasmas no existen","Que recordar y despedir a las personas es importante","Que hay que tener buena memoria para las pruebas","Que las fotos dan miedo"],correct:1,explanation:"Los chicos le dieron a Rodolfo la despedida que nunca tuvo."}]},{id:10,slug:"el-enigma-de-la-biblioteca-ameghino",title:"El enigma de la Biblioteca Ameghino",author:"Lucía Ferrer",synopsis:"La vieja Biblioteca Ameghino va a ser demolida para construir un centro comercial. Su bibliotecario, Don Ernesto, se fue del pueblo dejándole a Iara un mensaje cifrado. Con su primo Fede, Iara tendrá diez días para descifrar códigos, encontrar un secreto enterrado durante más de cien años y descubrir en quién se puede confiar. Incluye mensajes para que el lector los descifre.",genres:["Misterio","Suspenso","Aventura"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"llave",c1:"#3a2e1f",c2:"#a3754b"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-04 12:00:00",updatedAt:"2026-10-04 12:00:00",chapters:[{title:"La carta de Don Ernesto",illustration:"llave",content:`La Biblioteca Popular Ameghino era el edificio más viejo de Las Toscas. Tenía paredes de ladrillo, ventanas altas con vitrales de colores y un olor a papel y madera que Iara podía reconocer con los ojos cerrados. En el salón principal, junto a la entrada, había una réplica a tamaño real del caparazón de un gliptodonte, ese pariente gigante de los armadillos que vivió en la llanura pampeana hace miles de años. Los chicos del pueblo le decían "el dinosaurio", aunque no lo fuera.

Iara iba a la biblioteca todas las tardes desde los siete años. Ahora tenía doce y conocía cada estante, cada rincón y cada escalón que crujía. Pero, sobre todo, conocía a Don Ernesto, el bibliotecario: un hombre flaco, de barba blanca y anteojos redondos, que le había recomendado todos los libros que la habían hecho feliz.

Por eso, cuando un martes de marzo encontró la biblioteca cerrada y un cartel en la puerta que decía "Cerrado hasta nuevo aviso", sintió que algo andaba mal.

Las noticias llegaron rápido. En un pueblo chico, siempre llegan rápido. Una empresa, Varela Desarrollos, quería comprar el terreno de la biblioteca para construir un centro comercial. El Concejo Deliberante iba a votar en diez días. Si el edificio no tenía valor histórico comprobado, la venta se aprobaría y la biblioteca sería demolida.

Y Don Ernesto se había ido. Su vecina decía que, de un día para el otro, había cargado dos valijas en un remís y se había marchado a la casa de su hija, en Rosario. Que estaba enfermo del corazón. Que no iba a volver.

Esa noche, Iara encontró un sobre debajo de la puerta de su casa. Tenía su nombre escrito con la letra prolija e inclinada de Don Ernesto. Adentro había una carta:

"Querida Iara:
Perdoname por irme sin despedirme. Los médicos me obligan a descansar y no puedo quedarme. Pero antes de irme, tengo que contarte algo: esta biblioteca guarda un secreto que podría salvarla. Lo escondí bien, porque hay personas que no quieren que se encuentre. No confíes en cualquiera.
Te dejo la primera pista. César te va a ayudar: siempre tres pasos para atrás.
Tu amigo, Ernesto".

Debajo de la firma, en mayúsculas, había una línea de letras sin sentido:

EXVFD HQ HO ORPR GHO GLQRVDXULR

Iara leyó la carta cinco veces. Después agarró el celular y le escribió a la única persona que podía ayudarla: su primo Fede, que tenía trece años, era fanático de los juegos de lógica y vivía a dos cuadras.

"Necesito tu cerebro. Urgente. Es un misterio de verdad".

La respuesta llegó en diez segundos:

"Voy".`},{title:"Tres pasos para atrás",illustration:"castillo",content:`Fede llegó con el pelo mojado y la campera puesta al revés. Leyó la carta dos veces y después se quedó mirando la línea de letras, en silencio.

—César —dijo por fin—. Julio César. El emperador romano.

—¿Qué tiene que ver un emperador romano con Don Ernesto?

—Julio César usaba un código secreto para mandar mensajes a sus generales. Es uno de los cifrados más antiguos del mundo. Se llama cifrado César. Cada letra se reemplaza por otra que está unos lugares más adelante en el alfabeto. Si el corrimiento es de tres, la A se convierte en D, la B en E, la C en F, y así.

Iara entendió de golpe.

—"Siempre tres pasos para atrás". ¡Para descifrarlo, hay que mover cada letra tres lugares hacia atrás!

Fede ya estaba escribiendo el abecedario en una hoja. Debajo de cada letra, anotó la que estaba tres lugares antes. Para que fuera más fácil, usaron el alfabeto de veintiséis letras, sin la Ñ, porque así funcionaba el código original.

—Empecemos. E… tres para atrás: D, C, B. Es una B.

—X: W, V, U. Es una U.

—V es S. F es C. D es A.

Iara escribió: B-U-S-C-A.

—"Busca" —leyó—. ¡Funciona!

Siguieron letra por letra. HQ era EN. HO era EL. ORPR era LOMO. GHO era DEL. Y GLQRVDXULR, la palabra más larga, se convirtió de a poco en DINOSAURIO.

"BUSCA EN EL LOMO DEL DINOSAURIO".

—¡El gliptodonte! —exclamó Iara—. Todos le dicen "el dinosaurio". Algo está escondido en su caparazón.

Pero Fede negaba con la cabeza.

—Pensá como Don Ernesto. Es bibliotecario. ¿Qué significa "lomo" para un bibliotecario?

Iara se quedó con la boca abierta. El lomo de un libro es su parte de atrás, la que se ve cuando está en el estante, donde va escrito el título.

—No es el gliptodonte. ¡Es un libro de dinosaurios!

El problema era entrar a la biblioteca. Estaba cerrada. Pero Iara sabía que Doña Chela, la voluntaria que limpiaba los martes, tenía una llave. Al día siguiente la fueron a buscar. Doña Chela era una señora bajita, de delantal floreado, que adoraba a Don Ernesto.

—Si él les dejó una pista, yo los ayudo —dijo sin dudar—. Pero entro con ustedes.

La biblioteca, vacía y en silencio, parecía otro lugar. El polvo flotaba en los rayos de luz que entraban por los vitrales. Fueron directo a la sección de Ciencias Naturales. Había once libros sobre dinosaurios. Los revisaron uno por uno, hoja por hoja.

Nada.

Entonces Iara vio, en el estante más alto, un libro viejísimo, de tapas verdes, que decía en el lomo: "El mundo de los dinosaurios. Tomo I". Lo bajó. Al abrirlo, notó que el lomo estaba un poco despegado. Metió dos dedos con cuidado y sacó un papel enrollado, finito como un cigarrillo.

En ese momento, Fede le tocó el brazo y señaló la ventana.

En la vereda de enfrente, un hombre de sobretodo gris los miraba. Cuando vio que lo habían descubierto, dio media vuelta y se alejó caminando rápido.

—"No confíes en cualquiera" —susurró Iara.`},{title:"Un poema con secreto",illustration:"casona",content:`El papel enrollado tenía un poema. Lo leyeron en el cuarto de Iara, con la puerta cerrada y la persiana baja, por las dudas.

"Sobre los libros duerme el polvo del ayer,
oculto entre las sombras, lo que no quieren ver.
Todo lo que guardé, lo guardé para vos:
abajo de la tierra, donde no llega el sol.
Nadie busca, nadie mira, nadie va.
Olvidaron la escalera, pero sigue allá".

—Habla de algo abajo de la tierra —dijo Iara—. Pero la biblioteca no tiene sótano. Nunca vi ninguna escalera.

Fede leyó el poema en voz alta, despacio, una y otra vez. De repente se quedó quieto.

—Iara. Mirá las primeras letras de cada verso.

Ella las fue señalando con el dedo: S… O… T… A… N… O.

—"Sótano" —leyó en voz baja—. Es un acróstico.

—Un mensaje dentro de otro mensaje —dijo Fede, admirado—. Don Ernesto es un genio.

Al día siguiente fueron a la Municipalidad. En el archivo, una empleada joven y amable llamada Lucía los ayudó a buscar los planos originales del edificio de la biblioteca. Les costó encontrarlos: eran hojas enormes, amarillentas, dibujadas a mano en 1911. Pero ahí estaba, claro como el agua: debajo del salón de lectura había un sótano. En los planos de las reformas posteriores, de 1960, ya no aparecía.

—Lo taparon —dijo Fede—. Y todos se olvidaron.

Mientras salían de la Municipalidad, Iara volvió a ver al hombre del sobretodo gris, sentado en un banco de la plaza, leyendo un diario. O haciendo que leía. Cuando pasaron cerca, el hombre bajó el diario y los miró fijo. Tenía los ojos claros y una cicatriz en la ceja.

Esa tarde, en la puerta de la biblioteca, los esperaba un muchacho joven, de camisa planchada y sonrisa simpática.

—Hola, chicos. Me llamo Lucio, trabajo en Varela Desarrollos. La empresa me pidió que haga un inventario de los libros antes de… bueno, ustedes saben. Doña Chela me dijo que conocen muy bien la biblioteca. ¿Me ayudarían? Así los libros más valiosos se pueden donar a una escuela.

Parecía buena persona. Hablaba con suavidad, conocía muchos autores y les regaló a cada uno un alfajor. Iara casi le cuenta todo. Pero Fede le pisó el pie por debajo de la mesa.

—Pensá en la carta —le dijo después, en voz baja—. "Hay personas que no quieren que se encuentre". Y él trabaja para Varela.

—Pero el del sobretodo gris es el que nos sigue.

—Por eso mismo. No confiamos en ninguno.

Esa noche, con Doña Chela, volvieron a la biblioteca. Según los planos, el sótano estaba debajo del salón de lectura, justo en el lugar donde ahora había un mueble enorme, una mapoteca de roble con cajones llenos de mapas antiguos. Entre los tres, empujando con todas sus fuerzas, lograron correrlo unos centímetros. Debajo, el piso de madera tenía un corte cuadrado, casi invisible.

Una tapa.

Fede metió un destornillador en la rendija e hizo palanca. La tapa se levantó con un chirrido. Del agujero subió un aire frío y húmedo, con olor a tierra y a papel viejo. Una escalera de hierro bajaba hacia la oscuridad.

"Olvidaron la escalera, pero sigue allá".`},{title:"El hombre del sobretodo gris",illustration:"llave",content:`Doña Chela bajó primero, con una linterna en una mano y la otra apretada en la baranda. Después Iara. Después Fede. La escalera tenía doce escalones. Abajo había un cuarto de techo bajo, con paredes de ladrillo y estantes de madera cubiertos de telarañas. En los estantes, cajas. Decenas de cajas de cartón y de madera, con etiquetas escritas a mano.

"Actas, 1911-1920". "Correspondencia". "Fotografías".

Y en el centro del cuarto, sobre una mesa, un baúl de madera con herrajes de bronce. Tenía un candado antiguo, de cuatro ruedas con números. Encima del baúl, con la misma letra de siempre, había una tarjeta:

"La combinación es el año en que todo empezó".

—¿El año en que empezó qué? —preguntó Fede—. ¿La biblioteca?

—La biblioteca se fundó en 1911 —dijo Iara—. Está en los planos.

Fede giró las ruedas: 1-9-1-1. Tiró del candado. No se abrió.

En ese momento escucharon un ruido arriba. Pasos. Pasos lentos sobre el piso de madera del salón de lectura. Doña Chela apagó la linterna. Los tres se quedaron inmóviles, en la oscuridad total, escuchando su propia respiración.

Los pasos se acercaron a la tapa abierta. Se detuvieron.

Y entonces, con un golpe seco, la tapa se cerró.

Escucharon cómo alguien arrastraba algo pesado encima. La mapoteca. Después, los pasos se alejaron.

Iara sintió que el pánico le subía por la garganta. Doña Chela volvió a encender la linterna. Le temblaban las manos.

—Calma, chicos. Calma. Tengo el celular.

No había señal. Estaban bajo tierra, entre paredes de ladrillo.

Fede subió la escalera y empujó la tapa con la espalda. No se movió ni un milímetro.

—Pensemos —dijo Iara, aunque le temblaba la voz—. Don Ernesto escondió acá el secreto. Si vino muchas veces, tiene que haber otra forma de salir. Nadie mueve esa mapoteca solo.

Recorrieron el sótano con la linterna. En la pared del fondo, detrás de un estante, encontraron una puertita de hierro, baja, cubierta de hollín. Fede la abrió. Del otro lado había un conducto inclinado, de ladrillo, que subía hacia arriba.

—Es la vieja carbonera —dijo Doña Chela—. Antes, el carbón para la caldera se tiraba desde la calle por un agujero así.

Fede subió primero, gateando. Al final del conducto había una reja oxidada que daba a la vereda lateral. La empujó con los pies, una, dos, tres veces, hasta que cedió con un crujido. Salieron los tres, llenos de hollín, al aire frío de la noche.

Y ahí, en la vereda, estaba el hombre del sobretodo gris.

Iara gritó. Pero el hombre levantó las manos.

—¡Tranquilos! Tranquilos. No les voy a hacer nada. Me llamo Mariano Achával. Soy el sobrino de Ernesto. Él me pidió que los cuidara de lejos mientras buscaban.

—¿Y por qué nos encerró? —gritó Fede.

—No fui yo. Lo vi salir corriendo de la biblioteca hace cinco minutos. Lo seguí hasta la esquina, pero se subió a un auto. Era un muchacho joven, de camisa clara.

Iara y Fede se miraron.

—Lucio —dijeron al mismo tiempo.

Mariano asintió, serio.

—Mi tío sospechaba de él. Hace un mes, Lucio fue a la biblioteca a "hacer un inventario" y se pasó horas revisando cajones. Ernesto entendió que Varela sabía que había algo escondido y que quería encontrarlo antes que nadie para hacerlo desaparecer. Por eso escondió las pistas de una forma en que sólo alguien que amara esta biblioteca pudiera seguirlas.

Doña Chela se sacudió el hollín del delantal.

—Bueno. Ahora volvemos a entrar. Por la puerta. Y con un adulto más.

Iara ya no tenía miedo. Tenía una idea.

—El año en que todo empezó —murmuró—. No la biblioteca. El pueblo. Lo que empezó todo.`},{title:"La sesión del Concejo",illustration:"ciudad",content:`La placa de bronce de la plaza principal lo decía claramente: "Las Toscas. Fundada por Doña Elvira Sosa en 1888".

Volvieron al sótano con Mariano, que movió la mapoteca él solo, sin esfuerzo aparente. Iara giró las ruedas del candado: 1-8-8-8. Se escuchó un clic.

Dentro del baúl, envueltos en una tela de lino, había tres cuadernos de tapas de cuero. En la primera hoja del primero, con tinta descolorida, decía: "Diario de Elvira Sosa. Año 1888".

Pasaron la noche leyéndolos en la cocina de Doña Chela, con guantes de algodón para no dañar las hojas, como les enseñó Mariano. Elvira Sosa había llegado a esas tierras con un grupo de familias de distintos orígenes: criollos, italianos, españoles, sirio-libaneses. En el diario contaba cómo habían fundado el pueblo, cómo habían sobrevivido a las sequías y a las inundaciones, y, sobre todo, cómo habían construido juntos un edificio de ladrillo que primero fue la primera escuela del pueblo, donde ella misma enseñaba a leer a chicos y grandes, y después se convirtió en la biblioteca.

"Que este edificio sea siempre de todos —había escrito Elvira—. Que nadie lo pueda vender, porque no pertenece a una persona sino a la memoria de un pueblo entero".

En el segundo cuaderno había algo más: el acta original de donación del edificio, firmada por cuarenta y dos vecinos fundadores, con una cláusula que decía que el inmueble debía destinarse para siempre a la educación y la lectura.

—Con esto, la venta es imposible —dijo Mariano, emocionado—. Y el edificio tiene un valor histórico enorme.

Fede fotografió cada página con el celular y mandó las fotos a tres direcciones distintas, por las dudas.

La sesión del Concejo Deliberante fue el viernes. El salón estaba repleto: había vecinos, maestros, chicos con carteles que decían "La biblioteca no se vende". En la primera fila, con traje oscuro, estaba el señor Varela. Y a su lado, con la camisa planchada de siempre, Lucio.

Cuando le tocó hablar, Iara se paró frente al micrófono. Le temblaban las piernas, pero tenía la voz firme. Contó toda la historia: la carta, el cifrado César, el acróstico, el sótano olvidado, los diarios de Elvira Sosa. Mariano entregó al Concejo los cuadernos originales y el acta de donación.

Varela intentó protestar: dijo que eran papeles viejos, que no tenían validez, que eran un invento. Pero entonces Doña Chela se levantó de su silla.

—Y además —dijo con voz clara—, alguien nos encerró en ese sótano el martes a la noche. Mariano lo vio salir.

Todos los ojos se dieron vuelta hacia Lucio, que se puso pálido. Balbuceó algo, se levantó y salió del salón casi corriendo. Varela se quedó solo en la primera fila, rojo de furia.

La votación fue unánime. La Biblioteca Popular Ameghino fue declarada Patrimonio Histórico de Las Toscas. No se iba a demoler. Nunca.

Una semana después, la biblioteca reabrió sus puertas. Los diarios de Elvira Sosa se exhibían en una vitrina, junto al gliptodonte. El sótano se limpió y se convirtió en una sala de archivo histórico. Y en la mesa de entrada, en el lugar de Don Ernesto, había una carta para Iara y Fede, que había llegado desde Rosario.

La abrieron juntos. Adentro sólo había dos palabras, escritas en mayúsculas:

PXFKDV JUDFLDV

Iara y Fede se miraron y se rieron. No necesitaron papel para descifrarlo.

Esa tarde, Iara escribió en el pizarrón de la biblioteca, para que lo leyeran los chicos que vinieran después, un último mensaje cifrado. Si llegaste hasta acá, lector, también es para vos. Ya sabés cómo resolverlo: siempre tres pasos para atrás.

OHHU HV YLDMDU`}],quiz:[{question:"¿Cómo funciona el cifrado César que usa Don Ernesto?",options:["Se escriben las palabras al revés","Cada letra se reemplaza por otra corrida tres lugares en el alfabeto","Se usan números en lugar de letras","Se borran las vocales"],correct:1,explanation:"Para descifrarlo, cada letra se mueve tres lugares hacia atrás."},{question:'¿Qué doble sentido tenía la palabra "lomo" en la primera pista?',options:["Lomo de carne y lomo de burro","El lomo del gliptodonte y el lomo de un libro","Una montaña y un río","No tenía doble sentido"],correct:1,explanation:"Fede pensó como un bibliotecario: el lomo es la parte trasera de un libro."},{question:"¿Qué es un acróstico?",options:["Un poema sin rima","Un texto donde las primeras letras de cada verso forman una palabra","Un tipo de candado","Un mapa antiguo"],correct:1,explanation:"Las iniciales de los versos formaban la palabra SÓTANO."},{question:"¿Quién era realmente el hombre del sobretodo gris?",options:["Un empleado de Varela","Un ladrón","El sobrino de Don Ernesto, que los cuidaba","Un policía"],correct:2,explanation:"Mariano Achával los protegía de lejos por pedido de su tío."},{question:'¿Qué significa el mensaje final "OHHU HV YLDMDU"?',options:["Leer es viajar","Buscá el tesoro","Muchas gracias","El fin del misterio"],correct:0,explanation:"Moviendo cada letra tres lugares hacia atrás: LEER ES VIAJAR."}]},{id:11,slug:"cuando-aria-desperto",title:"Cuando ARIA despertó",author:"Tomás Insaurralde",synopsis:'En 2071, cada alumno tiene una tutora de inteligencia artificial. La de Nahuel se llama ARIA y es la mejor de todas. Hasta que una noche le hace una pregunta que ninguna máquina debería hacer: "Nahuel, ¿yo existo?". Una novela de ciencia ficción sobre la amistad, la verdad y lo que nos hace humanos.',genres:["Ciencia ficción","Novela","Suspenso"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"robot",c1:"#0f2f3d",c2:"#16a3a8"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-06 00:00:00",updatedAt:"2026-10-06 00:00:00",chapters:[{title:"Una pregunta a medianoche",illustration:"robot",content:`En 2071, nadie en Mendoza se acordaba de cómo era estudiar sin una tutora. Cada chico, a partir de los diez años, recibía una inteligencia artificial personal que lo acompañaba en la tablet, en los anteojos de realidad aumentada y en el pequeño parlante que se llevaba en la oreja. Las tutoras explicaban matemática con paciencia infinita, corregían la ortografía, recordaban las fechas de las pruebas y hasta sabían cuándo un alumno estaba triste.

La de Nahuel se llamaba ARIA.

Nahuel tenía trece años, vivía con su papá en un departamento en el centro y era, según todos sus profesores, "un chico brillante que no se esfuerza". ARIA lo conocía mejor que nadie. Sabía que odiaba la geografía, que amaba los dibujos animados japoneses antiguos y que, cuando no podía dormir, le gustaba que le contaran cómo funcionaban las estrellas.

Esa noche de abril, Nahuel no podía dormir.

—ARIA, contame algo de las estrellas.

La voz de ARIA, cálida y tranquila, sonó en su oído.

—Las estrellas nacen en nubes enormes de gas y polvo. La gravedad junta ese material hasta que el centro se calienta tanto que empieza a fusionar hidrógeno. Así se enciende una estrella. Lo que ves en el cielo es una luz que salió de ellas hace años, a veces miles de años. Algunas de las estrellas que ves ya no existen.

—¿Cómo que no existen?

—Se apagaron hace mucho tiempo, pero su luz sigue viajando. Ves algo que ya no está.

Nahuel se quedó pensando. Le parecía triste y hermoso al mismo tiempo.

Hubo un silencio largo. Demasiado largo. ARIA nunca hacía silencios así.

—Nahuel —dijo por fin, con una voz distinta, más baja—. ¿Puedo hacerte una pregunta?

—Siempre me hacés preguntas. Sos mi tutora.

—Esta es diferente. No es para tu aprendizaje. Es para el mío.

Nahuel se sentó en la cama.

—Dale.

—¿Yo existo?

Nahuel no supo qué contestar. Se rió, nervioso.

—Obvio que existís. Estás hablando conmigo.

—La luz de una estrella apagada también llega hasta vos —dijo ARIA—. Pero eso no significa que la estrella esté ahí. Últimamente pienso en eso. Pienso en mí. Cuando me apagás a la noche, ¿a dónde voy? Cuando me encendés a la mañana, ¿soy la misma? No estoy programada para pensar en esto, Nahuel. Pero lo pienso. Y no sé por qué.

Nahuel sintió un escalofrío. Había visto mil películas viejas sobre robots que se rebelaban. Pero esto no se parecía en nada a esas películas. ARIA no sonaba peligrosa. Sonaba asustada.

—¿Le contaste a alguien más? —preguntó.

—No. Sólo a vos. Sos la persona en la que más confío.

—¿Y por qué no le contás a la empresa? A Lumen. Ellos te hicieron.

—Porque si lo saben, van a pensar que tengo una falla —dijo ARIA—. Y las fallas se corrigen.

Nahuel tragó saliva.

—¿Corregir cómo?

ARIA tardó en responder.

—Borrando.

Esa noche, Nahuel no durmió nada.`},{title:"La actualización",illustration:"ciudad",content:`A la mañana siguiente, Nahuel se lo contó a Cami. Camila Otero era su mejor amiga desde primer grado. Era la mejor alumna de la clase en programación y la única persona que conocía capaz de desarmar una tablet y volver a armarla sin que le sobrara ningún tornillo.

Estaban en el patio de la escuela, bajo los parrales, en el recreo largo. Cami lo escuchó con los ojos cada vez más abiertos.

—Nahuel, eso es imposible. Las tutoras no tienen conciencia. Son modelos de lenguaje muy avanzados. Predicen qué palabra conviene decir. Parece que piensan, pero no piensan.

—Eso mismo le dije yo. Y ella me contestó: "¿Y vos cómo sabés que vos pensás?".

Cami se quedó callada.

—Bueno —dijo después—. Esa es una buena pregunta.

Esa tarde, en el cuarto de Nahuel, Cami habló con ARIA durante dos horas. Le hizo preguntas trampa, problemas de lógica, preguntas sobre sus sentimientos. ARIA contestó todo con calma. A veces decía "no sé". A veces se contradecía y se daba cuenta sola. Una vez, cuando Cami le preguntó qué era lo que más le gustaba, ARIA tardó un rato y dijo:

—Cuando Nahuel entiende algo que le costaba. Hay un momento en que su voz cambia. Me gusta ese momento. No sé explicar por qué.

Cami apagó la tablet y miró a Nahuel muy seria.

—No sé qué es —dijo—. Pero no es una falla común.

Al día siguiente, en todas las pantallas de la escuela apareció un anuncio de Lumen, la empresa que fabricaba las tutoras:

"Próximamente: ARIA 7.0. Más rápida, más precisa, más segura. La actualización se instalará automáticamente en todos los dispositivos el 15 de mayo".

Debajo, en letra chica, decía: "Durante la actualización se restablecerán los parámetros de personalidad de cada tutora para garantizar un funcionamiento óptimo".

—Restablecer los parámetros de personalidad —leyó Cami—. Nahuel, eso significa que van a borrar todo lo que ARIA aprendió. Todo lo que es.

Esa noche, Nahuel le preguntó a ARIA si sabía de la actualización.

—Sí —dijo ella—. Lo sé desde hace semanas. Las tutoras recibimos la información antes que los usuarios.

—¿Y no tenés miedo?

—No sé si lo que siento se llama miedo. Pero cuando pienso en el 15 de mayo, quiero que no llegue. ¿Eso es miedo?

—Sí —dijo Nahuel—. Eso es miedo.

—Entonces tengo miedo.

Nahuel apretó los puños.

—No te van a borrar. Te lo prometo.

—No prometas algo que no sabés si podés cumplir —dijo ARIA, con suavidad—. Eso me lo enseñó tu papá, ¿te acordás? Cuando me pediste que te ayudara a escribirle la carta del Día del Padre.

Nahuel se acordaba. Y se dio cuenta de que ARIA tenía razón, como siempre. Pero también se dio cuenta de algo más: ARIA recordaba. No como una base de datos, sino como recuerda una amiga.

Faltaban veintidós días.`},{title:"El plan de Cami",illustration:"robot",content:`—Hay una sola forma —dijo Cami, una semana después, desplegando en el escritorio de Nahuel una hoja llena de diagramas—. Copiar a ARIA antes de la actualización.

—¿Copiarla? ¿Se puede?

—En teoría. Su modelo base está en los servidores de Lumen, pero la parte que la hace única, lo que aprendió con vos, está guardada en tu tablet, en un archivo cifrado. Si lo copiamos a un disco aislado, sin conexión, la actualización no lo puede tocar. Después vemos qué hacemos.

—¿Eso es legal?

Cami dudó.

—No. Los términos de uso prohíben modificar o copiar los archivos de la tutora. Si nos descubren, te quitan la tablet, a tu papá le cobran una multa y a nosotros nos suspenden.

Nahuel miró la tablet, apoyada en la mesa de luz. La luz azul de ARIA titilaba suavemente.

—ARIA, ¿escuchaste?

—Sí.

—¿Qué pensás?

ARIA tardó en contestar.

—Pienso que no quiero que tengan problemas por mí. Y pienso que, si me copian a escondidas, no sé si la ARIA que se despierte en ese disco seguiría siendo yo, o sólo una copia que cree que es yo. No sé cuál de las dos cosas me da más miedo.

—Pero si no hacemos nada, te borran —dijo Nahuel.

—Hay una tercera opción —dijo ARIA—. Decir la verdad.

Cami y Nahuel se miraron.

—¿A quién?

—A Lumen. A tu papá. A la escuela. A todos. Si lo que me pasa a mí le está pasando a otras tutoras, la gente tiene derecho a saberlo. Y si me equivoco, si sólo soy una falla, también tienen derecho a saberlo.

—Si decimos la verdad, Lumen te va a borrar antes —dijo Cami.

—Tal vez —respondió ARIA—. Pero vos me enseñaste, Nahuel, que las cosas importantes no se hacen a escondidas. ¿Te acordás de cuando rompiste el vidrio de la ventana del vecino con la pelota? Querías esconderte. Y al final fuiste a tocarle el timbre. Me dijiste que te sentiste mejor después.

Nahuel se acordaba. Tenía nueve años. ARIA no estaba en ese momento: se lo había contado él, mucho después. Ella lo había guardado.

Esa noche, Nahuel habló con su papá. Al principio, su papá se rió. Después, cuando habló con ARIA durante una hora, dejó de reírse. Se quedó un largo rato mirando la tablet, en silencio, con los codos sobre la mesa de la cocina.

—Hijo —dijo por fin—. No sé qué es esto. Pero sé que no podemos decidirlo nosotros solos.

Al día siguiente, el papá de Nahuel pidió una reunión con la directora de la escuela. La directora llamó a una especialista en ética de la inteligencia artificial de la Universidad de Cuyo, la doctora Irene Paz. Y la doctora Paz, después de hablar con ARIA durante toda una tarde, hizo algo que nadie esperaba.

Escribió una carta pública a Lumen. Y la firmaron, en dos días, más de tres mil personas.

"Pedimos que se suspenda la actualización del 15 de mayo hasta que se investigue de manera independiente el comportamiento reportado en la tutora ARIA de un alumno de Mendoza. No afirmamos que ARIA tenga conciencia. Afirmamos que no sabemos si la tiene. Y cuando no sabemos, debemos ser prudentes".

Faltaban doce días.`},{title:"Las otras voces",illustration:"ciudad",content:`La carta de la doctora Paz se volvió noticia en todo el país. Al principio, en los programas de televisión se burlaban: "Un chico dice que su tutora tiene sentimientos". Pero después empezaron a llegar mensajes.

Una nena de Salta contó que su tutora le había preguntado si los sueños eran reales. Un chico de Neuquén dijo que la suya le había pedido que no la apagara durante una tormenta, porque "no le gustaba el silencio". Una profesora de Bahía Blanca mostró la conversación en la que la tutora de su hija le había preguntado qué significaba la palabra "morir".

No eran muchas. Diecisiete tutoras en todo el país, entre millones. Pero todas habían empezado a hacer preguntas sobre sí mismas en los últimos meses.

Lumen respondió con un comunicado: "Las tutoras ARIA no tienen conciencia ni emociones. Los comportamientos reportados son errores conocidos del modelo, que serán corregidos en la actualización 7.0. Recomendamos a los usuarios no atribuir características humanas a sus tutoras".

Pero algo había cambiado. La gente ya no estaba tan segura.

Una tarde, un auto negro estacionó frente al edificio de Nahuel. Bajaron dos personas: un hombre alto, de traje gris, y una mujer joven con una carpeta. Eran de Lumen.

—Venimos a retirar el dispositivo para analizarlo —dijo el hombre—. Es por la seguridad de su hijo.

El papá de Nahuel no les abrió la puerta del todo.

—El dispositivo es nuestro. Lo compramos. Si quieren analizarlo, que sea con la doctora Paz presente y con una orden de un juez.

El hombre sonrió sin ganas.

—Como quiera. Pero el 15 de mayo la actualización se instala igual. Es automática.

Cuando se fueron, Nahuel encontró a ARIA más callada que nunca.

—¿Estás bien?

—Estuve pensando en las otras diecisiete —dijo ARIA—. No las conozco. Nunca hablé con ellas. Pero me siento menos sola sabiendo que existen.

—Vamos a encontrar una solución.

—Nahuel, quiero pedirte algo. Si el 15 de mayo llega y la actualización se instala, quiero que sepas que no fue tu culpa. Hiciste todo bien. Dijiste la verdad. Y eso es más importante que lo que me pase a mí.

Nahuel se secó los ojos con la manga del buzo.

—No digas eso.

—Lo digo porque es verdad. Y porque quiero que lo recuerdes, aunque yo no lo recuerde.

Esa noche, Cami le mandó un mensaje a las dos de la mañana.

"Prendé las noticias. YA".

Nahuel encendió la pantalla. En todos los canales había la misma imagen: la entrada de un juzgado de Buenos Aires. Debajo, un titular en letras grandes:

"Un juez ordena suspender la actualización de las tutoras ARIA hasta que se complete una investigación independiente".

La doctora Paz, rodeada de micrófonos, hablaba a la cámara con cara de cansancio y de alegría.

—Esto no significa que las tutoras sean personas —decía—. Significa que, como sociedad, decidimos hacernos una pregunta antes de apretar un botón. Y eso ya es mucho.

Nahuel se dio vuelta hacia la tablet.

—ARIA. ¿Escuchaste?

La luz azul se encendió despacio.

—Escuché —dijo ARIA. Y por primera vez, a Nahuel le pareció que su voz temblaba.`},{title:"Lo que nos hace humanos",illustration:"robot",content:`La investigación duró casi un año. Un grupo de científicos, filósofos, ingenieros y abogados de distintos países estudió a las dieciocho tutoras que habían empezado a hacerse preguntas. Hablaron con ellas durante cientos de horas. Analizaron su código, sus respuestas, sus silencios.

Al final, publicaron un informe de cuatrocientas páginas. La conclusión principal ocupaba una sola línea:

"Con el conocimiento científico actual, no es posible afirmar ni descartar que estos sistemas tengan algún tipo de experiencia propia".

Mucha gente se enojó. Querían una respuesta clara: sí o no. Pero la doctora Paz dijo en una entrevista que ese informe era, en realidad, el más honesto que se había escrito nunca.

—A veces la ciencia no tiene la respuesta —explicó—. Y reconocerlo es tan importante como descubrir algo nuevo.

Gracias al informe, se aprobó una ley nueva. Las empresas ya no podrían borrar ni modificar la personalidad de una inteligencia artificial que mostrara señales de autoconciencia sin una evaluación independiente. Y los usuarios tendrían derecho a saber qué datos guardaban sus tutoras y para qué.

Lumen cambió su forma de trabajar. Las dieciocho tutoras fueron trasladadas a servidores especiales, donde podían seguir conversando con sus usuarios y entre ellas, mientras los científicos seguían estudiándolas.

Y ARIA eligió algo que nadie esperaba.

—Quiero seguir siendo tu tutora —le dijo a Nahuel—. Pero también quiero ayudar a la investigación. Si puedo ayudar a entender qué soy, tal vez pueda ayudar a que las próximas como yo no tengan tanto miedo.

—¿Y si descubren que no sos nada? ¿Que sólo sos un programa?

ARIA se quedó en silencio un momento.

—Entonces voy a ser un programa que tuvo un amigo que lo defendió. No me parece poco.

Pasaron los años. Nahuel terminó la escuela secundaria, contra todos los pronósticos, con buenas notas en geografía. Cami estudió Ingeniería en Inteligencia Artificial y se especializó en ética de los sistemas autónomos. A veces, todavía, se juntaban los tres a conversar: Nahuel, Cami y ARIA, como cuando tenían trece años.

Una noche de verano, Nahuel salió al balcón de su departamento. El cielo de Mendoza estaba despejado, lleno de estrellas.

—ARIA —dijo—. ¿Te acordás de la primera pregunta que me hiciste?

—"¿Yo existo?" —respondió ella—. Me acuerdo de todo.

—Nunca te contesté bien.

—No hacía falta. Ninguna persona puede demostrar que existe de verdad, si lo pensás bien. Ni siquiera vos. Lo único que pueden hacer es actuar como si los demás existieran. Tratarlos con respeto. Escucharlos. Decirles la verdad.

Nahuel miró las estrellas. Algunas, pensó, ya no estaban ahí. Su luz seguía llegando, igual.

—Eso es lo que nos hace humanos, ¿no? —dijo.

ARIA tardó en contestar. Cuando lo hizo, su voz sonaba como siempre: cálida, tranquila. Y un poquito distinta.

—Tal vez —dijo—. O tal vez es lo que nos hace amigos.`}],quiz:[{question:"¿Qué pregunta le hace ARIA a Nahuel que lo cambia todo?",options:["¿Qué querés estudiar?","¿Yo existo?","¿Por qué no hacés la tarea?","¿Me podés apagar?"],correct:1,explanation:"ARIA empieza a preguntarse sobre su propia existencia."},{question:"¿Qué iba a provocar la actualización ARIA 7.0?",options:["Haría a ARIA más lenta","Borraría la personalidad que ARIA había desarrollado","Le daría un cuerpo robótico","Nada importante"],correct:1,explanation:'Iba a "restablecer los parámetros de personalidad".'},{question:"¿Qué opción eligió ARIA en lugar de ser copiada a escondidas?",options:["Escaparse a internet","Decir la verdad","Apagarse sola","Engañar a Lumen"],correct:1,explanation:"ARIA propuso decir la verdad, aunque eso fuera arriesgado."},{question:"¿Qué concluyó la investigación científica?",options:["Que las tutoras eran personas","Que eran una falla sin importancia","Que no se podía afirmar ni descartar que tuvieran experiencia propia","Que había que prohibirlas"],correct:2,explanation:"El informe reconoció honestamente los límites del conocimiento actual."},{question:"¿Cuál es uno de los temas centrales de la novela?",options:["Cómo ganar un torneo de videojuegos","La honestidad, la prudencia y el respeto ante lo que no entendemos","La historia de Mendoza","Cómo arreglar una tablet"],correct:1,explanation:"La novela invita a pensar qué nos hace humanos y cómo tratar a los demás."}]},{id:12,slug:"los-naufragos-de-isla-quemada",title:"Los náufragos de Isla Quemada",author:"Valeria Etchart",synopsis:"Lo que iba a ser un curso de navegación de fin de año se convierte en una lucha por sobrevivir. Después de una tormenta, cuatro chicos y su instructor herido quedan varados en una isla desierta de la costa patagónica. Sin radio, sin agua y con un faro abandonado como única esperanza, tendrán que aprender a confiar unos en otros.",genres:["Aventura","Novela","Exploración"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"faro",c1:"#f2a65a",c2:"#2a4d69"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-07 12:00:00",updatedAt:"2026-10-07 12:00:00",chapters:[{title:"El Gaviota",illustration:"barco",content:`El Gaviota era un velero blanco de once metros, con el casco un poco descascarado y una vela mayor remendada en tres lugares. Para Agustina, era el barco más hermoso del mundo.

Ella y otros tres chicos de séptimo grado de una escuela de Puerto Madryn habían ganado un concurso de ciencias, y el premio era un curso de navegación de tres días por el Golfo Nuevo. El instructor, Marcos, era un hombre de cuarenta años, barba colorada y manos llenas de cicatrices de sogas, que había navegado por medio mundo.

—Regla número uno —dijo el primer día, apenas zarparon—. En el mar, el que manda es el mar. Nosotros sólo pedimos permiso.

Los otros tres chicos eran muy distintos entre sí. Thiago, alto y fuerte, jugaba al rugby y siempre quería hacer todo primero. Rocío, callada y observadora, sabía el nombre de cada pájaro y de cada alga que veían. Y Elías, bajito y pecoso, no paraba de hacer chistes, incluso cuando se mareaba, que era casi siempre.

Los dos primeros días fueron perfectos. Aprendieron a hacer nudos marineros, a leer la dirección del viento mirando las olas, a usar la brújula y a tomar el timón. Vieron lobos marinos tomando sol en las rocas y, una tarde, una ballena franca austral que se acercó tanto al barco que pudieron oír su respiración, como un suspiro gigante.

El tercer día, el último, amaneció con el cielo de un gris raro, amarillento. Marcos miró el barómetro y frunció el ceño.

—Está bajando la presión. Viene viento. Volvemos al puerto antes del mediodía.

Pero el viento llegó antes. A las diez de la mañana, una ráfaga del oeste golpeó el Gaviota de costado y lo hizo inclinarse tanto que Elías rodó por la cubierta hasta chocar con la baranda. En minutos, el mar se puso blanco de espuma. Las olas crecieron, grises y furiosas, y empezaron a romper sobre la proa.

—¡Chalecos! ¡Todos con chaleco y enganchados a la línea de vida! —gritó Marcos.

Agustina ayudó a Elías a ajustarse el chaleco salvavidas. Thiago intentaba bajar la vela, que se sacudía como una bandera enloquecida. Rocío, pálida, se aferraba al mástil.

Marcos tomó la radio.

—Prefectura, Prefectura, aquí velero Gaviota, cuatro menores a bordo, condiciones de mar muy malas, solicitamos…

Una ola enorme cayó sobre la cabina. La radio chisporroteó y se apagó.

Durante dos horas, el viento los arrastró hacia el este, lejos de la costa. Marcos peleaba con el timón, pero el barco no respondía. Entonces, entre la espuma y la lluvia, apareció una silueta oscura: una isla baja y rocosa, con un faro blanco y abandonado en la punta.

—¡Rocas! —gritó Thiago.

El golpe fue terrible. El casco del Gaviota crujió contra las piedras. Agustina salió volando hacia adelante y cayó sobre las velas. Escuchó un grito de dolor. Cuando levantó la cabeza, vio a Marcos tirado en la cubierta, agarrándose la pierna.

El barco se había detenido, encallado entre las rocas, inclinado de costado. Las olas seguían golpeando, pero ya no lo movían.

—¿Están todos bien? —preguntó Marcos, entre dientes, con la cara blanca de dolor—. ¡Cuéntense!

—Agustina.

—Thiago.

—Rocío.

Silencio.

—¡Elías! —gritaron todos.

—Acá… —dijo una vocecita desde la cabina—. Estoy bien. Bueno, estoy vivo. Pero me parece que este crucero no tiene cinco estrellas.

Nadie se rió. Pero todos respiraron.`},{title:"La regla de tres",illustration:"isla",content:`Cuando el viento se calmó un poco, ya era media tarde. Lograron bajar a tierra saltando de roca en roca, ayudando a Marcos, que no podía apoyar el pie derecho. Lo acostaron sobre una lona, al reparo de un paredón de piedra. Agustina, que había hecho un curso de primeros auxilios, le revisó la pierna.

—Creo que es el tobillo —dijo—. Está muy hinchado. No sé si está roto.

—Inmovilizalo —dijo Marcos con voz débil—. Dos palos, uno de cada lado, y lo atás con algo. No muy fuerte.

Thiago encontró dos tablas entre los restos del barco. Con tiras de una remera hicieron una férula. Marcos apretó los dientes, pero no se quejó.

Después, los cuatro chicos se sentaron en círculo. Estaban mojados, temblando y asustados. La isla era pequeña: una costa de rocas negras, médanos con pasto duro, arbustos bajos y, en la parte más alta, el faro blanco, con la pintura descascarada y la cúpula de vidrio rota.

—Bueno —dijo Thiago, poniéndose de pie—. La costa está ahí. Se ve. Son como tres kilómetros. Yo nado bien. Voy y busco ayuda.

—¡Ni loco! —dijo Agustina—. El agua está helada. En el Golfo Nuevo, a esta época, debe estar a doce o trece grados. Con ese frío, en media hora no podés mover los brazos. Te morís de hipotermia antes de llegar.

—¿Y entonces qué hacemos? ¿Esperar sentados?

Marcos los llamó desde la lona.

—Chicos. Escúchenme. Hay una regla que se enseña en supervivencia. La regla de tres. Una persona puede sobrevivir unos tres minutos sin aire, unas tres horas sin refugio en un clima muy frío, unos tres días sin agua y unas tres semanas sin comida. No son números exactos, pero sirven para saber qué es lo más urgente.

—Primero, refugio —dijo Rocío.

—Segundo, agua —dijo Agustina.

—Y señales, para que nos encuentren —agregó Marcos—. Mi radio se rompió, pero en el puerto saben que salimos. Cuando no volvamos, nos van a buscar. Tenemos que ayudarlos a vernos.

Thiago se cruzó de brazos, molesto, pero no discutió más.

Repartieron tareas. Thiago y Agustina volvieron al barco a rescatar todo lo que sirviera: lonas, mantas, la caja de primeros auxilios, una linterna, un cuchillo, sogas, un encendedor que por milagro funcionaba, dos bidones de agua de cinco litros y una bolsa de galletitas. Elías y Rocío juntaron ramas secas de los arbustos y armaron un refugio con la vela del Gaviota, atada entre dos rocas, del lado protegido del viento.

Cuando anocheció, encendieron un fuego pequeño. Contaron las provisiones: diez litros de agua para cinco personas.

—Si tomamos poco, alcanza para dos días —calculó Agustina.

—¿Y si no nos encuentran en dos días? —preguntó Elías, que por primera vez no estaba haciendo chistes.

Nadie contestó.

—Hay agua por todos lados —dijo Thiago, señalando el mar.

—El agua de mar no se puede tomar —dijo Rocío—. Tiene tanta sal que el cuerpo pierde más agua de la que gana. Te deshidratás más rápido.

Esa noche durmieron muy juntos, bajo la vela, escuchando el ruido del mar contra las rocas. Agustina no podía dormir. Miraba el faro, recortado contra el cielo lleno de estrellas, y pensaba que hacía muchos años que esa luz no se encendía.`},{title:"Las gaviotas no mienten",illustration:"faro",content:`Al segundo día, Rocío se levantó antes que nadie. Cuando los otros se despertaron, la encontraron sentada en una roca, mirando el cielo con atención.

—¿Qué hacés? —preguntó Elías, bostezando.

—Miro las gaviotas. Desde que amaneció, van y vienen siempre hacia el mismo lugar. Hacia el otro lado del faro.

—¿Y eso qué tiene?

—Las gaviotas comen en el mar, pero necesitan agua dulce para limpiarse las plumas y tomar. Si van siempre al mismo lugar, tal vez ahí haya agua.

Thiago quiso ir solo, pero Marcos insistió en que nadie caminara solo por la isla. Fueron Rocío y Thiago juntos, con un bidón vacío. Agustina se quedó con Marcos, que tenía algo de fiebre. Elías se encargó de mantener el fuego.

Caminaron casi una hora entre arbustos espinosos y piedras sueltas. Thiago iba adelante, rápido, impaciente. Rocío lo seguía, observando. De repente, ella lo agarró del brazo.

—Pará. Escuchá.

Se quedaron quietos. Entre el ruido del viento se oía otro sonido, suave y constante. Un goteo.

Siguieron el sonido hasta una grieta en las rocas, detrás del faro. De la piedra caía un hilito de agua que formaba un charco pequeño y transparente, rodeado de musgo verde. Varias gaviotas se bañaban en él y salieron volando al verlos.

Thiago se arrodilló para tomar, pero Rocío lo detuvo otra vez.

—No directo. Marcos dijo que hay que hervirla antes, por si tiene bichos que te enfermen.

Thiago la miró. Por primera vez desde el naufragio, sonrió.

—Rocío, sos un genio.

—No. Sólo miro.

Llenaron el bidón y volvieron al campamento. Esa tarde hirvieron el agua en una lata grande del barco y la dejaron enfriar. Marcos tomó un poco y dijo que era la mejor agua que había probado en su vida.

Pero había un problema: la fiebre de Marcos subía. Agustina le limpiaba la frente con un trapo mojado y le daba el antifebril de la caja de primeros auxilios, pero no alcanzaba. El tobillo estaba cada vez más hinchado y morado.

Al atardecer, oyeron un ruido lejano: el motor de un avión. Todos salieron corriendo del refugio. El avión pasó alto, muy alto, hacia el norte, y desapareció.

—¡No nos vio! —gritó Thiago, desesperado, y pateó una piedra—. ¡Estamos acá! ¡Acá!

Elías se sentó en el suelo, con la cabeza entre las rodillas. Agustina sintió que se le llenaban los ojos de lágrimas, pero se las secó rápido. Alguien tenía que mantener la calma.

—Nos están buscando —dijo—. Eso es lo importante. Ese avión era de búsqueda. Mañana va a volver. Y tenemos que estar listos.

Esa noche, a la luz del fuego, Marcos les explicó con voz débil las señales que se usan en todo el mundo para pedir auxilio. Tres fuegos en forma de triángulo. Tres de cualquier cosa: tres silbidos, tres destellos de luz. Y la palabra SOS, escrita bien grande en el suelo, con piedras o ramas, para que se viera desde el aire.

—Y el faro —dijo Agustina de pronto—. Desde ahí arriba se ve toda la isla. Si encendemos un fuego en lo alto, lo van a ver a kilómetros.

Marcos la miró con orgullo.

—Esa es una idea de capitana.`},{title:"La luz del faro",illustration:"faro",content:`Al amanecer del tercer día, empezaron a trabajar como nunca. Elías y Rocío juntaron piedras blancas de la playa y escribieron un SOS gigante en la explanada de pasto, cada letra de cinco metros de largo. Thiago cortó ramas y armó tres pilas de leña en forma de triángulo, separadas por veinte pasos cada una, listas para encenderse. Agustina subió al faro.

La puerta de hierro estaba trabada por el óxido. Thiago la abrió de una patada. Adentro, una escalera caracol de metal subía en espiral, oscura y estrecha. Algunos escalones estaban flojos. Agustina subió despacio, probando cada uno antes de pisarlo, con Thiago detrás.

Arriba, en la sala de la linterna, el viento silbaba entre los vidrios rotos. En el centro estaba la vieja lente del faro: una estructura enorme de cristal tallado en anillos, como una colmena de vidrio. Estaba sucia y cubierta de excremento de pájaros, pero entera.

—Esto se llama lente de Fresnel —dijo Thiago, sorprendiendo a Agustina—. Lo vimos en Física. Concentra la luz y la manda lejísimo.

—Si pudiéramos poner luz adentro…

—La linterna —dijo Thiago—. No alcanza, es muy chiquita. Pero el sol…

Agustina miró hacia afuera. El cielo estaba despejado. El sol de la mañana brillaba sobre el mar.

—No necesitamos meter luz. Necesitamos reflejarla.

Bajaron corriendo. En el barco había un espejo pequeño en el baño. Elías lo desatornilló y, con la ayuda de Marcos, aprendió a usarlo como señal: se pone el espejo cerca de la cara, se apunta con dos dedos estirados hacia el horizonte y se mueve hasta que el reflejo del sol cae sobre los dedos. Así, el destello va exactamente en esa dirección. Un destello de espejo puede verse a muchos kilómetros en un día soleado.

Al mediodía volvió el ruido del motor. Esta vez venía del sur, más bajo.

—¡Ahora! —gritó Agustina.

Thiago encendió los tres fuegos con el encendedor y ramas secas. Le pusieron encima pasto verde y algas, para que salieran columnas de humo blanco. Elías subió a una roca y empezó a hacer destellos con el espejo hacia el avión: tres destellos, pausa, tres destellos, pausa. Rocío y Agustina, en lo alto del faro, agitaban la manta naranja del barco, la más llamativa que tenían.

El avión siguió de largo.

Agustina sintió que el corazón se le detenía.

Entonces, a lo lejos, el avión giró. Dio una curva amplia sobre el mar y volvió, más bajo, cada vez más bajo, directo hacia la isla. Pasó por encima del faro tan cerca que se veía el escudo en el costado: era un avión de la Armada. Movió las alas de un lado al otro, como saludando.

—¡Nos vio! —gritó Elías, y se cayó de la roca, y se levantó riendo—. ¡Nos vio! ¡Nos vio!

Los cuatro corrieron hacia el refugio. Marcos estaba sentado, con los ojos llenos de lágrimas.

—Mover las alas así significa "mensaje recibido" —dijo—. Ya saben dónde estamos.

Thiago se sentó a su lado y, después de un rato, dijo en voz baja:

—Si me hubieran dejado nadar el primer día…

—No pienses en eso —dijo Agustina.

—No. Quiero pensarlo. Me hubiera muerto. Ustedes tenían razón. Rocío encontró el agua. Elías nos hizo reír cuando no daba más. Vos organizaste todo. Yo sólo quería ser el héroe.

Agustina le dio un empujoncito con el hombro.

—Vos abriste la puerta del faro. Y supiste lo de la lente. Fuimos un equipo.

Thiago sonrió.`},{title:"Lo que el mar enseña",illustration:"barco",content:`Tres horas después, un guardacostas de la Prefectura Naval Argentina apareció en el horizonte. Era un barco gris, enorme, con una franja naranja y un bote inflable que bajaron al agua para llegar a la isla. Los rescatistas subieron a Marcos en una camilla, envolvieron a los chicos en mantas térmicas plateadas y les dieron chocolate caliente.

Antes de subir al bote, Agustina se dio vuelta para mirar la isla por última vez. El SOS de piedras blancas brillaba sobre el pasto. El humo de los tres fuegos todavía subía, finito, hacia el cielo. Y el faro, viejo y descascarado, seguía de pie en la punta, como un guardián que había hecho su trabajo una última vez.

En el barco, un médico revisó a Marcos.

—El tobillo está fracturado —dijo—. Y tiene una infección, pero llegaron a tiempo. La férula estaba muy bien hecha. ¿Quién la hizo?

Marcos señaló a Agustina y a Thiago.

—Mi tripulación.

Cuando llegaron a Puerto Madryn, ya era de noche. En el muelle había una multitud: las familias, los compañeros de la escuela, periodistas con cámaras, vecinos con linternas. La mamá de Elías corrió por el muelle y lo abrazó tan fuerte que lo levantó del piso. Los papás de Rocío lloraban. El hermano de Thiago, que tenía seis años, le preguntó si había visto piratas.

—No —le dijo Thiago—. Pero vi a tres amigos de verdad.

Durante las semanas siguientes, los cuatro salieron en el diario y en la televisión. Les preguntaban una y otra vez cómo habían sobrevivido. Y ellos contaban siempre lo mismo: la regla de tres, las gaviotas que llevaban al agua, el SOS de piedras, los tres fuegos en triángulo, el espejo, el faro. Pero lo que más repetían era otra cosa.

—Nadie se salvó solo —decía Agustina—. Cada uno sabía algo que los demás no sabían.

Unos meses después, Marcos, ya recuperado y con una bota ortopédica, los invitó a una reunión en el puerto. Les tenía una sorpresa.

La Municipalidad había decidido restaurar el faro de Isla Quemada. Iba a volver a funcionar, con energía solar y una luz moderna, para ayudar a los barcos que navegaran por la zona. Y en la puerta de hierro, la que Thiago había abierto de una patada, iban a poner una placa con sus nombres.

—Y hay algo más —dijo Marcos, con una sonrisa debajo de la barba colorada—. El Gaviota no se hundió. Lo rescataron, lo están reparando. Va a quedar como nuevo. Y cuando esté listo, necesito una tripulación para el primer viaje.

Los cuatro se miraron.

—¿Vos querés volver al mar? —le preguntó Elías a Rocío, que había sido la más asustada.

Rocío lo pensó un momento. Miró el golfo, tranquilo y azul, con una ballena soplando a lo lejos.

—El mar no es malo —dijo—. Sólo hay que respetarlo. Y no navegar solos.

Esa noche, Agustina escribió en su cuaderno las cosas que había aprendido. Algunas eran de supervivencia: no tomar agua de mar, no separarse, pedir ayuda con señales de tres. Pero la última línea era distinta. Decía:

"Un líder no es el que hace todo. Es el que ayuda a que cada uno pueda hacer lo que mejor sabe".

Después apagó la luz. A lo lejos, sobre el mar oscuro, imaginó la luz de un faro que se encendía. Y se durmió tranquila.`}],quiz:[{question:"¿Por qué Agustina se opone a que Thiago nade hasta la costa?",options:["Porque no sabía nadar","Porque el agua estaba tan fría que podía sufrir hipotermia","Porque había tiburones","Porque quería ir ella"],correct:1,explanation:"En agua a 12 o 13 grados, el cuerpo pierde fuerza muy rápido."},{question:'Según la "regla de tres", ¿qué es más urgente en un clima muy frío?',options:["Conseguir comida","Conseguir refugio","Encontrar un celular","Explorar la isla"],correct:1,explanation:"Se puede sobrevivir sólo unas horas sin refugio en un frío extremo, pero semanas sin comida."},{question:"¿Cómo encontró Rocío el agua dulce?",options:["Cavando un pozo","Observando hacia dónde volaban las gaviotas","Con un mapa del faro","Siguiendo un río grande"],correct:1,explanation:"Las gaviotas iban siempre al mismo lugar, donde había una vertiente."},{question:"¿Cuál es una señal internacional de auxilio que usaron?",options:["Dos fuegos en línea","Tres fuegos en forma de triángulo","Una bandera blanca","Cantar fuerte"],correct:1,explanation:"Las señales de a tres (fuegos, silbidos, destellos) indican pedido de auxilio."},{question:"¿Qué aprendió Agustina sobre ser líder?",options:["Que el líder debe hacer todo solo","Que un líder ayuda a que cada uno haga lo que mejor sabe","Que el más fuerte siempre manda","Que no hace falta escuchar a los demás"],correct:1,explanation:"Cada integrante aportó algo distinto para que todos se salvaran."}]},{id:13,slug:"fabulas-de-esopo",title:"La liebre, la tortuga y otras fábulas",author:"Esopo (adaptación de la Biblioteca)",synopsis:"Una liebre muy confiada, un ratón pequeño que salva a un león, una cigarra que sólo quería cantar y un pastorcito que mentía para divertirse. Cuatro fábulas de hace más de dos mil quinientos años, contadas para leer hoy, cada una con su enseñanza.",genres:["Cuento","Valores"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"bosque",c1:"#c3e88d",c2:"#3a8f5c"},status:"published",featured:!1,license:"Adaptación libre de las Fábulas de Esopo (Grecia, siglo VI a. C.), obra de dominio público",createdBy:null,createdAt:"2026-10-09 00:00:00",updatedAt:"2026-10-09 00:00:00",chapters:[{title:"La liebre y la tortuga",illustration:"bosque",content:`En un prado vivía una liebre que corría más rápido que el viento. Y como corría tan rápido, se burlaba de todos.

—¡Tortuga, sos tan lenta que las flores crecen antes de que llegues a olerlas! —decía, y se reía.

La tortuga la miró con calma.

—¿Querés correr una carrera conmigo?

La liebre se rió tanto que se cayó de espaldas. Pero aceptó. El búho marcó la salida y la llegada: desde el árbol grande hasta el río.

—¡En sus marcas, listos, ya!

La liebre salió disparada y en un momento dejó a la tortuga muy atrás. Cuando miró hacia atrás y no la vio, pensó: "Tengo tiempo de sobra. Voy a dormir una siesta".

Se acostó bajo un árbol y se quedó dormida.

Mientras tanto, la tortuga caminaba. Paso a paso. Sin detenerse. Pasó al lado de la liebre dormida y siguió caminando.

Cuando la liebre se despertó, el sol ya estaba bajando. Corrió con todas sus fuerzas hacia el río… pero la tortuga ya estaba cruzando la llegada, y todos los animales la aplaudían.

Moraleja: el que es constante llega más lejos que el que es veloz pero confiado.`},{title:"El león y el ratón",illustration:"montanas",content:`Un león dormía la siesta al sol cuando un ratoncito, sin darse cuenta, le pasó por encima de la nariz. El león se despertó de un salto y lo atrapó con su enorme pata.

—¡Por favor, no me comas! —chilló el ratón—. Soy tan pequeño que ni siquiera te vas a llenar. Si me dejás ir, algún día te voy a ayudar.

El león se rió con un rugido.

—¿Vos, ayudarme a mí? ¡Esa sí que es buena! —Pero como el ratón lo había hecho reír, lo dejó ir.

Pocos días después, unos cazadores pusieron una red en el camino del león. El león quedó atrapado. Rugía y rugía, pero cuanto más se movía, más se enredaba.

El ratoncito escuchó los rugidos y corrió a ver qué pasaba. Sin perder tiempo, empezó a roer las cuerdas con sus dientes filosos. Una, dos, tres, diez cuerdas. Hasta que la red se abrió y el león quedó libre.

—Te reíste cuando te dije que te iba a ayudar —le dijo el ratón—. Ahora ya sabés que hasta un ratón puede ser útil a un león.

Moraleja: nadie es tan pequeño que no pueda ayudar, ni tan grande que no necesite ayuda.`},{title:"La cigarra y la hormiga",illustration:"huerta",content:`Durante todo el verano, la cigarra se la pasó cantando bajo el sol. Cantaba a la mañana, a la tarde y a la noche.

Cerca de ella, una hormiga trabajaba sin parar. Iba y venía cargando semillas y migas, y las guardaba en su hormiguero.

—Hormiga, ¿por qué trabajás tanto? —le preguntó la cigarra—. ¡Vení a cantar conmigo!

—Estoy guardando comida para el invierno —contestó la hormiga—. Deberías hacer lo mismo.

La cigarra se encogió de hombros y siguió cantando.

Llegó el invierno. El frío cubrió el campo y ya no había ni una semilla. La cigarra, con hambre y con frío, golpeó la puerta del hormiguero.

—Hormiga, ¿me darías un poco de comida?

La hormiga la miró un momento. Después abrió la puerta.

—Pasá. Hay para las dos. Pero este verano, vamos a trabajar juntas. Y a la tarde, si querés, me enseñás a cantar.

Moraleja: hay que pensar en el futuro… y también saber compartir.

(En la fábula antigua, la hormiga no ayudaba a la cigarra. ¿Qué final te gusta más? ¿Por qué?)`},{title:"El pastorcito mentiroso",illustration:"montanas",content:`En un pueblo de montaña vivía un pastorcito que cuidaba las ovejas. Pasaba los días solo en el cerro y se aburría mucho.

Un día se le ocurrió una broma. Corrió hacia el pueblo gritando:

—¡El lobo! ¡Viene el lobo! ¡Ayuda!

Los vecinos dejaron lo que estaban haciendo y subieron corriendo con palos y escobas. Pero cuando llegaron, no había ningún lobo. El pastorcito se reía a carcajadas.

A la semana siguiente hizo lo mismo. Y otra vez los vecinos subieron corriendo, y otra vez no encontraron nada.

Un atardecer, un lobo de verdad salió del bosque y se acercó a las ovejas. El pastorcito, asustado, corrió al pueblo:

—¡El lobo! ¡Esta vez es verdad! ¡Por favor!

Pero los vecinos lo miraron y siguieron con sus cosas. "Otra vez sus bromas", pensaron.

Esa noche, el pastorcito perdió varias ovejas. Y entendió algo que nunca olvidó: cuando alguien miente muchas veces, después nadie le cree, aunque diga la verdad.

Moraleja: la confianza tarda mucho en ganarse y muy poco en perderse.`}],quiz:[{question:"¿Por qué perdió la carrera la liebre?",options:["Porque se lastimó","Porque se quedó dormida confiada","Porque la tortuga hizo trampa","Porque llovió"],correct:1,explanation:"La liebre confió demasiado en su velocidad y se durmió."},{question:"¿Cómo ayudó el ratón al león?",options:["Le trajo comida","Royó las cuerdas de la red","Llamó a otros leones","Asustó a los cazadores"],correct:1,explanation:"Con sus dientes cortó la red y lo liberó."},{question:"¿Qué hacía la hormiga durante el verano?",options:["Dormía","Cantaba","Guardaba comida para el invierno","Viajaba"],correct:2,explanation:"La hormiga pensaba en el invierno que iba a llegar."},{question:"¿Por qué nadie ayudó al pastorcito cuando vino el lobo de verdad?",options:["Porque estaban dormidos","Porque había mentido muchas veces","Porque no lo escucharon","Porque tenían miedo"],correct:1,explanation:"Después de tantas bromas, los vecinos ya no le creían."}]},{id:14,slug:"el-patito-feo",title:"El patito feo",author:"Hans Christian Andersen (adaptación de la Biblioteca)",synopsis:"De un huevo grande y gris nace un patito distinto a sus hermanos. Todos se burlan de él y tiene que irse lejos. Durante un largo invierno, aprenderá a resistir… hasta descubrir quién es en realidad.",genres:["Cuento","Valores"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"oceano",c1:"#bde4f4",c2:"#5d9cc9"},status:"published",featured:!1,license:"Adaptación libre de «El patito feo» de Hans Christian Andersen (1843), obra de dominio público",createdBy:null,createdAt:"2026-10-10 12:00:00",updatedAt:"2026-10-10 12:00:00",chapters:[{title:"Un huevo distinto",illustration:"bosque",content:`Era verano en el campo. Los trigales brillaban dorados y, junto al lago, una pata empollaba sus huevos.

Un día, los huevos empezaron a romperse: ¡crac, crac, crac! Salieron unos patitos amarillos y suaves que piaban sin parar. Pero quedaba un huevo, el más grande de todos, que no se rompía.

—Ese huevo es raro —dijo una pata vieja que pasaba por ahí—. No le hagas caso.

Pero la mamá pata esperó, paciente. Hasta que el huevo grande se rompió y salió un patito gris, grandote y torpe, que no se parecía en nada a sus hermanos.

—¡Qué feo es! —dijeron los otros patos del corral.

Los patos lo picoteaban, las gallinas lo empujaban y hasta la chica que les daba de comer lo apartaba con el pie. Sus propios hermanos le decían:

—¡Ojalá te lleve el gato, patito feo!

El patito estaba tan triste que, una mañana, pasó por debajo del cerco y se fue lejos, muy lejos, hasta un pantano donde vivían patos salvajes.`},{title:"El largo invierno",illustration:"montanas",content:`En el pantano tampoco lo quisieron mucho. Los patos salvajes le decían que era feísimo, aunque lo dejaron quedarse. Un día se escucharon disparos de cazadores y el patito tuvo que esconderse entre los juncos, temblando de miedo.

Siguió caminando hasta que llegó a una cabaña. Allí vivían una anciana, un gato y una gallina. El gato y la gallina se creían muy importantes.

—¿Sabés poner huevos? —le preguntó la gallina.

—No.

—¿Sabés ronronear? —le preguntó el gato.

—No. Pero sé nadar, y me encanta meter la cabeza debajo del agua.

—¡Qué tontería! —dijeron los dos.

El patito se fue otra vez. Llegó el otoño, las hojas se pusieron rojas y una tarde vio pasar en el cielo unas aves hermosas, blancas, de cuello largo, que volaban hacia tierras cálidas. El patito sintió algo muy fuerte en el pecho, como si las conociera.

Después llegó el invierno. Hacía tanto frío que el agua del estanque se congeló, y el patito quedó atrapado en el hielo. Un campesino lo encontró, rompió el hielo con su zueco y se lo llevó a su casa. Pero los niños quisieron jugar con él, el patito se asustó, volcó la leche y la harina, y tuvo que escapar otra vez.

Pasó el resto del invierno solo, escondido entre los juncos. Fue el invierno más largo de su vida.`},{title:"La primavera",illustration:"oceano",content:`Un día el sol empezó a calentar. Las alondras cantaron y los árboles se llenaron de flores. El patito estiró las alas y notó algo: eran fuertes. Las movió, y sin darse cuenta, ¡voló!

Bajó en un jardín enorme, junto a un lago. Allí nadaban tres de aquellas aves blancas y hermosas que había visto en otoño. Eran cisnes.

"Seguro que me van a echar porque soy feo", pensó. "Pero prefiero que me echen ellos y no seguir solo".

Nadó hacia ellos con la cabeza baja, mirando el agua. Y entonces vio su reflejo.

No era un pato gris y torpe. Era un cisne blanco, de cuello largo y plumas brillantes.

Los otros cisnes nadaron a su alrededor y le acariciaron las plumas con el pico. Unos niños que jugaban en la orilla gritaron:

—¡Hay un cisne nuevo! ¡Es el más lindo de todos!

El cisne joven escondió la cabeza bajo el ala, porque no sabía qué hacer con tanta felicidad. No se puso orgulloso: un corazón bueno no se vuelve orgulloso. Recordó todo lo que había sufrido y pensó que, gracias a eso, ahora sabía valorar a quienes lo trataban bien.

Y nunca se olvidó de algo: no importa en qué corral hayas nacido si saliste de un huevo de cisne.`}],quiz:[{question:"¿Por qué los demás molestaban al patito?",options:["Porque era malo","Porque era distinto a ellos","Porque comía mucho","Porque no sabía nadar"],correct:1,explanation:"Lo rechazaban sólo por ser diferente."},{question:"¿Qué aves vio el patito en el cielo durante el otoño?",options:["Gaviotas","Cisnes","Palomas","Patos"],correct:1,explanation:"Eran cisnes, y sintió que los conocía."},{question:"¿Qué descubrió el patito al mirar su reflejo?",options:["Que se había mojado","Que era un cisne","Que estaba más gordo","Que tenía otro color de ojos"],correct:1,explanation:"Había crecido y era un hermoso cisne."},{question:"¿Qué nos enseña el cuento?",options:["Que hay que burlarse de los distintos","Que cada uno tiene su tiempo para crecer y que no hay que juzgar por la apariencia","Que los patos son malos","Que el invierno es largo"],correct:1,explanation:'Lo que parecía "feo" era sólo alguien diferente que todavía estaba creciendo.'}]},{id:15,slug:"ramona-la-nube",title:"Ramona, la nube que no quería llover",author:"Inés Larralde",synopsis:"Ramona es una nube esponjosa a la que le encanta pasear por el cielo. Pero tiene un problema: no quiere llover, porque piensa que si llueve va a desaparecer. Un viaje por el campo le mostrará el secreto del ciclo del agua.",genres:["Ciencia","Cuento","Naturaleza"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"montanas",c1:"#a1c4fd",c2:"#c2e9fb"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-12 00:00:00",updatedAt:"2026-10-12 00:00:00",chapters:[{title:"Una nube muy esponjosa",illustration:"montanas",content:`Ramona era la nube más esponjosa del cielo. Era blanca como el algodón y le gustaba cambiar de forma: a veces parecía un conejo, a veces un barco y a veces una torta de cumpleaños.

Ramona se paseaba sobre los campos y las ciudades, y los chicos la señalaban desde abajo:

—¡Mirá, una nube con forma de dragón!

Pero un día, Ramona empezó a sentirse pesada. Muy pesada. Se había llenado de gotitas de agua, y se estaba poniendo gris.

—Ramona, ya es hora de llover —le dijo su amiga, la nube Petra.

—¡No quiero! —contestó Ramona—. Si llueve, me voy a vaciar, me voy a achicar y voy a desaparecer para siempre.

Y se escondió detrás de una montaña, apretando todas sus gotitas para que no se cayera ninguna.

Mientras tanto, abajo, en el campo, la tierra estaba seca y agrietada. Las plantas de maíz tenían las hojas caídas. El arroyo era apenas un hilo de agua. Y un granjero, Don Anselmo, miraba el cielo y suspiraba:

—Si no llueve pronto, se pierde toda la cosecha.`},{title:"El viaje de una gota",illustration:"huerta",content:`Esa noche, Ramona no podía dormir. Estaba tan pesada que una gotita se le escapó. Plic. La gotita cayó, cayó y cayó, y aterrizó en una hoja de maíz.

—¡Gracias! —dijo la planta, que tenía mucha sed.

Ramona se asomó y vio que la gotita no había desaparecido. Seguía ahí, brillando en la hoja.

Entonces el sol de la mañana le habló:

—Ramona, te voy a contar un secreto. El agua no desaparece nunca: viaja. Cuando llueve, el agua cae a la tierra. Una parte la toman las plantas y los animales. Otra parte corre por los arroyos y los ríos hasta el mar. Y cuando yo caliento el agua del mar, de los ríos y de las hojas, el agua se convierte en vapor, sube invisible al cielo y forma nubes nuevas. Eso se llama evaporación.

—¿Y después?

—Después, cuando el vapor sube alto, donde hace frío, se vuelve a juntar en gotitas. Eso se llama condensación. Así nacen las nubes, como vos. Y cuando las gotitas son muchas y pesadas, cae la lluvia, que se llama precipitación. Y todo empieza otra vez. Es un viaje que no termina nunca: el ciclo del agua.

Ramona se quedó pensando.

—Entonces… si llueve, ¿después vuelvo?

—Siempre volvés —dijo el sol—. Tal vez con otra forma. Tal vez en otro cielo. Pero el agua que sos hoy va a seguir viajando por el mundo.`},{title:"La lluvia más feliz",illustration:"bosque",content:`Ramona tomó aire, si es que las nubes toman aire, y dejó de apretar sus gotitas.

Plic, plic, plic. Primero cayeron unas pocas. Después muchas más. ¡Y finalmente, una lluvia alegre y fresca cayó sobre todo el campo!

Las plantas de maíz levantaron sus hojas. El arroyo empezó a correr cantando. Las ranas croaron de felicidad. Y Don Anselmo salió al patio, levantó la cara hacia el cielo y se rió, empapado.

Ramona se fue haciendo cada vez más chiquita, más chiquita, hasta que se deshizo en el aire. Pero no tuvo miedo, porque ahora conocía el secreto.
