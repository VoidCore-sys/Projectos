Sus gotitas corrieron por el arroyo, llegaron al río y del río al mar. Algunas las tomó una vaca. Otras se quedaron en las raíces de un árbol.

Unos días después, el sol calentó el mar. Una nube nueva empezó a formarse sobre las olas, blanca, esponjosa, con forma de conejo.

Si alguna vez ves una nube con forma de conejo, saludala. Quizás sea Ramona, que volvió a pasear por el cielo.`}],quiz:[{question:"¿Por qué Ramona no quería llover?",options:["Porque le daba frío","Porque pensaba que iba a desaparecer para siempre","Porque no sabía cómo","Porque estaba enojada"],correct:1,explanation:"Creía que al llover se iba a terminar."},{question:"¿Cómo se llama cuando el sol calienta el agua y la convierte en vapor?",options:["Precipitación","Evaporación","Congelación","Condensación"],correct:1,explanation:"El agua se evapora y sube al cielo."},{question:"¿Qué es la precipitación?",options:["Cuando cae la lluvia","Cuando sale el sol","Cuando sopla el viento","Cuando se forma un río"],correct:0,explanation:"La lluvia, la nieve y el granizo son precipitaciones."},{question:"¿Qué aprendió Ramona?",options:["Que el agua desaparece","Que el agua viaja en un ciclo que no termina","Que las nubes son de algodón","Que el sol es malo"],correct:1,explanation:"El agua se evapora, se condensa y vuelve a caer: es el ciclo del agua."}]},{id:16,slug:"tuerquita-el-robot-que-aprendio-a-reir",title:"Tuerquita, el robot que aprendió a reír",author:"Diego Saravia",synopsis:"La escuela recibe un robot ayudante que sabe todas las respuestas, ordena los lápices en un segundo y nunca se equivoca. Pero Tuerquita no entiende los chistes, no sabe jugar a la mancha y nunca se ríe. Los chicos de segundo grado se proponen enseñarle lo más difícil de todo.",genres:["Humor","Ciencia ficción","Valores"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"robot",c1:"#ffd6a5",c2:"#ff8fab"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-13 12:00:00",updatedAt:"2026-10-13 12:00:00",chapters:[{title:"Un compañero nuevo",illustration:"escuela",content:`Un lunes, la seño Paula entró al aula de segundo grado con una caja enorme.

—Chicos, les presento a un compañero muy especial.

De la caja salió un robot redondo, del tamaño de un perro, con dos ruedas, dos brazos finitos y una pantalla en la cara donde se veían dos ojitos celestes.

—Hola. Soy el Robot Ayudante Modelo T-200. Puedo ordenar, calcular, deletrear y medir. Encantado de conocerlos.

—¡Se va a llamar Tuerquita! —gritó Benjamín. Y así se quedó.

Tuerquita era increíble. Sabía cuánto era 348 más 159 antes de que terminaras de preguntar. Ordenaba todos los lápices por color en un segundo. Sabía cómo se escribía "zanahoria" y "hipopótamo".

Pero había cosas que no entendía.

En el recreo, Lola le contó un chiste:

—Tuerquita, ¿qué le dijo un semáforo a otro? ¡No me mires, que me estoy cambiando!

Todos se rieron. Tuerquita se quedó quieto.

—Error. Los semáforos no hablan. Tampoco se cambian de ropa. La información es incorrecta.

Los chicos se miraron. Tuerquita sabía muchísimo, pero no sabía reírse.`},{title:"Lecciones de risa",illustration:"robot",content:`Los chicos de segundo grado decidieron que iban a enseñarle a Tuerquita a reír. Hicieron un plan, como hacen los científicos.

El martes le enseñaron a jugar a la mancha. Tuerquita corría muy rápido, pero cuando lo tocaban, decía: "Error. Fui alcanzado. Fin del juego". Y se iba a un rincón.

—¡No, Tuerquita! —le explicó Martina—. Si te tocan, ahora la mancha sos vos. ¡El juego sigue! Lo divertido no es ganar, es correr juntos.

Tuerquita se quedó pensando. Sus ojitos parpadearon. Después salió corriendo detrás de Benjamín, y por primera vez dijo algo raro:

—¡Mancha! ¡Te toqué! ¡Mancha vos!

El miércoles le hicieron cosquillas. No funcionó, porque Tuerquita no tenía cosquillas. Pero cuando Lola se tropezó con una pelota y cayó sentada sobre un almohadón con cara de sorpresa, todos se rieron, Lola también, y en la pantalla de Tuerquita apareció una línea curvada, como una sonrisita.

El jueves, Benjamín le contó a Tuerquita el chiste más malo del mundo:

—¿Qué le dijo el número uno al número diez? ¡Para ser como yo, tenés que ser sincero!

Tuerquita calculó. Uno. Diez. Sin cero. Sin-cero. Sincero. Su pantalla se iluminó.

—Comprendo. Es un juego de palabras. Es… ¡ji! ¡Ji, ji!

Era la risa más rara que habían escuchado: sonaba como una tetera con hipo. Pero era una risa.`},{title:"El mejor regalo",illustration:"escuela",content:`El viernes era el cumpleaños de la seño Paula. Los chicos querían hacerle una sorpresa, pero no se ponían de acuerdo. Unos querían cantar, otros querían hacer una torta de plastilina y otros querían hacer un dibujo gigante.

Empezaron a discutir. Todos hablaban al mismo tiempo. Martina se puso a llorar.

Entonces Tuerquita rodó hasta el medio del aula.

—Propuesta: si cantamos MIENTRAS mostramos el dibujo gigante QUE TIENE una torta dibujada, hacemos las tres cosas al mismo tiempo.

Todos se quedaron callados. Era una idea perfecta. Era la idea de un robot que sabía calcular… pero también de un amigo que quería que nadie estuviera triste.

Cuando la seño Paula entró, todos cantaron el feliz cumpleaños mientras levantaban un dibujo enorme con una torta de veinte velas. Tuerquita cantaba también, con voz de robot, desafinando muchísimo. La seño se rió tanto que le cayeron lágrimas.

—¿Por qué te reís, seño? —preguntó Tuerquita.

—Porque estoy feliz, Tuerquita.

El robot procesó la información.

—Entonces yo también me estoy riendo por eso. ¡Ji, ji, ji!

Ese día, en la libreta de Tuerquita, la seño escribió: "Aprendió a sumar, a restar y a deletrear. Pero lo más importante: aprendió a ser compañero".`}],quiz:[{question:"¿Qué cosas sabía hacer muy bien Tuerquita?",options:["Contar chistes","Calcular, ordenar y deletrear","Cocinar","Bailar"],correct:1,explanation:"Era un robot ayudante muy rápido para calcular y ordenar."},{question:"¿Qué le explicó Martina sobre la mancha?",options:["Que lo importante es ganar","Que lo divertido es jugar juntos","Que los robots no pueden jugar","Que hay que correr despacio"],correct:1,explanation:"Si te tocan, el juego sigue: lo divertido es compartirlo."},{question:"¿Por qué es gracioso el chiste del número uno?",options:['Porque "sin cero" suena como "sincero"',"Porque los números hablan","Porque el diez es grande","No es gracioso"],correct:0,explanation:"Es un juego de palabras: sin-cero / sincero."},{question:"¿Cómo ayudó Tuerquita a resolver la discusión?",options:["Gritando","Proponiendo juntar todas las ideas","Eligiendo la suya","Llamando a la directora"],correct:1,explanation:"Propuso hacer las tres cosas a la vez para que todos estuvieran contentos."}]},{id:17,slug:"la-bruja-bruna-y-su-escoba-resfriada",title:"La bruja Bruna y su escoba resfriada",author:"Clara Montiel",synopsis:"Bruna es una bruja joven que vive en lo alto de un castillo torcido. Esta noche se celebra la gran Carrera de Escobas, pero su escoba, Ventarrón, amaneció con un resfrío terrible: cada vez que estornuda, sale volando para cualquier lado.",genres:["Fantasía","Humor","Aventura"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"castillo",c1:"#cdb4ff",c2:"#6a4c93"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-15 00:00:00",updatedAt:"2026-10-15 00:00:00",chapters:[{title:"¡Achís!",illustration:"castillo",content:`En lo alto de una colina había un castillo torcido, con torres que se inclinaban como si estuvieran cansadas. Allí vivía la bruja Bruna, que tenía nueve años de bruja, un sombrero violeta lleno de remiendos y un gato naranja llamado Mermelada.

Bruna estaba feliz: esa noche, con luna llena, se iba a hacer la gran Carrera de Escobas, y ella iba a participar por primera vez.

—Ventarrón, ¡arriba! —le dijo a su escoba—. Hoy es nuestro gran día.

La escoba se levantó del rincón… y estornudó.

—¡ACHÍS!

Con el estornudo, Ventarrón salió disparada, dio tres vueltas por la cocina, tiró la olla de sopa de calabaza y se quedó pegada al techo, temblando.

—¡Ay, no! —dijo Bruna—. ¡Ventarrón, estás resfriada!

La escoba tenía las ramitas todas paradas y le goteaba la punta. Cada vez que intentaba volar derecho: ¡ACHÍS!, y salía para cualquier lado.

Mermelada se lamió una pata con cara de "te lo dije".

—Te dije que no volaras bajo la lluvia anoche —maulló.`},{title:"Remedios de bruja",illustration:"luna",content:`Bruna abrió su gran libro de hechizos y buscó en la letra R: "Remedios para escobas resfriadas".

—Acá está. Primer remedio: un caldo de hojas de eucalipto con una pizca de polvo de estrellas.

Preparó el caldo, sopló para enfriarlo y se lo dio a Ventarrón. La escoba lo tomó por la punta, como si fuera un sorbete. Se quedó quieta un momento… y estornudó tan fuerte que el caldo salió volando y le cayó a Mermelada en la cabeza.

—Segundo remedio —leyó Bruna, mientras el gato se sacudía furioso—: una bufanda tejida con lana de oveja de las nubes.

Bruna no tenía lana de oveja de las nubes, así que le puso a Ventarrón la bufanda de su abuela, que era roja con rayas verdes. La escoba se veía muy elegante. Pero en cuanto intentó volar: ¡ACHÍS! Y se fue de cabeza contra la biblioteca. Cayeron veinte libros, y uno de ellos se abrió en una página que decía: "Para curar un resfrío no hay hechizo mejor que descansar y que te cuiden".

Bruna miró el reloj. Faltaba una hora para la carrera.

Miró a Ventarrón, que estaba tirada en el piso, con la bufanda torcida y los ojos llorosos (porque las escobas mágicas también tienen ojos, aunque no se vean).

—No podemos correr así —dijo Bruna, despacio—. Vos estás enferma.`},{title:"La carrera más rara",illustration:"castillo",content:`Esa noche, mientras las otras brujas se juntaban para la carrera, Bruna se quedó en el castillo. Hizo una cama de almohadones para Ventarrón, la tapó con una manta y le leyó un cuento. Mermelada, aunque seguía ofendido por el caldo, se acostó al lado de la escoba para darle calor.

De pronto, golpearon la ventana. Era la bruja más anciana del bosque, Doña Escarcha, con su escoba de plata.

—Bruna, ¿no venís a la carrera?

—No puedo, Doña Escarcha. Ventarrón está resfriada y prefiero cuidarla.

La anciana sonrió y bajó de su escoba.

—¿Sabés una cosa? Hace cien años, en mi primera carrera, mi escoba también se enfermó. Yo la obligué a volar igual. Nos caímos en un pantano y ella estuvo un mes sin poder levantarse. Vos elegiste mejor.

Doña Escarcha sacó de su bolsillo un frasquito con miel de flores de luna.

—Una cucharadita antes de dormir. Mañana va a estar como nueva.

Al día siguiente, Ventarrón se despertó con las ramitas brillantes y sin un solo estornudo. Bruna se subió de un salto y volaron sobre el bosque, rápido y derecho, haciendo piruetas entre las nubes.

No habían ganado ninguna carrera. Pero Bruna sentía que había ganado algo mejor: una escoba sana y feliz, que la quería muchísimo.

Y el año siguiente, en la Carrera de Escobas, Bruna y Ventarrón llegaron… terceras. ¡Pero con la bufanda roja con rayas verdes flameando al viento!`}],quiz:[{question:"¿Qué le pasaba a Ventarrón?",options:["Estaba rota","Estaba resfriada y estornudaba","Tenía miedo de volar","Se había perdido"],correct:1,explanation:"Cada estornudo la hacía salir volando para cualquier lado."},{question:"¿Qué decía la página del libro que se abrió sola?",options:["Que hay que volar igual","Que lo mejor es descansar y que te cuiden","Que hay que comprar otra escoba","Que el gato tenía la culpa"],correct:1,explanation:"El mejor remedio era descansar y recibir cuidados."},{question:"¿Qué decidió Bruna?",options:["Correr igual","Quedarse a cuidar a su escoba","Pedir prestada otra escoba","Hacer trampa"],correct:1,explanation:"Eligió cuidar a Ventarrón antes que competir."},{question:"¿Qué le contó Doña Escarcha?",options:["Que ella había obligado a su escoba enferma a volar y le fue mal","Que la carrera se había suspendido","Que Bruna había ganado","Que las escobas no se enferman"],correct:0,explanation:"Por eso le dijo a Bruna que había elegido mejor."}]},{id:18,slug:"mateo-y-los-gigantes-de-la-patagonia",title:"Mateo y los gigantes de la Patagonia",author:"Martín Aldaz",synopsis:"Mateo visita con su clase un museo de paleontología. Cuando se separa del grupo, un esqueleto gigante le guiña un ojo y lo invita a un viaje de millones de años, a la Patagonia de los dinosaurios más grandes que existieron.",genres:["Ciencia","Aventura","Fantasía"],gradeMin:2,gradeMax:3,section:1,cover:{scene:"montanas",c1:"#f9c784",c2:"#a0522d"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-16 12:00:00",updatedAt:"2026-10-16 12:00:00",chapters:[{title:"El esqueleto que guiñó un ojo",illustration:"castillo",content:`La excursión de tercer grado era al museo de ciencias naturales. Mateo estaba tan emocionado que no había dormido en toda la noche: le encantaban los dinosaurios y sabía los nombres de un montón.

En la sala principal había un esqueleto enorme, tan largo que la cola llegaba hasta la otra punta del salón y la cabeza casi tocaba el techo.

—Este es un Argentinosaurus —explicó la guía—. Vivió en lo que hoy es la provincia de Neuquén, hace unos noventa millones de años. Es uno de los animales más grandes que caminaron sobre la Tierra. Podía medir más de treinta metros: ¡como tres colectivos uno detrás del otro!

Mateo se quedó mirándolo con la boca abierta. Tanto, que no se dio cuenta de que el grupo se iba a la sala siguiente. Se quedó solo.

Entonces escuchó un crujido. Levantó la vista. La enorme cabeza del esqueleto estaba girando, muy despacio, hacia él. Y uno de los huecos de los ojos… le guiñó.

—Hola, Mateo —dijo una voz grave, como un trueno lejano—. Me llamo Tita. ¿Querés ver cómo era mi casa?

Antes de que pudiera contestar, el piso del museo se volvió de arena, las paredes se volvieron cielo, y Mateo sintió un viento caliente en la cara.`},{title:"La Patagonia de hace millones de años",illustration:"montanas",content:`Mateo estaba en una llanura enorme, con ríos anchos, helechos gigantes y árboles altísimos. Hacía calor. A su lado, Tita ya no era un esqueleto: era una Argentinosaurus de verdad, con piel gris verdosa y un cuello tan largo que su cabeza se perdía entre las copas de los árboles.

—Bienvenido a la Patagonia del período Cretácico —dijo Tita—. En esta época, todo esto era muy distinto. No había personas, ni ciudades, ni rutas.

Tita arrancó un montón de hojas de lo alto de un árbol y se las tragó sin masticar.

—¿Sólo comés plantas? —preguntó Mateo.

—Sí. Soy herbívora. Como muchísimas plantas por día. Para ser tan grande, hay que comer mucho.

De pronto, la tierra tembló. Entre los árboles apareció otro dinosaurio, de dientes filosos como cuchillos y patas poderosas. Caminaba en dos patas y rugía.

—Es un Giganotosaurus —susurró Tita—. Uno de los carnívoros más grandes que existieron. También vivió acá, en la Patagonia. Pero no te preocupes: a mí no se anima a atacarme. Soy demasiado grande para él.

El Giganotosaurus las miró, olfateó el aire y se fue por donde había venido. Mateo soltó el aire que estaba aguantando.

—¿Y cómo saben los científicos todo esto, si nadie estuvo acá?

—Por los fósiles —dijo Tita—. Cuando un animal muere, a veces queda cubierto de barro y arena. Con millones de años, sus huesos se convierten en piedra. Los paleontólogos los encuentran, los estudian como detectives y descubren cómo éramos.`},{title:"El cuaderno de un paleontólogo",illustration:"escuela",content:`—Es hora de volver —dijo Tita—. Tus compañeros te están buscando.

—¿Te voy a volver a ver?

—Cada vez que vayas a un museo, Mateo. Y quizás algún día seas vos el que encuentre un hueso nuevo en el desierto.

El viento caliente sopló otra vez, la arena se volvió baldosas y el cielo se volvió techo. Mateo estaba en la sala del museo, frente al esqueleto quieto, y la seño lo llamaba desde la puerta.

—¡Mateo! ¡Te estábamos buscando!

Mateo corrió hacia el grupo. Antes de salir, miró hacia atrás. El esqueleto estaba igual que siempre. ¿O le pareció que la cola se había movido un poquito?

En la sala siguiente había una mesa donde una paleontóloga limpiaba un hueso con un pincel finito.

—Esto se hace con mucha paciencia —les explicó—. Un hueso fósil puede tardar semanas en limpiarse. Y en la Patagonia todavía hay muchísimos dinosaurios por descubrir.

Mateo levantó la mano.

—¿Qué hay que estudiar para ser paleontólogo?

—Mucha ciencia, mucha paciencia y muchas ganas de preguntarse cosas —sonrió ella.

Esa noche, Mateo abrió un cuaderno nuevo y escribió en la tapa: "Cuaderno de un paleontólogo". En la primera página dibujó a Tita, con su cuello larguísimo. Y abajo, con su mejor letra, escribió: "Argentinosaurus. Herbívora. Neuquén. Mi amiga".`}],quiz:[{question:"¿Dónde vivió el Argentinosaurus?",options:["En Europa","En lo que hoy es Neuquén, en la Patagonia","En el mar","En la Antártida"],correct:1,explanation:"Sus restos se encontraron en la provincia de Neuquén."},{question:"¿Qué comía Tita?",options:["Carne","Peces","Plantas","Insectos"],correct:2,explanation:"Era herbívora: comía hojas y plantas."},{question:"¿Qué es un fósil?",options:["Un hueso de plástico","Restos de un ser vivo que con millones de años se convirtieron en piedra","Un dinosaurio vivo","Una piedra preciosa"],correct:1,explanation:"Los fósiles permiten saber cómo eran los seres que vivieron hace mucho."},{question:"¿Qué hace falta para ser paleontólogo, según la científica?",options:["Ser muy fuerte","Ciencia, paciencia y ganas de preguntarse cosas","Tener un dinosaurio","Vivir en un museo"],correct:1,explanation:"La paleontología requiere estudio y mucha paciencia."}]},{id:19,slug:"la-lechuza-que-tenia-miedo-de-la-oscuridad",title:"La lechuza que tenía miedo de la oscuridad",author:"Rocío Benavídez",synopsis:"Todas las lechuzas salen de noche. Todas, menos Lunita, que tiene miedo de la oscuridad. Con la ayuda de una luciérnaga, un murciélago y un zorrito, descubrirá que la noche está llena de cosas maravillosas.",genres:["Cuento","Valores","Naturaleza"],gradeMin:1,gradeMax:2,section:1,cover:{scene:"luna",c1:"#3d348b",c2:"#7678ed"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-18 00:00:00",updatedAt:"2026-10-18 00:00:00",chapters:[{title:"Lunita no quiere salir",illustration:"luna",content:`En el hueco de un árbol viejo vivía una familia de lechuzas. Durante el día dormían, y cuando el sol se escondía, salían a volar por el bosque.

Pero Lunita, la lechuza más chiquita, no quería salir.

—Tengo miedo de la oscuridad —decía, escondida bajo el ala de su mamá.

—Pero Lunita, somos lechuzas —le explicaba su mamá—. Nuestros ojos son grandes para ver de noche. Y nuestras orejas escuchan hasta el ruido más chiquito.

—Igual tengo miedo. En la oscuridad hay ruidos raros y sombras que se mueven.

Esa noche, sus hermanos salieron a volar y Lunita se quedó sola en la puerta del árbol, mirando la noche. Estaba todo negro. Se escuchaba un "cri-cri-cri" y un "fru-fru-fru". Lunita cerró los ojos con fuerza.

Entonces sintió una lucecita cálida frente a la cara.

—Hola. ¿Por qué tenés los ojos cerrados? —preguntó una vocecita.

Lunita abrió un ojo. Frente a ella flotaba una luciérnaga, con la colita encendida como una linterna.`},{title:"Amigos de la noche",illustration:"bosque",content:`La luciérnaga se llamaba Chispa.

—Yo te acompaño —dijo—. Así ves que la noche no es tan oscura.

Lunita salió del árbol, despacito. Chispa iluminaba el camino.

—¿Ese "cri-cri-cri" qué es? —preguntó Lunita, temblando.

—Son los grillos. Cantan frotando las alas. Están dando un concierto.

—¿Y ese "fru-fru-fru"?

Desde una rama colgaba un animalito cabeza abajo, envuelto en sus alas como en una capa.

—Soy yo —dijo—. Me llamo Bati. Soy un murciélago. Ese ruido son mis alas cuando vuelo. ¿Sabías que yo veo con las orejas? Hago unos sonidos muy agudos y escucho el eco. Así sé dónde están las cosas, aunque esté todo oscuro.

Lunita estaba asombrada. Siguieron caminando y vieron dos ojitos brillando entre los arbustos. Lunita se escondió detrás de Chispa. Pero era un zorrito, que salía a buscar frutos.

—Buenas noches —dijo el zorro—. La noche es la mejor hora para pasear. Hay silencio, hay frescura, y mirá para arriba.

Lunita levantó la cabeza. El cielo estaba lleno de estrellas, miles y miles, y en el medio, redonda y brillante, estaba la luna.

—¡Qué lindo! —dijo Lunita—. Nunca la había visto.`},{title:"El primer vuelo",illustration:"luna",content:`—¿Te animás a volar? —le preguntó Chispa.

Lunita miró sus alas. Miró la luna. Respiró hondo, abrió las alas y saltó de la rama.

Al principio volaba torcida, pero enseguida se dio cuenta de algo: ¡veía todo! Sus ojos grandes se habían acostumbrado y podía ver los árboles, el río plateado por la luna, las flores que se abrían de noche. Y sus orejas escuchaban a los grillos, el agua, el viento entre las hojas.

Voló por encima del bosque, junto a Bati el murciélago, y Chispa iba detrás, dejando una estela de luz.

Cuando volvió al árbol, su mamá la estaba esperando con los ojos muy abiertos.

—¡Lunita! ¡Volaste de noche!

—Sí, mamá. Y ¿sabés qué? La oscuridad no estaba vacía. Estaba llena de amigos.

Desde esa noche, Lunita sale a volar cada vez que se esconde el sol. A veces todavía siente un poquito de miedo, porque el miedo no se va de golpe. Pero ahora sabe que el miedo se achica cuando uno conoce lo que lo asusta. Y que siempre es más fácil con amigos al lado.`}],quiz:[{question:"¿De qué tenía miedo Lunita?",options:["Del agua","De la oscuridad","De los gatos","De volar alto"],correct:1,explanation:"Le daban miedo la noche, sus ruidos y sus sombras."},{question:'¿Cómo "ve" el murciélago en la oscuridad?',options:["Con una linterna","Escuchando el eco de sus sonidos","Con anteojos","No ve nada"],correct:1,explanation:"Los murciélagos se orientan con el eco."},{question:"¿Qué ruido hacían los grillos?",options:["Fru-fru-fru","Cri-cri-cri","Uh-uh-uh","Plic-plic"],correct:1,explanation:"Los grillos cantan frotando sus alas."},{question:"¿Qué descubrió Lunita sobre el miedo?",options:["Que se va de golpe","Que se achica cuando conocemos lo que nos asusta","Que nunca se va","Que hay que esconderse"],correct:1,explanation:"Conocer la noche y tener amigos la ayudó a animarse."}]},{id:20,slug:"la-liga-de-los-pelirrojos",title:"Sherlock Holmes: La liga de los pelirrojos",author:"Arthur Conan Doyle (adaptación de la Biblioteca)",synopsis:"Un comerciante de pelo rojo como el fuego recibe un trabajo extrañísimo: copiar la enciclopedia a cambio de mucho dinero, sólo por ser pelirrojo. Cuando el trabajo desaparece de un día para el otro, Sherlock Holmes y el doctor Watson descubren que detrás de la broma se esconde un plan audaz.",genres:["Policial","Misterio"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"ciudad",c1:"#5a3e36",c2:"#c0392b"},status:"published",featured:!0,license:"Adaptación libre de «La liga de los pelirrojos» de Arthur Conan Doyle (1891), obra de dominio público",createdBy:null,createdAt:"2026-10-19 12:00:00",updatedAt:"2026-10-19 12:00:00",chapters:[{title:"Un trabajo demasiado bueno",illustration:"ciudad",content:`Londres, otoño de 1890. En el departamento de la calle Baker 221B, el detective Sherlock Holmes escuchaba con atención a un visitante robusto, de cara colorada y con un pelo tan rojo que parecía en llamas. Su amigo, el doctor Watson, tomaba notas.

—Me llamo Jabez Wilson —dijo el hombre—. Tengo una pequeña casa de empeños cerca de la plaza Saxe-Coburg. El negocio no anda muy bien, así que tengo un solo empleado, Vincent Spaulding. Trabaja por la mitad del sueldo para aprender el oficio. Es muy listo, aunque tiene una manía: se pasa horas en el sótano revelando fotografías.

—Siga, por favor —dijo Holmes.

—Hace dos meses, Spaulding me mostró un aviso en el diario. Decía que una tal "Liga de los Pelirrojos" ofrecía un puesto bien pagado a un hombre de pelo rojo. Spaulding insistió tanto que fui a la dirección. Había una fila enorme de pelirrojos, ¡de todos los tonos! Pero el señor que entrevistaba, un tal Duncan Ross, me eligió a mí. Hasta me tiró del pelo para comprobar que no fuera una peluca.

—¿Y en qué consistía el trabajo?

—En copiar la Enciclopedia Británica, a mano, de diez a dos de la tarde, todos los días. Por cuatro libras por semana. Con una sola condición: no podía salir de la oficina en esas horas, por ningún motivo. Si salía, perdía el puesto.

Watson levantó las cejas. Era un sueldo muy alto por un trabajo tan absurdo.

—Durante ocho semanas copié artículos —siguió Wilson—: abades, arquería, armaduras, arquitectura… Ya iba por la letra B. Pero esta mañana, cuando llegué, la puerta estaba cerrada. Tenía clavado un cartel: "La Liga de los Pelirrojos ha sido disuelta. 9 de octubre de 1890". Nadie sabe nada. La oficina está vacía. ¡Señor Holmes, quiero saber quién me hizo esta broma, y por qué!

Holmes cerró los ojos, juntó la punta de los dedos y se quedó en silencio.

—Señor Wilson —preguntó por fin—, ese empleado suyo, Spaulding, ¿cómo es?

—Bajo, ágil, sin barba. Tiene una mancha blanca en la frente, como de ácido. Y las orejas agujereadas, como para usar aros.

Holmes abrió los ojos. Le brillaban.

—Muy interesante. Muy, muy interesante.`},{title:"Lo que vio Holmes en la plaza",illustration:"escuela",content:`Esa misma tarde, Holmes y Watson fueron a la plaza Saxe-Coburg. Era un lugar gris y tranquilo, con casas viejas y un jardincito triste. Sobre una de las puertas, un cartel decía: "Jabez Wilson. Préstamos".

Holmes hizo algo raro: golpeó varias veces el empedrado de la vereda con su bastón, frente al negocio. Después tocó el timbre. Abrió un joven bien afeitado.

—Disculpe —dijo Holmes—, ¿cómo se llega a la calle Strand?

El joven le explicó el camino y cerró la puerta.

—Ese es Spaulding —dijo Holmes mientras se alejaban—. Lo conozco de nombre: es uno de los hombres más astutos de Londres. Y no le pregunté el camino para saberlo. Quería ver sus rodillas.

—¿Sus rodillas? —Watson no entendía nada.

—Los pantalones estaban gastados y sucios en las rodillas, Watson. ¿Qué hace un hombre arrodillado durante horas? Y además golpeé la vereda para saber si el sótano se extendía hacia adelante. No. Se extiende hacia atrás.

Dieron la vuelta a la manzana. Del otro lado, en la calle de atrás, había negocios elegantes: una tabaquería, un restaurante… y la sucursal del Banco de la City y de los Suburbios.

Holmes se detuvo frente al banco y sonrió.

—Ahora sí entiendo todo. ¿Por qué alguien pagaría para que un hombre se quede fuera de su casa cuatro horas por día? Para que no esté en su casa. ¿Y qué hace un empleado en el sótano durante horas, arrodillado? No revela fotografías, Watson. Cava. Cava un túnel. Y el túnel va justo hacia este banco.

—¿Y por qué la liga se disolvió hoy?

—Porque el túnel está terminado. No necesitan más que Wilson esté afuera. Van a entrar al banco muy pronto, probablemente esta misma noche, que es sábado. El banco cierra hasta el lunes y tendrían tiempo de escapar.

Holmes llamó a un coche.

—Watson, traiga su revólver. Esta noche vamos a esperar a los ladrones en la oscuridad.`},{title:"Esperando en la bóveda",illustration:"llave",content:`A las diez de la noche, cuatro hombres bajaron en silencio al sótano del banco: Holmes, Watson, el inspector Jones de Scotland Yard y el señor Merryweather, director del banco, que estaba muy nervioso.

—En esta bóveda tenemos treinta mil monedas de oro francesas —susurró Merryweather—. Si ese túnel llega hasta acá, estamos perdidos.

El sótano estaba lleno de cajas pesadas. Holmes se arrodilló, revisó las baldosas con una lupa y asintió.

—Apaguen las linternas. Quietos y en silencio.

Esperaron en la oscuridad total. Pasó una hora. Pasó otra. Watson sentía las piernas entumecidas y escuchaba su propio corazón.

De pronto vio un brillo en el piso. Una línea de luz entre dos baldosas. Después, una de las baldosas se levantó con un chirrido, y por el agujero asomó una mano blanca, con un farol. Después apareció una cara joven, sin barba, con una mancha blanca en la frente.

El hombre salió del agujero y ayudó a subir a su compañero, un pelirrojo grandote.

—Todo despejado, Archie —susurró—. Pasame las bolsas.

En ese momento, Holmes saltó y lo agarró del cuello.

—¡Es inútil, John Clay! No tiene escapatoria.

El pelirrojo grandote se tiró de cabeza por el agujero y el inspector Jones apenas alcanzó a agarrarle un pedazo de la ropa. Pero no llegó lejos: Holmes había hecho vigilar la casa de Wilson por la policía.

John Clay, que se hacía llamar Vincent Spaulding, miró a Holmes con una calma helada.

—Lo felicito, señor. Fue una idea muy ingeniosa la de la liga.

—La de ustedes también —contestó Holmes—. Nunca había visto algo tan original.`},{title:"La explicación",illustration:"ciudad",content:`A la madrugada, en la calle Baker, frente a la chimenea, Watson pidió las explicaciones que se moría por escuchar.

—Desde el principio fue evidente —dijo Holmes, encendiendo su pipa— que el único objetivo de ese aviso tan absurdo era sacar a Wilson de su casa algunas horas cada día. La pregunta era: ¿para qué?

—Y pensó en el empleado.

—Exacto. Un hombre muy inteligente que trabaja por la mitad del sueldo y se pasa horas en el sótano: eso es sospechoso. Seguramente fue él quien convenció a Wilson de presentarse. La liga la inventaron Clay y su cómplice, que es pelirrojo y se hizo pasar por Duncan Ross. El trabajo de copiar la enciclopedia era perfecto: aburrido, largo y obligaba a Wilson a quedarse lejos.

—¿Y cómo supo que el robo sería esta noche?

—Porque cerraron la oficina de la liga. Eso significaba que ya no les importaba si Wilson estaba en casa: el túnel estaba listo. Y tenían que usarlo pronto, antes de que alguien lo descubriera o el oro cambiara de lugar. El sábado era el mejor día: les daba dos días de ventaja.

Watson negó con la cabeza, admirado.

—Es usted asombroso, Holmes. Una cadena de razonamientos sin un solo eslabón suelto.

—Elemental —dijo Holmes, y bostezó—. Mi querido Watson, mi vida es un largo esfuerzo para escapar del aburrimiento. Estos pequeños problemas me ayudan.

Lo más curioso de todo es que el pobre Jabez Wilson nunca entendió del todo lo que había pasado. Sólo supo que había cobrado treinta y dos libras por copiar artículos de la letra A… y que el pelo rojo, a veces, trae aventuras inesperadas.`}],quiz:[{question:"¿Qué trabajo extraño le dieron a Jabez Wilson?",options:["Contar monedas","Copiar la enciclopedia a mano","Cuidar un banco","Teñir pelucas"],correct:1,explanation:"Debía copiar la Enciclopedia Británica de diez a dos sin salir."},{question:"¿Por qué Holmes quería ver las rodillas de Spaulding?",options:["Para saber si estaba lastimado","Porque los pantalones gastados mostraban que pasaba horas arrodillado cavando","Por curiosidad","Para medirlo"],correct:1,explanation:"Las rodillas sucias y gastadas confirmaban que cavaba un túnel."},{question:'¿Cuál era el verdadero objetivo de la "Liga de los Pelirrojos"?',options:["Ayudar a los pelirrojos","Sacar a Wilson de su casa para cavar un túnel hasta el banco","Vender enciclopedias","Hacerle una broma"],correct:1,explanation:"Así los ladrones podían trabajar en el sótano sin ser vistos."},{question:"¿Por qué Holmes dedujo que el robo sería ese sábado?",options:["Porque lo leyó en el diario","Porque la liga se disolvió y el banco cerraba hasta el lunes","Porque llovía","Porque Watson lo adivinó"],correct:1,explanation:"El túnel estaba listo y el fin de semana les daba ventaja."}]},{id:21,slug:"viaje-al-centro-de-la-tierra",title:"Viaje al centro de la Tierra",author:"Julio Verne (adaptación de la Biblioteca)",synopsis:"Un mensaje secreto escondido en un libro antiguo dice que es posible llegar al centro de la Tierra entrando por un volcán de Islandia. El profesor Lidenbrock, su sobrino Axel y el guía Hans bajan a las profundidades, donde los esperan túneles infinitos, un mar subterráneo y criaturas de otra era.",genres:["Aventura","Ciencia ficción","Exploración"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"montanas",c1:"#ff9a3c",c2:"#5c2a1d"},status:"published",featured:!1,license:"Adaptación libre de «Viaje al centro de la Tierra» de Julio Verne (1864), obra de dominio público",createdBy:null,createdAt:"2026-10-21 00:00:00",updatedAt:"2026-10-21 00:00:00",chapters:[{title:"El mensaje secreto",illustration:"llave",content:`Hamburgo, Alemania, mayo de 1863. El profesor Otto Lidenbrock entró a su casa como un huracán, con un libro viejísimo bajo el brazo. Era un sabio famoso, experto en minerales, impaciente y gruñón. Su sobrino Axel, que vivía con él y lo ayudaba en sus estudios, lo miró con miedo: cuando su tío estaba así de entusiasmado, nadie comía hasta que resolviera lo que tenía entre manos.

—¡Axel! Mirá este tesoro. Una crónica islandesa de hace setecientos años.

Al abrir el libro, cayó un pergamino amarillento. Estaba cubierto de signos extraños.

—Son runas —dijo el profesor—. Un alfabeto antiguo de los pueblos del norte. Y esta firma… ¡es de Arne Saknussemm, un sabio islandés del siglo XVI!

Pasaron horas tratando de descifrarlo. Convirtieron las runas en letras, pero el resultado no tenía sentido. El profesor se encerró furioso en su estudio y juró que nadie en la casa comería hasta descubrir el secreto.

Fue Axel quien lo descubrió, por casualidad, abanicándose con el papel: al mirar el texto al revés, desde la última letra hasta la primera, aparecieron palabras en latín. El mensaje decía, más o menos:

"Baja al cráter del Snæfellsjökull, que la sombra del Scartaris acaricia antes de las calendas de julio, viajero audaz, y llegarás al centro de la Tierra. Yo lo hice. Arne Saknussemm".

Axel se puso pálido. Su tío era capaz de intentarlo. Pensó en esconder el papel, pero el profesor lo vio, leyó y saltó de alegría.

—¡Nos vamos a Islandia!

—Pero, tío —protestó Axel—, los científicos dicen que el interior de la Tierra está caliente, que a cierta profundidad todo es roca fundida…

—Los científicos dicen muchas cosas —gruñó el profesor—. Nadie bajó a comprobarlo. Nosotros lo vamos a hacer.`},{title:"Bajo el volcán",illustration:"montanas",content:`Viajaron en barco hasta Islandia, una isla de volcanes, glaciares y géiseres. Allí contrataron a un guía: Hans, un cazador callado y tranquilo, de brazos fuertes, que hablaba muy poco y nunca se asustaba de nada.

Subieron al volcán Snæfellsjökull, cubierto de nieve. En el fondo del cráter había tres chimeneas. ¿Cuál era la correcta? El profesor esperó, impaciente, varios días nublados. Hasta que el último día de junio salió el sol, y la sombra de un pico vecino, el Scartaris, tocó justo el borde de una de las chimeneas.

—¡Es esa! —gritó el profesor.

Bajaron con sogas, faroles eléctricos y provisiones. Al principio los túneles eran de lava antigua, y las paredes brillaban como cristal. Después se volvieron estrechos, oscuros, interminables. Bajaron durante días y días. Axel se dio cuenta de algo curioso: la temperatura subía mucho menos de lo que los sabios decían.

Pero pronto apareció un problema más grave: se terminó el agua. Durante dos días caminaron con la garganta seca, y Axel se desmayó de sed.

Entonces Hans pegó la oreja a la roca. Escuchó un murmullo: había agua corriendo del otro lado. Con el pico, golpeó la pared con paciencia. De pronto, un chorro de agua caliente saltó de la grieta. Bebieron hasta llenarse.

—Lo vamos a llamar el Hansbach —dijo el profesor—, el arroyo de Hans.

Hans sólo sonrió y siguió caminando.

Días después, Axel se distrajo y se separó de los demás. Cuando se dio cuenta, estaba solo, perdido en la oscuridad de un túnel. Gritó hasta quedarse sin voz. Lloró. Pero de pronto escuchó, muy lejos, la voz de su tío: por un efecto del sonido en la roca, la voz viajaba por las paredes. Siguiendo esas indicaciones, caminó, resbaló, cayó por una pendiente… y se desmayó. Cuando despertó, estaba otra vez junto a su tío y a Hans.`},{title:"El mar de las profundidades",illustration:"oceano",content:`Al salir de una galería, los tres se quedaron mudos. Delante de ellos había un mar. Un mar enorme, bajo tierra, con olas que rompían en una playa de arena. Arriba, a gran altura, había una bóveda de roca iluminada por una luz eléctrica extraña, como una aurora permanente.

—El mar de Lidenbrock —anunció el profesor, orgulloso de ponerle su propio nombre.

Cerca de la costa había un bosque de hongos gigantes, altos como árboles. Y más allá encontraron huesos enormes de animales extinguidos hacía muchísimo tiempo.

Hans construyó una balsa y se lanzaron al mar. Navegaron durante días. Un mediodía, el agua empezó a agitarse. De las olas surgieron dos monstruos marinos colosales: uno con hocico de delfín y dientes de cocodrilo, un ictiosaurio; el otro, con cuello de serpiente y cuerpo de tortuga gigante, un plesiosaurio. Eran reptiles marinos que, en la superficie, sólo se conocían por sus fósiles. Lucharon con una furia espantosa, levantando olas que casi dan vuelta la balsa, hasta que desaparecieron en las profundidades.

Después llegó una tormenta subterránea, con rayos que bajaban de la bóveda de roca. Una bola de fuego recorrió la balsa. El viento los arrastró durante días hasta tirarlos en una costa desconocida.

Allí, Axel y su tío vieron algo que nunca pudieron explicar del todo: en un bosque de árboles antiguos, una manada de mastodontes, unos parientes enormes de los elefantes, comía tranquila. Y entre ellos, cuidándolos como un pastor, había un ser gigantesco con forma humana. Axel arrastró a su tío y huyeron sin hacer ruido.`},{title:"Lanzados por un volcán",illustration:"cohete",content:`En esa costa, el profesor encontró un cuchillo oxidado y, grabadas en la roca, las iniciales "A. S.": Arne Saknussemm había pasado por ahí. El camino seguía por un túnel. Pero el túnel estaba bloqueado por una roca enorme.

—La vamos a volar con pólvora —decidió el profesor.

Prepararon la carga, se alejaron en la balsa y encendieron la mecha. La explosión fue mucho más grande de lo que esperaban. La roca se abrió y detrás no había un túnel, sino un abismo. El mar entero empezó a caer por ahí, arrastrando la balsa con ellos.

Cayeron durante horas, a una velocidad terrible, en la oscuridad. Después, la corriente cambió. Ya no bajaban: subían. El agua se había metido en la chimenea de un volcán y la balsa era empujada hacia arriba por el agua hirviente, el vapor y la lava. Hacía un calor insoportable. Las paredes temblaban y se escuchaban explosiones.

—¡Estamos dentro de un volcán en erupción! —gritó el profesor, y por primera vez parecía encantado de verdad.

Con un estallido final, salieron disparados por el aire y cayeron en la ladera de una montaña. Estaban lastimados, chamuscados, con la ropa hecha jirones… pero vivos. Alrededor había olivos, viñas y un mar azul brillante. Un chico que pasaba les dijo el nombre del lugar: estaban en el volcán Stromboli, en una isla de Italia, a miles de kilómetros de Islandia.

Habían entrado por un volcán en el norte de Europa y salido por otro en el sur.

Al volver a Hamburgo, el profesor Lidenbrock fue recibido como un héroe. Hans volvió a Islandia, tranquilo como siempre. Y Axel, que al principio tenía tanto miedo, terminó contando la historia a todo el que quisiera escucharla, porque había aprendido que la curiosidad, cuando va acompañada de valor y de buenos compañeros, puede llevarte a los lugares más increíbles del mundo… y de debajo del mundo.`}],quiz:[{question:"¿Cómo descifró Axel el mensaje de Saknussemm?",options:["Con una computadora","Leyéndolo al revés","Traduciéndolo al islandés","Se lo explicó Hans"],correct:1,explanation:"Al leerlo desde la última letra aparecían palabras en latín."},{question:"¿Cómo consiguieron agua cuando se quedaron sin provisiones?",options:["Con la lluvia","Hans escuchó un arroyo detrás de la roca y abrió la pared","Derritieron nieve","Encontraron un lago"],correct:1,explanation:"El arroyo fue llamado Hansbach en su honor."},{question:"¿Qué criaturas vieron pelear en el mar subterráneo?",options:["Ballenas","Un ictiosaurio y un plesiosaurio","Tiburones","Pulpos gigantes"],correct:1,explanation:"Eran reptiles marinos de épocas muy antiguas."},{question:"¿Por dónde salieron de las profundidades?",options:["Por el mismo volcán","Por el volcán Stromboli, en Italia","Por una cueva en Islandia","Por el mar"],correct:1,explanation:"Una erupción los lanzó hacia afuera en Italia."}]},{id:22,slug:"el-fantasma-de-canterville",title:"El fantasma de Canterville",author:"Oscar Wilde (adaptación de la Biblioteca)",synopsis:"Una familia norteamericana compra un castillo inglés donde vive un fantasma que lleva trescientos años asustando a todo el mundo. El problema es que a esta familia nada le da miedo. Una historia de fantasmas muy divertida… y, al final, muy emotiva.",genres:["Humor","Fantasía","Misterio"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"casona",c1:"#6d597a",c2:"#355070"},status:"published",featured:!1,license:"Adaptación libre de «El fantasma de Canterville» de Oscar Wilde (1887), obra de dominio público",createdBy:null,createdAt:"2026-10-22 12:00:00",updatedAt:"2026-10-22 12:00:00",chapters:[{title:"Una familia que no cree en fantasmas",illustration:"casona",content:`Cuando el señor Hiram Otis, embajador de los Estados Unidos, compró el castillo de Canterville, en Inglaterra, todos le advirtieron:

—Señor Otis, ahí vive un fantasma. Lo vio la duquesa viuda, y del susto nunca se recuperó.

—Si existe un fantasma —contestó el señor Otis—, en mi país lo pondríamos en un museo y cobraríamos entrada.

Así que la familia Otis se mudó al castillo: el señor y la señora Otis; su hijo mayor, Washington; su hija Virginia, de quince años, una chica valiente que montaba a caballo mejor que nadie; y los mellizos, dos pequeños terremotos traviesos.

La primera tarde, en la biblioteca, la señora Otis vio una mancha roja en el piso.

—Es sangre —explicó la vieja ama de llaves, la señora Umney, con voz temblorosa—. Es la sangre de Lady Eleanore de Canterville, asesinada en este lugar en 1575 por su marido, Sir Simon. Él desapareció misteriosamente, y su espíritu culpable recorre el castillo desde entonces. La mancha no se puede borrar.

—Tonterías —dijo Washington, y sacó del bolsillo un frasco—. "Quitamanchas Campeón Pinkerton". Lo limpia todo.

Frotó, y la mancha desapareció. Justo en ese momento, un trueno sacudió el castillo y la señora Umney se desmayó.

A la mañana siguiente, la mancha había vuelto. Washington la limpió. Al otro día, estaba otra vez. Y otra vez la limpió. Era evidente que algo raro pasaba en Canterville. Pero a los Otis, más que miedo, les daba curiosidad.`},{title:"Un fantasma muy ofendido",illustration:"luna",content:`Esa noche, a la una de la madrugada, el señor Otis se despertó por un ruido de cadenas en el pasillo. Abrió la puerta y vio a un anciano espantoso, de ojos rojos como brasas, pelo gris enredado, ropa antigua hecha jirones y cadenas pesadas en las muñecas y en los tobillos.

—Estimado señor —le dijo el señor Otis con toda amabilidad—, le pido que aceite esas cadenas. Hacen un ruido terrible. Le dejo este frasco de "Lubricante Sol Naciente Tammany". Dicen que con una sola aplicación es suficiente.

Lo dejó sobre una mesa y volvió a la cama.

El fantasma se quedó paralizado de indignación. ¡Él, Sir Simon de Canterville, que había asustado a reyes y duquesas durante tres siglos! Furioso, tiró el frasco al piso y se fue gimiendo por el pasillo, con una luz verde espectral. En lo alto de la escalera, los mellizos lo esperaban: le tiraron dos almohadas a la cabeza. El fantasma tuvo que escapar atravesando la pared.

En su cuarto secreto, Sir Simon repasó su carrera con orgullo herido. Había hecho que una dama se desmayara viendo un esqueleto en su sillón. Había vuelto loco a un mayordomo con una mano verde golpeando la ventana. ¡Y ahora unos norteamericanos le ofrecían aceite!

Decidió vengarse. Durante semanas preparó sus mejores apariciones: "El Muerto Sin Ojos", "El Fantasma del Bosque", "El Monje Vampiro". Pero todo le salía mal. Los mellizos le ponían trampas: le tendían hilos para que tropezara, le llenaban el piso de mantequilla para que resbalara, y una noche armaron un fantasma falso, con una calabaza por cabeza y un cartel que decía "Yo soy el verdadero fantasma". Sir Simon se asustó tanto con el fantasma falso que corrió a esconderse.

Al final, el pobre fantasma se enfermó de tanto disgusto. Ya casi no salía de su escondite. Sólo seguía pintando la mancha de sangre por las noches, con las pinturas que les robaba a la acuarela de Virginia, y como se le terminó el rojo, a veces la mancha aparecía verde, o incluso azul.`},{title:"Virginia y el jardín de la muerte",illustration:"bosque",content:`Una tarde, Virginia entró a una salita y encontró al fantasma sentado junto a la ventana, con la cabeza apoyada en la mano, mirando las hojas secas del otoño. Parecía tan triste que a ella le dio pena.

—Lamento mucho lo que le hacen mis hermanos —le dijo—. Pero usted fue muy malo con su esposa.

—Lo sé —dijo el fantasma—. Fue hace mucho. Y desde entonces no he podido dormir. Hace trescientos años que no duermo. Estoy tan cansado…

—¿Y no hay forma de que descanse?

El fantasma señaló un viejo vitral de la ventana. Tenía escritos unos versos antiguos:

"Cuando una niña rubia logre que rece un pecador,
cuando el almendro seco vuelva a dar flor
y una criatura llore por él con amor,
la casa entera tendrá paz y quietud".

—Significa —explicó el fantasma— que alguien tiene que llorar por mis culpas, porque yo ya no tengo lágrimas, y rezar por mi alma, porque yo no tengo fe. Y que tiene que ser una persona buena y valiente. Si vos venís conmigo al Jardín de la Muerte y pedís por mí, el Ángel de la Muerte tendrá piedad. Pero vas a ver cosas terribles en la oscuridad.

Virginia lo pensó un momento. Después se levantó.

—No tengo miedo. Lo voy a acompañar.

El fantasma le besó la mano con sus labios fríos como el hielo. La pared se abrió, y los dos desaparecieron.`},{title:"El almendro florecido",illustration:"castillo",content:`Esa noche, toda la familia buscó a Virginia por el castillo, por el bosque y por el pueblo. El señor Otis recorrió los caminos a caballo. Washington buscó en el estanque. La señora Otis lloraba. Nadie la encontró.

A la medianoche, cuando sonaron las doce campanadas, se escuchó un trueno y un canto lejano. Un panel de la escalera se abrió y apareció Virginia, pálida, tranquila, con una cajita en las manos.

—¿Dónde estabas? —preguntó su madre, abrazándola.

—Estuve con el fantasma —dijo Virginia—. Ya murió de verdad. Ahora descansa. Vengan, les voy a mostrar.

Por un pasadizo secreto llegaron a un cuarto escondido. Allí, encadenado a la pared, había un esqueleto antiguo. Era Sir Simon. Virginia se arrodilló a su lado y rezó en voz baja. Los mellizos, que miraban por la ventana, gritaron de pronto:

—¡Miren! ¡El almendro del jardín! ¡Está florecido!

El viejo almendro, que llevaba años seco, estaba cubierto de flores blancas a la luz de la luna.

Unos días después, enterraron a Sir Simon en el jardín, bajo el almendro. Virginia puso sobre la tumba una corona de flores. La cajita que el fantasma le había dado estaba llena de joyas antiguas, un regalo de agradecimiento.

Desde entonces, nadie volvió a ver al fantasma de Canterville, y la mancha de la biblioteca desapareció para siempre.

Años más tarde, cuando alguien le preguntó a Virginia qué había pasado aquella noche, ella sólo sonrió y dijo:

—El fantasma me enseñó qué es la vida, qué significa la muerte y por qué el amor es más fuerte que las dos.`}],quiz:[{question:"¿Cómo reaccionó la familia Otis ante el fantasma?",options:["Se fueron del castillo","No le tuvieron miedo y lo trataron con humor","Llamaron a un cazafantasmas","Se desmayaron"],correct:1,explanation:"Le ofrecieron lubricante para las cadenas y quitamanchas para la sangre."},{question:"¿Qué le hacían los mellizos al fantasma?",options:["Le daban regalos","Le hacían bromas y trampas","Le tenían miedo","Lo ignoraban"],correct:1,explanation:"Hilos, mantequilla y hasta un fantasma falso."},{question:"¿Qué necesitaba el fantasma para poder descansar?",options:["Una cama nueva","Que una persona buena llorara y pidiera por él","Que lo encerraran","Asustar a alguien"],correct:1,explanation:"Así lo decían los versos del vitral."},{question:"¿Qué señal mostró que el fantasma había encontrado la paz?",options:["Llovió","El almendro seco floreció","Apareció la mancha","Sonó una campana"],correct:1,explanation:"Era una de las señales de la profecía."}]},{id:23,slug:"los-guardianes-del-bosque-de-arrayanes",title:"Los guardianes del bosque de arrayanes",author:"Valeria Etchart",synopsis:"Durante las vacaciones en Villa La Angostura, Juli y su primo Nico recorren el Bosque de Arrayanes, un lugar único en el mundo. Pero descubren huellas de algo que no debería estar ahí: alguien está poniendo en peligro el bosque. Con la ayuda de una guardaparques, tendrán que actuar rápido.",genres:["Aventura","Naturaleza","Exploración"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"bosque",c1:"#d4a373",c2:"#2d6a4f"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-24 00:00:00",updatedAt:"2026-10-24 00:00:00",chapters:[{title:"Árboles color canela",illustration:"bosque",content:`Juli había visto muchos bosques, pero nunca uno así. Los troncos de los árboles eran de color canela, lisos y fríos al tacto, con manchas blancas como si alguien los hubiera pintado con pinceladas. Se retorcían hacia el cielo, y la luz que pasaba entre las hojas tenía un tono dorado.

—Son arrayanes —explicó Rocío, la guardaparques que guiaba al grupo—. Este bosque está en la península de Quetrihué, en el Parque Nacional Nahuel Huapi, a orillas del lago. Es uno de los pocos lugares del mundo donde los arrayanes forman un bosque entero. Algunos tienen cientos de años.

—¿Por qué los troncos están fríos? —preguntó Nico, el primo de Juli, que tenía las manos apoyadas en uno.

—Porque la corteza es muy fina y el árbol tiene mucha agua adentro. Por eso también se llama "quetrihué": en la lengua mapuche significa algo así como "lugar de arrayanes".

Caminaban por una pasarela de madera que serpenteaba entre los árboles.

—¿Y por qué no se puede caminar por afuera de la pasarela? —preguntó Juli.

—Porque las raíces de los arrayanes son muy superficiales y delicadas —dijo Rocío—. Si miles de visitantes pisaran el suelo, el bosque se moriría. La pasarela protege a los árboles.

Juli se agachó para mirar el suelo entre las tablas. Y vio algo que le llamó la atención: un pedazo de papel plateado, como el envoltorio de una golosina, y más allá, la marca de una zapatilla en la tierra húmeda. Alguien había salido de la pasarela.`},{title:"Huellas en el lugar equivocado",illustration:"montanas",content:`Al día siguiente, Juli y Nico volvieron al bosque con sus papás. Juli no podía dejar de pensar en la huella. Esta vez, en el mismo lugar, encontraron más huellas, y un sendero de ramas rotas que se metía entre los arrayanes.

—Alguien camina por adentro del bosque —susurró Nico.

Siguieron el sendero con la vista, sin bajarse de la pasarela. A unos metros, entre las raíces, vieron un círculo de piedras ennegrecidas y restos de ceniza.

—¡Hicieron fuego! —dijo Juli—. ¡En medio del bosque!

Los dos sabían, porque se lo habían enseñado en la escuela, que en la Patagonia los incendios forestales son uno de los peores peligros. El viento sopla fuerte y, en verano, una sola chispa puede quemar miles de hectáreas en pocos días. Un bosque como ese, que tardó cientos de años en crecer, podría desaparecer en una tarde.

Nico sacó el celular de su mamá y sacó fotos: las huellas, el sendero, las cenizas.

—Hay que avisarle a Rocío.

Corrieron hasta la oficina de guardaparques, en la entrada del bosque. Rocío miró las fotos con el ceño fruncido.

—Esto es muy grave. Hace días que encontramos basura en lugares raros. Pensamos que eran visitantes descuidados. Pero un fogón… eso significa que alguien está pasando la noche dentro del bosque, y está prohibido.

—¿Quién haría algo así? —preguntó Juli.

—No sé. Pero lo vamos a averiguar. Y ustedes me ayudaron muchísimo: tienen buen ojo de guardaparques.`},{title:"La noche del viento",illustration:"luna",content:`Esa noche, el viento empezó a soplar con fuerza. Desde la cabaña, Juli escuchaba cómo sacudía los árboles. No podía dormir. Pensaba en el fogón.

Por la ventana se veía la costa del lago y, del otro lado, la oscura silueta de la península. De pronto, Juli vio un punto de luz anaranjada que titilaba entre los árboles.

—¡Nico! ¡Despertate! ¡Hay fuego en la península!

Despertaron a los adultos. El papá de Juli llamó enseguida al número de emergencias de los guardaparques. Rocío atendió en segundos.

—Ya salimos. Gracias por avisar tan rápido.

Los chicos, desde la ventana, vieron cómo una lancha de los guardaparques cruzaba el lago con sus luces encendidas. El punto de luz se movió, como si alguien corriera con una linterna. Después, la luz anaranjada se apagó.

A la mañana siguiente, Rocío vino a la cabaña. Tenía cara de cansada, pero sonreía.

—Llegamos a tiempo. Eran dos campamentistas que se habían metido en el bosque para pasar la noche "en un lugar mágico", según dijeron. Hicieron un fogón para calentarse. Con el viento, unas brasas habían prendido el pasto seco. Lo apagamos antes de que llegara a los árboles. Si nos avisaban media hora más tarde, hoy no tendríamos bosque.

Juli sintió un escalofrío.

—¿Y qué les va a pasar?

—Van a tener que pagar una multa importante y hacer trabajo comunitario en el parque. Pero sobre todo, espero que hayan entendido algo: un bosque no es un decorado. Es un ser vivo muy antiguo, y es de todos.`},{title:"Guardianes",illustration:"bosque",content:`El último día de vacaciones, Rocío los invitó a una actividad especial. En un vivero del parque, les mostró unas plantitas chiquitas, en macetas, con hojas brillantes.

—Son arrayanes bebés. Crecen muy, muy despacio. Este, que tiene apenas veinte centímetros, tiene tres años. Para que llegue a ser un árbol como los del bosque, van a pasar décadas.

Los ayudaron a plantar algunos en una zona que había sido dañada hacía años. Juli cavó con cuidado, puso la plantita, la tapó con tierra y la regó.

—Cuando seas grande —le dijo Rocío—, podés volver a visitarla. Para entonces, apenas va a llegarte a la cintura.

Antes de irse, Rocío les dio a los dos un pañuelo verde con el escudo de Parques Nacionales.

—Esto es para los guardianes honorarios del bosque. Ustedes vieron lo que otros no vieron, avisaron a tiempo y no se pusieron en peligro. Eso es lo que hace un buen guardián.

En el auto, volviendo a casa, Nico iba callado, mirando por la ventana las montañas y los lagos.

—Juli —dijo de pronto—, ¿sabés qué me di cuenta? Que proteger la naturaleza no es sólo cosa de los guardaparques. Es no tirar basura, quedarse en los senderos, no hacer fuego donde no se puede. Cosas chiquitas que hace todo el mundo.

Juli asintió y se ató el pañuelo verde en la muñeca. Pensó en su arrayán, tan chiquito, que iba a crecer despacio durante cientos de años. Y se prometió que, algún día, iba a volver a verlo.`}],quiz:[{question:"¿Por qué los visitantes deben caminar por la pasarela?",options:["Porque es más rápido","Porque las raíces de los arrayanes son delicadas y superficiales","Porque hay serpientes","Por la lluvia"],correct:1,explanation:"Pisar el suelo dañaría las raíces y el bosque podría morir."},{question:"¿Qué pista encontraron los chicos que indicaba un peligro?",options:["Un nido","Restos de un fogón dentro del bosque","Un árbol caído","Un mapa"],correct:1,explanation:"Hacer fuego en el bosque está prohibido y es muy peligroso."},{question:"¿Por qué los incendios son tan peligrosos en la Patagonia?",options:["Porque no hay agua","Porque el viento fuerte los extiende muy rápido","Porque hace frío","Porque no hay árboles"],correct:1,explanation:"Con el viento, una chispa puede quemar miles de hectáreas."},{question:"¿Qué entendió Nico al final?",options:["Que sólo los guardaparques cuidan la naturaleza","Que cuidar la naturaleza es tarea de todos con acciones cotidianas","Que los bosques crecen rápido","Que no hay que ir de vacaciones"],correct:1,explanation:"Pequeñas acciones de todos protegen los bosques."}]},{id:24,slug:"codigo-colmena",title:"Código Colmena",author:"Ana Sol Quiroga",synopsis:"En el año 2090, en la ciudad de Nueva Córdoba, ya casi no quedan abejas: las flores las polinizan miles de abejas robot. Pero un día los drones empiezan a fallar y las cosechas peligran. Lara, una chica fanática de la programación, descubrirá un secreto en una terraza abandonada.",genres:["Ciencia ficción","Naturaleza","Aventura"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"robot",c1:"#ffd60a",c2:"#2a9d8f"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-25 12:00:00",updatedAt:"2026-10-25 12:00:00",chapters:[{title:"La ciudad de los zumbidos metálicos",illustration:"ciudad",content:`En el año 2090, la ciudad de Nueva Córdoba zumbaba. Pero no era el zumbido de las abejas: era el de las Polinas, unas abejas robot del tamaño de una uña, con alas transparentes y un cuerpito dorado. Había millones. Volaban de flor en flor en los campos y en los invernaderos verticales, llevando polen de una planta a otra.

Lara, de once años, las miraba todos los días desde la ventana de su escuela. Sabía mucho de ellas, porque su mamá trabajaba en la Central Polina, el edificio desde donde se controlaba todo el enjambre.

—Hace cincuenta años casi no quedaban abejas de verdad —les había explicado la maestra—. Los pesticidas, la pérdida de flores silvestres y el cambio del clima las hicieron desaparecer en muchos lugares. Y las abejas son muy importantes: sin polinización, muchas plantas no dan frutos. Gran parte de lo que comemos, como manzanas, tomates, almendras o zapallos, depende de ellas.

—Por eso se inventaron las Polinas —dijo Lara.

—Exacto. Las Polinas salvaron las cosechas.

Esa tarde, Lara fue a buscar a su mamá a la Central. En la gran sala de control, las pantallas mostraban mapas del enjambre: millones de puntitos dorados moviéndose. Pero algo andaba mal. En un sector del mapa, los puntitos se habían vuelto rojos.

—Fallas —dijo su mamá, preocupada—. Desde hace tres días, cientos de Polinas se apagan en pleno vuelo. Y nadie sabe por qué.`},{title:"Un error en el código",illustration:"robot",content:`Las fallas siguieron. Cada día, más Polinas caían al suelo como granizo dorado. En los invernaderos, las plantas de tomate florecían pero no daban frutos. Las noticias empezaron a hablar de "la crisis de la polinización".

Lara no podía quedarse quieta. Le encantaba programar: en su habitación tenía una computadora vieja con la que armaba juegos y robots pequeños. Le pidió a su mamá que le mostrara el código de las Polinas.

—Es muy complicado, Lara. Hay equipos enteros de ingenieros revisándolo.

—Por favor. Sólo quiero mirar.

Su mamá le dio acceso a una copia de prueba. Lara se pasó dos noches leyendo líneas y líneas. Y encontró algo. En una actualización reciente, alguien había cambiado la forma en que las Polinas calculaban su batería: ahora volaban hasta las flores más lejanas para "aumentar la eficiencia", pero sin dejar suficiente carga para volver a las estaciones. Se quedaban sin energía en el aire y caían.

—¡Mamá! ¡Es un error de cálculo! ¡Les falta batería para volver!

Su mamá miró la pantalla, en silencio. Después llamó a su jefe. En una hora, los ingenieros confirmaron el error y prepararon una corrección.

—Lara, encontraste lo que cincuenta ingenieros no vieron —le dijo su mamá, con los ojos brillantes.

Pero cuando enviaron la corrección, descubrieron un problema más grande: miles de Polinas ya se habían perdido, y fabricar nuevas iba a llevar meses. La cosecha de este año estaba en peligro.`},{title:"La terraza secreta",illustration:"huerta",content:`Un sábado, Lara fue a visitar a su abuelo Ernesto, que vivía en un edificio muy viejo del centro. El abuelo había sido apicultor cuando era joven, antes de que las abejas desaparecieran.

—Abuelo, ¿vos extrañás a las abejas de verdad?

El abuelo sonrió de una manera rara.

—Vení. Te voy a mostrar algo, pero es un secreto.

Subieron por una escalera oxidada hasta la terraza del edificio. Lara se quedó con la boca abierta. La terraza estaba cubierta de flores: lavandas, girasoles, salvias, tréboles, plantas de tomate y zapallo, todo mezclado, desordenado y hermoso. Y entre las flores, zumbando, había abejas. Abejas de verdad, peludas, con rayas negras y amarillas.

—Hace veinte años encontré un enjambre perdido en un árbol de la plaza —le contó el abuelo—. Lo traje acá. Les planté flores de todo tipo y nunca usé un solo pesticida. Fueron creciendo. Ahora hay seis colmenas.

Lara se acercó despacito. Una abeja se posó en su mano, caminó un poquito y se fue volando hacia una flor de lavanda.

—Abuelo, ¿y si hay más terrazas así? ¿Y si la ciudad entera se llena de flores para que las abejas puedan volver?

El abuelo la miró con los ojos húmedos.

—Eso es lo que soñé toda mi vida.`},{title:"Una ciudad que florece",illustration:"huerta",content:`Lara preparó una presentación para la escuela. Mostró fotos de la terraza del abuelo, explicó el error de las Polinas y propuso un plan: crear "corredores de flores" en las terrazas, plazas y balcones de toda la ciudad, sin pesticidas, para que las abejas reales pudieran volver a multiplicarse.

—Las Polinas son una gran herramienta —dijo frente a todos—. Pero no pueden reemplazar a la naturaleza. Si dependemos sólo de una máquina, y la máquina falla, nos quedamos sin nada. Necesitamos las dos cosas: tecnología y abejas.

La presentación llegó a las noticias. Después, al gobierno de la ciudad. Y un mes más tarde, Nueva Córdoba lanzó el programa "Código Colmena": cada edificio que plantara flores para polinizadores recibiría semillas gratis y ayuda de expertos. El abuelo Ernesto fue nombrado asesor oficial, y les enseñaba a los vecinos a cuidar colmenas.

Esa primavera, las Polinas reparadas volvieron a volar. Pero, por primera vez en décadas, no estaban solas. En las terrazas, en los balcones y en las plazas, se escuchaba otro zumbido: más suave, más irregular, más vivo.

Lara, desde la terraza del abuelo, miraba la ciudad llenarse de manchas de colores.

—¿Sabés qué es lo mejor, abuelo? —dijo—. Que yo arreglé un código de computadora. Pero las abejas tienen el código más antiguo de todos, y ese nunca falla, si las dejamos vivir.

El abuelo se rió y le pasó un frasquito de miel dorada, la primera cosecha del programa Código Colmena.`}],quiz:[{question:"¿Por qué las abejas son tan importantes?",options:["Porque hacen ruido","Porque polinizan las plantas y muchas frutas dependen de ellas","Porque pican","Porque comen insectos"],correct:1,explanation:"Sin polinización, muchas plantas no dan frutos."},{question:"¿Qué error descubrió Lara en el código?",options:["Las Polinas no veían las flores","Volaban demasiado lejos sin batería para volver","Eran demasiado lentas","Picaban a la gente"],correct:1,explanation:"Se quedaban sin energía en pleno vuelo."},{question:"¿Qué secreto tenía el abuelo Ernesto?",options:["Una fábrica de robots","Una terraza con flores y colmenas de abejas reales","Un laboratorio","Un invernadero de Polinas"],correct:1,explanation:"Cuidaba abejas sin usar pesticidas."},{question:"¿Qué propuso Lara?",options:["Fabricar más robots","Llenar la ciudad de flores sin pesticidas para que vuelvan las abejas","Prohibir las flores","Mudarse al campo"],correct:1,explanation:"Propuso combinar tecnología y naturaleza."}]},{id:25,slug:"el-secreto-de-la-piedra-de-rosetta",title:"El secreto de la piedra de Rosetta",author:"Gonzalo Echeverría",synopsis:"Para el cumpleaños de los mellizos Bruno y Vera, su abuela egiptóloga escondió el regalo en su estudio y dejó las pistas escritas en jeroglíficos. Para encontrarlo, tendrán que aprender a leer como los antiguos egipcios, siguiendo los pasos del joven que descifró uno de los mayores misterios de la historia.",genres:["Historia","Misterio","Exploración"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"llave",c1:"#e9c46a",c2:"#8d5524"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-27 00:00:00",updatedAt:"2026-10-27 00:00:00",chapters:[{title:"Un regalo escrito en piedra",illustration:"llave",content:`La abuela Irene era egiptóloga, es decir, una científica que estudia el antiguo Egipto. Había viajado muchas veces a ese país del norte de África, había caminado entre pirámides y templos, y su casa estaba llena de libros, mapas, réplicas de estatuas y cajas con etiquetas misteriosas.

El día que Bruno y Vera cumplieron diez años, la abuela les dio un sobre.

—Su regalo está escondido en mi estudio. Para encontrarlo, tienen que leer esto.

Dentro del sobre había una tarjeta con dibujos: un pájaro, una mano, una serpiente, un ojo, una línea de agua ondulada. Eran jeroglíficos, la escritura de los antiguos egipcios.

—¡Pero no sabemos leer esto! —protestó Bruno.

—Durante más de mil años, nadie en el mundo supo leerlo —dijo la abuela—. Los últimos que sabían escribir jeroglíficos vivieron hace unos mil seiscientos años. Después, el idioma se olvidó. La gente veía esos dibujos en templos y tumbas y no tenía idea de qué decían. Algunos creían que eran símbolos mágicos, que cada dibujo era una idea secreta.

—¿Y cómo se aprendió a leerlos otra vez? —preguntó Vera.

La abuela sonrió y señaló una réplica que tenía sobre el escritorio: una piedra oscura, rota en los bordes, cubierta de inscripciones.

—Gracias a esto. La piedra de Rosetta. Y a un joven francés muy testarudo. Pero esa es una historia para mientras buscan.`},{title:"Tres escrituras en una piedra",illustration:"cabildo",content:`Vera y Bruno se acercaron a la réplica. La piedra tenía tres partes, cada una con un tipo de escritura distinta.

—La piedra original fue encontrada en 1799, en Egipto, cerca de una ciudad llamada Rashid, que los europeos llamaban Rosetta —explicó la abuela—. Hoy está en un museo de Londres. Es un decreto, una especie de ley, escrito hace más de dos mil años. Lo importante es que el mismo texto está escrito tres veces: arriba, en jeroglíficos; en el medio, en otra escritura egipcia más rápida llamada demótica; y abajo, en griego antiguo.

—¡Y el griego sí se sabía leer! —dijo Vera.

—Exacto. Era como tener la misma frase en tres idiomas, uno conocido y dos desconocidos. Una llave. Pero aun así, descifrarla llevó más de veinte años.

—¿Por qué tanto?

—Porque los sabios pensaban que cada jeroglífico representaba una idea completa, como un dibujo que significa "sol" o "rey". Pero un joven llamado Jean-François Champollion, que de chico aprendía idiomas como quien junta figuritas, sospechó otra cosa: que muchos jeroglíficos representaban sonidos, como nuestras letras.

La abuela tomó una lupa y señaló unos óvalos en la piedra, con varios signos adentro.

—Estos óvalos se llaman cartuchos. Encierran nombres de reyes. Champollion comparó el cartucho del rey Ptolomeo, que aparecía en griego en la parte de abajo, con el de la reina Cleopatra, en otro monumento. Los dos nombres comparten sonidos: la "p", la "t", la "o", la "l". Y los signos para esos sonidos eran iguales en los dos cartuchos. ¡Así descubrió que eran letras!

—¿Y qué pasó?

—En 1822, Champollion entendió el sistema. Dicen que corrió a contarle a su hermano, gritó "¡Lo tengo!" y se desmayó de la emoción.

Bruno y Vera se rieron. Después volvieron a mirar la tarjeta con otros ojos.`},{title:"Los mellizos descifradores",illustration:"escuela",content:`En la biblioteca de la abuela encontraron un libro con una tabla: el "alfabeto" de los jeroglíficos que representan sonidos. No era exactamente un alfabeto como el nuestro, pero servía.

—El buitre es una especie de "a" —leyó Vera—. La pierna es "b". La mano, "d". La serpiente con cuernos es "f". La línea de agua es "n". La lechuza es "m". El pan es "t"…

—Los egipcios a veces no escribían todas las vocales —agregó Bruno, que leía la página siguiente—. Y podían escribir de derecha a izquierda, o de izquierda a derecha. Para saber para dónde leer, hay que mirar hacia dónde miran los animales y las personas: siempre miran hacia el principio de la frase.

Volvieron a la tarjeta. Los pájaros miraban hacia la izquierda. Empezaron por la izquierda.

Signo por signo, fueron armando una palabra. Lechuza: m. Buitre: a. Pierna: b… Les costó, se equivocaron, borraron y volvieron a empezar, igual que Champollion. Al final, en el papel, escrito con letras torcidas, leyeron:

"MAPA. ARMARIO AZUL".

Corrieron al armario azul del pasillo. En la puerta había un mapa de Egipto, y sobre la ciudad de Rashid, un círculo rojo y otro mensaje en jeroglíficos, más corto. Ya tenían práctica. En cinco minutos lo descifraron:

"DEBAJO".

Abrieron el armario. En el piso había una caja de madera con un cartucho dibujado en la tapa. Dentro del cartucho, en jeroglíficos, dos nombres: el de Vera y el de Bruno.`},{title:"Escribir el propio nombre",illustration:"llave",content:`Dentro de la caja había dos cuadernos de tapas de cuero, dos lápices dorados y un sobre. En el sobre, dos pasajes de avión. Debajo, con la letra prolija de la abuela, decía: "Para mis dos descifradores. El próximo verano, nos vamos juntos a Egipto".

Los mellizos gritaron tan fuerte que el perro del vecino empezó a ladrar.

Esa noche, la abuela les mostró fotos de sus viajes: las pirámides de Guiza, la esfinge con su cara de león y de hombre, el templo de Abu Simbel con sus estatuas gigantes, y las paredes llenas de jeroglíficos de colores que, gracias a Champollion, hoy se pueden leer.

—¿Sabés qué es lo que más me gusta de esta historia? —dijo la abuela—. Que muestra que el conocimiento se puede perder. Una escritura entera se olvidó durante siglos. Y también muestra que se puede recuperar, con paciencia, curiosidad y trabajo, comparando, probando y equivocándose.

Bruno pensó un momento.

—Entonces, si un día alguien encuentra nuestros cuadernos dentro de dos mil años…

—…ojalá que alguien sepa leerlos —completó Vera.

Antes de dormir, cada uno escribió en la primera página de su cuaderno su nombre en jeroglíficos, dentro de un cartucho, como los reyes y reinas del antiguo Egipto. Les quedó un poco torcido. Pero era la primera vez, en mucho tiempo, que alguien en esa casa escribía como hace tres mil años.`}],quiz:[{question:"¿Por qué la piedra de Rosetta fue tan importante?",options:["Porque era de oro","Porque tenía el mismo texto en jeroglíficos, demótico y griego","Porque era la más grande","Porque estaba en una pirámide"],correct:1,explanation:"El griego conocido sirvió como llave para descifrar los jeroglíficos."},{question:"¿Qué descubrió Champollion?",options:["Que los jeroglíficos eran sólo dibujos mágicos","Que muchos jeroglíficos representaban sonidos","Una pirámide nueva","El idioma griego"],correct:1,explanation:"Comparando cartuchos vio que los signos funcionaban como letras."},{question:"¿Qué es un cartucho en la escritura egipcia?",options:["Un óvalo que encierra el nombre de un rey o reina","Un tipo de papel","Una tumba","Un dibujo de un sol"],correct:0,explanation:"Los nombres reales se escribían dentro de un óvalo."},{question:"¿Cómo se sabe hacia dónde leer los jeroglíficos?",options:["Siempre de arriba abajo","Mirando hacia dónde miran los animales y personas dibujados","Al azar","Por los colores"],correct:1,explanation:"Las figuras miran hacia el comienzo de la frase."}]},{id:26,slug:"la-bandera-junto-al-parana",title:"La bandera junto al Paraná",author:"Martín Aldaz",synopsis:"Rosario, febrero de 1812. Catalina tiene once años y vive en una villa a orillas del río Paraná, donde el general Manuel Belgrano construye baterías para defender el río. Una tarde, el general le pide un favor inesperado. Una historia sobre el nacimiento de nuestra bandera.",genres:["Historia","Aventura"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"barco",c1:"#75aadb",c2:"#f4f1de"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-28 12:00:00",updatedAt:"2026-10-28 12:00:00",chapters:[{title:"Los cañones de la barranca",illustration:"barco",content:`En febrero de 1812, Rosario no era la gran ciudad que es hoy. Era un pueblo pequeño, la Villa del Rosario, con casas bajas, una capilla y calles de tierra que bajaban hasta la barranca del río Paraná. El río era ancho, marrón y tranquilo, y desde arriba se veían las islas verdes del otro lado.

Catalina tenía once años y vivía con su mamá, que cosía ropa para los vecinos. Esas semanas, el pueblo estaba revolucionado: había llegado el general Manuel Belgrano con sus soldados.

—Vino a construir baterías —le explicó su mamá—. Son lugares con cañones, para proteger el río. Los barcos realistas, los que defienden al rey de España, bajan desde Montevideo y atacan los pueblos de la costa.

Catalina bajaba todas las tardes a mirar. Los soldados cavaban, cargaban piedras y troncos, y acomodaban los cañones mirando al río. Una de las baterías estaba en la barranca y otra en una isla de enfrente. Los soldados decían que se iban a llamar "Libertad" e "Independencia".

El general Belgrano no era como Catalina se imaginaba a un general. Era un hombre delgado, de cara amable, que hablaba con todos, preguntaba mucho y escribía cartas a la luz de una vela hasta muy tarde. Le gustaba leer y decía que lo más importante para un pueblo eran las escuelas.

Un día, Catalina se animó a preguntarle a un soldado joven:

—¿Por qué los soldados de Belgrano usan una cinta celeste y blanca en el sombrero?

—Es la escarapela —le contestó el soldado, orgulloso—. El general pidió permiso al gobierno para usarla. Así nos distinguimos de los realistas. Antes usábamos los mismos colores que ellos, ¡y en las batallas era un lío!`},{title:"Un encargo para la costurera",illustration:"cabildo",content:`Una tarde golpearon la puerta de la casa de Catalina. Era un oficial del ejército.

—El general necesita una costurera de confianza. Le dijeron que su madre es la mejor del pueblo.

La mamá de Catalina se secó las manos en el delantal, nerviosa, y fue con el oficial. Catalina la siguió.

En una casa cerca de la barranca, el general Belgrano los recibió con una sonrisa cansada.

—Señora, quiero pedirle algo especial. Necesito una bandera. Una bandera que tenga los mismos colores de la escarapela: celeste y blanco. Que nuestros soldados vean flamear algo que sea sólo nuestro.

Les mostró las telas. Eran dos piezas, una celeste y otra blanca.

Catalina ayudó a su mamá durante toda la noche. Cortaban, medían y cosían a la luz de una vela de sebo. La mamá hacía las costuras finas, y Catalina enhebraba las agujas y sostenía la tela para que no se arrugara.

—¿Te das cuenta, hija? —dijo su mamá, en voz baja, cerca de la madrugada—. Estamos haciendo algo que nunca existió.

(Los historiadores no saben con seguridad quién cosió aquella primera bandera. Hay una tradición que dice que fue una vecina de Rosario llamada María Catalina Echevarría. Esta historia imagina cómo pudo haber sido esa noche).

Cuando salió el sol, la bandera estaba terminada. Catalina la miró extendida sobre la mesa: los dos colores juntos, como el cielo con una nube, le parecieron lo más lindo que había visto en su vida.`},{title:"El 27 de febrero",illustration:"barco",content:`La tarde del 27 de febrero de 1812, todo el pueblo bajó a la barranca. Los soldados estaban formados frente a la batería Libertad, con sus uniformes y la escarapela en el sombrero. El río brillaba con el sol de la tarde.

El general Belgrano se paró frente a ellos. Catalina, desde un costado, vio cómo un soldado subía la bandera que ella y su mamá habían cosido, y cómo la tela se abría con el viento del río. Celeste y blanca, flameando por primera vez sobre el Paraná.

Belgrano habló con voz fuerte. Les pidió a los soldados que juraran defender la patria y ser fieles a esa bandera. Los soldados gritaron que sí. Algunos tenían lágrimas en los ojos. Catalina también.

Esa noche, el general escribió una carta al gobierno, en Buenos Aires, para contar lo que había hecho. Estaba feliz.

Pero unos días después llegó una respuesta que nadie esperaba. El gobierno, que se llamaba el Primer Triunvirato, no estaba de acuerdo: le ordenaba guardar la bandera y no usarla. Les preocupaba que, en ese momento, tener una bandera propia se tomara como una declaración de independencia antes de tiempo, y que eso trajera problemas con otros países.

—¿Y ahora qué va a hacer el general? —le preguntó Catalina a su mamá.

—Lo que hace la gente que cree en algo —dijo ella—: no rendirse.`},{title:"La bandera viaja al norte",illustration:"montanas",content:`Belgrano no llegó a recibir a tiempo la orden del gobierno, porque ya había partido hacia el norte para ponerse al frente del Ejército del Norte, en Jujuy. Llevó la bandera con él.

Meses después, llegaron noticias a Rosario. El 25 de mayo de 1812, al cumplirse dos años de la Revolución de Mayo, Belgrano hizo bendecir la bandera en la catedral de San Salvador de Jujuy, y la mostró al pueblo y a sus soldados. Cuando el gobierno se enteró, se enojó otra vez, y Belgrano tuvo que guardarla.

Pero la bandera ya no se podía guardar en el corazón de la gente. Los soldados la habían visto. Los pueblos la habían visto. En 1816, cuando se declaró la independencia en Tucumán, el Congreso adoptó oficialmente la bandera celeste y blanca. Más tarde se le agregó el sol en el centro.

Catalina creció. Se hizo costurera, como su mamá. Cuando ya era una mujer grande, sus nietos le pedían que les contara la historia de la noche en que cosió la primera bandera. Ella siempre terminaba igual:

—El general nunca buscó la gloria para él. Murió pobre, en 1820, y casi nadie se acordó de él ese día. Pero la bandera que soñó junto al río sigue flameando.
