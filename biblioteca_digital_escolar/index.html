Hoy, en el lugar donde estaba la batería Libertad, en Rosario, se levanta el Monumento Nacional a la Bandera. Y cada 20 de junio, el día que murió Manuel Belgrano, el país entero recuerda al hombre que, a orillas del Paraná, nos dio los colores que nos representan.`}],quiz:[{question:"¿Por qué Belgrano construía baterías en Rosario?",options:["Para hacer una fiesta","Para defender el río de los barcos realistas","Para pescar","Para construir un puerto"],correct:1,explanation:"Los barcos realistas atacaban los pueblos de la costa."},{question:"¿Qué colores tenía la bandera que creó Belgrano?",options:["Rojo y amarillo","Celeste y blanco","Verde y blanco","Azul y rojo"],correct:1,explanation:"Los mismos colores de la escarapela."},{question:"¿Qué día se izó por primera vez la bandera a orillas del Paraná?",options:["25 de mayo de 1810","27 de febrero de 1812","9 de julio de 1816","20 de junio de 1820"],correct:1,explanation:"Fue el 27 de febrero de 1812, junto a la batería Libertad."},{question:"¿Por qué el gobierno le ordenó a Belgrano guardar la bandera?",options:["Porque no le gustaban los colores","Porque temía que se tomara como una declaración de independencia antes de tiempo","Porque estaba mal cosida","Porque ya existía otra"],correct:1,explanation:"En ese momento la independencia todavía no se había declarado."}]},{id:27,slug:"la-isla-del-tesoro",title:"La isla del tesoro",author:"Robert Louis Stevenson (adaptación de la Biblioteca)",synopsis:"Jim Hawkins es un chico que ayuda en la posada de su madre, hasta que un viejo pirata le deja un mapa con una cruz roja. Pronto se embarca en la goleta Hispaniola rumbo a una isla lejana, sin saber que el simpático cocinero de una sola pierna, Long John Silver, esconde un plan muy peligroso.",genres:["Aventura","Novela"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"isla",c1:"#f6bd60",c2:"#1d3557"},status:"published",featured:!0,license:"Adaptación libre de «La isla del tesoro» de Robert Louis Stevenson (1883), obra de dominio público",createdBy:null,createdAt:"2026-10-30 00:00:00",updatedAt:"2026-10-30 00:00:00",chapters:[{title:"El viejo pirata y el mapa",illustration:"barco",content:`Mi nombre es Jim Hawkins, y esta es la historia de cómo encontramos el tesoro del capitán Flint.

Todo empezó en la posada de mis padres, el Almirante Benbow, junto al mar. Una tarde llegó un viejo marinero, alto, curtido, con una cicatriz en la mejilla y un cofre de marinero a cuestas. Cantaba con voz ronca:

"Quince hombres sobre el cofre del muerto,
¡yo-ho-ho, y una botella de ron!"

Se quedó a vivir en la posada. Se llamaba Billy Bones, pasaba el día mirando el mar con un catalejo y me pagaba una moneda por mes para que vigilara si aparecía "un marinero con una sola pierna".

Un día llegó un mendigo ciego, con un bastón que golpeaba el camino: toc, toc, toc. Le dio a Billy Bones un papelito con un círculo negro: la "marca negra", la señal con la que los piratas avisaban que vendrían por alguien. El viejo pirata se asustó tanto que, esa misma noche, cayó muerto.

Mi madre y yo abrimos su cofre. Entre ropa vieja y monedas había un paquete envuelto en tela encerada. Apenas lo tomé, escuchamos el toc-toc del bastón y pasos de muchos hombres. Escapamos por la puerta de atrás y nos escondimos bajo un puente, mientras los piratas destrozaban la posada buscando algo.

Lo que buscaban lo tenía yo en el bolsillo.

Llevé el paquete al doctor Livesey y al señor Trelawney, el caballero más rico de la zona. Al abrirlo, encontramos un mapa de una isla, con montes, bahías y tres cruces rojas. Al lado de una de ellas, una nota: "Aquí está el grueso del tesoro".

—¡Es el mapa del capitán Flint, el pirata más temido de los mares! —exclamó Trelawney—. Compraremos un barco y zarparemos de inmediato. Y vos, Jim, vendrás como grumete.`},{title:"Lo que escuché dentro del barril",illustration:"barco",content:`El señor Trelawney compró una goleta, la Hispaniola, y contrató a un capitán serio y estricto, el capitán Smollett. Para la tripulación, un hombre del puerto le recomendó a muchos marineros, y también un cocinero: Long John Silver.

Silver era alto y fuerte, aunque le faltaba una pierna y caminaba con una muleta, con una agilidad asombrosa. Era simpático, sonriente, y llevaba sobre el hombro un loro verde que gritaba: "¡Piezas de ocho! ¡Piezas de ocho!". Me cayó bien de inmediato. Me contaba historias de mar y me trataba como a un amigo.

El capitán Smollett, en cambio, desconfiaba de todos.

—No me gusta este viaje —le dijo a Trelawney—. Todos los marineros parecen saber más que yo sobre adónde vamos.

Una noche, poco antes de llegar a la isla, bajé a buscar una manzana al barril que estaba en cubierta. Como quedaban pocas, me metí adentro. Y mientras estaba ahí, alguien se sentó apoyando la espalda en el barril. Era Silver. Hablaba en voz baja con dos marineros.

—Yo era el contramaestre de Flint —decía—. Muchos de los que estamos acá navegamos con él. Cuando tengamos el tesoro en el barco, nos deshacemos del capitán, del caballero y del doctor. Pero no antes: necesitamos que nos lleven de vuelta.

Me quedé helado. El hombre de una sola pierna del que me había advertido Billy Bones era Long John Silver. Y la mitad de la tripulación eran piratas.

En ese momento, el vigía gritó: "¡Tierra a la vista!". Todos corrieron a mirar y yo pude salir del barril sin que me vieran. Fui directo a contarle todo al capitán, al doctor y al señor Trelawney.

—Somos pocos —dijo el capitán Smollett, tranquilo—, pero ahora sabemos la verdad. Y eso, muchacho, nos da ventaja.`},{title:"Ben Gunn",illustration:"isla",content:`Al llegar a la isla, el capitán dejó que la mayoría de los marineros bajara a tierra, para tenerlos lejos del barco. Sin pensarlo mucho, yo me escondí en uno de los botes y salté a la playa antes que nadie. Corrí hacia el bosque.

Fue una locura. Desde los arbustos vi cómo Silver mataba a un marinero que no quiso unirse a los piratas. Escapé temblando, sin saber adónde ir, hasta que me encontré con una figura extraña: un hombre flaco, quemado por el sol, vestido con harapos de lona y piel de cabra.

—Me llamo Ben Gunn —dijo, con voz de quien no habla hace mucho—. Hace tres años que estoy solo en esta isla. Mis compañeros me abandonaron aquí. ¿Tenés queso? ¡Daría cualquier cosa por un pedacito de queso!

Ben Gunn había navegado con Flint. Y me dijo algo en voz baja, guiñando un ojo:

—Decile a tu caballero que Ben Gunn es rico. Muy rico.

Mientras tanto, el capitán, el doctor, Trelawney y los marineros leales habían abandonado el barco y se habían refugiado en un fuerte de troncos que había en la isla. Los piratas los atacaron. Hubo disparos, gritos y humo. Cuando encontré a mis amigos, estaban heridos pero habían resistido.

Esa noche no pude dormir. Pensaba que mientras los piratas tuvieran la Hispaniola, nunca podríamos volver a casa. Entonces tuve una idea muy valiente… o muy tonta.`},{title:"El tesoro de Flint",illustration:"isla",content:`Me escapé del fuerte en la oscuridad, encontré el pequeño bote de Ben Gunn escondido en la costa y remé hasta la Hispaniola. A bordo sólo habían quedado dos piratas, borrachos y peleando. Corté la cuerda del ancla y el barco empezó a ir a la deriva. Después de una lucha terrible con uno de ellos, Israel Hands, logré esconder la goleta en una bahía del norte de la isla. ¡El barco era nuestro otra vez!

Cuando volví al fuerte, me llevé una sorpresa horrible: los piratas lo habían ocupado, y mis amigos se habían ido. Silver me atrapó. Pero en lugar de matarme, me protegió.

—Jim, el doctor me dio el mapa —me dijo en voz baja—. Algo raro está pasando. Si las cosas salen mal, vos vas a hablar a mi favor.

Silver era así: siempre jugaba para los dos lados.

Al día siguiente, los piratas fueron a buscar el tesoro, conmigo atado a una cuerda. Siguieron el mapa hasta un árbol enorme. Allí encontraron un pozo… vacío. Sólo había unas tablas rotas y una moneda.

Los piratas se volvieron contra Silver, furiosos. Justo cuando iban a atacarnos, sonaron disparos desde el bosque: eran el doctor, Ben Gunn y un marinero leal. Los piratas huyeron.

Entonces se aclaró todo. Ben Gunn había encontrado el tesoro hacía mucho tiempo, durante sus años solo en la isla, y lo había llevado a una cueva. El doctor lo sabía, y por eso le había dado a Silver un mapa que ya no servía.

En la cueva de Ben Gunn vi el tesoro de Flint: montañas de monedas de todos los países, lingotes, joyas. Tardamos días en cargarlo en la Hispaniola.

En el viaje de vuelta, Silver se escapó una noche en un puerto, llevándose una bolsa de monedas. Nunca más supimos de él. Y yo, aunque terminé siendo rico, todavía hoy me despierto algunas noches escuchando, en sueños, al loro que grita: "¡Piezas de ocho! ¡Piezas de ocho!".`}],quiz:[{question:"¿Qué encontró Jim en el cofre de Billy Bones?",options:["Una espada","El mapa del tesoro del capitán Flint","Un loro","Una carta de su padre"],correct:1,explanation:"Estaba envuelto en tela encerada."},{question:"¿Cómo descubrió Jim el plan de los piratas?",options:["Leyó una carta","Escuchó a Silver escondido dentro de un barril de manzanas","Se lo contó el loro","Se lo dijo el capitán"],correct:1,explanation:"Silver habló del motín sin saber que Jim estaba ahí."},{question:"¿Por qué el pozo del tesoro estaba vacío?",options:["Porque nunca hubo tesoro","Porque Ben Gunn lo había encontrado y llevado a una cueva","Porque se lo llevó el mar","Porque Silver lo escondió"],correct:1,explanation:"Ben Gunn lo descubrió durante sus años solo en la isla."},{question:"¿Cómo era Long John Silver?",options:["Siempre leal","Simpático pero traicionero, jugaba para los dos lados","Muy tímido","Un capitán honrado"],correct:1,explanation:"Es uno de los personajes más complejos de la novela."}]},{id:28,slug:"el-misterio-del-tren-a-las-nubes",title:"El misterio del tren a las nubes",author:"Federico Lanús",synopsis:"En un tren turístico que sube por las montañas de Salta hasta más de cuatro mil metros de altura, desaparece un antiguo charango de plata que iba a ser donado a un museo. El tren no se detuvo en ningún lugar. El ladrón tiene que estar a bordo. Mora, del Club de Detectives Lupa, vuelve a investigar.",genres:["Policial","Misterio","Exploración"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"montanas",c1:"#f28482",c2:"#84a59d"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-31 12:00:00",updatedAt:"2026-10-31 12:00:00",chapters:[{title:"Rumbo a las nubes",illustration:"montanas",content:`Mora, la presidenta del Club de Detectives Lupa, estaba de vacaciones en Salta con su tía Clara, que era periodista. Habían subido al Tren a las Nubes, un tren turístico que parte de la ciudad de Salta y sube por la Quebrada del Toro, entre cerros de colores, hasta el viaducto La Polvorilla, a más de cuatro mil metros sobre el nivel del mar.

—A esa altura hay menos oxígeno en el aire —les explicó Fermín, el guía del tren, un muchacho simpático con un poncho rojo—. Por eso algunas personas se marean o les duele la cabeza. En la zona lo llaman "apunamiento". Hay que moverse despacio y tomar mucha agua.

En el mismo vagón viajaban personajes interesantes. Un señor elegante, de bigote fino, que se presentó como coleccionista de instrumentos antiguos: el señor Benavente. Una señora que tejía sin parar: la señora Quispe, que viajaba a su pueblo. Un estudiante extranjero con una cámara enorme: Hans. Y una pareja de recién casados que se sacaba fotos todo el tiempo.

Pero lo más interesante iba en una vitrina al fondo del vagón: un charango antiguo, de más de doscientos años, con incrustaciones de plata. Lo acompañaba una mujer seria, la licenciada Ríos, del museo de la provincia.

—Este charango perteneció a un músico famoso de la Quebrada —explicó—. Lo vamos a llevar a San Antonio de los Cobres para una muestra especial y después vuelve al museo. Es una pieza única.

El señor Benavente se acercó a la vitrina y la miró largo rato, con los ojos brillantes.

—Daría una fortuna por tenerlo —murmuró.

Mora anotó eso en su libreta.`},{title:"La vitrina vacía",illustration:"barco",content:`El tren subía y subía, haciendo zigzags y vueltas en espiral para ganar altura. Por la ventana se veían cardones, llamas, cerros violetas y verdes, y un cielo azul intenso.

Cerca del mediodía, el tren entró en un túnel largo. Todo quedó a oscuras durante casi un minuto. Cuando salieron a la luz, la licenciada Ríos pegó un grito.

La vitrina estaba abierta. El charango había desaparecido.

—¡Que nadie se mueva! —dijo Fermín, el guía—. El tren no paró en ningún lugar. El charango tiene que estar acá.

Llamaron a un policía que viajaba en el tren, el cabo Mamaní, que empezó a revisar bolsos y equipajes. Todos estaban nerviosos. El señor Benavente se ofendió muchísimo:

—¡Esto es una vergüenza! ¡Yo soy un caballero!

Mora se acercó a la vitrina con su lupa. La cerradura no estaba rota: la habían abierto con una llave. En el piso, junto a la vitrina, encontró unos pelos finitos de color rojo, como de lana. Y en la manija de la vitrina, una mancha brillante, como de grasa.

—Tía, ¿quién tenía llave de la vitrina?

—La licenciada Ríos, supongo —dijo tía Clara—. Y quizás alguien del tren.

Mora habló con la licenciada.

—Sólo hay dos llaves —le dijo la mujer—. Yo tengo una, y la otra la tiene el personal del tren, por seguridad.

Revisaron todos los equipajes. No apareció el charango. Ni en el bolso del señor Benavente, ni en la mochila de Hans, ni en las bolsas de la señora Quispe, ni en ningún otro lado.

—Es imposible —dijo el cabo Mamaní, rascándose la cabeza—. Un charango no se puede esconder en el aire.

Mora miró por la ventana. Afuera, el tren avanzaba sobre un puente altísimo, de hierro, sobre un precipicio enorme. Era el viaducto La Polvorilla.`},{title:"Lo que vio la lupa",illustration:"montanas",content:`Mora repasó sus notas con cuidado, como le había enseñado su amigo Ulises: no hay que acusar sin pruebas, y las pistas pequeñas también importan.

Primera pista: la vitrina se abrió con llave. Segunda: pelos rojos de lana en el piso. Tercera: una mancha de grasa brillante en la manija. Cuarta: el robo fue durante el túnel, en la oscuridad, así que el ladrón sabía exactamente cuándo iba a entrar el tren al túnel y cuánto iba a durar.

—El señor Benavente quería el charango —dijo tía Clara—. Es el sospechoso perfecto.

—Demasiado perfecto —contestó Mora—. Y además, él no sabía cuándo venía el túnel. Es la primera vez que viaja. Lo dijo esta mañana.

Mora miró a su alrededor. ¿Quién conocía el recorrido de memoria? ¿Quién tenía acceso a la llave del personal del tren? ¿Quién usaba algo de lana roja?

Fermín, el guía, pasó por el pasillo, sonriendo, con su poncho rojo. Mora vio que tenía las manos un poco brillantes. Él dijo que se había puesto protector solar, porque en la altura el sol quema mucho.

Mora sintió un cosquilleo en la nuca, el que sentía siempre que estaba cerca de resolver un caso.

—Tía —susurró—, si yo me robara algo en un tren y no lo pudiera tener encima, porque me van a revisar, ¿qué haría?

—Lo escondería en algún lugar del tren y lo buscaría después, cuando todos se fueran.

—Exacto. Y ¿quién se queda en el tren cuando todos se van?

Tía Clara abrió muy grandes los ojos.

—El personal del tren.`},{title:"El escondite",illustration:"escuela",content:`Mora le contó sus deducciones al cabo Mamaní en voz baja. El policía dudó: Fermín era muy querido por todos y trabajaba en el tren hacía años. Pero aceptó revisar los lugares que sólo podía usar el personal.

En un armario de mantenimiento, junto a los baños, detrás de unas cajas de agua mineral, encontraron una bolsa de tela. Adentro, envuelto en una manta, estaba el charango de plata, intacto.

Cuando le mostraron la bolsa, Fermín se puso pálido. Primero dijo que no sabía nada. Pero en la manija de la vitrina había quedado la misma crema brillante que él tenía en las manos, y en la manta que envolvía el charango había pelitos rojos de su poncho. Además, él tenía la segunda llave.

Al final, Fermín confesó. Tenía muchas deudas, y un comprador desconocido le había ofrecido mucho dinero por el charango. Pensaba sacarlo del tren por la noche, cuando ya no hubiera pasajeros.

—Me equivoqué —dijo, mirando el piso—. Este charango es parte de la historia de mi tierra. No tendría que haberlo tocado.

El señor Benavente, que había estado ofendidísimo toda la mañana, se acercó a Mora y le dio la mano.

—Señorita, gracias por no dejarse llevar por las apariencias. Todos pensaban que yo era el ladrón.

La licenciada Ríos abrazó el charango como si fuera un bebé. Esa tarde, en San Antonio de los Cobres, se hizo la muestra. Un músico del pueblo tocó el charango de plata frente a todos: sonaba dulce, agudo, como si cantara.

Esa noche, en el hotel, Mora le escribió un mensaje a Benja y a Ulises, del Club Lupa:

"Caso N.º 8: resuelto. Lección: el sospechoso más evidente no siempre es el culpable. Y las pistas más chiquitas, como un pelito de lana, pueden ser las más importantes".`}],quiz:[{question:"¿Por qué en la altura algunas personas se marean?",options:["Porque hace calor","Porque hay menos oxígeno en el aire","Porque el tren va rápido","Por la comida"],correct:1,explanation:"A más de cuatro mil metros el aire tiene menos oxígeno: se llama apunamiento."},{question:"¿Cuándo robaron el charango?",options:["En la estación","Mientras el tren pasaba por un túnel oscuro","A la noche","En el viaducto"],correct:1,explanation:"El ladrón aprovechó la oscuridad y sabía cuánto duraba el túnel."},{question:"¿Por qué Mora descartó al señor Benavente?",options:["Porque era amable","Porque no conocía el recorrido ni tenía llave","Porque estaba dormido","Porque era rico"],correct:1,explanation:"El ladrón necesitaba conocer el túnel y tener la llave."},{question:"¿Qué pistas incriminaron a Fermín?",options:["Una foto","Pelos de lana roja de su poncho, la crema en la manija y la segunda llave","Una confesión escrita","Una huella de zapato"],correct:1,explanation:"Las pistas pequeñas resultaron decisivas."}]},{id:29,slug:"cuentos-de-la-selva-y-del-miedo",title:"Cuentos de la selva y del miedo",author:"Horacio Quiroga (adaptación de la Biblioteca)",synopsis:"Horacio Quiroga vivió en la selva de Misiones y escribió algunos de los cuentos más famosos de nuestra literatura: unos tiernos y llenos de animales que hablan, otros inquietantes, de esos que se quedan dando vueltas en la cabeza. Tres de sus relatos, contados de nuevo para lectores de hoy.",genres:["Cuento","Terror","Naturaleza"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"bosque",c1:"#606c38",c2:"#283618"},status:"published",featured:!1,license:"Adaptación libre de cuentos de Horacio Quiroga («El almohadón de plumas», 1907; «La tortuga gigante» y «Las medias de los flamencos», de Cuentos de la selva, 1918), obra de dominio público",createdBy:null,createdAt:"2026-11-02 00:00:00",updatedAt:"2026-11-02 00:00:00",chapters:[{title:"Las medias de los flamencos",illustration:"oceano",content:`Cierta vez las víboras dieron un gran baile. Invitaron a las ranas y a los sapos, a los flamencos, a los yacarés y a los peces. Los peces, como no caminan, no pudieron bailar; pero, sentados a la orilla del río, aplaudían con la cola.

Los yacarés, para estar elegantes, se pusieron en el pescuezo un collar de bananas. Los sapos se pegaron escamas de pescado en todo el cuerpo y caminaban meneándose, como si nadaran. Las ranas se perfumaron y caminaban en dos pies. Pero las más lindas eran las víboras de coral, que llevaban un traje de rayas rojas, blancas y negras, y bailaban como serpentinas.

Sólo los flamencos estaban tristes. En aquel tiempo tenían las patas blancas, y como son tan poco inteligentes, no se les había ocurrido cómo adornarse. Envidiaban a todos, y sobre todo a las víboras de coral.

—Ya sé —dijo uno—. Vamos a ponernos medias coloradas, blancas y negras, y las víboras se van a enamorar de nosotros.

Fueron al almacén del pueblo.

—¡Tan-tan! ¿Tiene medias coloradas, blancas y negras?

—No hay —contestó el almacenero.

Fueron a otro, y a otro. En ninguna parte había. Entonces un tatú, que había ido a tomar agua al río, se quiso burlar de ellos:

—Yo sé dónde hay medias así. Vayan a ver a la lechuza.

La lechuza, que era muy pícara, les dijo:

—Esperen un momento. —Y volvió con unas medias preciosas, rojas, blancas y negras—. Pero no dejen de bailar ni un instante. Si se detienen, en vez de bailar, van a llorar.

Las medias no eran medias: eran cueros de víboras de coral, que la lechuza había cazado.

Los flamencos se las pusieron muy contentos y llegaron al baile. Todos se quedaron mirándolos. Las víboras, sobre todo, no les sacaban los ojos de encima a esas medias. Bailaron y bailaron, hasta que, cansados, tuvieron que detenerse un instante. Entonces las víboras se acercaron, vieron de cerca las medias… y descubrieron que eran cueros de sus hermanas.

—¡No son medias! —gritaron—. ¡Nos mataron a nuestras hermanas!

Y se lanzaron sobre los flamencos, mordiéndoles las patas. Los flamencos huyeron volando, con las patas ardiendo por el veneno, y se metieron en el agua para calmar el dolor.

Desde entonces, los flamencos tienen las patas coloradas, como si todavía les ardieran. Y se pasan el día parados en el agua, con las patas rojas metidas en el río, tratando de calmar ese ardor que no se les pasa nunca.`},{title:"La tortuga gigante",illustration:"bosque",content:`Había una vez un hombre que vivía en Buenos Aires y estaba muy contento porque era fuerte y trabajador. Pero un día se enfermó, y los médicos le dijeron que solamente yéndose al campo podría curarse. Él no quería ir, porque tenía hermanos chicos a quienes daba de comer; pero se enfermaba cada día más. Entonces, un amigo suyo, que era director del Zoológico, le dijo:

—Usted es amigo mío, y es un hombre bueno y trabajador. Por eso quiero que se vaya a vivir al monte, a hacer mucho ejercicio al aire libre para curarse. Y como usted tiene mucha puntería con la escopeta, cace bichos del monte para traerme los cueros.

El hombre se fue a vivir al monte, lejos, más lejos que Misiones todavía. Hacía allá mucho calor, y eso le hacía bien. Comía pájaros y bichos del monte, dormía bajo los árboles y poco a poco se puso fuerte.

Un día vio a un tigre enorme que quería comerse a una tortuga, una tortuga grandísima, a la que el tigre le había lastimado la cabeza. El hombre le apuntó al tigre y, de un solo tiro, la salvó. Después le curó la herida con trapos y grasa, y la cuidó durante días, dándole hierbas para comer, hasta que la tortuga se curó.

Pero entonces fue el hombre el que se enfermó. Le dio una fiebre terrible y se quedó tirado, sin poder moverse.

—Me voy a morir —dijo—. Estoy solo, y tengo mucha sed.

La tortuga lo oyó. Ella no sabía hablar, pero lo había comprendido todo.

—El hombre no me comió, aunque tenía hambre, y me curó —pensó—. Ahora yo lo voy a curar a él.

Fue al arroyo, juntó agua en la cáscara de un caracol y le dio de beber. Le buscó raíces y hierbas. Pero el hombre seguía enfermo. Entonces la tortuga tomó una decisión. Se lo cargó en el lomo, atado con enredaderas, y empezó a caminar hacia Buenos Aires.

Caminó durante días, semanas, meses. Cruzó montes, pantanos y ríos. Comía cuando podía, dormía poco. Llevaba al hombre arriba, que deliraba de fiebre. Cuando estaba ya muerta de cansancio, una noche, vio a lo lejos un resplandor en el cielo: eran las luces de Buenos Aires.

Siguió caminando, a la madrugada, por las calles de la ciudad, hasta que llegó al Zoológico. Golpeó la puerta con el pico. El director salió, vio al hombre enfermo atado sobre una tortuga gigante, y no lo pudo creer.

Lo curaron. El hombre se mejoró y, cuando supo lo que la tortuga había hecho por él, no quiso separarse de ella. Pero como no podía tenerla en su casa, el director le dio un lugar en el Zoológico, donde la cuidaron como a una reina.

Y el hombre fue todos los días a visitarla. Le hacía cariños en la cabeza, y ella, aunque no hablaba, lo miraba como se mira a un amigo.`},{title:"El almohadón de plumas",illustration:"casona",content:`Su luna de miel fue un largo escalofrío. Alicia, rubia, angelical y tímida, se había casado con Jordán, un hombre serio, callado y de carácter duro. Ella lo quería mucho, pero el carácter frío de su marido la hacía estremecerse a veces.

La casa en que vivían tampoco ayudaba. Era una casa grande, silenciosa, con paredes blancas y patios de mármol, donde todo resonaba y donde siempre parecía hacer frío, aun en verano.

Alicia empezó a adelgazar. Tuvo un ataque de gripe que se arrastró durante días, y después ya no se recuperó. Una tarde, paseando por el jardín, se quedó sin fuerzas. Esa noche ya no se levantó de la cama.

El médico la revisó con atención.

—No sé qué tiene —dijo—. Está muy débil, como si cada día perdiera sangre. Pero no veo ninguna herida. No vomita, no tiene fiebre alta. Simplemente, se apaga.

Los días pasaron. Alicia empeoraba. Por las mañanas se despertaba más pálida que la noche anterior, y durante el día parecía recuperarse un poco. Pero cada noche volvía a hundirse. Tenía alucinaciones: veía en la alfombra figuras horribles que se arrastraban hacia ella. Jordán caminaba de un lado al otro de la sala, sin saber qué hacer.

Una mañana, Alicia ya no despertó.

Cuando la sirvienta entró a deshacer la cama, se quedó mirando el almohadón de plumas donde Alicia había apoyado la cabeza.

—Señor —dijo, en voz baja—, el almohadón tiene unas manchas que parecen de sangre.

Jordán se acercó. En el lugar donde había descansado la cabeza de Alicia se veían dos puntitos oscuros. Levantó el almohadón. Pesaba muchísimo, como si estuviera lleno de algo más que plumas.

Lo llevó a la mesa del comedor y lo abrió con un cuchillo. Las plumas volaron, y la sirvienta dio un grito: entre las plumas, moviéndose lentamente, había un animal monstruoso, una bola viviente y viscosa, hinchada como un globo, con unas patitas velludas. Estaba tan lleno de sangre que apenas se le veía la boca.

Noche tras noche, desde que Alicia había caído en cama, aquel animal había aplicado su boca a las sienes de ella, chupándole la sangre en silencio. La picadura era casi imperceptible. Y como Alicia apoyaba la cabeza todas las noches en el mismo almohadón, el animal había ido creciendo mientras ella se apagaba.

Estos parásitos de las aves, diminutos en el medio común, llegan a adquirir en ciertas condiciones proporciones enormes. La sangre humana parece serles particularmente favorable, y no es raro encontrarlos en los almohadones de plumas.`}],quiz:[{question:'Según "Las medias de los flamencos", ¿por qué los flamencos tienen las patas rojas?',options:["Por el sol","Por el veneno de las víboras que los mordieron","Porque las pintaron","Porque comen frutas rojas"],correct:1,explanation:'Es un cuento que "explica" de forma fantástica un rasgo de la naturaleza.'},{question:"¿Qué hizo la tortuga gigante para salvar al hombre?",options:["Llamó a un médico","Lo llevó en su lomo hasta Buenos Aires","Le dio un remedio mágico","Buscó a otros animales"],correct:1,explanation:"Caminó durante meses cargándolo."},{question:'¿Qué valores aparecen en "La tortuga gigante"?',options:["La envidia","La gratitud y la amistad","La venganza","El engaño"],correct:1,explanation:"La tortuga devuelve el cuidado que había recibido."},{question:'¿Qué provocaba la enfermedad de Alicia en "El almohadón de plumas"?',options:["Un virus","Un parásito escondido en el almohadón que le chupaba la sangre","La tristeza","Un veneno"],correct:1,explanation:"El final revela la causa de manera sorpresiva."},{question:'¿Qué tipo de final tiene "El almohadón de plumas"?',options:["Feliz","Sorpresivo, con una revelación inquietante","Abierto sin explicación","Cómico"],correct:1,explanation:"Quiroga guarda la explicación para el final, como en muchos cuentos de terror."}]},{id:30,slug:"el-corazon-delator-y-la-mascara-de-la-muerte-roja",title:"El corazón delator y otros cuentos de Poe",author:"Edgar Allan Poe (adaptación de la Biblioteca)",synopsis:"Un narrador que insiste en que no está loco mientras cuenta un crimen que lo atormenta. Un príncipe que se encierra con sus amigos en un palacio para escapar de una peste. Dos cuentos de Edgar Allan Poe, el maestro del terror psicológico, en una versión para lectores valientes.",genres:["Terror","Suspenso","Cuento"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"casona",c1:"#1b1b2f",c2:"#9d0208"},status:"published",featured:!1,license:"Adaptación libre de «El corazón delator» (1843) y «La máscara de la Muerte Roja» (1842) de Edgar Allan Poe, obra de dominio público",createdBy:null,createdAt:"2026-11-03 12:00:00",updatedAt:"2026-11-03 12:00:00",chapters:[{title:"El corazón delator (I): el ojo",illustration:"casona",content:`¡Es verdad! Soy nervioso, terriblemente nervioso. Siempre lo fui. Pero ¿por qué dicen que estoy loco? La enfermedad agudizó mis sentidos; no los destruyó. Sobre todo, el oído. Oía todo lo que pasa en el cielo y en la tierra. ¿Cómo, entonces, puedo estar loco? Escuchen. Observen con qué calma, con qué cordura les cuento esta historia.

Es imposible decir cómo se me metió la idea en la cabeza. No había un motivo. Yo quería al viejo con quien vivía. Nunca me había hecho daño. Nunca me había ofendido. No deseaba su dinero. Creo que fue su ojo. ¡Sí, eso fue! Tenía un ojo como el de un buitre: un ojo celeste pálido, cubierto por una tela. Cada vez que me miraba, se me helaba la sangre. Y así, poco a poco, muy gradualmente, decidí librarme para siempre de aquel ojo.

Ustedes me creen loco. Los locos no saben nada. Pero deberían haberme visto. ¡Con qué prudencia procedí! Nunca fui tan amable con el viejo como durante la semana anterior. Y cada noche, cerca de las doce, giraba el picaporte de su puerta y la abría, ¡oh, tan despacio! Metía una linterna sorda, cerrada, que no dejaba salir ninguna luz, y después la cabeza. Tardaba una hora en meter la cabeza por la abertura, tan lentamente para no despertarlo. ¿Haría eso un loco? Después, cuando mi cabeza estaba dentro, abría la linterna con cuidado, sólo lo suficiente para que un rayo finito cayera sobre el ojo del buitre.

Durante siete noches hice lo mismo. Y siempre encontré el ojo cerrado. Así que era imposible hacer el trabajo, porque no era el viejo quien me molestaba, sino su ojo maldito.

La octava noche fui más cuidadoso que nunca. El minutero de un reloj se mueve más rápido que mi mano. Estaba abriendo la puerta, poco a poco, cuando el viejo se movió en la cama. Mi dedo resbaló sobre el cierre de la linterna, y el viejo se incorporó, gritando:

—¿Quién anda ahí?

Me quedé inmóvil. Durante una hora entera no moví un músculo, y en todo ese tiempo no lo oí volver a acostarse. Estaba sentado en la cama, escuchando, igual que yo lo había hecho tantas noches, oyendo los ruidos de la muerte en la pared.`},{title:"El corazón delator (II): el latido",illustration:"luna",content:`Al rato oí un gemido. No era de dolor ni de pena: era el gemido sordo que sube desde el fondo de un alma llena de terror. Yo conocía ese sonido. Muchas noches había brotado de mi propio pecho. El viejo sabía que había alguien en la habitación. Sentía la presencia de la muerte, aunque no la viera.

Abrí la linterna, muy poco, hasta que un único rayo, fino como un hilo de araña, cayó sobre el ojo del buitre. Estaba abierto. Abierto de par en par. Y me enfureció mirarlo.

Entonces llegó a mis oídos un sonido apagado y rápido, como el de un reloj envuelto en algodón. Yo conocía ese sonido. Era el latido del corazón del viejo. Aumentó mi furia, como el redoble de un tambor aumenta el coraje del soldado.

El latido crecía, más rápido, más fuerte. El terror del viejo debía ser extremo. ¡Más fuerte, más fuerte! Y temí que algún vecino pudiera oírlo. Llegó la hora del viejo. Con un grito, abrí la linterna y salté dentro de la habitación. Él gritó una sola vez. En un instante todo terminó. El corazón siguió latiendo unos minutos con un sonido ahogado. Después se detuvo. El ojo no volvería a molestarme.

Si todavía me creen loco, ya no lo creerán cuando les cuente las precauciones que tomé para esconder el cuerpo. Levanté tres tablas del piso de la habitación y lo escondí allí, entre las vigas. Después volví a colocar las tablas con tanta habilidad que ningún ojo humano, ni siquiera el suyo, hubiera podido notar nada.

A las cuatro de la mañana golpearon la puerta. Eran tres policías. Un vecino había escuchado un grito durante la noche y habían venido a investigar.

Los hice pasar con una sonrisa. ¿Qué tenía que temer? El grito, les dije, lo había dado yo, en sueños. El viejo, les expliqué, estaba de viaje en el campo. Les mostré la casa entera. Los llevé, por último, a su habitación. Traje sillas y, en mi entusiasmo, puse la mía justo encima de las tablas bajo las cuales descansaba la víctima.

Los policías estaban satisfechos. Charlaban tranquilos. Pero al rato sentí que palidecía. Me dolía la cabeza y me zumbaban los oídos. El zumbido se volvió más claro. Era un sonido apagado y rápido… como el de un reloj envuelto en algodón.

Hablé más fuerte. Me levanté, discutí, golpeé la silla contra el piso. Pero el sonido crecía. ¿Cómo era posible que ellos no lo oyeran? ¡Lo oían! ¡Sospechaban! ¡Se burlaban de mi horror! ¡Más fuerte! ¡Más fuerte!

—¡Basta de fingir! —grité—. ¡Lo confieso todo! ¡Levanten esas tablas! ¡Ahí, ahí! ¡Es el latido de su horrible corazón!`},{title:"La máscara de la Muerte Roja",illustration:"castillo",content:`Hacía mucho tiempo que la Muerte Roja devastaba el país. Nunca una peste había sido tan terrible. Sus señales eran el color rojo y el horror de la sangre: dolores agudos, un mareo repentino y, en menos de media hora, el fin.

Pero el príncipe Próspero era feliz, valiente y astuto. Cuando la mitad de su reino había muerto, convocó a mil amigos sanos y alegres de su corte y se retiró con ellos a una de sus abadías fortificadas. Una muralla alta rodeaba el edificio, con puertas de hierro. Una vez adentro, los cortesanos soldaron los cerrojos. No pensaban dejar salir a nadie, ni dejar entrar a la desesperación. Afuera, que el mundo se arreglara solo. Adentro había músicos, bailarines, vino y belleza. Afuera, la Muerte Roja.

Al quinto o sexto mes de encierro, mientras la peste arrasaba el exterior, el príncipe ofreció a sus invitados un baile de máscaras de una magnificencia nunca vista.

El baile se hizo en siete salones conectados entre sí, cada uno de un color: el primero azul, el segundo púrpura, el tercero verde, el cuarto anaranjado, el quinto blanco, el sexto violeta. El séptimo estaba cubierto de terciopelo negro, y sus ventanas eran de un rojo intenso, color sangre. Pocos invitados se animaban a entrar en él. Allí había, además, un gigantesco reloj de ébano. Cada vez que daba la hora, sonaba de un modo tan extraño que los músicos dejaban de tocar y los bailarines se quedaban quietos, pálidos, con un escalofrío. Después se reían de sus nervios, y la fiesta seguía.

Cuando el reloj dio las doce de la noche, la multitud notó la presencia de una figura enmascarada que nadie había visto antes. Era alta, delgada, envuelta en un sudario como el de las tumbas. Su máscara imitaba el rostro rígido de un cadáver. Y su ropa y su cara estaban salpicadas de manchas rojas: el disfraz imitaba a la Muerte Roja.

El príncipe Próspero se puso rojo de furia.

—¿Quién se atreve a burlarse de nosotros de esta manera? —gritó—. ¡Agárrenlo y quítenle la máscara!

Pero nadie se animó a tocar al desconocido, que caminó lentamente por los salones: el azul, el púrpura, el verde, el anaranjado, el blanco, el violeta. El príncipe, avergonzado de su propio miedo, sacó un puñal y corrió detrás de él. Lo alcanzó en el salón negro. La figura se dio vuelta. Se oyó un grito, y el príncipe cayó muerto sobre la alfombra.

Los invitados, desesperados, se lanzaron sobre el enmascarado y le arrancaron el sudario y la máscara. Debajo no había nada. Ninguna forma. Sólo vacío.

Entonces reconocieron la presencia de la Muerte Roja. Había llegado como un ladrón en la noche. Y uno a uno fueron cayendo los invitados en los salones de la fiesta. El reloj de ébano se detuvo. Y las tinieblas, la ruina y la Muerte Roja tuvieron un dominio ilimitado sobre todo.`}],quiz:[{question:'¿Por qué el narrador de "El corazón delator" insiste tanto en que no está loco?',options:["Porque es médico","Porque intenta convencernos, aunque su relato muestra lo contrario","Porque lo dice un juez","Porque es verdad"],correct:1,explanation:"Es un narrador poco confiable: su propia forma de contar lo delata."},{question:"¿Qué molestaba al narrador del viejo?",options:["Su dinero","Su ojo de buitre","Sus gritos","Su casa"],correct:1,explanation:"Él mismo dice que no tenía otro motivo."},{question:"¿Por qué confiesa el crimen ante los policías?",options:["Porque lo vieron","Porque cree oír el latido del corazón del viejo y no lo soporta","Porque encontraron el cuerpo","Porque un vecino lo acusó"],correct:1,explanation:"Su culpa y sus nervios lo traicionan."},{question:'En "La máscara de la Muerte Roja", ¿qué intentó hacer el príncipe Próspero?',options:["Curar a los enfermos","Encerrarse con sus amigos para escapar de la peste","Huir a otro país","Buscar un médico"],correct:1,explanation:"Se aisló dejando al pueblo afuera, sufriendo la peste."},{question:"¿Qué idea transmite el final de ese cuento?",options:["Que el dinero salva de todo","Que nadie puede escapar de la muerte, por más poder que tenga","Que las fiestas son peligrosas","Que los relojes dan miedo"],correct:1,explanation:"La peste entra igual: el poder no protege del destino común."}]},{id:31,slug:"frankenstein",title:"Frankenstein",author:"Mary Shelley (adaptación de la Biblioteca)",synopsis:"Víctor Frankenstein, un joven científico obsesionado, logra dar vida a un ser hecho con sus propias manos. Pero cuando lo ve abrir los ojos, huye horrorizado y lo abandona. La criatura, sola y rechazada por todos, buscará respuestas… y su creador tendrá que enfrentar las consecuencias. Una de las primeras novelas de ciencia ficción de la historia.",genres:["Ciencia ficción","Terror","Novela"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"castillo",c1:"#2b2d42",c2:"#588157"},status:"published",featured:!0,license:"Adaptación libre de «Frankenstein o el moderno Prometeo» de Mary Shelley (1818), obra de dominio público",createdBy:null,createdAt:"2026-11-05 00:00:00",updatedAt:"2026-11-05 00:00:00",chapters:[{title:"Un hombre en el hielo",illustration:"pinguino",content:`En el verano de 1797, el barco del explorador Robert Walton avanzaba lentamente entre los hielos del Polo Norte. Walton soñaba con llegar a donde nadie había llegado, aunque para eso tuviera que arriesgarlo todo.

Una mañana, la tripulación vio algo increíble: a lo lejos, sobre el hielo, un trineo tirado por perros, y en él una figura de forma humana pero de un tamaño gigantesco, que se alejó rápidamente hacia el norte. Al día siguiente encontraron otro trineo, a la deriva sobre un témpano. En él había un hombre casi muerto de frío y cansancio. Lo subieron al barco.

Cuando se recuperó un poco, el hombre miró a Walton con ojos muy tristes.

—Usted busca el conocimiento a cualquier precio, como lo hice yo —le dijo—. Escuche mi historia. Tal vez le sirva de advertencia.

Se llamaba Víctor Frankenstein. Había nacido en Ginebra, en una familia feliz. Tenía un hermano pequeño, William, y una prima que se crió con él, Elizabeth, a quien amaba profundamente. Su mejor amigo era Henry Clerval, un muchacho alegre que adoraba la poesía.

Desde chico, a Víctor le apasionaban los secretos de la naturaleza. Leía a viejos alquimistas que buscaban el elixir de la vida. Cuando entró a la universidad de Ingolstadt, en Alemania, descubrió la química moderna y la electricidad, y se obsesionó con una pregunta: ¿de dónde viene la vida? ¿Se podría crear?

Durante dos años trabajó en secreto, día y noche, en un cuarto alto de su casa. Dejó de escribirle a su familia. Dejó de ver a sus amigos. Adelgazó, se puso pálido. Juntaba materiales en lugares oscuros que prefería no recordar. Quería crear un ser vivo. Y como las partes pequeñas eran difíciles de trabajar, decidió hacerlo enorme: de casi dos metros y medio de altura.

—Pensaba que sería un benefactor de la humanidad —le dijo a Walton—. Que una nueva especie me bendeciría como su creador. No pensé en nada más.`},{title:"Lo que abrió los ojos",illustration:"luna",content:`Fue una noche lúgubre de noviembre. La lluvia golpeaba los vidrios y la vela estaba casi consumida. A la luz temblorosa, Víctor vio cómo se abría el ojo amarillento y sin brillo de la criatura. Respiró con dificultad. Un movimiento convulsivo agitó sus miembros.

Víctor había elegido sus rasgos pensando que serían hermosos. Pero ahora, con vida, aquel ser le pareció espantoso: la piel amarillenta apenas cubría los músculos, el pelo era negro y brillante, los dientes blanquísimos, y los ojos acuosos parecían del mismo color que las cuencas en que estaban. Sus labios eran negros y rectos.

El sueño de dos años se convirtió en horror. Víctor salió corriendo de la habitación y se encerró en su dormitorio. Esa noche, despertó sobresaltado: la criatura estaba junto a su cama, mirándolo, con una mano extendida hacia él, como pidiéndole algo. Sus labios hicieron unos sonidos que no entendió. Quizás sonreía. Víctor huyó a la calle y pasó la noche caminando bajo la lluvia.

Cuando volvió, con su amigo Clerval, que había llegado de visita, la criatura ya no estaba. Víctor cayó enfermo con una fiebre que le duró meses. Clerval lo cuidó con paciencia. Víctor nunca le contó lo que había hecho.

Meses después, recibió una carta terrible de su padre: su hermanito William había sido asesinado en un bosque cerca de Ginebra. Víctor viajó de inmediato. Era de noche y había tormenta cuando llegó al lugar. Un relámpago iluminó los árboles, y entre ellos vio una figura gigantesca, deforme, que trepaba por las rocas con una agilidad imposible.

Lo supo en ese mismo instante: era su criatura. Era ella la que había matado a William.

Pero lo peor estaba por llegar. Habían acusado del crimen a Justine, una joven muy querida que trabajaba en la casa de la familia, porque encontraron entre sus cosas un medallón de William. Víctor sabía que era inocente. Pero ¿cómo iba a explicar la verdad? ¿Quién le iba a creer que había creado un monstruo? Calló. Y Justine fue condenada.

Víctor se sentía el verdadero culpable de las dos muertes.`},{title:"La historia de la criatura",illustration:"montanas",content:`Para escapar de su dolor, Víctor subió a las montañas de los Alpes, hasta un enorme glaciar llamado el Mar de Hielo. Allí, entre la niebla, vio acercarse a la criatura saltando sobre las grietas del hielo.

—¡Demonio! —gritó Víctor—. ¡Ojalá pudiera destruirte!

—Esperaba que me recibieras así —dijo la criatura, con una voz grave y una sorprendente elocuencia—. Todos odian a los desgraciados. Pero yo soy tu creación. Debería ser tu Adán, y soy más bien el ángel caído al que expulsaste sin culpa. Escúchame. Después decidirás.

Y le contó su historia.

Al principio no entendía nada. Veía, oía, sentía frío y hambre sin saber qué eran esas cosas. Vagó por los bosques. La primera vez que entró a un pueblo, la gente gritó, los perros lo persiguieron y le tiraron piedras. Se escondió en un cobertizo pegado a la casa de una familia pobre: un anciano ciego, De Lacey, y sus dos hijos.

Durante meses los observó en secreto por una rendija. Vio su cariño, su tristeza, su música. Por las noches, les dejaba leña cortada para ayudarlos. Escuchándolos, aprendió a hablar. Encontró unos libros y aprendió a leer. Leyendo, descubrió qué era: un ser solo, sin familia, sin nombre, sin nadie parecido a él.

Un día se animó a presentarse ante el anciano ciego, que no podía ver su aspecto. El anciano lo escuchó con bondad. Pero en ese momento volvieron sus hijos, y al verlo, lo atacaron horrorizados. La familia abandonó la casa para siempre.

—Ese día —dijo la criatura— algo se rompió en mí. Yo era bueno. La desgracia me hizo malo. Busqué a mi creador, y en el camino encontré a tu hermano. Al saber que era de tu familia… Sí, fui yo. Y yo puse el medallón entre las ropas de Justine.

Víctor temblaba de odio y de horror. Pero la criatura hizo un pedido.

—Estoy solo. Hazme una compañera, de mi misma especie, tan horrible como yo. Nos iremos lejos, a las selvas de América del Sur, donde ningún humano nos vea. Te juro que nunca más le haré daño a nadie.`},{title:"Hasta el fin del hielo",illustration:"pinguino",content:`Víctor aceptó, atormentado. Viajó con Clerval a Inglaterra y después se encerró solo en una cabaña de una isla remota de Escocia para trabajar en la compañera. Pero mientras trabajaba, las dudas lo devoraban. ¿Y si ella no aceptaba el pacto? ¿Y si tenían hijos, y nacía una raza de seres que amenazara a la humanidad?

Una noche, al levantar la vista, vio a la criatura en la ventana, observándolo con una sonrisa. En ese momento, Víctor destrozó lo que había hecho.

La criatura soltó un aullido de desesperación.

—Recordá esto —le dijo antes de desaparecer en la noche—: estaré contigo en tu noche de bodas.

La venganza llegó como una tormenta. Primero, Clerval apareció sin vida en una playa de Irlanda. Después, cuando Víctor, al volver a Suiza, se casó con Elizabeth, sucedió lo que la criatura había anunciado: la noche de bodas, Víctor escuchó un grito, corrió a la habitación y encontró a Elizabeth muerta. Por la ventana vio a la criatura, que se burlaba de él y huía hacia el lago. Poco después, el padre de Víctor murió de pena.

Víctor ya no tenía a nadie. Sólo le quedaba un propósito: perseguir a su creación hasta destruirla. La siguió por Europa y Rusia, hasta los hielos del Ártico. A veces la criatura le dejaba mensajes y comida, como si quisiera que la persecución no terminara nunca.

Así lo había encontrado Walton. Pocos días después de contar su historia, Víctor Frankenstein murió en el barco.

Esa misma noche, Walton oyó ruidos en el camarote. Al entrar, vio a la criatura inclinada sobre el cuerpo de su creador. Lloraba.

—Él también es mi víctima —dijo—. Y yo soy la suya. Busqué amor y encontré odio. Ahora todo terminó. Me iré al extremo norte del mundo y no volveré a ser visto.

Saltó por la ventana a un témpano de hielo, y pronto se perdió en la oscuridad y la distancia.

Walton decidió volver. Había aprendido que la búsqueda del conocimiento sin responsabilidad puede ser una tragedia. Y que, a veces, los verdaderos monstruos no nacen monstruos: los crea el abandono.`}],quiz:[{question:"¿Cuál fue el primer error grave de Víctor después de crear a la criatura?",options:["Venderla","Abandonarla horrorizado","Enseñarle a leer","Encerrarla"],correct:1,explanation:"Huyó y la dejó sola, sin guía ni cuidado."},{question:"¿Cómo aprendió a hablar y leer la criatura?",options:["En una escuela","Observando en secreto a la familia De Lacey","Víctor le enseñó","Nunca aprendió"],correct:1,explanation:"Los escuchaba por una rendija del cobertizo."},{question:"¿Qué le pidió la criatura a Víctor en el glaciar?",options:["Dinero","Una compañera de su misma especie","Volver a su casa","Un nombre"],correct:1,explanation:"Prometió irse lejos y no hacer daño a nadie."},{question:"¿Por qué Víctor guardó silencio cuando acusaron a Justine?",options:["Porque la odiaba","Porque pensó que nadie le creería la verdad","Porque estaba de viaje","Porque no se enteró"],correct:1,explanation:"Su silencio lo hizo sentirse culpable de su condena."},{question:"¿Qué reflexión deja la novela?",options:["Que la ciencia es mala","Que crear sin hacerse responsable puede causar tragedias, y que el abandono crea monstruos","Que los monstruos existen","Que el hielo es peligroso"],correct:1,explanation:"Es una reflexión sobre la responsabilidad del creador."}]},{id:32,slug:"el-extrano-caso-del-dr-jekyll-y-mr-hyde",title:"El extraño caso del Dr. Jekyll y Mr. Hyde",author:"Robert Louis Stevenson (adaptación de la Biblioteca)",synopsis:"En la niebla de Londres, un hombre pequeño y desagradable comete actos crueles y desaparece por la puerta trasera de la casa de un médico respetado. El abogado Utterson no entiende qué relación hay entre el bondadoso doctor Jekyll y el siniestro señor Hyde. La verdad será más inquietante de lo que imagina.",genres:["Suspenso","Terror","Misterio"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"ciudad",c1:"#1d3557",c2:"#457b9d"},status:"published",featured:!1,license:"Adaptación libre de «El extraño caso del Dr. Jekyll y Mr. Hyde» de Robert Louis Stevenson (1886), obra de dominio público",createdBy:null,createdAt:"2026-11-06 12:00:00",updatedAt:"2026-11-06 12:00:00",chapters:[{title:"La historia de la puerta",illustration:"ciudad",content:`El señor Utterson era un abogado serio, de pocas palabras, que casi nunca sonreía, pero que tenía un gran corazón y siempre ayudaba a sus amigos en problemas. Todos los domingos paseaba por Londres con su primo, el señor Enfield.

Una tarde pasaron frente a una puerta extraña, en una calle lateral: una puerta vieja, sin timbre, con la pintura descascarada, que parecía no pertenecer a nadie.

—Esa puerta me recuerda una historia muy rara —dijo Enfield—. Una noche, a eso de las tres de la mañana, volvía a casa por acá. De pronto vi a un hombre pequeño que caminaba muy rápido y a una nena que corría desde la esquina. Chocaron. Y el hombre, en lugar de detenerse, pasó por encima de la nena caída, tranquilamente, dejándola llorando en el suelo. Fue horrible.

Enfield lo había atrapado. Se juntaron vecinos furiosos. Para evitar un escándalo, el hombre aceptó pagar cien libras a la familia de la nena. Y para buscar el dinero, entró por esa puerta, y volvió con un cheque firmado por una de las personas más respetadas de Londres.

—Pensé que era falso —dijo Enfield—. Pero al día siguiente, en el banco, lo cobré. Era auténtico.

—¿Y cómo se llamaba el hombre? —preguntó Utterson.

—Hyde. Edward Hyde. Hay algo en él que da asco, algo deforme, aunque no sabría decir qué. Nunca vi a nadie que me causara tanto rechazo.

Utterson se quedó callado. Él conocía ese nombre. Esa misma noche, en su casa, abrió la caja fuerte y sacó un documento: el testamento de su viejo amigo, el doctor Henry Jekyll. Decía que, si el doctor moría o desaparecía durante más de tres meses, todos sus bienes debían pasar a "mi amigo y benefactor, Edward Hyde".

Y la puerta de la historia de Enfield… era la puerta trasera del laboratorio del doctor Jekyll.`},{title:"Un crimen en la niebla",illustration:"luna",content:`Utterson empezó a vigilar la puerta. Una noche fría y despejada, vio llegar a un hombre pequeño, vestido con sencillez. Se acercó.

—¿Señor Hyde?

El hombre retrocedió, siseando como una serpiente. No mostró la cara enseguida, pero al final la levantó. Era pálido y bajo, y daba una impresión de deformidad sin tener ningún defecto visible. Tenía una sonrisa desagradable y una voz ronca y quebrada. Utterson sintió una mezcla de miedo y repugnancia que no pudo explicar.

Fue a ver a Jekyll. El doctor era un hombre alto, de unos cincuenta años, amable y apreciado por todos.

—Henry, tu testamento me preocupa. Ese Hyde…

El rostro de Jekyll se ensombreció.

—Te pido que no hables más del asunto. Puedo librarme de Hyde cuando quiera. Te doy mi palabra. Sólo te pido que, si me pasa algo, lo ayudes a obtener lo que le corresponde.

Pasó un año. Una noche de niebla, una sirvienta que miraba por la ventana vio a un caballero anciano y amable, Sir Danvers Carew, que se acercó a preguntar algo a un hombre pequeño. Era Hyde. De pronto, sin ningún motivo, Hyde estalló en furia y atacó al anciano con su pesado bastón, con una violencia salvaje, hasta matarlo. Después huyó.

La policía encontró la mitad del bastón roto. Utterson lo reconoció con horror: era un bastón que él mismo le había regalado al doctor Jekyll.

Fueron a la casa donde vivía Hyde, pero había escapado. Utterson corrió a ver a Jekyll y lo encontró en el laboratorio, enfermo, pálido, temblando.

—Juro que nunca volveré a verlo —dijo Jekyll—. Se terminó. Nunca más se sabrá de él.

Y durante un tiempo pareció ser verdad. Jekyll volvió a ser el de antes: alegre, sociable, ayudaba a los pobres. Hasta que, de un día para otro, se encerró en su casa y dejó de recibir visitas.`},{title:"La puerta del laboratorio",illustration:"casona",content:`El doctor Lanyon, un viejo amigo de Jekyll y de Utterson, enfermó de repente. Cuando Utterson fue a visitarlo, lo encontró envejecido, con la cara de alguien que ha visto algo terrible.

—No quiero oír hablar más del doctor Jekyll —dijo Lanyon—. Para mí está muerto. Algún día sabrás por qué.

Pocas semanas después, Lanyon murió. Dejó para Utterson un sobre cerrado con una indicación: "No abrir hasta la muerte o desaparición del doctor Henry Jekyll".

Una noche de marzo, Poole, el mayordomo de Jekyll, apareció en la casa de Utterson, pálido de miedo.

—Señor, algo malo pasa. El doctor está encerrado en el laboratorio desde hace una semana. Nos pasa papelitos por debajo de la puerta, pidiendo una sustancia química que tenemos que buscar en todas las farmacias de Londres. Pero cada vez que la traemos, dice que no sirve, que no es pura. Y la voz que se oye detrás de la puerta… señor, no es la voz del doctor.

Fueron juntos. Llamaron a la puerta.

—Utterson —gritó—, ¡exijo verte!

—¡Por el amor de Dios, ten piedad! —respondió una voz ronca.

—Esa no es la voz de Jekyll —dijo Utterson—. ¡Es la de Hyde! ¡Poole, derribemos la puerta!

Golpearon con un hacha. Al quinto golpe, la puerta cayó. Dentro, sobre el piso, yacía el cuerpo sin vida de un hombre pequeño, vestido con ropa demasiado grande para él: la ropa del doctor Jekyll. Era Edward Hyde. Había tomado veneno.

Buscaron a Jekyll por toda la casa. No estaba en ninguna parte. Sobre el escritorio encontraron un sobre a nombre de Utterson. Adentro había una carta larga, con la letra del doctor: "Declaración completa de Henry Jekyll sobre el caso".`},{title:"La confesión de Henry Jekyll",illustration:"llave",content:`"Nací con una gran fortuna, buenas cualidades y deseos de ser respetado. Pero también tenía en mí una tendencia a los placeres egoístas y a la impaciencia, que escondía bajo una cara seria. Con los años me di cuenta de algo: el ser humano no es uno solo, sino dos. Dentro de cada uno conviven el bien y el mal, peleando.

Pensé: ¿y si se pudieran separar? El lado bueno podría vivir en paz, sin la vergüenza del malo; y el malo podría hacer lo que quisiera, sin la culpa del bueno.

Investigué durante años, hasta que preparé una sustancia, una mezcla con una sal especial. Una noche la bebí. Sentí dolores terribles, náuseas, un horror del espíritu. Y después, una sensación nueva: me sentía más joven, más ligero, sin ataduras, libre de toda conciencia. Me miré en el espejo. Era Edward Hyde. Más pequeño, más joven, porque mi lado malo había vivido menos, había sido menos ejercitado que el bueno. Hyde no era una mezcla de bien y mal, como todos: era mal puro.

Al principio, ser Hyde era un juego. Bebía la sustancia, salía a la noche, hacía lo que quería y volvía a beberla para ser Jekyll otra vez. Hyde era cada vez más cruel, y yo me decía que no era mi responsabilidad: era él.

Pero un día me desperté en mi cama… y mi mano, sobre la sábana, era la mano de Hyde. Me había transformado sin beber nada. El mal estaba ganando. Juré no volver a usar la sustancia. Durante dos meses resistí. Pero la tentación pudo más, y esa noche, siendo Hyde, con toda la furia acumulada, maté a Sir Danvers Carew.

Desde entonces, las transformaciones llegaban solas, cada vez con más frecuencia. Necesitaba dosis más fuertes para volver a ser yo. Y la sal se terminó. Pedí más a todas las farmacias, pero ninguna servía: ahora sé que la primera tenía una impureza desconocida, y que era esa impureza la que hacía funcionar la mezcla. Nunca podré volver a conseguirla.

Esta es la última vez que escribo como Henry Jekyll. Dentro de poco, Hyde va a ocupar mi lugar para siempre. Aquí, con este papel, termino la vida del desdichado Henry Jekyll".

Utterson dejó la carta sobre el escritorio. Afuera, la niebla cubría Londres. Pensó en su amigo, que había querido separar el bien del mal para no tener que elegir, y había terminado dejando que el mal lo devorara todo.`}],quiz:[{question:"¿Qué le llamó la atención a Utterson del testamento de Jekyll?",options:["Que no tenía firma","Que dejaba todo a Edward Hyde","Que era muy corto","Que estaba en otro idioma"],correct:1,explanation:"Le parecía muy sospechoso que heredara un hombre tan siniestro."},{question:"¿Qué pista vinculó el crimen de Carew con Jekyll?",options:["Una carta","El bastón roto que Utterson le había regalado a Jekyll","Una huella","Un testigo"],correct:1,explanation:"Hyde usó un bastón que pertenecía a Jekyll."},{question:"¿Qué intentaba lograr Jekyll con su sustancia?",options:["Ser invisible","Separar el lado bueno del malo del ser humano","Curar enfermedades","Volverse inmortal"],correct:1,explanation:"Quería vivir sin el conflicto entre el bien y el mal."},{question:"¿Por qué Hyde era más pequeño y joven que Jekyll?",options:["Por la ropa","Porque el lado malo de Jekyll había sido menos ejercitado","Porque era otra persona","Por la niebla"],correct:1,explanation:"Es una metáfora de la parte oculta de la personalidad."},{question:"¿Qué idea plantea la novela?",options:["Que las personas son todas buenas","Que en cada persona conviven el bien y el mal, y somos responsables de nuestras elecciones","Que la química es peligrosa","Que Londres es aburrido"],correct:1,explanation:"Jekyll quiso escapar de esa responsabilidad y lo perdió todo."}]},{id:33,slug:"la-maquina-del-tiempo",title:"La máquina del tiempo",author:"H. G. Wells (adaptación de la Biblioteca)",synopsis:"Un inventor construye una máquina capaz de viajar a través del tiempo y llega al año 802.701. Encuentra un mundo que parece un paraíso, habitado por seres pequeños y alegres. Pero cuando su máquina desaparece, descubre que bajo la tierra se esconde otra especie… y una verdad inquietante sobre el futuro de la humanidad.",genres:["Ciencia ficción","Novela","Aventura"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"reloj",c1:"#3a0ca3",c2:"#f72585"},status:"published",featured:!1,license:"Adaptación libre de «La máquina del tiempo» de H. G. Wells (1895), obra de dominio público",createdBy:null,createdAt:"2026-11-08 00:00:00",updatedAt:"2026-11-08 00:00:00",chapters:[{title:"La cuarta dimensión",illustration:"reloj",content:`Un jueves por la noche, en una casa de Richmond, cerca de Londres, un grupo de amigos cenaba con su anfitrión, un científico e inventor a quien llamaremos simplemente el Viajero del Tiempo. Era un hombre de ojos grises, brillantes, que hablaba con entusiasmo de ideas que los demás encontraban absurdas.

—Ustedes saben que todo objeto tiene largo, ancho y alto —dijo—. Tres dimensiones. Pero ningún objeto puede existir si no dura un tiempo. El tiempo es la cuarta dimensión. Nos movemos libremente por las otras tres, pero por el tiempo sólo avanzamos en una dirección, a un ritmo fijo, como un barco arrastrado por la corriente. ¿Y si se pudiera navegar a voluntad, hacia adelante o hacia atrás?

Los invitados se rieron. El Viajero sonrió y trajo una pequeña máquina de metal brillante y cristal, del tamaño de un reloj de mesa, con dos palancas diminutas.

—Este es un modelo. La máquina verdadera está casi terminada en mi laboratorio.

Le pidió a uno de los invitados que empujara una palanca. La maquinita giró, se volvió borrosa, como un fantasma, y desapareció. No quedó nada sobre la mesa.

—Viajó hacia el futuro —dijo el Viajero, muy tranquilo.

Nadie le creyó del todo.

Una semana después, los invitados volvieron a cenar. El anfitrión no estaba. Llegó tarde, cuando ya habían empezado a comer, y su aspecto los dejó helados: estaba pálido, despeinado, con la ropa sucia y rota, y rengueaba. Tenía la cara de alguien que ha sufrido mucho.

Comió con un hambre feroz, en silencio. Después se sentó junto al fuego.

—Les voy a contar dónde estuve —dijo—. Pero no me interrumpan. Hoy, a las diez de la mañana, partí en mi máquina. Y estuve ocho días fuera… en un tiempo muy lejano.`},{title:"Los eloi",illustration:"bosque",content:`"Me senté en la máquina, empujé la palanca y el mundo se volvió loco. El sol saltaba por el cielo como un relámpago, los días y las noches se convertían en un parpadeo gris. Vi crecer edificios y derrumbarse. La máquina vibraba y yo sentía un vértigo terrible. Cuando por fin frené, la máquina volcó y caí sobre el pasto. Miré los diales: estaba en el año 802.701.

Llovía granizo. Frente a mí había una enorme estatua de piedra blanca, con forma de esfinge con alas. Alrededor, un paisaje de jardines, flores y edificios gigantescos, cubiertos de vegetación, como palacios en ruinas.

Pronto aparecieron unos seres pequeños, de poco más de un metro, vestidos con túnicas de colores. Eran delicados, hermosos, con ojos grandes y risas alegres. Se acercaron sin miedo, me tocaron con curiosidad y me llevaron a uno de los grandes edificios, donde comían frutas sentados sobre almohadones. Les llamé los eloi.

Al principio, pensé que había llegado a un paraíso. No había enfermedades, ni guerras, ni trabajo. Los eloi pasaban el día jugando, bañándose en los ríos, adornándose con flores. Pero pronto noté algo raro: eran como niños. Se cansaban enseguida de cualquier conversación, no les interesaba nada, olvidaban todo. Pensé que la humanidad, después de vencer todas las dificultades, se había vuelto tan cómoda que había perdido la fuerza y la inteligencia.

Un día, una pequeña eloi se cayó al río y empezó a ahogarse. Los demás miraban sin hacer nada. Me tiré al agua y la saqué. Se llamaba Weena. Desde entonces me siguió a todas partes y me regalaba flores. Fue mi única amiga en ese mundo extraño.

Esa misma tarde, volví al pasto donde había dejado mi máquina. No estaba. Había desaparecido".`},{title:"Los morlocks",illustration:"luna",content:`"Me desesperé. Grité, corrí, busqué por todos lados como un loco. Las huellas en el pasto mostraban que alguien la había arrastrado hasta la base de la esfinge blanca, que tenía unas puertas de bronce cerradas. Golpeé las puertas hasta lastimarme las manos. No se abrieron.

Noté otras cosas extrañas. Los eloi le tenían terror a la oscuridad. Al caer la noche, se encerraban todos juntos en los grandes edificios y no salían por nada del mundo. Y en el paisaje había unos pozos profundos, como chimeneas, de los que salía un ruido sordo de máquinas y un aire caliente.

Una madrugada, a la luz gris, vi unas figuras pálidas que se escabullían entre las ruinas. Una noche, en un edificio, sentí que una mano fría me tocaba en la oscuridad. Encendí un fósforo y lo vi: un ser pálido, de ojos grandes y rojizos, sin color en la piel, como un animal que vive siempre bajo tierra. Huyó de la luz con un chillido.

Me animé a bajar por uno de los pozos, agarrándome de unos ganchos de metal. Abajo había túneles, máquinas enormes que zumbaban y criaturas como aquella. Los llamé morlocks. Eran muchos. Me rodearon en la oscuridad. Sólo me salvaron mis fósforos: la luz los encandilaba y los hacía retroceder. Logré subir, temblando.

Entonces entendí la terrible verdad. Hace muchísimo tiempo, la humanidad se había dividido en dos: los ricos, que vivían en la superficie sin trabajar, y los trabajadores, que vivían bajo tierra manejando las máquinas. Con los siglos, se habían convertido en dos especies distintas. Los eloi, descendientes de los ricos, se habían vuelto débiles e indefensos. Los morlocks, descendientes de los trabajadores, seguían manejando las máquinas… y de noche subían a la superficie. Los eloi no les tenían miedo a la oscuridad por capricho. Los morlocks los cazaban".`},{title:"El fin del mundo y la flor de Weena",illustration:"cohete",content:`"Decidí buscar armas. Con Weena caminé hasta un edificio lejano, un gigantesco museo abandonado al que llamé el Palacio de Porcelana Verde. Allí había esqueletos de dinosaurios, máquinas oxidadas y libros que se deshacían en polvo. Encontré una barra de hierro y una caja de fósforos.

Al volver, nos sorprendió la noche en un bosque. Los morlocks nos rodearon. Encendí una fogata para mantenerlos lejos, pero el fuego se extendió por el bosque seco y se convirtió en un incendio enorme. En la confusión, entre el humo y las llamas, perdí a Weena. La busqué desesperadamente. Nunca la volví a encontrar.

Al amanecer volví a la esfinge. Las puertas de bronce estaban abiertas. Adentro, en la oscuridad, estaba mi máquina. Era una trampa: apenas entré, las puertas se cerraron y los morlocks se abalanzaron sobre mí. Pero había preparado las palancas. Me senté en la máquina, los aparté a golpes y empujé hacia adelante.

Viajé todavía más lejos. Millones de años. Llegué a una playa donde el sol era una enorme bola roja y apagada, inmóvil en el cielo. Hacía frío. No había casi vida: sólo líquenes verdes y unos cangrejos gigantescos que se arrastraban por la arena. Más adelante, treinta millones de años después, ya no se movía nada. Todo era silencio, nieve y oscuridad. Sentí un horror inmenso y volví.

Ahora estoy aquí".

Los invitados se miraron. Nadie le creía. Uno pensó que era un gran escritor. Otro, que se había vuelto loco.

Entonces el Viajero sacó de su bolsillo dos flores blancas, marchitas, de una especie que ningún botánico conocía. Se las había dado Weena.

Al día siguiente, uno de los amigos volvió a su casa. Lo vio subir a la máquina con una cámara de fotos y una mochila. Hubo un viento, un brillo… y la máquina desapareció. Esperaron días, meses, años. El Viajero del Tiempo nunca volvió.

Quizás está en el pasado, entre dinosaurios. Quizás en un futuro mejor que el que vio. Lo único que nos dejó fueron dos flores blancas, como prueba de que, incluso cuando la inteligencia y la fuerza desaparecen, todavía queda en el corazón humano la gratitud y la ternura".`}],quiz:[{question:'¿Qué es la "cuarta dimensión" según el Viajero?',options:["El espacio exterior","El tiempo","La velocidad","La memoria"],correct:1,explanation:"Además del largo, el ancho y el alto, todo objeto dura un tiempo."},{question:"¿Cómo eran los eloi?",options:["Fuertes y trabajadores","Pequeños, alegres, pero débiles y sin curiosidad","Gigantes","Robots"],correct:1,explanation:"Vivían sin esfuerzo y habían perdido fuerza e inteligencia."},{question:"¿Qué descubrió el Viajero sobre los morlocks?",options:["Que eran amigos de los eloi","Que vivían bajo tierra, manejaban máquinas y de noche cazaban a los eloi","Que eran extraterrestres","Que no existían"],correct:1,explanation:"La humanidad se había dividido en dos especies."},{question:"¿Qué crítica plantea Wells con la división entre eloi y morlocks?",options:["Que la tecnología es mala","Que la desigualdad extrema entre ricos y trabajadores puede tener consecuencias terribles","Que los bosques son peligrosos","Que viajar en el tiempo es fácil"],correct:1,explanation:"La novela reflexiona sobre la sociedad de su época."},{question:"¿Qué prueba mostró el Viajero de su aventura?",options:["Una foto","Dos flores desconocidas que le dio Weena","Un morlock","Un diario"],correct:1,explanation:"Las flores simbolizan la ternura que sobrevive."}]},{id:34,slug:"veinte-mil-leguas-de-viaje-submarino",title:"Veinte mil leguas de viaje submarino",author:"Julio Verne (adaptación de la Biblioteca)",synopsis:"En 1866, un misterioso monstruo marino hunde barcos en todos los océanos. El profesor Aronnax se une a una expedición para cazarlo y termina prisionero de algo mucho más asombroso: el Nautilus, un submarino eléctrico comandado por el enigmático capitán Nemo, un hombre que juró no volver a pisar tierra.",genres:["Aventura","Ciencia ficción","Exploración"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"oceano",c1:"#0077b6",c2:"#03045e"},status:"published",featured:!1,license:"Adaptación libre de «Veinte mil leguas de viaje submarino» de Julio Verne (1870), obra de dominio público",createdBy:null,createdAt:"2026-11-09 12:00:00",updatedAt:"2026-11-09 12:00:00",chapters:[{title:"El monstruo de los mares",illustration:"barco",content:`En el año 1866, el mundo entero hablaba de un fenómeno inexplicable. Varios barcos habían visto en el mar una "cosa enorme", larga, en forma de huso, a veces fosforescente, mucho más grande y rápida que una ballena. Algunos barcos habían chocado contra ella y aparecían con agujeros en el casco, como si los hubieran atravesado con una lanza gigante.

Los diarios no hablaban de otra cosa. ¿Era un narval gigantesco, ese cetáceo con un largo cuerno en la cabeza? ¿Un monstruo desconocido de las profundidades?

Yo, Pierre Aronnax, profesor del Museo de Historia Natural de París, había escrito que probablemente se trataba de un narval de tamaño colosal. Por eso, cuando el gobierno de Estados Unidos preparó una fragata, la Abraham Lincoln, para cazar al monstruo, me invitaron a participar. Acepté de inmediato, acompañado por mi fiel ayudante, Conseil, un muchacho tranquilo que sabía clasificar a todos los animales del mundo, pero que no se sorprendía de nada.

A bordo conocimos a Ned Land, un arponero canadiense, el mejor del mundo, fuerte, impaciente y de mal carácter, pero de gran corazón.

Durante meses recorrimos los océanos sin ver nada. Hasta que una noche, en el Pacífico, apareció una luz bajo el agua. El "monstruo" se acercó a una velocidad increíble. La fragata lo persiguió. Ned Land lanzó su arpón con todas sus fuerzas, y el arpón rebotó con un sonido metálico.

En ese momento, dos chorros de agua enormes cayeron sobre la cubierta. La fragata recibió un choque terrible. Yo salí despedido al mar.

Nadé en la oscuridad, cada vez más cansado, hasta que sentí que alguien me sostenía: era Conseil, que se había tirado al agua para seguirme. Poco después, una voz nos llamó. Era Ned Land, subido sobre el lomo del "monstruo". Trepamos con él.

Bajo nuestros pies no había piel ni escamas. Había placas de metal remachadas. El monstruo no era un animal: era un barco que navegaba bajo el agua. Un submarino.`},{title:"El capitán Nemo",illustration:"oceano",content:`Al amanecer, se abrió una escotilla y unos hombres nos hicieron bajar. Nos encerraron en un cuarto oscuro. Después de varias horas, entró un hombre alto, de mirada firme y orgullosa, de unos cuarenta años, que nos estudió en silencio.

—Señores —dijo por fin en perfecto francés—, ustedes atacaron mi barco. Podría devolverlos al mar. Pero voy a permitir que se queden a bordo, con una condición: nunca podrán volver a tierra. Ustedes conocen ahora un secreto que no puedo permitir que se revele. Me llamo el capitán Nemo, y este es el Nautilus.

"Nemo" quiere decir "nadie" en latín.

El capitán nos mostró su barco. Era una maravilla. Tenía una biblioteca con doce mil libros, un salón con pinturas de grandes artistas, un órgano en el que el capitán tocaba música en las noches, ventanales gigantes desde los que se veía el fondo del mar iluminado por reflectores. Todo funcionaba con electricidad, que el capitán producía con su propia invención. Del mar sacaba todo lo que necesitaba: comida, ropa, hasta el tabaco que fumaba, hecho con algas.

—El mar es todo —nos dijo—. Cubre siete décimas partes del planeta. En el mar no hay tiranos. Allí soy libre.

Aronnax no podía creer su suerte: iba a estudiar lo que ningún científico había visto. Conseil clasificaba peces sin parar. Sólo Ned Land, el arponero, sufría como un león enjaulado y soñaba con escapar.

Nemo era un misterio. Era culto, generoso con los pobres, pero odiaba profundamente a algunas naciones, aunque nunca decía por qué. A veces se encerraba durante días. A veces parecía llorar mientras tocaba el órgano.`},{title:"Maravillas del fondo del mar",illustration:"tortuga",content:`Durante meses recorrimos los océanos. Con escafandras que tenían tanques de aire, caminamos por el fondo del mar, en bosques de algas gigantes y corales de todos los colores, entre peces que nunca nadie había descrito.

En las costas de Ceilán, lo que hoy es Sri Lanka, vimos a un pobre pescador de perlas que buceaba sin equipo. De pronto, un tiburón enorme se lanzó sobre él. El capitán Nemo, con un puñal, se interpuso y luchó contra el tiburón. Ned Land lo remató con su arpón. Después, Nemo le regaló al pescador una bolsa de perlas.

—Ese hombre es un habitante del país de los oprimidos —dijo el capitán—. Y yo seré siempre de ese país.

Atravesamos el canal secreto que, según Nemo, unía el mar Rojo con el Mediterráneo por debajo de la tierra. En el fondo del Atlántico, una noche, el capitán me llevó a caminar entre ruinas cubiertas de algas, iluminadas por un volcán submarino. Eran templos, columnas, murallas. Con un pedazo de tiza, Nemo escribió en una roca una sola palabra: "Atlántida".

Llegamos hasta el Polo Sur, rompiendo el hielo. Nemo plantó allí una bandera negra con una "N" de oro. Al volver, una montaña de hielo se dio vuelta y nos dejó atrapados bajo una capa congelada. El aire se terminaba. Durante días, todos los tripulantes, incluso nosotros, picamos el hielo con piquetas, por turnos, respirando un aire cada vez más pesado. Nemo usó también agua hirviendo para debilitar el hielo. Cuando estábamos a punto de perder el conocimiento, el Nautilus rompió la última capa con su espolón y salimos al mar abierto. Nunca el aire me pareció tan hermoso.

Pero lo más terrible estaba por llegar. Cerca de las islas Bahamas, unos calamares gigantes, de ocho metros, atacaron el Nautilus. Sus tentáculos se enredaban en la hélice. Subimos a cubierta con hachas. Fue una lucha espantosa. Uno de los tripulantes fue atrapado por un tentáculo y arrastrado al mar. Nemo lloró por él.`},{title:"El torbellino",illustration:"montanas",content:`Después de la lucha con los calamares, algo cambió en el capitán. Un día, un barco de guerra nos persiguió y nos atacó con cañones. Nemo, con una furia helada que nunca le había visto, lanzó el Nautilus contra él y lo hundió. Desde los ventanales vi cómo el barco se iba al fondo.

Me horroricé. Comprendí que el capitán Nemo, a pesar de su bondad con los pobres y su amor por la ciencia, llevaba en el alma una herida profunda y una sed de venganza. Más tarde, en su camarote, vi un retrato de una mujer y dos niños. Nemo lo miraba de rodillas, sollozando: "¡Dios todopoderoso, basta, basta!".

Ned Land tenía razón: teníamos que huir.

Una noche, el Nautilus navegaba cerca de las costas de Noruega. Ned nos avisó: era la oportunidad. Subimos en silencio al bote que el submarino llevaba sujeto en su lomo. Justo cuando íbamos a soltarlo, escuchamos gritos dentro del submarino. Una palabra se repetía: "¡Maelstrom! ¡Maelstrom!".

El Maelstrom es un torbellino gigantesco del mar del norte, capaz de tragarse barcos enteros. El Nautilus había entrado en él. El bote se soltó con un golpe y empezó a girar como una hoja. Me golpeé la cabeza y perdí el conocimiento.

Cuando desperté, estaba en la cabaña de un pescador, en una isla de Noruega, junto a Ned Land y Conseil. Estábamos vivos. Del Nautilus, nadie sabía nada.

Habíamos recorrido veinte mil leguas bajo los mares en diez meses. Una legua es una medida antigua, de unos cuatro kilómetros: en total, cerca de ochenta mil kilómetros, casi dos vueltas al mundo.

¿Qué fue del capitán Nemo? ¿Sobrevivió al torbellino? No lo sé. Sólo espero que, si sigue recorriendo los océanos, haya encontrado la paz, y que el sabio que había en él haya vencido al hombre que buscaba venganza.

Porque, como escribió un antiguo libro, sólo dos hombres tienen derecho a responder la pregunta del Eclesiastés, "¿Quién pudo sondear nunca las profundidades del abismo?": el capitán Nemo y yo.`}],quiz:[{question:'¿Qué era en realidad el "monstruo" que hundía barcos?',options:["Un narval gigante","Un submarino, el Nautilus","Una ballena","Un calamar gigante"],correct:1,explanation:"Su lomo era de placas de metal remachadas."},{question:'¿Qué significa "Nemo" en latín?',options:["Mar","Nadie","Capitán","Libre"],correct:1,explanation:"El capitán elige un nombre que oculta su identidad."},{question:"¿Con qué energía funcionaba el Nautilus?",options:["Vapor","Electricidad","Viento","Petróleo"],correct:1,explanation:"Verne imaginó un submarino eléctrico mucho antes de que existieran."},{question:"¿Cómo salieron cuando quedaron atrapados bajo el hielo?",options:["Esperaron el verano","Picaron el hielo por turnos y usaron agua hirviendo hasta romperlo","Pidieron ayuda","Usaron explosivos"],correct:1,explanation:"Fue un trabajo en equipo al límite del aire."},{question:"¿Cómo es el capitán Nemo?",options:["Un villano sin sentimientos","Un personaje complejo: sabio y generoso, pero con una herida profunda y deseo de venganza","Un pirata ladrón","Un científico aburrido"],correct:1,explanation:"Es uno de los personajes más ambiguos de Verne."}]},{id:35,slug:"la-senal-de-las-3-33",title:"La señal de las 3:33",author:"Tomás Insaurralde",synopsis:"Abril vive en San Juan, cerca de los cielos más limpios del país. Su abuelo es radioaficionado y una madrugada, con su vieja radio, captan una señal que se repite todas las noches a la misma hora: una serie de pitidos que forman números primos. ¿Es un mensaje del espacio? Lo que descubran será más sorprendente —y más cercano— de lo que imaginan.",genres:["Ciencia ficción","Suspenso","Ciencia"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"cohete",c1:"#14213d",c2:"#fca311"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-11-11 00:00:00",updatedAt:"2026-11-11 00:00:00",chapters:[{title:"Pitidos en la madrugada",illustration:"luna",content:`En la casa del abuelo Rubén había un cuarto que olía a polvo y a electricidad. Estaba lleno de radios viejas, cables enrollados, perillas, auriculares y un mapa del mundo lleno de alfileres de colores. Cada alfiler era una persona con la que el abuelo había hablado por radio, desde Japón hasta Islandia.

—La radio es magia de verdad —decía el abuelo—. Ondas invisibles que viajan por el aire a la velocidad de la luz y dan la vuelta al mundo rebotando en la atmósfera.

Abril, de doce años, pasaba las vacaciones de invierno con él en un pueblo de San Juan. Las noches eran heladas y el cielo era tan limpio que la Vía Láctea parecía un río de leche. No por casualidad, cerca de ahí, en El Leoncito, había observatorios astronómicos.

Una noche de julio, Abril no podía dormir. Fue al cuarto de las radios y encontró al abuelo con los auriculares puestos, muy concentrado.

—Escuchá esto —le susurró, y le pasó un auricular.

Entre el ruido de la estática, se oía algo claro y preciso: pitidos. Dos pitidos. Pausa. Tres pitidos. Pausa. Cinco. Siete. Once. Trece. Diecisiete… Después silencio. Y otra vez: dos, tres, cinco, siete…

Abril miró el reloj de la pared. Eran las 3:33 de la madrugada.

—Abuelo… esos números… dos, tres, cinco, siete, once, trece. Son números primos. Los que sólo se pueden dividir por uno y por sí mismos. Lo vimos en Matemática.

El abuelo la miró por encima de los anteojos.

—Exacto. Y ningún fenómeno natural produce números primos, Abril. Esto lo hizo alguien. O algo.

A las 3:41, la señal desapareció.`},{title:"El cuaderno de las señales",illustration:"cohete",content:`La noche siguiente, a las 3:33, la señal volvió. Y la siguiente también. Siempre a la misma hora, durante unos ocho minutos, en la misma frecuencia.

Abril empezó un cuaderno. Anotaba la hora exacta de comienzo y de fin, la intensidad y los números. Con el abuelo descubrieron algo raro: cada noche, la señal empezaba unos segundos más tarde que la anterior.
