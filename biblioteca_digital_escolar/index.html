<script>(()=>{var De=[{id:1,slug:"pipo-y-las-burbujas-de-colores",title:"Pipo y las burbujas de colores",author:"Clara Montiel",synopsis:"En el Valle de las Tres Chimeneas todos los dragones echan fuego. Todos, menos Pipo: cuando él sopla, salen burbujas de colores. Una noche de verano, lo que lo hacía distinto se convertirá en lo que salve a todo el valle.",genres:["Fantasía","Valores","Cuento"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"dragon",c1:"#ffb36b",c2:"#ff6f91"},status:"published",featured:!0,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-21 00:00:00",updatedAt:"2026-09-21 00:00:00",chapters:[{title:"El dragón más pequeño del valle",illustration:"dragon",content:`En el Valle de las Tres Chimeneas vivían muchos dragones. Había dragones rojos como tomates, dragones verdes como lechuga y dragones violetas como berenjenas. Y había uno muy pequeño, de color naranja, que se llamaba Pipo.

Pipo tenía alas cortitas, una cola enrulada y unos ojos grandes que miraban todo con curiosidad. Le gustaba contar nubes, perseguir mariposas y escuchar las historias de los dragones viejos.

Todos los años, cuando llegaba la primavera, en el valle se hacía el Festival del Fuego. Los dragones jóvenes se paraban en la piedra más alta, respiraban hondo y soplaban su primera llamarada. Los demás aplaudían con las alas y gritaban:

—¡Bravo! ¡Bravo!

Ese año le tocaba a Pipo. Estaba tan nervioso que le temblaban las escamas. Subió a la piedra, cerró los ojos, infló la panza y sopló con todas sus fuerzas.

Pero no salió fuego.

Salieron burbujas.

Burbujas redondas, brillantes, de todos los colores: rosas, celestes, amarillas y verdes. Subieron despacito hacia el cielo y explotaron con un ¡plop! suave.

Por un momento, nadie dijo nada. Después, Grisel, un dragón gris y enorme, soltó una carcajada.

—¡Ja, ja, ja! ¡Un dragón de burbujas! ¿Qué vas a hacer con eso? ¿Bañar a los patos?

Algunos dragones se rieron con él. Pipo sintió que la cara le ardía, aunque no tenía ni una chispa de fuego adentro. Bajó de la piedra sin mirar a nadie y se fue volando, bajito, hasta una cueva escondida detrás de la cascada.

Allí se sentó en el suelo y se tapó la cara con las alas.

—Nunca voy a ser un dragón de verdad —dijo en voz bajita.`},{title:"Un secreto detrás de la cascada",illustration:"montanas",content:`Dentro de la cueva hacía fresco y se escuchaba el ruido del agua. De pronto, una voz tranquila habló desde una roca:

—¿Quién llora en mi casa?

Pipo levantó la cabeza. Sobre la roca había una lechuza vieja, de plumas blancas y anteojos redondos.

—Perdón, señora. Soy Pipo. No sabía que esta cueva tenía dueña.

—Me llamo Doña Ofelia —dijo la lechuza—. Y no te preocupes: las cuevas son de quien las necesita. ¿Por qué estás triste?

Pipo le contó todo: el festival, las burbujas, las risas de Grisel. Doña Ofelia lo escuchó sin interrumpirlo. Cuando terminó, se acomodó los anteojos.

—A ver, mostrame esas burbujas.

Pipo sopló un poquito. Salió una burbuja celeste que flotó por la cueva y se posó, sin romperse, sobre el ala de la lechuza.

—¡Qué maravilla! —exclamó Doña Ofelia—. ¿Sabés una cosa, Pipo? Cada uno trae un regalo distinto. Al pájaro carpintero no le pedimos que cante como el zorzal, ni al zorzal que haga agujeros en los árboles. Tu regalo no es el fuego. Tu regalo es otro, y todavía no sabés para qué sirve. Eso no es una tristeza: es una aventura.

Pipo se quedó pensando. Nunca lo había visto de esa manera.

Desde ese día, todas las tardes, Pipo volvió a la cueva para practicar. Aprendió a soplar burbujas chiquitas y burbujas gigantes. Aprendió a hacer burbujas que flotaban quietas en el aire, como globos. Y un día descubrió algo increíble: si tomaba un trago largo de agua de la cascada y después soplaba, ¡las burbujas salían llenas de agua!

Eran como bolsitas transparentes que se podían llevar de un lado a otro. Cuando explotaban, caía una lluvia fresca.

—Doña Ofelia, ¡mire! —gritó Pipo, y una burbuja enorme reventó sobre unas flores marchitas, que enseguida levantaron la cabeza.

La lechuza sonrió.

—Ya ves. Los regalos se descubren practicando.`},{title:"La noche de las chispas",illustration:"bosque",content:`Llegó el verano, y con él, muchos días sin lluvia. El pasto del valle se puso amarillo y seco, y los arroyos se volvieron finitos como hilos.

Una noche, los dragones jóvenes jugaban a ver quién lanzaba la llamarada más alta. Grisel, como siempre, quería ganar. Sopló tan fuerte que una chispa voló lejos, muy lejos, y cayó sobre el pasto seco, cerca del bosque donde vivían los conejos, los zorros y los pájaros.

Primero fue una llamita. Después, una fogata. Y en un ratito, una línea de fuego empezó a correr hacia los árboles.

—¡Fuego en el bosque! —gritó alguien.

Los dragones volaron hasta allí, pero no sabían qué hacer. Algunos intentaron apagar las llamas soplando, y el fuego se hizo todavía más grande. ¡Claro! Ellos soplaban fuego, y el fuego no se apaga con más fuego.

Pipo vio todo desde la colina. Le temblaban las patas, pero recordó las palabras de Doña Ofelia. Corrió hasta el lago, tomó un trago enorme de agua y sopló.

Una burbuja gigante, llena de agua, flotó sobre las llamas y ¡plaf! cayó como un balde de lluvia. El fuego chisporroteó y se achicó.

Pipo volvió al lago, tomó más agua y sopló otra vez. Y otra. Y otra. Pero sus alas eran cortas y el lago estaba lejos. Se estaba cansando.

Entonces sintió que algo lo levantaba del suelo. Era Grisel, que lo llevaba sobre el lomo.

—Yo vuelo rápido y vos soplás —dijo el dragón gris—. ¡Juntos!

Volaron del lago al bosque, del bosque al lago, una y otra vez. Pipo soplaba burbujas de agua y Grisel lo llevaba a toda velocidad. Poco a poco, las llamas se fueron apagando, hasta que sólo quedó un humito blanco subiendo hacia la luna.

Los animales del bosque salieron de sus escondites. Estaban todos a salvo.`},{title:"Un festival nuevo",illustration:"dragon",content:`A la mañana siguiente, todo el valle se reunió frente a la piedra más alta. Pipo pensó que iban a hablar del incendio, pero nadie lo miraba con tristeza. Todos le sonreían.

Grisel subió a la piedra. Estaba un poco colorado, aunque era gris.

—Quiero decir algo —empezó—. En el festival me reí de Pipo. Pensé que ser distinto era ser menos. Pero anoche, cuando nuestro fuego no servía para nada, sus burbujas salvaron el bosque. Pipo, te pido perdón.

Pipo bajó la mirada, emocionado.

—Te perdono —dijo—. Y gracias por llevarme. Sin tus alas, no lo hubiera logrado.

Los dragones aplaudieron con las alas. Los conejos aplaudieron con las patas. Hasta los pájaros cantaron más fuerte que nunca.

Ese mismo día, los dragones viejos decidieron algo importante: desde ese año, el Festival del Fuego tendría un nombre nuevo. Se llamaría Festival del Fuego y de las Burbujas, y cada dragón podría mostrar el regalo que tuviera, fuera cual fuera.

Al año siguiente hubo dragones que mostraron llamaradas, otros que hicieron figuras con humo, una dragona que cantaba bellísimo y un dragoncito que sabía contar chistes. Y Pipo, por supuesto, llenó el cielo de burbujas de colores que brillaban con el sol como un arcoíris.

Doña Ofelia lo miraba desde una rama, con sus anteojos redondos.

—¿Ves, Pipo? —le dijo cuando terminó—. No hacía falta que fueras como los demás. Hacía falta que fueras vos.

Y colorín colorado, este cuento de burbujas se ha terminado.`}],quiz:[{question:"¿Qué le salía a Pipo cuando soplaba?",options:["Fuego muy fuerte","Burbujas de colores","Humo negro","Nieve"],correct:1,explanation:"Pipo era el único dragón del valle que soplaba burbujas de colores."},{question:"¿Quién ayudó a Pipo a descubrir su regalo?",options:["Grisel","Un conejo","Doña Ofelia, la lechuza","Su mamá"],correct:2,explanation:"Doña Ofelia le explicó que cada uno tiene un regalo distinto y que se descubre practicando."},{question:"¿Por qué el fuego de los dragones no servía para apagar el incendio?",options:["Porque estaban dormidos","Porque el fuego no se apaga con más fuego","Porque no sabían volar","Porque era de día"],correct:1,explanation:"Al soplar fuego, las llamas crecían. Hacía falta agua."},{question:"¿Qué hizo Grisel al final del cuento?",options:["Se fue del valle","Se volvió a reír de Pipo","Le pidió perdón a Pipo","Ganó el festival"],correct:2,explanation:"Grisel reconoció su error y le pidió perdón frente a todos."},{question:"¿Qué enseñanza nos deja la historia?",options:["Que hay que ser igual a los demás","Que ser distinto también es un regalo","Que los dragones no existen","Que no hay que jugar con burbujas"],correct:1,explanation:"Lo que hacía distinto a Pipo terminó siendo lo que salvó al valle."}]},{id:2,slug:"lia-y-la-luna-escondida",title:"Lía y la luna escondida",author:"Martín Aldaz",synopsis:"Todas las noches, Lía saluda a la luna desde su ventana. Pero una noche la luna no está. ¿Se perdió? ¿Se fue de viaje? Con su gato Bigote y un barquito de papel, Lía emprenderá un viaje por el cielo para descubrir el secreto de la luna.",genres:["Ciencia","Aventura","Fantasía"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"luna",c1:"#2b2f77",c2:"#7b5ea7"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-22 12:00:00",updatedAt:"2026-09-22 12:00:00",chapters:[{title:"La noche sin luna",illustration:"luna",content:`Lía tenía siete años, un flequillo que siempre se le metía en los ojos y un gato blanco y gordo llamado Bigote.

Todas las noches, antes de dormir, Lía hacía lo mismo: corría la cortina de su ventana, miraba el cielo y decía:

—¡Buenas noches, luna!

A veces la luna estaba redonda como una pelota. Otras veces parecía una sonrisa finita, o una uña cortada. Pero siempre estaba ahí, como una amiga que la cuidaba.

Una noche, Lía corrió la cortina y se quedó con la boca abierta. Había estrellas, había nubes, había una lucecita roja de un avión que pasaba. Pero la luna no estaba.

—¿Dónde está la luna? —preguntó, asustada.

Bigote maulló y apoyó la nariz contra el vidrio.

Lía buscó por todo el cielo: arriba del techo de la vecina, detrás del árbol de la vereda, al lado de la antena. Nada. La luna había desaparecido.

—¿Y si se perdió? ¿Y si está sola y tiene frío? —dijo Lía.

Se acostó preocupada, abrazada a Bigote. Pensaba y pensaba, hasta que los ojos se le fueron cerrando.

Entonces pasó algo muy raro. Bigote se levantó, se estiró, la miró con sus ojos amarillos y habló:

—Si querés, vamos a buscarla.

Lía se sentó en la cama de un salto.

—¡Bigote! ¡Hablás!

—Sólo en los sueños importantes —dijo el gato, muy serio—. Agarrá una hoja de tu cuaderno. Vamos a necesitar un barco.`},{title:"El viaje en el barquito de papel",illustration:"cohete",content:`Lía arrancó una hoja de su cuaderno de dibujo e hizo un barquito, como le había enseñado su abuelo Tito. Lo apoyó en el marco de la ventana y, de repente, el barquito creció y creció, hasta que tuvo lugar para una nena y un gato.

Se subieron. La ventana se abrió sola y el barquito salió flotando hacia el cielo, como si las nubes fueran un mar.

Navegaron entre las estrellas, que de cerca brillaban y hacían un ruidito parecido a una campanita. Al rato vieron tres estrellas en fila, una al lado de la otra, que charlaban entre ellas.

—¡Son las Tres Marías! —dijo Lía, que las conocía porque su abuelo se las había mostrado.

—Buenas noches, viajeros —dijeron las tres estrellas al mismo tiempo—. ¿Qué buscan tan lejos de la cama?

—Buscamos a la luna —explicó Lía—. Desapareció. Creo que se perdió.

Las Tres Marías se rieron con un tintineo.

—La luna no se perdió. Está ahí mismo, aunque no la puedas ver. Te vamos a contar un secreto: la luna no tiene luz propia. La luz que ves es la del sol, que la ilumina como una linterna.

—¿Y entonces por qué cambia de forma? —preguntó Lía.

—Porque la luna da vueltas alrededor de la Tierra. Según dónde esté, vemos más o menos parte iluminada. Cuando la vemos toda iluminada, es luna llena. Cuando está entre la Tierra y el sol, la parte iluminada mira para el otro lado, y desde tu ventana no se ve nada. Esa es la luna nueva.

Lía abrió grandes los ojos.

—¡Entonces la luna está jugando a las escondidas!

—Algo así —dijo la estrella del medio—. En unos días, vas a ver una sonrisa finita. Después, media luna. Y después, la luna llena otra vez. Siempre vuelve. Siempre.`},{title:"El cuaderno de la luna",illustration:"luna",content:`Cuando Lía abrió los ojos, ya era de día. El sol entraba por la ventana y Bigote dormía a sus pies, roncando suavecito. En el marco de la ventana había un barquito de papel.

Lía corrió a la cocina, donde el abuelo Tito tomaba mate.

—¡Abuelo! ¡La luna no se perdió! Está haciendo luna nueva. No tiene luz propia, la ilumina el sol, y da vueltas alrededor de la Tierra.

El abuelo levantó las cejas, sorprendido.

—¿Y quién te enseñó todo eso?

—Las Tres Marías —dijo Lía, muy segura.

El abuelo se rió y fue a buscar algo a su cajón. Volvió con un cuaderno nuevo, de tapas azules.

—Entonces te propongo un experimento de científica. Todas las noches vas a mirar la luna y la vas a dibujar en este cuaderno, con la fecha. Así vamos a comprobar si las Tres Marías tienen razón.

Esa misma noche, Lía miró el cielo: nada todavía. Dibujó un círculo vacío y escribió: "Luna nueva". Dos noches después apareció una rayita finita, como una sonrisa. Lía la dibujó feliz.

Noche tras noche, la luna fue creciendo: primero fue una sonrisa, después media luna, que el abuelo llamó cuarto creciente, y una noche, ¡una luna enorme y redonda! Era la luna llena. Después empezó a achicarse otra vez: cuarto menguante, una rayita, y otra vez luna nueva.

Cuando el cuaderno tuvo una página entera de lunas, el abuelo contó los días con ella.

—Veintinueve días y medio —dijo—. Eso tarda la luna en dar una vuelta completa a sus formas. Lo descubriste vos solita.

Esa noche, Lía corrió la cortina. En el cielo había una sonrisa finita de luna.

—¡Buenas noches, luna! —dijo—. Ya sé tu secreto.

Y a Lía le pareció que la luna, desde allá arriba, le guiñaba un ojo.`}],quiz:[{question:"¿Cómo se llama el gato de Lía?",options:["Pelusa","Bigote","Tito","Copito"],correct:1,explanation:"Bigote es el gato blanco y gordo que acompaña a Lía en su sueño."},{question:"¿De dónde viene la luz de la luna?",options:["La luna tiene luz propia","Del sol, que la ilumina","De las estrellas","De las lámparas de la ciudad"],correct:1,explanation:"La luna no tiene luz propia: refleja la luz del sol."},{question:"¿Qué pasa en la luna nueva?",options:["La luna se rompe","La luna se va a otro planeta","La parte iluminada no mira hacia la Tierra","La luna se apaga para siempre"],correct:2,explanation:"En la luna nueva, la cara iluminada mira hacia el otro lado y no la vemos."},{question:"¿Qué le regaló el abuelo Tito a Lía?",options:["Un telescopio","Un cuaderno para dibujar la luna","Un barco de verdad","Una linterna"],correct:1,explanation:"Con el cuaderno, Lía hizo un experimento: dibujó la luna todas las noches."},{question:"¿Cuántos días tarda la luna en repetir todas sus formas?",options:["Siete días","Un año","Unos veintinueve días y medio","Dos días"],correct:2,explanation:"El ciclo de las fases de la luna dura aproximadamente 29 días y medio."}]},{id:3,slug:"tomi-y-la-semilla-impaciente",title:"Tomi y la semilla impaciente",author:"Rocío Benavídez",synopsis:"La abuela Rosa le regala a Tomi una semilla de girasol. Tomi la planta y espera una flor gigante… ¡para el día siguiente! Con la ayuda de Lombi, una lombriz muy sabia, descubrirá lo que pasa debajo de la tierra y aprenderá el valor de la paciencia.",genres:["Naturaleza","Valores","Cuento"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"huerta",c1:"#8fd694",c2:"#f9d65c"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-24 00:00:00",updatedAt:"2026-09-24 00:00:00",chapters:[{title:"Una semilla en el bolsillo",illustration:"huerta",content:`Tomi era el chico más apurado del barrio. Se ponía las zapatillas sin desatar los cordones, se comía la merienda en tres bocados y quería que los cumpleaños llegaran mañana mismo.

Un sábado fue a visitar a la abuela Rosa, que tenía una huerta llena de tomates, lechugas, zapallos y flores. La abuela le dio una semilla chiquita, alargada, con rayitas negras y grises.

—Es una semilla de girasol —le dijo—. Si la cuidás, va a crecer una flor más alta que vos.

—¿Más alta que yo? —Tomi no lo podía creer—. ¡La voy a plantar ya!

En su casa buscó una maceta, la llenó de tierra, hizo un agujerito con el dedo y metió la semilla. La tapó, le echó un poco de agua y se sentó a mirarla.

Miró y miró. Pasaron cinco minutos. Pasaron diez.

—Mamá, ¿cuándo sale la flor?

—Tenés que esperar, Tomi —le contestó su mamá desde la cocina.

A la mañana siguiente, Tomi saltó de la cama y corrió a la maceta. Esperaba ver un girasol enorme, amarillo, saludándolo.

Pero en la maceta sólo había tierra. Tierra marrón, quieta y aburrida.

—¡Esta semilla está rota! —gritó Tomi, enojado—. ¡No hace nada!

Entonces, desde la tierra, se escuchó una vocecita.

—¿Cómo que no hace nada? Está trabajando muchísimo.

Tomi dio un salto hacia atrás. De la maceta asomaba una cabecita rosada y finita.`},{title:"Lo que pasa debajo de la tierra",illustration:"bosque",content:`—Me llamo Lombi —dijo la lombriz, estirándose—. Vivo en esta tierra y conozco a tu semilla. Es muy trabajadora, pero vos sólo mirás desde arriba.

—¿Y qué hace allá abajo? —preguntó Tomi, agachándose.

—Vení a ver.

Lombi le hizo un guiño y, de pronto, Tomi sintió que se achicaba y se achicaba, hasta quedar del tamaño de una hormiga. Lombi lo llevó por un túnel oscuro y húmedo, que olía a lluvia.

Allí abajo estaba la semilla. Ya no estaba dura: se había hinchado con el agua, y de una de sus puntas salía un hilito blanco que bajaba hacia el fondo.

—Eso es la raíz —explicó Lombi—. Es lo primero que sale. La raíz busca agua y alimento en la tierra, y sostiene a la planta para que no se caiga. Sin raíz, no hay flor.

—¿Y por qué tarda tanto?

—Porque las cosas importantes llevan tiempo. Para crecer, tu semilla necesita cuatro cosas: tierra buena, agua, luz del sol y… paciencia.

Tomi pensó un ratito.

—¿Y si le echo un montón de agua, crece más rápido?

Lombi negó con la cabeza.

—Si le das demasiada agua, la tierra se encharca, la raíz no puede respirar y se pudre. Hay que regarla un poquito, cuando la tierra está seca. Ni de más, ni de menos.

Tomi miró la raíz blanca y finita. Le pareció valiente, abriéndose camino sola en la oscuridad.

—Perdón, semilla —dijo bajito—. No sabía que estabas trabajando tanto.

Cuando volvió a su tamaño, Tomi estaba otra vez al lado de la maceta. Tocó la tierra con el dedo: estaba húmeda. "Hoy no hace falta regar", pensó. Y por primera vez en su vida, decidió esperar.`},{title:"El girasol que miraba al sol",illustration:"huerta",content:`Pasaron unos días. Una mañana, Tomi vio algo que lo hizo gritar de alegría: dos hojitas verdes habían asomado de la tierra, como dos manos pequeñas que se abrían.

Desde ese día, Tomi cuidó su planta con mucha atención. La regaba cuando la tierra estaba seca. La puso cerca de la ventana para que recibiera sol. Y todos los sábados la medía con una regla y anotaba los centímetros en un papel pegado en la heladera.

La planta crecía y crecía. Pronto fue tan alta que hubo que pasarla al patio. Tomi notó algo curioso: a la mañana, el capullo miraba hacia donde salía el sol, y a la tarde, hacia donde se escondía.

—¡Lombi, mi planta se mueve! —dijo, aunque Lombi ya no había vuelto a hablar.

La abuela Rosa le explicó que los girasoles jóvenes siguen al sol durante el día, como si quisieran tomar toda su luz.

Una mañana de verano, el capullo se abrió. Era un girasol enorme, con pétalos amarillos como rayos y un centro marrón lleno de semillitas. ¡Y era más alto que Tomi! Al rato llegó una abeja zumbando y se paseó por la flor.

—Las abejas ayudan a que se formen las semillas —le contó la abuela—. Todos trabajan juntos en la huerta.

Al final del verano, el girasol se llenó de semillas nuevas. Tomi las sacó con cuidado y las guardó en sobrecitos de papel. El lunes los llevó a la escuela y le regaló uno a cada compañero.

—Es una semilla de girasol —les dijo, igual que la abuela—. Pero les aviso: no sale mañana. Hay que esperar.

Sus compañeros se rieron. Tomi también. Y esa noche, antes de dormir, se ató los cordones de las zapatillas para el día siguiente. Despacito. Sin apuro.`}],quiz:[{question:"¿Qué semilla le regaló la abuela Rosa a Tomi?",options:["De tomate","De girasol","De zapallo","De rosa"],correct:1,explanation:"Era una semilla de girasol, alargada y con rayitas."},{question:"¿Qué es lo primero que le sale a la semilla?",options:["La flor","Las hojas","La raíz","Las semillas nuevas"],correct:2,explanation:"La raíz sale primero: busca agua y sostiene a la planta."},{question:"¿Qué pasa si se riega una planta con demasiada agua?",options:["Crece el doble","La raíz no respira y se puede pudrir","Se vuelve azul","No pasa nada"],correct:1,explanation:"El exceso de agua encharca la tierra y daña la raíz."},{question:"¿Qué hacía el girasol joven durante el día?",options:["Seguía al sol","Se escondía","Cantaba","Se cerraba"],correct:0,explanation:"Los girasoles jóvenes giran siguiendo al sol."},{question:"¿Qué aprendió Tomi en esta historia?",options:["A correr más rápido","A tener paciencia","A cocinar","A hablar con gatos"],correct:1,explanation:"Tomi entendió que las cosas importantes llevan tiempo."}]},{id:4,slug:"coral-la-tortuguita-que-buscaba-el-mar",title:"Coral, la tortuguita que buscaba el mar",author:"Julieta Ferraro",synopsis:"Una noche de luna, cien tortuguitas salen de sus huevos en la arena y corren hacia el mar. Pero las luces de la costa confunden a Coral, que toma el camino equivocado. Con la ayuda de un cangrejo gruñón y de una nena valiente, tendrá que encontrar el gran azul.",genres:["Aventura","Naturaleza","Valores"],gradeMin:1,gradeMax:3,section:1,cover:{scene:"tortuga",c1:"#57c4e5",c2:"#1a6fa8"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-25 12:00:00",updatedAt:"2026-09-25 12:00:00",chapters:[{title:"Nacer en la arena",illustration:"tortuga",content:`En una playa tranquila, debajo de la arena tibia, había un nido lleno de huevos blancos y redondos como pelotitas de ping-pong.

Una noche de luna, uno de los huevos hizo crac. Después otro, y otro más. De cada huevo salió una tortuguita del tamaño de una galletita, con aletas chiquitas y ojos negros y brillantes.

La última en salir fue Coral. Se sacudió la arena de la cabeza y miró a su alrededor. Sus hermanas ya corrían, todas en la misma dirección.

—¡Al mar! ¡Al mar! —decían.

Coral no sabía qué era el mar, pero algo adentro suyo le decía que tenía que ir. Las tortugas recién nacidas saben que el mar está donde el horizonte brilla más, porque la luna se refleja sobre el agua.

Coral empezó a caminar con sus aletas. Pero cuando levantó la cabeza vio dos brillos: uno, plateado y suave, del otro lado de la playa; el otro, amarillo y fuerte, detrás de los médanos. Eran las luces de un bar de la costa.

—Ese brillo es más grande —pensó Coral—. Por ahí debe ser.

Y caminó hacia las luces amarillas. Caminó y caminó, subiendo médanos, esquivando ramitas, cada vez más lejos del agua. La arena se puso fría y seca. Coral estaba cansada y no se escuchaba el ruido de las olas.

—¿Dónde está el mar? —dijo con su vocecita—. ¿Dónde están mis hermanas?

Nadie le contestó. Coral se dio cuenta de que estaba perdida.`},{title:"Un cangrejo gruñón",illustration:"oceano",content:`—¡Eh, vos! ¡Cuidado por dónde caminás, que me pisás la casa!

Coral dio un respingo. Frente a ella había un cangrejo rojo, con una pinza más grande que la otra, que la miraba con el ceño fruncido.

—Perdón, señor cangrejo. Me llamo Coral. Busco el mar.

—¿El mar? —el cangrejo se rió con un sonido de castañuelas—. Vas para el lado contrario, chiquita. Esas luces son de la gente, no del mar. Me llamo Ramón. Vení, te acompaño, aunque me hagas perder la noche.

Ramón era gruñón, pero tenía buen corazón. Le enseñó a Coral un truco:

—Cuando no sepas para dónde ir, quedate quieta y escuchá. El mar siempre habla.

Coral se quedó quietita. Y entonces lo oyó: shhh… shhh… shhh. Era el sonido de las olas, a lo lejos.

Empezaron a caminar hacia allí. Pero de pronto, Coral sintió que algo le apretaba una aleta. Se había enredado en una bolsa de plástico que el viento había dejado en la arena. Cuanto más se movía, más se enredaba.

—¡Ramón, ayudame!

El cangrejo usó su pinza grande: tric, tric, tric. Cortó el plástico con cuidado hasta que Coral quedó libre.

—Esta basura es un peligro para nosotros —refunfuñó Ramón—. Las tortugas grandes se la comen porque creen que es una medusa, y se enferman.

En ese momento, una luz de linterna los iluminó. Coral se asustó, pero era una nena con un gorro de lana y una bolsa en la mano.

—¡Una tortuguita perdida! —dijo la nena—. Tranquila, te voy a ayudar.`},{title:"El gran azul",illustration:"tortuga",content:`La nena se llamaba Juana y era voluntaria de un grupo que cuidaba a las tortugas marinas. Todas las noches de verano recorría la playa con su papá para ayudar a las tortuguitas que se perdían.

Juana no tocó a Coral con las manos. Le puso la linterna con una luz roja suave, que no confunde a las tortugas, y caminó a su lado, como una guardiana, hasta la orilla. Ramón iba detrás, refunfuñando por lo bajo.

Por fin, Coral sintió la arena mojada bajo sus aletas. Una ola llegó, le hizo cosquillas en la panza y se la llevó.

¡Era el mar! Era enorme, fresco y salado. Coral nadó, nadó y nadó. Las aletas que eran tan torpes en la arena, en el agua se movían como alas.

—¡Gracias, Juana! ¡Gracias, Ramón! —gritó, aunque ellos ya no podían oírla.

En el fondo del mar, entre algas que bailaban, Coral encontró a una tortuga enorme, con el caparazón cubierto de pequeños caracoles.

—Soy la abuela Marina —le dijo con voz lenta—. Bienvenida al gran azul. Tenés un largo viaje por delante. Vas a cruzar océanos y vas a crecer muchísimo. Y cuando seas grande, vas a volver a esta misma playa para poner tus propios huevos.

—¿Y si las luces confunden a mis hijitos?

La abuela Marina sonrió.

—Por eso es tan importante que la gente nos ayude.

Y en la playa, la gente ayudaba. Juana contó en su escuela la historia de la tortuguita perdida. Sus compañeros hicieron carteles: "En verano, apagá las luces que dan a la playa". "No dejes basura en la arena". El dueño del bar puso luces más bajitas. Y un sábado, todos juntos limpiaron la playa.

Desde una roca, Ramón los miraba trabajar.

—Bueno —gruñó—. Al final, los humanos no son tan malos.`}],quiz:[{question:"¿Dónde nacen las tortuguitas del cuento?",options:["En el fondo del mar","En un nido en la arena","En un árbol","En un barco"],correct:1,explanation:"Los huevos estaban enterrados en la arena tibia de la playa."},{question:"¿Por qué Coral se perdió?",options:["Porque se quedó dormida","Porque las luces de la costa la confundieron","Porque no quería ir al mar","Porque llovía"],correct:1,explanation:"Coral confundió las luces del bar con el brillo de la luna sobre el mar."},{question:"¿Qué truco le enseñó Ramón?",options:["Quedarse quieta y escuchar el mar","Correr muy rápido","Seguir a las gaviotas","Cavar un pozo"],correct:0,explanation:"Escuchando, Coral oyó el sonido de las olas."},{question:"¿Por qué la basura de plástico es peligrosa para las tortugas?",options:["Porque es muy pesada","Porque se enredan y la confunden con medusas","Porque las hace volar","No es peligrosa"],correct:1,explanation:"El plástico las enreda y, si lo comen, se enferman."}]},{id:5,slug:"el-caso-del-reloj-detenido",title:"El caso del reloj detenido",author:"Federico Lanús",synopsis:"Desde el lunes, el antiguo reloj de la torre de la escuela se detiene todos los días a las tres y cuarto. Y, además, empiezan a desaparecer lápices, punteros y palillos. Mora, Benja y Ulises, del Club de Detectives Lupa, aceptan el caso. Hay pistas, sospechosos… y un culpable que nadie imagina.",genres:["Policial","Misterio","Naturaleza"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"reloj",c1:"#f4a259",c2:"#5b8e7d"},status:"published",featured:!0,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-27 00:00:00",updatedAt:"2026-09-27 00:00:00",chapters:[{title:"Las tres y cuarto",illustration:"reloj",content:`La Escuela N.º 12 de Villa Aurora tenía algo que ninguna otra escuela del pueblo tenía: una torre con un reloj antiguo, instalado en 1910, que daba campanadas cada hora. Los abuelos del pueblo decían que nunca, jamás, se había atrasado ni un minuto.

Por eso, cuando el lunes el reloj se detuvo a las tres y cuarto, todos se sorprendieron. Don Aníbal, el portero nuevo, subió a la torre, lo puso en hora y el reloj volvió a andar.

El martes, a las tres y cuarto, se detuvo otra vez.

El miércoles, también.

—Esto ya no es casualidad —dijo Mora, mientras anotaba en su libreta de tapas rojas—. Esto es un caso.

Mora era la presidenta del Club de Detectives Lupa, que funcionaba en un rincón de la biblioteca de la escuela. Tenía once años, una memoria de elefante y la costumbre de morder el lápiz cuando pensaba. El club tenía dos miembros más: Benja, que nunca se separaba de la cámara de fotos de su tía, y Ulises, un chico callado que se pasaba los recreos mirando pájaros con unos binoculares viejos.

Ese mismo día pasó algo más. En la sala de música, el profesor Ledesma no encontraba los palillos del bombo. En la sala de arte habían desaparecido seis pinceles. Y la directora Ibáñez buscaba, desesperada, su puntero de madera.

—Reloj detenido y objetos desaparecidos —dijo Benja—. ¿Tendrán que ver?

—Un buen detective no cree en las casualidades —respondió Mora—. Pero tampoco acusa sin pruebas. Primero, juntamos pistas.

Fueron a ver a la directora. La señora Ibáñez los recibió en su despacho, con cara de preocupación.

—Chicos, el reloj es parte de la historia del pueblo. Si no averiguamos qué le pasa, vamos a tener que llamar a un relojero de la ciudad, y eso cuesta mucho dinero.

—Nosotros lo vamos a resolver —prometió Mora—. Denos tres días.

La directora sonrió. No estaba muy convencida, pero le gustaba el entusiasmo de esos chicos.

Esa tarde, en la biblioteca, Mora escribió en el pizarrón del club:

CASO N.º 7: EL RELOJ DETENIDO
Pista 1: Se detiene siempre a las 3:15.
Pista 2: Faltan objetos largos y finos: palillos, pinceles, un puntero.
Pista 3: Todo empezó el lunes.

Ulises, que no había dicho nada en toda la tarde, se acercó al pizarrón y agregó, con letra chiquita:

Pista 4: Desde el lunes hay más ruido de pájaros en el patio.

Benja se rió.

—¿Pájaros? Ulises, esto es un caso serio.

Ulises se encogió de hombros y no dijo nada más. Pero Mora copió la pista en su libreta. Por las dudas.`},{title:"Los sospechosos",illustration:"escuela",content:`Al día siguiente, el Club Lupa armó una lista de sospechosos. Mora la leyó en voz baja, como si fuera un secreto de Estado.

—Sospechoso número uno: Don Aníbal, el portero nuevo. Empezó a trabajar hace dos semanas y es el único que tiene la llave de la torre.

—Sospechoso número dos: Gastón, de séptimo. Es famoso por sus bromas. El año pasado escondió todos los borradores de la escuela.

—Sospechoso número tres: el profesor Ledesma. Siempre se queja de que las campanadas de las tres interrumpen su clase de música.

Benja levantó la cámara.

—Hay que interrogarlos.

—Entrevistarlos —lo corrigió Mora—. Un detective no interroga a la gente como si fuera culpable.

Empezaron por Don Aníbal. Lo encontraron barriendo el patio. Era un señor alto, de bigote gris, que escuchó las preguntas con paciencia.

—Sí, yo tengo la llave de la torre —dijo—. Subo todos los días a poner el reloj en hora. Y les digo algo raro: cada vez que subo, encuentro ramitas en el piso. Las barro, y al otro día hay más.

Mora anotó: "Ramitas en la torre".

Después buscaron a Gastón. Estaba en la cantina, comiendo un alfajor.

—¿Yo? ¿Romper el reloj? —Gastón se rió—. Ni loco. Si el reloj no suena, no sé cuándo termina el recreo. Además, a las tres y cuarto estoy en clase de Educación Física, en el club de enfrente. Pregúntenle al profe.

Le preguntaron al profe. Era verdad: los martes y miércoles, a esa hora, Gastón estaba a dos cuadras de la escuela, jugando al vóley.

Por último, fueron a la sala de música. El profesor Ledesma estaba afinando una guitarra.

—Es cierto que las campanadas me molestan —admitió—. Pero yo fui el que más sufrió: ¡me robaron los palillos del bombo! ¿Ustedes creen que yo me robaría a mí mismo?

Benja sacó una foto de la sala. Al revisarla en la pantallita de la cámara, notó algo: en la ventana abierta, sobre el marco, había una pluma verde.

Esa tarde, el club se reunió otra vez.

—Gastón tiene coartada —dijo Mora, tachando su nombre—. El profesor Ledesma también perdió cosas, así que es más víctima que sospechoso. Y Don Aníbal…

—Don Aníbal nos dio una pista —dijo Ulises.

Los otros dos lo miraron. Era la primera vez que hablaba en todo el día.

—Ramitas en la torre. Una pluma verde. Palillos, pinceles y punteros: todos parecen palitos. Y más ruido de pájaros desde el lunes.

Mora dejó de morder el lápiz.

—Ulises… ¿estás diciendo que el culpable es un pájaro?

Ulises sonrió por primera vez.

—Estoy diciendo que tenemos que subir a esa torre.`},{title:"Una pista con plumas",illustration:"reloj",content:`Subir a la torre no era fácil. Había que pedir permiso a la directora, firmar una autorización y, sobre todo, ir acompañados por un adulto. Don Aníbal aceptó llevarlos el viernes a las tres en punto.

La escalera era de madera, angosta y caracol. Crujía a cada paso. A medida que subían, el tic tac del reloj se hacía más fuerte, como si fuera el corazón de la escuela.

Arriba había un cuarto pequeño, lleno de engranajes de bronce que giraban despacio. Por un hueco, detrás de la esfera del reloj, entraba la luz de la tarde. Y por ese hueco también entraba el ruido: un griterío agudo, como de una plaza llena de chicos.

—¡Miren! —susurró Benja.

En el hueco, apoyado entre la pared y la parte de atrás de la esfera, había un nido enorme. No era un nido chiquito, como los de los horneros, sino una bola gigante de ramitas entrelazadas, del tamaño de una sandía grande. Y entre las ramitas, se veían cosas muy raras: un pincel con la punta azul, un palillo de bombo y, atravesado en el medio, el puntero de la directora.

De pronto, un pájaro verde, de pecho grisáceo, salió del nido y los miró con la cabeza inclinada.

—Cotorras —dijo Ulises, con los ojos brillantes—. Son cotorras. Hacen nidos gigantes con ramas, y a veces viven muchas familias juntas en el mismo nido, como si fuera un edificio.

—¿Y por qué se llevaron nuestras cosas? —preguntó Benja.

—Porque para una cotorra, un pincel o un palillo son ramitas perfectas: largas, finas y fáciles de llevar en el pico.

Mora miraba el reloj. Las agujas, del otro lado de la esfera, estaban unidas a un eje que pasaba muy cerca del nido.

—Un momento —dijo—. Don Aníbal, ¿qué hora es?

—Las tres y doce.

Esperaron en silencio. Las tres y trece. Las tres y catorce. El engranaje grande giraba despacito, y una varilla de metal, que movía el minutero, se acercaba cada vez más al borde del nido.

A las tres y cuarto en punto, la varilla chocó contra el puntero de la directora, que sobresalía del nido como una lanza. El engranaje hizo un ruido seco. Y el reloj se detuvo.

—¡Ahí está! —gritó Mora—. ¡El puntero traba la varilla!

Benja sacó cinco fotos seguidas. Don Aníbal se rascó el bigote, asombrado.

—Treinta años trabajando en escuelas —dijo— y nunca vi una cosa así.

Mora cerró su libreta.

—Caso resuelto —anunció—. Bueno… casi.

—¿Casi? —preguntó Benja.

Ulises señaló el nido. Desde adentro se escuchaban unos piídos muy finitos.

—Hay pichones —dijo—. No podemos sacar el nido así nomás.`},{title:"El nido en la torre",illustration:"escuela",content:`El lunes, el Club Lupa presentó su informe en la dirección. Estaban la directora Ibáñez, Don Aníbal, el profesor Ledesma y hasta Gastón, que se había enterado de que lo habían investigado y quería saber por qué.

Mora explicó todo con orden, como buena detective: las pistas, las entrevistas, las coartadas y la subida a la torre. Benja mostró las fotos en la computadora. Y Ulises, aunque se puso colorado, habló de las cotorras.

—Las cotorras construyen nidos comunitarios con ramas —explicó—. Toman lo que encuentran: ramitas, alambres… y también pinceles y palillos, si quedan cerca de una ventana abierta. El problema es que este nido está pegado al mecanismo del reloj.

—Entonces hay que sacarlo hoy mismo —dijo el profesor Ledesma.

—No se puede —respondió Ulises—. Tiene pichones adentro. Si sacamos el nido ahora, se mueren. Hay que esperar a que aprendan a volar, que es en unas semanas.

La directora se quedó pensando.

—¿Y mientras tanto?

Mora tenía la respuesta preparada.

—Don Aníbal puede sacar con cuidado sólo el puntero, que es lo que traba la varilla, sin tocar el resto del nido. Así el reloj vuelve a andar. Y cuando los pichones vuelen, colocamos una tela metálica en el hueco para que no vuelvan a hacer el nido ahí.

—¿Y a dónde van a ir las cotorras? —preguntó Gastón, que se había interesado de verdad.

—Podemos poner una plataforma de madera en el eucalipto del fondo del patio —dijo Ulises—. Así tienen un lugar para construir un nido nuevo, lejos del reloj.

Y así lo hicieron. Esa misma tarde, Don Aníbal subió a la torre y retiró el puntero con mucho cuidado. Las cotorras protestaron con un griterío espantoso, pero no abandonaron el nido. A las tres y cuarto, toda la escuela se quedó en silencio, mirando la torre. El minutero pasó por el número tres… y siguió de largo.

El patio estalló en aplausos.

Unas semanas después, cuando los pichones ya volaban, Don Aníbal y un grupo de padres retiraron el nido de la torre y colocaron la tela metálica. En el eucalipto, la plataforma de madera ya tenía las primeras ramitas de un nido nuevo.

La directora recuperó su puntero, aunque tenía marcas de picotazos. El profesor Ledesma recuperó sus palillos y, desde entonces, cada vez que suenan las campanadas de las tres, toca un redoble de bombo en honor a las cotorras.

Ese viernes, el Club Lupa se reunió en la biblioteca. Mora escribió en el pizarrón: "CASO N.º 7: RESUELTO". Y debajo agregó algo:

"Lección aprendida: las pistas pequeñas también importan. Y no hay que acusar a nadie sin pruebas".

Benja miró a Ulises.

—Perdón por reírme de tu pista de los pájaros.

—No pasa nada —dijo Ulises—. Pero el próximo caso, los binoculares los llevo yo.

Y los tres se rieron, mientras a lo lejos, puntual como siempre, el viejo reloj daba las cuatro.`}],quiz:[{question:"¿A qué hora se detenía el reloj de la escuela?",options:["A las doce en punto","A las tres y cuarto","A las ocho de la mañana","A cualquier hora"],correct:1,explanation:"El reloj se detenía todos los días a las 3:15."},{question:"¿Por qué Gastón dejó de ser sospechoso?",options:["Porque confesó","Porque tenía una coartada: estaba en Educación Física en otro lugar","Porque era amigo de Mora","Porque se fue de la escuela"],correct:1,explanation:"A esa hora estaba en el club de enfrente, y el profesor lo confirmó."},{question:"¿Qué tienen en común los objetos que desaparecieron?",options:["Son todos rojos","Son largos y finos, como ramitas","Son de metal","Son muy caros"],correct:1,explanation:"Las cotorras los usaban como ramitas para su nido."},{question:"¿Qué detenía realmente el reloj?",options:["Una pila gastada","El puntero de la directora atravesado en el nido","Una broma de Gastón","El viento"],correct:1,explanation:"La varilla del minutero chocaba contra el puntero que sobresalía del nido."},{question:"¿Por qué no sacaron el nido enseguida?",options:["Porque era muy pesado","Porque tenía pichones que todavía no volaban","Porque la directora no quiso","Porque no tenían escalera"],correct:1,explanation:"Decidieron esperar a que los pichones aprendieran a volar para no dañarlos."}]},{id:6,slug:"mision-estacion-condor",title:"Misión: Estación Cóndor",author:"Ana Sol Quiroga",synopsis:"Año 2131. Sofía tiene once años y vive en la Estación Cóndor, que gira alrededor de Marte. Un día, mientras los adultos trabajan en la superficie del planeta rojo, una lluvia de micrometeoritos deja la estación sin energía. Sofía, su amigo Kenji y el robot Tornillo tendrán que usar todo lo que saben para salvar la estación.",genres:["Ciencia ficción","Aventura","Ciencia"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"cohete",c1:"#1b1f4b",c2:"#c8553d"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-28 12:00:00",updatedAt:"2026-09-28 12:00:00",chapters:[{title:"Un día normal en órbita",illustration:"cohete",content:`Lo primero que hacía Sofía cada mañana era mirar por la ventanilla redonda de su cabina. Abajo, enorme y rojiza, estaba Marte.

Desde la Estación Cóndor, Marte parecía una naranja gigante con manchas marrones y blancas. Las manchas blancas eran los polos, cubiertos de hielo. Y, si la estación pasaba por el lugar justo, Sofía podía ver el Monte Olimpo, el volcán más alto de todo el sistema solar: casi tres veces más alto que el monte Everest de la Tierra.

—Buen día, Sofi. Son las siete horas, tiempo de la estación. La temperatura exterior es de ciento veinte grados bajo cero. ¿Querés que te prepare el desayuno?

El que hablaba era Tornillo, un robot del tamaño de un perro grande, con brazos plegables y una pantalla redonda donde dibujaba caritas para expresar lo que sentía. Esa mañana, la carita sonreía.

—Sí, gracias, Tornillo.

En la Estación Cóndor no había gravedad como en la Tierra, así que todo flotaba. Sofía dormía en una bolsa de dormir atada a la pared, para no andar flotando por la cabina toda la noche. El jugo se tomaba con bombilla desde una bolsita cerrada, porque si se volcaba, el líquido no caía: se convertía en bolitas temblorosas que flotaban por todos lados.

Sofía había nacido en la Tierra, en Córdoba, pero vivía en la estación desde hacía dos años con su mamá, que era ingeniera. En la Cóndor vivían cuarenta personas: científicos, médicos, pilotos y cuatro chicos. Uno de ellos era Kenji, su mejor amigo, que siempre tenía el pelo parado porque, sin gravedad, era imposible peinarse.

Esa mañana, Kenji apareció flotando en la puerta de su cabina.

—¿Te enteraste? Hoy bajan casi todos los adultos a la base de la superficie. Van a instalar el invernadero nuevo.

—Sí, mi mamá también va —dijo Sofía—. Vuelven a la noche.

En la estación sólo quedarían los chicos, el doctor Méndez, que estaba resfriado y no podía bajar, y los robots. No era nada raro: pasaba todos los meses.

La comunicación con la Tierra era lenta. Los mensajes tardaban entre tres y veintidós minutos en llegar, según lo cerca o lejos que estuvieran los dos planetas en sus órbitas alrededor del Sol. Por eso, en la estación, la gente aprendía a resolver sus problemas sola.

A media mañana, Sofía y Kenji tuvieron clase con la maestra virtual. Ese día aprendieron sobre las lunas de Marte: Fobos, que es la más grande y da casi tres vueltas a Marte por día, y Deimos, más pequeña y lejana.

—Fobos tiene forma de papa —dijo Kenji, riéndose.

—Y se acerca a Marte un poquito cada año —agregó Sofía—. Dentro de millones de años, se va a romper en pedazos y Marte va a tener un anillo, como Saturno.

Sofía no sabía que, esa misma tarde, todo lo que había aprendido iba a servirle para algo mucho más importante que una prueba.`},{title:"La lluvia de piedras invisibles",illustration:"montanas",content:`A las tres de la tarde, una alarma sonó en toda la estación. Era un sonido agudo, que Sofía sólo había escuchado en los simulacros.

—Alerta —dijo la voz de la computadora central—. Impacto de micrometeoritos en el sector cuatro. Daño en los paneles solares.

Las luces parpadearon y se apagaron. Se encendieron las luces de emergencia, rojas y débiles. El zumbido de los ventiladores, ese ruido que siempre estaba y que nadie escuchaba, se detuvo de golpe. El silencio era espantoso.

Sofía, Kenji y Tornillo flotaron hasta el módulo de control. El doctor Méndez ya estaba ahí, con la nariz roja y cara de preocupación.

—Los micrometeoritos son piedritas del espacio, a veces más chicas que un grano de arena —explicó, mientras revisaba las pantallas—. Pero viajan tan rápido que pueden dañar cualquier cosa. Rompieron los cables que conectan los paneles solares con las baterías. Estamos usando energía de reserva.

—¿Cuánta reserva queda? —preguntó Kenji.

El doctor tragó saliva.

—Seis horas. Después, se apaga el sistema que limpia el aire.

—¿Y los adultos? ¿Podemos llamarlos? —dijo Sofía.

—Lo intenté. En la superficie se desató una tormenta de polvo. Las tormentas de Marte pueden ser enormes y bloquean las comunicaciones. No van a poder despegar hasta que pase.

Sofía sintió un nudo en la panza. Miró por la ventanilla: abajo, una mancha marrón cubría parte del planeta como una sábana sucia. Su mamá estaba ahí abajo.

—Entonces hay que arreglar los cables nosotros —dijo.

—El arreglo se hace desde afuera —contestó el doctor—. Hay que salir con traje espacial. Yo estoy enfermo y ustedes son chicos. Ni lo piensen.

—Tornillo puede salir —dijo Kenji—. Los robots de mantenimiento están hechos para eso.

La carita de Tornillo mostró un signo de pregunta.

—Puedo salir —dijo el robot—. Pero mi programa de reparación necesita instrucciones de un ingeniero. Y la ingeniera de la estación es la mamá de Sofía.

Sofía pensó rápido. En la cabina de su mamá había una tablet con los manuales de la estación. Mil veces la había visto estudiarlos.

—Yo puedo leerle las instrucciones a Tornillo —dijo—. Paso por paso. El doctor Méndez puede controlar que lo haga bien.

El doctor los miró a los dos. Tenía fiebre, estaba cansado y no había otra opción.

—Está bien. Pero ustedes se quedan adentro. Y hacemos todo exactamente como dice el manual.

Kenji flotó hasta la cabina de la mamá de Sofía y volvió con la tablet. Sofía la encendió. En la pantalla apareció un título: "Procedimiento 14-B. Reparación de conexión de paneles solares".

Respiró hondo y empezó a leer.`},{title:"Seis horas de oscuridad",illustration:"cohete",content:`Tornillo salió por la escotilla de mantenimiento con un cable de seguridad atado a la cintura. Desde el módulo de control, Sofía, Kenji y el doctor lo veían a través de la cámara que el robot llevaba en la cabeza.

Afuera, el espacio era negro y silencioso. Marte ocupaba la mitad de la pantalla. Los paneles solares, largos como canchas de fútbol, se extendían a los costados de la estación.

—Paso uno —leyó Sofía—. Localizar la caja de conexiones del sector cuatro.

—Localizada —dijo Tornillo.

—Paso dos. Desconectar el cable dañado. Paso tres. Conectar el cable de repuesto, color naranja, en la entrada B.

Tornillo trabajaba despacio, con sus pinzas de precisión. Pasaron veinte minutos, cuarenta, una hora. Sofía leía, Tornillo hacía, el doctor revisaba. Kenji anotaba cada paso en una hoja.

Cuando faltaba el último paso, la pantalla de la cámara se puso oscura.

—¿Tornillo? ¿Qué pasa?

—Visión reducida —dijo el robot—. No hay luz suficiente.

Sofía miró por la ventanilla. Una sombra enorme avanzaba sobre la estación. No era una nube, porque en el espacio no hay nubes.

—¡Es Fobos! —gritó Kenji—. ¡Fobos está pasando entre el Sol y nosotros!

Sofía recordó la clase de esa mañana. Fobos da casi tres vueltas a Marte por día. Cada tanto, su sombra pasa sobre la estación, como un eclipse pequeñito.

—Si Fobos tapa el Sol, los paneles no reciben luz —dijo—. Aunque Tornillo termine la reparación, no vamos a saber si funciona hasta que pase la sombra.

—¿Y cuánto dura? —preguntó el doctor.

Sofía hizo la cuenta, como en clase: Fobos es chico y se mueve rápido.

—Menos de un minuto. Tornillo, encendé la linterna del brazo y esperá.

La linterna se encendió. Tornillo terminó el último paso: ajustar la tuerca de seguridad. Y entonces la sombra de Fobos pasó, y la luz del Sol volvió a caer sobre los paneles, que brillaron como espejos.

En el módulo de control, una pantalla se puso verde.

—Energía restablecida —dijo la computadora—. Carga de baterías: en aumento.

Los ventiladores volvieron a zumbar. Las luces blancas se encendieron. Kenji pegó un grito tan fuerte que salió flotando hacia el techo.

Sofía no gritó. Se quedó quieta, con la tablet en las manos, y se dio cuenta de que le temblaban los dedos.

—Lo hicimos —susurró.

En la pantalla de Tornillo, del otro lado de la ventanilla, apareció una carita sonriente enorme.`},{title:"El regreso",illustration:"montanas",content:`La tormenta de polvo duró dos días más. Durante ese tiempo, la estación funcionó perfectamente. El doctor Méndez se recuperó del resfrío, Tornillo volvió a preparar desayunos y Sofía y Kenji siguieron sus clases, aunque no podían dejar de hablar de la reparación.

Al tercer día, la tormenta se calmó y por fin llegó un mensaje desde la superficie. En la pantalla apareció la mamá de Sofía, con la cara cansada y el pelo lleno de polvo rojo.

—Sofi, nos enteramos de todo. Ya despegamos. Llegamos en dos horas.

Cuando la nave de transporte se acopló a la estación, Sofía flotó por el pasillo tan rápido que casi choca con la escotilla. Su mamá la abrazó fuerte, como se abraza en el espacio: con cuidado de no salir girando las dos.

—El doctor Méndez me mandó el informe —le dijo su mamá—. Leíste el procedimiento 14-B sin saltearte ni un paso. Y te diste cuenta de la sombra de Fobos.

—Kenji también ayudó. Y Tornillo hizo todo el trabajo difícil.

—Lo sé. Trabajaron en equipo. Eso es lo que hacen los buenos ingenieros.

Esa noche, la estación hizo una pequeña fiesta. Hubo pizza deshidratada, que no era tan rica como la de la Tierra, y jugo en bolsitas. El comandante de la estación le dio a Sofía, a Kenji y a Tornillo un parche de tela con el dibujo de un cóndor y una frase: "Tripulación de honor".

Más tarde, ya en su cabina, Sofía miró por la ventanilla. La tormenta había terminado y Marte se veía claro y rojizo. Su color se debe al óxido de hierro que cubre sus rocas y su polvo: Marte, en cierto modo, es un planeta oxidado.

Sofía pensó en la Tierra, tan lejos que desde ahí parecía una estrella azul. Pensó en las personas que, cien años antes, habían soñado con llegar a Marte. Pensó en todo lo que había que aprender para vivir en un lugar así.

—Tornillo —dijo—. ¿Vos creés que algún día voy a ser ingeniera?

La carita del robot se iluminó.

—Según mis cálculos, ya empezaste.

Sofía sonrió, se metió en su bolsa de dormir atada a la pared y cerró los ojos. Abajo, Marte giraba despacio. Arriba, Fobos cruzaba el cielo, rápido, como siempre. Y la Estación Cóndor, con todas sus luces encendidas, seguía su vuelta alrededor del planeta rojo.`}],quiz:[{question:"¿Cuál es el volcán más alto del sistema solar, que Sofía ve desde la estación?",options:["El Aconcagua","El Monte Olimpo","El Everest","El Vesubio"],correct:1,explanation:"El Monte Olimpo, en Marte, es casi tres veces más alto que el Everest."},{question:"¿Qué dañó los paneles solares de la estación?",options:["Un rayo","Micrometeoritos","Un robot","Una tormenta de nieve"],correct:1,explanation:"Son piedritas del espacio que viajan a enorme velocidad."},{question:"¿Por qué los adultos no podían comunicarse ni volver?",options:["Porque estaban dormidos","Porque se desató una tormenta de polvo en Marte","Porque se les rompió la nave","Porque estaban en la Tierra"],correct:1,explanation:"Las tormentas de polvo marcianas bloquean las comunicaciones y los despegues."},{question:"¿Qué tapó la luz del Sol durante la reparación?",options:["La Luna de la Tierra","Deimos","La sombra de Fobos","Una nave"],correct:2,explanation:"Fobos pasó entre el Sol y la estación, como un pequeño eclipse."},{question:"¿Por qué Marte es de color rojizo?",options:["Porque es muy caliente","Por el óxido de hierro de sus rocas y polvo","Porque refleja el fuego del Sol","Porque tiene plantas rojas"],correct:1,explanation:"El óxido de hierro, como el de la herrumbre, le da su color."}]},{id:7,slug:"diario-de-la-antartida",title:"Diario de la Antártida",author:"Malena Ruiz Díaz",synopsis:"Malena tiene diez años y su mamá, bióloga, consiguió un puesto en la Base Esperanza, en la Antártida Argentina. Durante un año, Malena escribe en su diario todo lo que vive: el cruce del mar más bravo del mundo, una escuela entre los hielos, sus vecinos los pingüinos y una tormenta blanca que nunca olvidará.",genres:["Exploración","Aventura","Ciencia"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"pinguino",c1:"#bfe3f2",c2:"#4b8fbf"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-09-30 00:00:00",updatedAt:"2026-09-30 00:00:00",chapters:[{title:"Rumbo al sur",illustration:"barco",content:`Querido diario:

Hoy empieza la aventura más grande de mi vida. Mamá es bióloga marina y la eligieron para trabajar un año entero en la Base Esperanza, en la Antártida Argentina. Y yo voy con ella. Papá se queda en Buenos Aires porque tiene que trabajar, pero prometió que nos vamos a hablar todas las semanas por videollamada.

Cuando les conté a mis compañeros, no me creían. "¿En la Antártida vive gente?", me preguntó Lucas. ¡Sí! En la Base Esperanza viven familias enteras, con chicos, y hasta hay una escuela. Es uno de los pocos lugares de la Antártida donde pasa eso.

Viajamos en el rompehielos Almirante Irízar, un barco enorme, de color naranja, que puede abrirse camino entre el hielo del mar. Tiene un casco reforzado y, cuando encuentra una capa de hielo, se sube encima y la rompe con su propio peso. ¡Crac!

Querido diario (día 4 de viaje):

Hoy cruzamos el Pasaje de Drake, el mar que separa América del Sur de la Antártida. Dicen que es uno de los mares más bravos del mundo, y es verdad. Las olas eran tan altas que el barco subía y bajaba como una montaña rusa. Los platos del comedor tenían bordes para que no se cayeran y había sogas en los pasillos para agarrarse.

Me mareé muchísimo. Mamá también. Un marinero, el cabo Ruiz, nos dio un consejo: mirar el horizonte y comer galletitas secas. Funcionó un poquito.

Querido diario (día 6):

¡Vi mi primer iceberg! Era más grande que mi escuela, blanco y celeste, con partes de un azul tan intenso que parecía pintado. El cabo Ruiz me explicó que lo que vemos de un iceberg es sólo una parte pequeña: la mayor parte está escondida debajo del agua. Por eso los barcos tienen que tener mucho cuidado.

También vi ballenas. Primero vi un chorro de agua que salía del mar como una fuente. Después, una cola enorme que se levantaba y se hundía despacio. Me quedé tanto tiempo mirando que se me congeló la nariz.

Querido diario (día 8):

Llegamos. Desde el barco, la Base Esperanza parecía un pueblito de juguete: casas de colores, rojas, naranjas y verdes, sobre la roca oscura, rodeadas de hielo y de montañas blancas. Los colores no son por adorno: sirven para que las casas se vean desde lejos, incluso cuando hay niebla o nieve.

Mañana bajamos a tierra. Estoy nerviosa y feliz al mismo tiempo. Voy a vivir un año en el continente más frío, más seco y más ventoso del planeta.`},{title:"Una escuela entre los hielos",illustration:"escuela",content:`Querido diario:

Nuestra casa en la base es chiquita pero calentita. Tiene doble puerta en la entrada, para que no se escape el calor, y un perchero enorme para dejar las camperas, los guantes, las botas y los gorros. Para salir hay que ponerse como cuatro capas de ropa. Mamá dice que tardo más en vestirme que en ir y volver.

Hoy fue mi primer día en la escuela. Es la escuela más austral de la Argentina, y somos poquitos alumnos: en total, menos de veinte, de todas las edades. En mi aula estamos Tomás, que tiene once; Nahiara, que tiene diez como yo, y yo. La seño se llama Silvina y vino desde Ushuaia.

Lo más lindo es que lo que estudiamos lo podemos ver por la ventana. Hoy, en Ciencias Naturales, aprendimos que la Antártida es un continente cubierto casi entero por una capa de hielo que, en algunos lugares, tiene más de cuatro kilómetros de espesor. ¡Es como si apiláramos muchos edificios uno arriba del otro, pero de hielo! En ese hielo está guardada la mayor parte del agua dulce del planeta.

Querido diario:

Hoy la seño Silvina nos habló del Tratado Antártico. Es un acuerdo que firmaron muchos países en 1959. Dice que la Antártida tiene que usarse sólo para la paz y para la ciencia, que no se pueden hacer pruebas militares ni dejar basura, y que los científicos de todos los países tienen que compartir lo que descubren.

Me gustó mucho esa idea: un continente entero dedicado a aprender.

Querido diario:

Ahora es verano en la Antártida. Eso significa que casi no se hace de noche. A las once de la noche todavía hay luz, y el sol apenas se esconde un ratito detrás de las montañas. Me cuesta dormir, así que mamá puso una cortina negra en mi ventana.

Nahiara me contó que en invierno pasa lo contrario: los días son cortísimos y casi todo el tiempo está oscuro. "Ya vas a ver", me dijo, misteriosa. "En invierno, el cielo hace magia".

No sé qué quiso decir. Pero tengo curiosidad.

Querido diario:

Hoy acompañé a mamá al laboratorio. Ella estudia el krill, unos animalitos parecidos a camarones chiquitos que viven en el mar antártico. Parecen poca cosa, pero son importantísimos: los comen las ballenas, las focas, los pingüinos y muchos peces. Si el krill desapareciera, toda la vida del mar antártico estaría en peligro.

—Todo está conectado —me dijo mamá—. Hasta el animal más chiquito.

Lo anoté en mi cuaderno de ciencias, con letra grande.`},{title:"Los vecinos de frac",illustration:"pinguino",content:`Querido diario:

Hoy conocí a nuestros vecinos más famosos. Cerca de la base hay una colonia enorme de pingüinos de Adelia: ¡son miles y miles! Son blancos y negros, como si tuvieran puesto un traje de fiesta, y tienen un anillo blanco alrededor de los ojos que los hace parecer siempre sorprendidos.

Antes de ir, la seño Silvina nos explicó las reglas para visitar a los animales antárticos:

1. No acercarse demasiado: hay que quedarse a varios metros de distancia.
2. Nunca tocarlos ni darles de comer.
3. Si un pingüino viene hacia nosotros, quedarnos quietos y dejarlo pasar. Ellos tienen prioridad.
4. Caminar despacio y no hacer ruidos fuertes.
5. No llevarse nada: ni piedras, ni plumas, ni huesos.

Cuando llegamos a la colonia, lo primero que noté fue el olor. ¡Qué olor! Mamá se rió de mi cara. Lo segundo fue el ruido: los pingüinos graznan todo el tiempo, se llaman entre ellos, discuten.

Los pingüinos de Adelia hacen sus nidos con piedritas. Las piedritas son tan importantes que a veces se las roban unos a otros. Vi a un pingüino que, cuando su vecino se distraía, le sacaba una piedra del nido y la llevaba al suyo. Después volvía por otra. ¡Era un ladrón profesional!

Querido diario:

Hoy vi algo muy emocionante: en uno de los nidos, entre las patas de un pingüino adulto, asomaba un pichón. Era una bolita de plumas grises, suave, con el pico abierto pidiendo comida. Mamá y papá pingüino se turnan: uno cuida el nido y el otro va al mar a pescar krill. Cuando vuelve, le da de comer al pichón directo en el pico.

Tomás me dijo que los pingüinos no pueden volar, pero que en el agua nadan rapidísimo, como si volaran bajo el mar. Sus alas se transformaron en aletas.

Querido diario:

Hoy vimos una foca leopardo descansando en un témpano. Es enorme y tiene manchas como un leopardo, de ahí su nombre. Es una gran cazadora y los pingüinos le tienen miedo. Nos quedamos lejos, muy lejos, y la miramos con los binoculares.

Mamá dice que en la Antártida, nosotros somos los visitantes. Los dueños de casa son ellos.

Esa frase también la anoté en mi cuaderno.`},{title:"La tormenta blanca",illustration:"montanas",content:`Querido diario:

Hoy pasó algo que me dio mucho miedo, y quiero escribirlo para no olvidarme nunca de lo que aprendí.

Ya era otoño y los días se habían acortado bastante. Después de la escuela, Nahiara y yo fuimos caminando hasta la casa de Tomás, que queda en el otro extremo de la base. Son apenas doscientos metros. Hacía frío, pero el cielo estaba despejado.

Cuando estábamos a mitad de camino, el viento cambió. En unos minutos el cielo se puso gris, empezó a soplar fortísimo y la nieve que estaba en el suelo se levantó en remolinos. De repente, no se veía nada. Nada de nada. Ni las casas, ni las montañas, ni siquiera mis propias botas. Todo era blanco.

Los de la base le dicen "blanqueo" o "viento blanco". Es cuando la nieve y la niebla hacen que no se pueda distinguir el suelo del cielo.

Nahiara me agarró la mano. Yo quería correr, pero me acordé de lo que nos habían enseñado el primer día en la charla de seguridad: "Si te agarra un viento blanco, no corras. Buscá la soga guía y seguila".

En la Base Esperanza, entre las casas, hay unas sogas atadas a postes, justamente para estos casos. Nos agachamos y tanteamos con los guantes hasta que encontramos un poste. Después, la soga.

—No la sueltes por nada del mundo —le grité a Nahiara, porque el viento no dejaba escuchar.

Caminamos despacito, agarradas de la soga, paso a paso, con el viento empujándonos de costado. No sé cuánto tiempo tardamos. Me pareció una eternidad. De pronto, la soga terminó en una pared roja: ¡era la casa de Tomás!

Su papá abrió la puerta y nos hizo pasar. Llamó por radio a nuestras familias para avisar que estábamos bien. Mamá llegó una hora después, cuando el viento se calmó, y me abrazó tan fuerte que casi no podía respirar.

—Hiciste exactamente lo correcto —me dijo—. Las reglas de la Antártida no son para molestar. Son para cuidarnos.

Querido diario (invierno):

Ahora entiendo lo que me había dicho Nahiara. Una noche de julio, la seño Silvina nos llamó a todos afuera. En el cielo negro, lleno de estrellas, aparecieron unas cortinas de luz verde que se movían despacio, como si alguien las sacudiera con el viento. Era una aurora austral.

La seño nos explicó que las auroras se forman cuando partículas que vienen del Sol chocan con el aire de la parte alta de la atmósfera, cerca de los polos, y lo hacen brillar.

Nadie habló. Nos quedamos todos mirando el cielo, con la boca abierta, hasta que el frío nos obligó a entrar.

Querido diario (último día):

Mañana volvemos a Buenos Aires. Guardé en mi valija la campera, los guantes y este diario. No me llevo ni una piedra, ni una pluma, porque eso dicen las reglas. Pero me llevo algo más grande: me llevo las ganas de ser científica, como mamá. Y la seguridad de que, algún día, voy a volver.`}],quiz:[{question:"¿Cómo se llama el barco en el que viajan Malena y su mamá?",options:["Titanic","Almirante Irízar","Cóndor","Esperanza"],correct:1,explanation:"El Almirante Irízar es un rompehielos argentino."},{question:"¿Qué establece el Tratado Antártico?",options:["Que la Antártida es de un solo país","Que se usa para la paz y la ciencia","Que está prohibido visitarla","Que se puede pescar sin límites"],correct:1,explanation:"El tratado de 1959 dedica la Antártida a la paz y a la investigación científica."},{question:"¿Por qué el krill es tan importante?",options:["Porque es muy grande","Porque es el alimento de muchos animales antárticos","Porque brilla de noche","Porque derrite el hielo"],correct:1,explanation:"Ballenas, focas, pingüinos y peces dependen del krill."},{question:"¿Qué usan los pingüinos de Adelia para hacer sus nidos?",options:["Ramas","Algas","Piedritas","Plumas de otras aves"],correct:2,explanation:"Las piedritas son tan valiosas que se las roban entre ellos."},{question:"¿Qué hicieron Malena y Nahiara durante el viento blanco?",options:["Corrieron hacia la casa","Se quedaron gritando","Siguieron la soga guía sin soltarla","Se escondieron en la nieve"],correct:2,explanation:"Siguieron la regla de seguridad: no correr y seguir la soga guía."}]},{id:8,slug:"la-mochila-del-tiempo",title:"La mochila del tiempo",author:"Gonzalo Echeverría",synopsis:"A Tomás la historia le parece aburridísima. Hasta que encuentra en el altillo de su abuela una vieja mochila de cuero que lo lleva, sin aviso, a Buenos Aires en mayo de 1810. Calles de barro, vendedores ambulantes, un Cabildo lleno de gente y una pregunta que cambió la historia: ¿el pueblo quiere saber de qué se trata?",genres:["Historia","Fantasía","Aventura"],gradeMin:4,gradeMax:5,section:2,cover:{scene:"cabildo",c1:"#7fb7e6",c2:"#f2e8cf"},status:"published",featured:!1,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-01 12:00:00",updatedAt:"2026-10-01 12:00:00",chapters:[{title:"Una mochila con olor a antiguo",illustration:"cabildo",content:`—Para el lunes, un trabajo sobre la Semana de Mayo —dijo la seño Marta—. Quiero que me cuenten cómo era la vida en Buenos Aires en 1810.

Tomás apoyó la frente sobre el banco y suspiró. Para él, la historia era una lista interminable de fechas, nombres y próceres con peluca que miraban serios desde los cuadros. ¿A quién le podía importar lo que había pasado hacía más de doscientos años?

Ese fin de semana tenía que quedarse en la casa de su abuela Elvira, que vivía en San Telmo, en una casa vieja con patio, aljibe y un altillo lleno de cajas. La abuela era historiadora jubilada y tenía la casa repleta de libros.

—¿Tenés tarea? —le preguntó mientras le servía chocolatada.

—Un trabajo sobre 1810 —gruñó Tomás—. Es un embole.

La abuela sonrió de una manera rara, como si supiera un secreto.

—En el altillo hay libros que te pueden servir. Buscá en la caja que dice "Mayo".

Tomás subió la escalera de madera, que crujía como un barco viejo. El altillo olía a polvo y a papel. Encontró la caja. Adentro había libros gastados, mapas doblados y, en el fondo, una mochila de cuero marrón, con hebillas de bronce y una inscripción grabada a mano: "Para quien quiera saber".

—Qué mochila rara —murmuró.

Se la colgó en la espalda para ver cómo le quedaba. En cuanto ajustó la segunda hebilla, sintió un tirón en el estómago, como cuando el ascensor baja de golpe. Todo empezó a girar: las cajas, los libros, la ventanita del altillo. Cerró los ojos.

Cuando los abrió, estaba parado en el medio de una calle de tierra.

Hacía frío y lloviznaba. Una carreta tirada por bueyes pasó a su lado, salpicándole barro en las zapatillas. Un hombre con poncho lo miró de arriba abajo, sorprendido por su ropa, y siguió caminando. Las casas eran bajas, blancas, con rejas en las ventanas. No había autos, ni semáforos, ni cables. A lo lejos sonaban las campanas de una iglesia.

En la pared de una esquina, alguien había pegado un papel escrito a mano. Tomás se acercó y leyó, con dificultad por la letra antigua, una fecha:

"Buenos Aires, 20 de mayo de 1810".

Tomás se quedó helado. Y no por el frío.`},{title:"Una ciudad de barro y velas",illustration:"ciudad",content:`—¡Eh, vos! ¡Correte, que te pisa el aguatero!

Una nena lo tiró del brazo justo a tiempo. Un carro con un barril enorme pasó por donde él estaba parado. El hombre que lo manejaba gritaba: "¡Agua! ¡Agua fresca del río!".

—Gracias —dijo Tomás, todavía asustado.

La nena tenía más o menos su edad, el pelo negro atado con un pañuelo y una canasta en el brazo. Lo miraba con curiosidad.

—Qué ropa más rara. ¿De dónde sos?

Tomás pensó rápido.

—De… muy lejos. Me llamo Tomás.

—Yo soy Pancha. Vendo pastelitos con mi mamá en la plaza. Vení, que te morís de frío.

Mientras caminaban, Tomás miraba todo con los ojos muy abiertos. Pancha le explicó que en la ciudad no había agua corriente: los aguateros la sacaban del río y la vendían casa por casa. De noche, las calles casi no tenían luz, así que mucha gente iba con faroles. Había vendedores de todo: el velero, que vendía velas de sebo; el lechero, que llegaba a caballo con los tarros colgando; la mazamorrera, que gritaba "¡Mazamorra caliente!".

—En Buenos Aires vivimos como cuarenta mil personas —dijo Pancha con orgullo—. Es una ciudad grande.

Tomás pensó en los millones de personas que vivían en su Buenos Aires y no dijo nada.

Llegaron a una plaza enorme, de tierra, rodeada de edificios. En uno de los lados había un edificio blanco con muchos arcos y una torre en el medio.

—¡El Cabildo! —exclamó Tomás.

Lo reconoció por las fotos del manual. Pero era distinto: más largo, con más arcos a los costados. Pancha lo miró extrañada.

—Claro que es el Cabildo. Ahí se reúnen los vecinos importantes para decidir cosas de la ciudad.

En la plaza había mucha gente, más de la normal. Hablaban en grupos, en voz baja, con caras preocupadas. Pancha bajó la voz.

—Dicen que en España las cosas están muy mal. Que los franceses de Napoleón tomaron el país y que el rey está preso. Y si no hay rey, la gente se pregunta: ¿por qué tenemos que seguir obedeciendo al virrey Cisneros, que manda acá en nombre del rey?

Tomás se acordó de algo que había leído a las apuradas en el manual. Las noticias de España habían llegado en barco, y eso había hecho que muchos criollos pensaran que era el momento de gobernarse a sí mismos.

—¿Y qué va a pasar? —preguntó.

—Nadie sabe —dijo Pancha—. Pero algo va a pasar. Se siente en el aire.`},{title:"El pueblo quiere saber",illustration:"cabildo",content:`Los días siguientes, Tomás se quedó en la casa de Pancha y su mamá, Doña Rufina, que lo recibieron sin hacer muchas preguntas. "Un chico perdido es un chico perdido", decía Doña Rufina. Tomás las ayudaba a hornear pastelitos de membrillo y a venderlos en la plaza. Así fue como vio la historia con sus propios ojos.

El 22 de mayo, el Cabildo convocó a un Cabildo Abierto: una reunión de los vecinos más importantes de la ciudad para discutir si el virrey debía seguir gobernando. Pancha y Tomás no podían entrar, porque sólo invitaban a algunos vecinos, pero esperaron afuera con mucha otra gente.

La discusión duró horas. Algunos decían que, aunque el rey estuviera preso, el virrey debía seguir en su puesto. Otros, que si el rey no estaba, el poder volvía al pueblo, y que el pueblo tenía derecho a elegir su propio gobierno.

—Ganaron los que quieren sacar al virrey —le contó un muchacho a Pancha, a la salida—. Pero todavía no se sabe qué va a pasar.

El 24, se enteraron de algo que enojó a muchos: el Cabildo había armado una junta de gobierno… ¡y el presidente era el mismo virrey Cisneros!

—¡Eso es una trampa! —gritó alguien en la plaza—. ¡Cambian todo para que no cambie nada!

La mañana del 25 de mayo amaneció fría y nublada. La plaza se llenó de gente desde temprano. Había criollos, comerciantes, soldados, vendedores, chicos como ellos. Tomás vio a unos jóvenes que repartían cintas para que la gente se las pusiera en el pecho.

—Son los chisperos —le explicó Pancha—. Esos son French y Beruti. Organizan a la gente.

Desde la multitud, alguien gritó una frase que Tomás conocía desde el jardín:

—¡El pueblo quiere saber de qué se trata!

Y muchas voces repitieron: "¡Queremos saber!". Golpeaban las puertas del Cabildo. Pedían que el virrey renunciara.

Pasaron horas de nervios. Hasta que, por fin, se supo la noticia: el virrey Cisneros renunciaba y se formaba una nueva junta de gobierno, la Primera Junta. El presidente sería Cornelio Saavedra. Los secretarios, Mariano Moreno y Juan José Paso. Y entre los vocales estaban Manuel Belgrano y Juan José Castelli.

La plaza estalló en gritos de alegría. Pancha abrazó a Tomás y le puso una de las cintas en la mano.

—¡Guardala! —le dijo—. Para que te acuerdes de este día.

Tomás apretó la cinta. Recién en ese momento entendió algo: los que estaban en la plaza no sabían cómo iba a terminar todo. No sabían que, años después, iban a celebrar ese día con actos escolares y escarapelas. Para ellos, era un día de miedo, de discusiones y de esperanza.

Y él, sin querer, estaba en el medio de la historia.`},{title:"De vuelta con una cinta",illustration:"escuela",content:`Esa noche, en la casa de Pancha, Tomás no podía dormir. Se acordó de la mochila, que había dejado colgada en un clavo. Se levantó, la descolgó y vio que, del lado de adentro, había algo escrito que antes no estaba: "Ya sabés. Ahora contalo".

Se despidió de Pancha en voz baja, aunque ella dormía.

—Gracias por todo. No me voy a olvidar.

Se colgó la mochila y ajustó las hebillas. Sintió el tirón en el estómago, el giro, el mareo. Y cuando abrió los ojos estaba otra vez en el altillo de la abuela Elvira, con la luz de la tarde entrando por la ventanita. En el reloj de su celular habían pasado apenas cinco minutos.

En su mano tenía la cinta.

Bajó corriendo la escalera.

—¡Abuela! ¡Estuve en 1810! ¡Vi el Cabildo, y a French y a Beruti, y conocí a una chica que vendía pastelitos!

La abuela Elvira dejó la taza de té y lo miró en silencio, durante un largo rato. Después, sonrió.

—Entonces ya tenés material para tu trabajo.

Tomás pasó todo el fin de semana escribiendo. Pero no escribió sólo fechas y nombres. Escribió sobre los aguateros y las veleras, sobre el barro de las calles, sobre el frío de esa mañana y sobre los nervios de la gente en la plaza. Escribió que la historia la hicieron personas que no sabían cómo iba a terminar.

El lunes, cuando terminó de leer su trabajo frente a la clase, sus compañeros aplaudieron. La seño Marta estaba sorprendida.

—Tomás, está muy bien. Pero tengo una pregunta: ¿cómo sabés que ese día la gente usaba cintas? ¿Y de qué color eran?

Tomás dudó. Las había visto, pero no podía decir eso.

—Bueno… lo leí en libros de mi abuela.

—Muy bien —dijo la seño—. Porque eso es algo que los historiadores todavía investigan. Hay muchos relatos distintos. Algunos dicen que las cintas eran celestes y blancas; otros, que tenían otros colores. Hasta se discute si ese día la gente llevaba paraguas. La historia no es una lista de respuestas: es una investigación que nunca termina. Los historiadores buscan documentos, cartas y diarios de la época, y los comparan para acercarse a la verdad.

Tomás sonrió. Ahora la historia le parecía un misterio. Y a él le encantaban los misterios.

Esa tarde volvió a la casa de la abuela. Subió al altillo y abrió la mochila para guardar la cinta. Adentro había un papelito nuevo, escrito con la misma letra antigua:

"Próximo viaje: Tucumán, 9 de julio de 1816".

Tomás miró las hebillas de bronce. Y, por primera vez en su vida, tuvo ganas de que llegara la próxima clase de historia.`}],quiz:[{question:"¿Qué decía la inscripción de la mochila?",options:["Viajes en el tiempo","Para quien quiera saber","Propiedad de la abuela","No abrir"],correct:1,explanation:'La mochila tenía grabada la frase "Para quien quiera saber".'},{question:"¿Cómo conseguía agua la gente de Buenos Aires en 1810?",options:["De las canillas","Se la compraban a los aguateros, que la sacaban del río","De la lluvia solamente","La traían de España"],correct:1,explanation:"No había agua corriente: los aguateros la vendían casa por casa."},{question:"¿Por qué mucha gente quería que el virrey dejara de gobernar?",options:["Porque era muy joven","Porque el rey de España estaba preso por Napoleón","Porque se había ido de viaje","Porque no sabía leer"],correct:1,explanation:"Sin rey, muchos criollos pensaban que el poder volvía al pueblo."},{question:"¿Quién fue el presidente de la Primera Junta?",options:["Manuel Belgrano","Mariano Moreno","Cornelio Saavedra","José de San Martín"],correct:2,explanation:"Cornelio Saavedra presidió la Primera Junta formada el 25 de mayo de 1810."},{question:"¿Qué aprendió Tomás sobre la historia?",options:["Que es una lista de fechas para memorizar","Que es una investigación que nunca termina","Que no sirve para nada","Que todo lo que se cuenta es inventado"],correct:1,explanation:"Los historiadores comparan documentos para acercarse a la verdad."}]},{id:9,slug:"cuentos-para-leer-con-la-luz-encendida",title:"Cuentos para leer con la luz encendida",author:"Ignacio Vidal Sáenz",synopsis:"Un espejo que tarda un segundo de más en devolver el reflejo. Un ascensor que se detiene en un piso que no existe. Algo que respira debajo del muelle. Una foto escolar con un alumno de más. Cuatro relatos de terror y suspenso para quienes se animan… con la luz encendida.",genres:["Terror","Suspenso","Cuento"],gradeMin:6,gradeMax:7,section:3,cover:{scene:"casona",c1:"#2d1b3d",c2:"#5c3c6e"},status:"published",featured:!0,license:"Obra original creada para la Biblioteca Digital Escolar",createdBy:null,createdAt:"2026-10-03 00:00:00",updatedAt:"2026-10-03 00:00:00",chapters:[{title:"El espejo del abuelo",illustration:"casona",content:`Cuando el abuelo Ernesto murió, a mi mamá le tocó vaciar su casa. Había muebles, cuadros, cajas llenas de cartas y un espejo grande, de marco dorado, que estaba en el pasillo desde que yo tenía memoria. Mamá quería venderlo, pero yo le pedí quedármelo. No sé por qué. Algo en ese espejo me llamaba.

Lo colgamos en mi cuarto, frente a la cama.

La primera noche no pasó nada. La segunda, tampoco. La tercera, mientras me lavaba los dientes con el cepillo en la boca y me miraba distraída en el espejo, noté algo extraño. Levanté la mano para acomodarme el pelo y mi reflejo la levantó un instante después. No mucho: medio segundo, quizás menos. Como cuando en una videollamada la imagen se retrasa.

Me quedé quieta. Moví la mano otra vez, rápido. El reflejo la movió… un poquito tarde.

"Estoy cansada", pensé. Y me fui a dormir.

Pero la cosa empeoró. Cada noche, el retraso era un poco mayor. Al quinto día, yo pestañeaba y mi reflejo seguía con los ojos abiertos durante un segundo entero, mirándome. Al séptimo, me di vuelta para apagar la luz y, por el rabillo del ojo, vi que mi reflejo no se daba vuelta. Se quedaba quieto, de frente, como esperando.

No le conté a nadie. ¿Quién me iba a creer?

La noche del décimo día, me desperté a las tres de la mañana con frío. Mi cuarto estaba helado, aunque era verano. El espejo estaba empañado, como si alguien hubiera respirado muy cerca del vidrio. Y sobre esa niebla, con letras torcidas, escritas desde adentro, había una palabra:

"AYUDAME".

Grité. Mamá vino corriendo, prendió la luz y miró el espejo. No había nada. Ni niebla, ni letras. Sólo mi reflejo, pálido y despeinado, que me devolvía la mirada con un segundo de retraso.

Al día siguiente, mientras mamá trabajaba, fui al depósito donde guardaba las cajas del abuelo. Busqué durante horas. En una caja de zapatos, entre cartas viejas, encontré una foto en blanco y negro. Era el espejo, en el pasillo de la casa del abuelo, mucho tiempo atrás. Frente a él, una nena de mi edad sonreía a la cámara.

Lo extraño era el reflejo. En la foto, la nena sonreía. Pero en el espejo, su reflejo no sonreía. Tenía las manos apoyadas contra el vidrio, del lado de adentro, como si golpeara para salir.

Detrás de la foto, con la letra prolija del abuelo, decía: "Mi hermana Clarita, 1958. La última foto antes de que se fuera".

Mamá nunca me había dicho que el abuelo tuvo una hermana.

Esa noche no dormí en mi cuarto. Cubrí el espejo con una sábana y me acosté en el sillón del living. A las tres de la mañana, me desperté otra vez con frío. Desde mi cuarto llegaba un sonido suave, rítmico, paciente.

Toc. Toc. Toc.

Alguien golpeaba el vidrio. Desde adentro.

Al día siguiente, le pedí a mamá que vendiera el espejo. No le expliqué por qué y, por suerte, ella no preguntó. Vinieron a buscarlo dos hombres de una casa de antigüedades. Lo envolvieron en mantas y se lo llevaron en una camioneta.

Desde entonces, duermo tranquila. Casi siempre.
