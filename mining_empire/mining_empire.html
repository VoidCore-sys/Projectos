<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--A-->
<title>Mining Empire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: lantern-lit mine viewport on the left, a riveted command console with tabs on the right; stacks vertically on phones */
:root{
  --bg:#110d12; --bg2:#18121a; --panel:#1e1721; --panel2:#281f2c; --panel3:#33283a;
  --line:#3e3045; --line2:#5a4762; --ink:#f2e8d7; --dim:#ab9ba5; --mute:#716272;
  --gold:#f4b43c; --gold2:#ffd977; --goldD:#8f5c12; --good:#7ad66e; --bad:#ff6a5c;
  --rare:#bb8fff; --cyan:#67dcea; --shadow:#07050a;
  --fd:'Pixelify Sans',ui-monospace,'Courier New',monospace;
  --fn:'VT323',ui-monospace,'Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fd);font-size:15px;line-height:1.3;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(ellipse at 30% 0%,#2a1a24 0%,transparent 60%);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px}
/* top bar */
#top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 2px 0 #ffffff10,inset 0 -3px 0 #00000060;padding:6px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.08em;color:var(--gold2);font-size:18px;margin-right:6px;white-space:nowrap}
.brand img{width:26px;height:26px}
.stat{display:flex;align-items:center;gap:6px;background:var(--bg2);border:2px solid var(--line);padding:2px 8px;min-width:0}
.stat img{width:20px;height:20px}
.stat b{font-family:var(--fn);font-size:24px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.stat small{color:var(--dim);font-family:var(--fn);font-size:17px}
.stat.money b{color:var(--gold2)}
.stat.sh b{color:var(--rare)}
#boostChip{background:#3a1f4a;border-color:var(--rare);color:var(--rare)}
.topbtns{margin-left:auto;display:flex;gap:6px}
.ibtn{background:var(--panel2);border:2px solid var(--line2);padding:4px 6px;cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 -3px 0 #00000070}
.ibtn:hover{background:var(--panel3)} .ibtn img{width:20px;height:20px}
/* main */
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(350px,1fr);gap:10px}
#minePane{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
#sceneWrap{flex:1;min-height:220px;position:relative;background:#050307;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 2px #000}
#scene{display:block;image-rendering:pixelated;touch-action:none;cursor:pointer}
#sceneWrap.fade::after{content:"";position:absolute;inset:0;background:#000;animation:fadeout .6s forwards;pointer-events:none}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.hud{position:absolute;pointer-events:none;font-size:13px;text-shadow:0 2px 0 #000,0 0 4px #000}
#hudTL{left:8px;top:8px;display:flex;flex-direction:column;gap:3px;min-width:150px}
#hudTL b{font-size:16px;color:var(--gold2);letter-spacing:.04em}
.xbar{height:6px;background:#000a;border:1px solid #fff3;width:150px;position:relative}
.xbar i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan)}
#hudTR{right:8px;top:8px;display:flex;gap:6px;pointer-events:auto}
#hudB{left:50%;transform:translateX(-50%);bottom:6px;white-space:nowrap;color:var(--ink);background:#000a;padding:2px 8px;font-size:17px}
#hint{left:50%;top:22%;transform:translate(-50%,-50%);font-size:18px;color:var(--gold2);animation:bob 1.2s ease-in-out infinite alternate;background:#000b;padding:4px 10px;border:2px solid var(--goldD)}
@keyframes bob{to{transform:translate(-50%,-62%)}}
.chipbtn{background:#000b;border:2px solid var(--line2);color:var(--ink);padding:2px 8px;cursor:pointer;font-size:12px}
.chipbtn.on{border-color:var(--good);color:var(--good)}
#oreStrip{display:flex;gap:4px;align-items:stretch;background:var(--panel);border:2px solid var(--line);padding:5px;overflow-x:auto;min-height:44px;scrollbar-width:thin}
.och{display:flex;align-items:center;gap:4px;background:var(--bg2);border:2px solid var(--line);padding:1px 6px 1px 3px;cursor:pointer;white-space:nowrap;font-family:var(--fn);font-size:19px}
.och img{width:22px;height:22px}
.och.full{border-color:var(--bad);color:var(--bad)}
.och:hover{border-color:var(--gold)}
#stripSell{margin-left:auto;flex:none}
/* side */
#sidePane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:2px solid var(--line);box-shadow:inset 0 2px 0 #ffffff0d}
#tabs{display:flex;overflow-x:auto;background:var(--bg2);border-bottom:2px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 7px 4px;background:none;border:0;border-right:2px solid var(--line);cursor:pointer;color:var(--dim);font-size:11px;position:relative;min-width:56px}
.tab img{width:22px;height:22px;opacity:.75}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab.on{background:var(--panel);color:var(--gold2);box-shadow:inset 0 -3px 0 var(--gold)}
.tab.on img{opacity:1}
.tab .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;background:var(--good);box-shadow:0 0 0 2px var(--bg2)}
.tab.lock{opacity:.45}
#panel{flex:1;overflow:auto;padding:12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
#panel.anim>*{animation:slidein .22s ease-out}
@keyframes slidein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
h2{margin:0;font-size:22px;color:var(--gold2);letter-spacing:.03em;text-wrap:balance}
h3{margin:14px 0 6px;font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em;font-weight:500}
.sub{color:var(--dim);font-size:13px}
.card{background:var(--panel2);border:2px solid var(--line);padding:8px;box-shadow:inset 0 2px 0 #ffffff0a,inset 0 -3px 0 #00000050}
.card.hl{border-color:var(--goldD);background:linear-gradient(#33241a,var(--panel2))}
.list{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.it{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.it .ic{width:36px;height:36px;background:var(--bg2);border:2px solid var(--line);display:grid;place-items:center}
.it .ic img{width:28px;height:28px}
.it .ic.lg{width:48px;height:48px}.it .ic.lg img{width:40px;height:40px}
.nm{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ds{color:var(--dim);font-size:12.5px;overflow-wrap:anywhere}
.ds b{color:var(--ink);font-weight:400}
b.n,.ds b,.toast b,#modal p b,.node span,.kv span,.req,.tag+.n,#hudB,#hDepth,#hExpT{font-family:var(--fn);font-size:1.22em;line-height:1}
.req{font-size:17px}
.n{font-family:var(--fn);font-size:19px;font-variant-numeric:tabular-nums;line-height:1}
.big{font-family:var(--fn);font-size:30px;color:var(--gold2);line-height:1}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tag{display:inline-block;font-size:10px;padding:0 4px;border:1px solid currentColor;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle;margin-left:4px}
.r-Common{color:#b9b2a6}.r-Uncommon{color:#7ad66e}.r-Rare{color:#5fb0ff}.r-Epic{color:#c48cff}.r-Legendary{color:#ffb84a}.r-Mythic{color:#ff6ad0}
.btn{background:var(--panel3);border:2px solid var(--line2);padding:5px 10px;cursor:pointer;box-shadow:inset 0 -3px 0 #00000080;white-space:nowrap;font-size:13.5px;min-height:32px}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -1px 0 #00000080}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gold{background:#7a4c10;border-color:var(--gold);color:var(--gold2)}
.btn.ok{background:#2e5a22;border-color:var(--good);color:#d8ffd0}
.btn.bad{background:#5a1e1a;border-color:var(--bad);color:#ffd6d0}
.btn.rare{background:#3f2560;border-color:var(--rare);color:#eadcff}
.btn.sm{padding:2px 7px;font-size:12px;min-height:26px}
.btn:focus-visible,.tab:focus-visible,.ibtn:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .2s}
.bar.g i{background:var(--good)}.bar.c i{background:var(--cyan)}.bar.r i{background:var(--rare)}
.bar.full i{background:var(--bad)}
.seg{display:inline-flex;border:2px solid var(--line2)}
.seg button{background:var(--bg2);border:0;padding:3px 9px;cursor:pointer;color:var(--dim);font-size:12.5px}
.seg button.on{background:var(--gold);color:#2a1800}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.good{color:var(--good)}.bad{color:var(--bad)}.goldc{color:var(--gold2)}.rarec{color:var(--rare)}.dimc{color:var(--dim)}
.req{display:inline-flex;align-items:center;gap:3px;margin-right:8px;white-space:nowrap}
.req img{width:16px;height:16px}
.locked{opacity:.55}
.reg{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
.reg .thumb{width:96px;height:60px;border:2px solid var(--line);object-fit:cover;image-rendering:pixelated}
.reg.cur{border-color:var(--gold)}
.reg.lockd .thumb{filter:grayscale(1) brightness(.4)}
.minis{display:flex;gap:2px;flex-wrap:wrap;margin:3px 0}
.minis img{width:18px;height:18px}
.tree{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:92px;gap:8px;margin-top:6px}
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;z-index:1;background:var(--panel2);border:2px solid var(--line2);padding:4px;font-size:11px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px;justify-content:center;align-items:center;box-shadow:inset 0 -3px 0 #0007;overflow:hidden}
.node b{font-size:11.5px;color:var(--ink)}
.node.own{border-color:var(--rare);background:#35204f}
.node.can{border-color:var(--gold);animation:pulse 1.4s infinite}
.node.no{opacity:.5;cursor:default}
@keyframes pulse{50%{box-shadow:0 0 0 2px #f4b43c55,inset 0 -3px 0 #0007}}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bk{background:var(--panel2);border:2px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center}
.bk img{width:40px;height:40px}
.bk.unk img{filter:brightness(0) opacity(.5)}
.stars{color:var(--gold);letter-spacing:2px;font-size:12px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.ac{display:flex;gap:8px;align-items:center;background:var(--panel2);border:2px solid var(--line);padding:6px}
.ac.got{border-color:var(--goldD);background:#30251a}
.ac img{width:28px;height:28px}.ac:not(.got) img{filter:grayscale(1) brightness(.5)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.kv span:nth-child(odd){color:var(--dim)}
.kv span:nth-child(even){font-family:var(--fn);font-size:19px;text-align:right}
/* overlays */
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:6px;z-index:40;pointer-events:none;width:min(320px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:2px solid var(--line2);padding:7px 10px;display:flex;gap:8px;align-items:center;animation:tin .25s ease-out;box-shadow:0 4px 0 #0008;font-size:13.5px}
.toast img{width:28px;height:28px;flex:none}
.toast.rare{border-color:var(--rare)}.toast.gold{border-color:var(--gold)}.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
#modal .box{background:var(--panel);border:2px solid var(--gold);box-shadow:0 0 0 4px #000,0 10px 0 #000a;max-width:520px;width:100%;max-height:calc(100% - 20px);overflow:auto;padding:16px;animation:pop .2s ease-out}
#modal h2{margin-bottom:8px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#tip{position:fixed;z-index:60;background:#0d0a10;border:2px solid var(--line2);padding:6px 8px;font-size:12.5px;max-width:260px;pointer-events:none;color:var(--ink)}
.setrow{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:8px;align-items:center;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--gold)}
textarea{width:100%;height:90px;background:var(--bg);color:var(--ink);border:2px solid var(--line2);font-family:monospace;font-size:11px}
ul.plain{margin:6px 0;padding-left:18px}ul.plain li{margin:2px 0}
@media (max-width:880px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  #main{display:flex;flex-direction:column}
  #sceneWrap{flex:none;height:auto;aspect-ratio:16/9;min-height:0}
  #hudTL{font-size:11px;left:4px;top:4px;min-width:0}#hudTL b{font-size:13px}#hExpT,.xbar{display:none}
  #hudTR{top:4px;right:4px}#hint{font-size:14px;top:30%}
  #sidePane{height:72vh;min-height:380px;flex:none}
  .brand span{display:none}
  .stat b{font-size:21px}
  #hudB{font-size:14px!important}
  .tree{grid-auto-rows:84px;gap:4px}
  .node{font-size:10px}
  #toasts{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);position:fixed}
  .toast{font-size:12px;padding:5px 8px}.toast img{width:22px;height:22px}
  .toast:nth-last-child(n+3){display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!--/A-->
</head>
<body>
<!--B-->
<div id="app">
  <header id="top">
    <div class="brand"><img class="px" id="brandIco" alt=""><span>MINING EMPIRE</span></div>
    <div class="stat money" data-tip="Cash on hand. Income shows automated earnings per second."><img class="px" data-ico="coin" alt=""><b id="tMoney">0</b><small id="tInc"></small></div>
    <div class="stat sh" data-tip="Core Shards earned from Prestige. Each shard ever earned boosts everything."><img class="px" data-ico="shard" alt=""><b id="tShards">0</b></div>
    <div class="stat" data-tip="Current depth / deepest point reached"><img class="px" data-ico="depth" alt=""><b id="tDepth">0m</b></div>
    <div class="stat" data-tip="Automated ore production per second"><img class="px" data-ico="gear" alt=""><b id="tOps">0</b><small>ore/s</small></div>
    <div class="stat" id="boostChip" hidden data-tip="Production boost from missions"><b id="tBoost">2x</b></div>
    <div class="topbtns">
      <button class="ibtn" id="btnMute" aria-label="Toggle sound" data-tip="Sound on/off"><img class="px" data-ico="sound" alt=""></button>
      <button class="ibtn" id="btnSet" aria-label="Settings" data-tip="Settings, save and load"><img class="px" data-ico="cog" alt=""></button>
    </div>
  </header>
  <main id="main">
    <section id="minePane">
      <div id="sceneWrap">
        <canvas id="scene" aria-label="Mine. Click or tap rocks to mine them."></canvas>
        <div class="hud" id="hudTL"><b id="hRegion">Surface Mine</b><span id="hDepth">Depth 0m</span><div class="xbar" data-tip="Exploration of this region"><i id="hExp"></i></div><span id="hExpT" class="dimc"></span></div>
        <div class="hud" id="hudTR"><button class="chipbtn" id="autoBtn" hidden>AUTO-PICK</button></div>
        <div class="hud" id="hudB"></div>
        <div class="hud" id="hint" hidden>Tap the rocks to mine!</div>
      </div>
      <div id="oreStrip"></div>
    </section>
    <section id="sidePane">
      <nav id="tabs" role="tablist"></nav>
      <div id="panel"></div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<div id="modal" hidden></div>
<div id="tip" hidden></div>
<script>
'use strict';
(function(){
/* =========================================================================
   UTIL
   ========================================================================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const num=v=>(typeof v==='number'&&isFinite(v))?Math.max(-1e300,Math.min(v,1e300)):0;
const rnd=Math.random;
const pick=a=>a[(rnd()*a.length)|0];
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad','Qid','Sxd','Spd','Ocd','Nod','Vg','Uvg','Dvg','Tvg','Qavg','Qivg','Sxvg','Spvg','Ocvg','Novg','Tg','Utg','Dtg','Ttg','Qatg','Qitg','Sxtg','Sptg','Octg','Notg','Qag'];
function fmt(n,int){
  if(typeof n!=='number'||isNaN(n))return '0';
  if(!isFinite(n))return '∞';
  if(n<0)return '-'+fmt(-n,int);
  if(n<1000){
    if(int||n>=100||Math.abs(n-Math.round(n))<1e-9)return String(Math.floor(n+1e-9));
    return (n<10?n.toFixed(n<1?2:1):n.toFixed(1)).replace(/\.0+$/,'').replace(/(\.\d)0$/,'$1');
  }
  const e=Math.floor(Math.log10(n)/3);
  if((S&&S.set&&S.set.sci)||e>=SUF.length)return n.toExponential(2).replace('e+','e');
  const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+SUF[e];
}
function fmtT(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${x}s`:`${x}s`}
const costN=(b,g,l,n)=>b*Math.pow(g,l)*(Math.pow(g,n)-1)/(g-1);
function maxAff(b,g,l,money,cap){const c0=b*Math.pow(g,l);if(money<c0)return 0;let n=Math.floor(Math.log(money*(g-1)/c0+1)/Math.log(g));n=Math.max(0,Math.min(n,cap));while(n>0&&costN(b,g,l,n)>money)n--;return n}
function hash(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vn(x,y,s)*.55+vn(x*2.1,y*2.1,s+7)*.3+vn(x*4.3,y*4.3,s+13)*.15}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16-.5);
const hex2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* =========================================================================
   DATA
   ========================================================================= */

function merge(d,o){
  if(!o||typeof o!=='object'||Array.isArray(o))return d;
  const open=Object.keys(d).length===0;
  for(const k of Object.keys(o)){
    const v=o[k];
    if(k in d){const t=d[k];
      if(typeof t==='number'){const x=Number(v);d[k]=isFinite(x)?num(x):t}
      else if(typeof t==='boolean')d[k]=!!v;
      else if(typeof t==='string')d[k]=typeof v==='string'?v:t;
      else if(Array.isArray(t))d[k]=Array.isArray(v)?v:t;
      else if(t===null)d[k]=v;
      else if(typeof t==='object')d[k]=merge(t,v);
    }else if(open){d[k]=typeof v==='number'?num(v):v}
  }
  return d;
}

}

  for(const k in S.prods){if(!PB[k])delete S.prods[k];else S.prods[k]=Math.max(0,num(S.prods[k]))}
  for(const k in S.upg){if(!UB[k])delete S.upg[k];else S.upg[k]=clamp(S.upg[k]|0,0,UB[k].max)}
  for(const k in S.crew){if(!CB[k])delete S.crew[k];else S.crew[k]=Math.max(0,S.crew[k]|0)}
  for(const k in S.fac){const f=S.fac[k];if(!FB[k]||!f||typeof f!=='object'){delete S.fac[k];continue}f.lvl=Math.max(0,f.lvl|0);if(!FB[k].rec.includes(f.rec))f.rec=FB[k].rec[0];f.acc=num(f.acc)}
  if(!Array.isArray(S.mis.active))S.mis.active=[];
  S.mis.active=S.mis.active.filter(m=>m&&MT[m.type]);

function load(){
  const raw=store.get(KEY);

  try{const o=JSON.parse(raw);S=merge(fresh(),migrate(o));sanitize();return true}
  catch(e){
    store.set(KEY+'.corrupt',raw);

    try{if(bak){S=merge(fresh(),migrate(JSON.parse(bak)));sanitize();loadMsg='Your save was damaged. Restored the backup copy.';return true}}catch(e2){}

const C={val:{},share:{},dist:{},crewOps:{}};
const U=id=>S.upg[id]||0;
function stars(id){const b=S.book[id];if(!b)return 0;let n=0;for(const t of STAR)if(b.mined>=t)n++;return n}
function msMul(n){let m=1;for(const t of CREW_MS)if(n>=t)m*=1.5;return m}
function nextMs(n){for(const t of CREW_MS)if(n<t)return t;return 0}
function hpOf(mid,k){return 10*MB[mid].h*REG[k].hpm}
function explored(){let n=0;for(const r of REG)if((S.explore[r.id]||0)>=r.target)n++;return n}
function achCount(){return Object.keys(S.ach).length}
function calc(){
  const P=S.pupg,sr={};MIN.forEach(m=>sr[m.id]=stars(m.id));C.st=sr;
  C.shardRate=P.reson?.03:.02;
  C.Gp=(1+S.shardsTotal*C.shardRate)*(1+achCount()*.01+S.perm)*(P.heart?3:1)*(1+.05*explored())*(1+.05*sr.void);
  C.boost=S.boost>0?2:1;C.G=C.Gp*C.boost;
  const pk=PICK[S.pick];
  C.dmg=num(pk.p*Math.pow(1.15,U('power'))*(P.hands?2:1)*(1+.04*sr.iron)*(1+.06*sr.mythril)*C.G);
  C.cd=Math.max(.045,.3*Math.pow(.93,U('speed'))*pk.spd/(1+.02*sr.sapphire));
  C.critC=Math.min(.9,.04+.015*U('critc')+pk.crit+(P.lucky?.1:0)+.01*sr.diamond);
  C.critD=2+.3*U('critd')+.1*sr.ruby;
  C.valMul=num(Math.pow(1.08,U('value'))*(P.golden?1.5:1)*(1+.02*sr.silver));
  MIN.forEach(m=>C.val[m.id]=num(m.v*C.valMul*(1+.1*sr[m.id])));
  PROD.forEach(p=>C.val[p.id]=num(p.v*C.valMul));
  C.rareC=Math.min(.5,.03*(1+.12*U('rare'))*(P.geo?2:1)*(1+.04*sr.emerald));
  C.rareShift=.08*U('rare')+(P.geo?.5:0);
  C.offCap=(2+U('offline')+(P.night?12:0))*3600;
  C.offEff=Math.min(1,.4+.02*U('offline')+(P.night?.25:0)+.03*sr.ancient);
  C.cap=num(300*Math.pow(2,U('storage'))*(1+.1*sr.stone));
  C.wMul=num(Math.pow(1.08,U('weff'))*(P.crews?2:1)*(1+.03*sr.copper)*C.G);
  C.mMul=num(Math.pow(1.08,U('meff'))*(P.crews?2:1)*(1+.04*sr.platinum)*C.G);
  C.autoRate=U('auto')?(.5+.25*(U('auto')-1))*(1+.05*sr.uranium):0;
  C.facMul=(P.industry?1.5:1)*(1+.03*sr.coal);
  let ops=0;CREW.forEach(c=>{const n=S.crew[c.id]||0;const o=num(n*c.ops*msMul(n)*(c.t==='w'?C.wMul:C.mMul));C.crewOps[c.id]=o;ops+=o});C.ops=num(ops);
  // spawn distribution & production share in current region
  const R=REG[S.reg],ids=R.min.slice().sort((a,b)=>MB[a].v-MB[b].v);let tw=0;
  ids.forEach((id,i)=>{const f=ids.length>1?i/(ids.length-1):0;const w=R.w[id]*(1+C.rareShift*f);C.dist[id]=w;tw+=w});
  let pu=0;ids.forEach(id=>{C.dist[id]/=tw;pu+=C.dist[id]*MB[id].u});C.pu=pu;
  for(const k in C.share)delete C.share[k];
  let avg=0;ids.forEach(id=>{C.share[id]=C.dist[id]*MB[id].u/pu;avg+=C.share[id]*C.val[id]});C.avgVal=avg;
  C.incomePS=num(C.ops*avg);
  // manual estimate
  let mo=0;ids.forEach(id=>{mo+=C.dist[id]*MB[id].u*Math.min(1,C.dmg/hpOf(id,S.reg))});
  C.manualHitsPS=1/C.cd;C.manualOre=mo;
  C.manualIncome=num(mo*avg/pu*C.manualHitsPS*.5*(1+C.critC));
  C.incEst=Math.max(5,C.incomePS+C.manualIncome);
  C.oreTotalPS=C.ops+mo*C.manualHitsPS*.5;
  let cr=0;for(const k in S.fac){const f=S.fac[k];if(f.lvl>0&&f.on!==false)cr+=facRate(k)}C.craftPS=cr;
}
function facRate(id){const f=S.fac[id];if(!f||f.lvl<1)return 0;return FB[id].rate*Math.pow(1.5,f.lvl-1)*C.facMul*C.Gp}
function have(id){return MB[id]?(S.ores[id]||0):(S.prods[id]||0)}
function take(id,n){if(MB[id])S.ores[id]=Math.max(0,(S.ores[id]||0)-n);else S.prods[id]=Math.max(0,(S.prods[id]||0)-n)}
function hasReq(req,mult=1){for(const k in req)if(have(k)+1e-9<req[k]*mult)return false;return true}
function addMoney(v,sale){v=num(v);S.money=num(S.money+v);if(sale){S.stats.earned=num(S.stats.earned+v);S.run.earned=num(S.run.earned+v)}}
function spend(v){if(S.money+1e-6<v)return false;S.money=Math.max(0,S.money-v);return true}
function discover(id){
  if(S.book[id])return;S.book[id]={mined:0,rare:0,first:Date.now()};
  const m=MB[id];toast(`New mineral discovered: <b>${m.n}</b> <span class="tag r-${m.rar}">${m.rar}</span>`,['Rare','Epic','Legendary','Mythic'].includes(m.rar)?'rare':'gold','i:'+id);
  if(m.i>=5)AU.rare();dirty();

function gain(id,amt,src){
  if(!(amt>0))return 0;amt=num(amt);
  discover(id);
  S.stats.mined=num(S.stats.mined+amt);S.stats.minedBy[id]=num((S.stats.minedBy[id]||0)+amt);S.book[id].mined=num(S.book[id].mined+amt);

  return amt;
}
const fullFlag={};
function sellOre(id,n){n=Math.min(n,S.ores[id]||0);if(n<=0)return 0;const v=n*C.val[id];S.ores[id]-=n;if(S.ores[id]<1e-9)S.ores[id]=0;addMoney(v,true);return v}
function sellProd(id,n){n=Math.min(n,S.prods[id]||0);if(n<=0)return 0;const v=n*C.val[id];S.prods[id]-=n;addMoney(v,true);return v}
function oreWorth(){let v=0;for(const k in S.ores)v+=Math.floor(S.ores[k])*(C.val[k]||0);return v}
function prodWorth(){let v=0;for(const k in S.prods)v+=Math.floor(S.prods[k])*(C.val[k]||0);return v}
function sellAll(){let v=0;for(const k in S.ores)v+=sellOre(k,Math.floor(S.ores[k]));return v}

function hitSlot(i,manual){

function updDepth(){const r=REG[S.reg],p=Math.min(1,(S.explore[r.id]||0)/r.target),dep=r.d[0]+(r.d[1]-r.d[0])*p;C.depth=dep;if(dep>S.stats.maxDepth)S.stats.maxDepth=dep}

const FX={parts:[],floats:[],shake:0,swing:null,
  burst(x,y,n,pal,big,pal2){n=Math.round(n*[.4,1,1.6][S.set.parts]);const cp=COSPAL[S.cos];for(let i=0;i<n;i++){if(this.parts.length>420)this.parts.shift();const a=rnd()*6.283,sp=(big?60:35)*(.4+rnd());const cols=cp&&rnd()<.5?cp:(pal2&&rnd()<.4?pal2:pal);this.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40*rnd()-20,l:.5+rnd()*.5,ml:1,c:cols[1+((rnd()*(cols.length-1))|0)]||cols[0],s:rnd()<.3?2:1,g:180})}},

/* =========================================================================
   AUTOMATION / FACTORY / LOGIC TICK
   ========================================================================= */
let autoAcc=0,autoFloatT=0,sellTick=0;
function logic(dt,off){
  const mul=off?C.offEff:1;
  if(C.ops>0){const tot=C.ops*dt*mul;for(const id in C.share)gain(id,tot*C.share[id],'auto');const r=REG[S.reg];S.explore[r.id]=(S.explore[r.id]||0)+tot/C.pu*.02}
  if(!off&&C.autoRate>0&&S.autoMine){autoAcc+=dt*C.autoRate;let g=0;while(autoAcc>=1&&g++<20){autoAcc-=1;autoHit()}}
  for(const k in S.fac){const f=S.fac[k];if(!(f.lvl>0)||f.on===false)continue;const p=PB[f.rec];if(!p)continue;
    f.acc=(f.acc||0)+facRate(k)*dt*mul;let n=Math.floor(f.acc);if(n<1)continue;
    let can=Infinity;for(const i in p.inp)can=Math.min(can,Math.floor(have(i)/p.inp[i]+1e-9));
    n=Math.min(n,can);if(n<=0){f.acc=Math.min(f.acc,1);f.starved=true;continue}f.starved=false;
    for(const i in p.inp)take(i,p.inp[i]*n);S.prods[p.id]=(S.prods[p.id]||0)+n;f.acc-=n;S.stats.crafted+=n;S.pbook[p.id]=(S.pbook[p.id]||0)+n;
    if((S.pbook[p.id]||0)===n){toast(`First <b>${p.n}</b> produced!`,'gold','i:'+p.id);dirty()}}
  sellTick+=dt;if(sellTick>=.5){sellTick=0;if(S.autoSell&&S.broker){for(const k in S.ores){const keep=C.cap*S.keep;if(S.ores[k]>keep)sellOre(k,S.ores[k]-keep)}}}
  S.boost=Math.max(0,S.boost-dt);
  if(!off)S.stats.playTime+=dt;
  if(S.run.earned>S.stats.bestRun)S.stats.bestRun=S.run.earned;
  updDepth();
}
function simulate(sec,off){
  const steps=Math.min(400,Math.max(1,Math.ceil(sec/2))),dt=sec/steps;
  for(let i=0;i<steps;i++){calc();logic(dt,off)}calc();
}

    case 'mine':target=Math.ceil(ore*k);break;
    case 'mineM':{key=pick(REG[S.reg].min.filter(id=>C.share[id]>.04));target=Math.ceil(Math.max(15,ore*(C.share[key]||.2))*k);break}

}

  facBuild(d){const f=FB[d.id],cur=S.fac[f.id];const lvl=cur?cur.lvl:0;const cost=f.cost*Math.pow(3.2,lvl);if(!spend(cost)){AU.err();return}if(!cur)S.fac[f.id]={lvl:1,rec:f.rec[0],on:true,acc:0};else cur.lvl++;AU.buy();if(!lvl)toast(`${f.n} built!`,'good','f:'+f.id);calc();dirty()},

   ========================================================================= */
function presReq(){return 1e13*Math.pow(4,Math.min(S.stats.prestiges,60))}
function presGain(){return Math.floor(3*Math.cbrt(S.run.earned/1e12))}
function canPrestige(){return S.run.earned>=presReq()&&presGain()>0}
function prestigeConfirm(){
  if(!canPrestige()){AU.err();return}
  modal('Prestige: Collapse the Mine',`<p>You will gain <b class="rarec">${fmt(presGain())} Core Shards</b>. Every shard you ever earn adds <b>+${Math.round(C.shardRate*100)}%</b> to all production and damage, even after you spend it on perks.</p>
   <div class="grid2"><div class="card"><div class="lbl bad">Reset</div><ul class="plain"><li>Money, ores and products</li><li>Pickaxe, upgrades, crew and machines</li><li>Factories and unlocked regions</li><li>Exploration and current missions</li></ul></div>
   <div class="card"><div class="lbl good">Kept forever</div><ul class="plain"><li>Core Shards and prestige perks</li><li>Achievements and their bonuses</li><li>Collection book and mineral mastery</li><li>Milestones, statistics, cosmetics, settings</li></ul></div></div>`,
   [{l:'Cancel'},{l:'Collapse and prestige',c:'rare',f:doPrestige}]);
}
function doPrestige(){
  const g=presGain();const keep=['shards','shardsTotal','pupg','ach','book','pbook','perm','cos','cosUnl','stats','set','created','mis'];
  const old=S,n=fresh();keep.forEach(k=>n[k]=old[k]);n.shards+=g;n.shardsTotal+=g;n.stats.prestiges++;n.mis.active=[];
  const P=n.pupg;if(P.quick){n.money=5000;n.crew.basic=5}if(P.deep){n.maxReg=2}if(P.keeppick){n.pick=Math.min(old.pick,3)}if(P.broker){n.broker=true;n.autoSell=old.autoSell}
  if(P.industry){for(const k in old.fac)if(old.fac[k].lvl>0)n.fac[k]={lvl:1,rec:old.fac[k].rec,on:true,acc:0}}
  S=n;respawnAll();ensureMissions();calc();save();AU.ach();
  toast(`The mine collapses... and rises again. +${fmt(g)} Core Shards!`,'rare','shard');S.set.tab='pres';dirty(true);
}

/* =========================================================================
   ACHIEVEMENTS / MILESTONES
   ========================================================================= */
function checkAch(){
  for(const a of ACH){if(S.ach[a.id])continue;let ok=false;try{ok=a.chk()}catch(e){}if(!ok)continue;S.ach[a.id]=Date.now();
    let rw=[];if(a.r.m){addMoney(a.r.m);rw.push('$'+fmt(a.r.m))}if(a.r.p){S.perm+=a.r.p;rw.push('+'+Math.round(a.r.p*100)+'% production')}if(a.r.c){S.cosUnl[a.r.c]=true;rw.push('cosmetic: '+COS[a.r.c])}
    rw.push('+1% all');toast(`Achievement: <b>${a.n}</b><br><span class="dimc">${rw.join(' · ')}</span>`,'gold',a.ic);AU.ach();dirty()}
  const ms=MS[S.mis.ms];if(ms&&ms.chk()){S.mis.ms++;calc();const m=Math.max(ms.m,Math.ceil(C.incEst*120));addMoney(m);if(ms.p)S.perm+=ms.p;toast(`Milestone reached: <b>${ms.d}</b><br><span class="dimc">+$${fmt(m)}${ms.p?` · +${Math.round(ms.p*100)}% production`:''}</span>`,'gold','star');AU.ach();dirty()}
}

let binds=[],gbinds=[],bseq=0,needBuild=true,animNext=false;
function B(fn){const id='b'+(bseq++);binds.push({id,fn,el:null,last:null});return id}

function runBinds(list){for(const b of list){if(!b.el)continue;let r;try{r=b.fn()}catch(e){continue}
  if(typeof r!=='object'||r===null){r=String(r);if(b.last!==r){b.el.textContent=r;b.last=r}continue}
  if(r.t!==undefined&&r.t!==b.last){b.el.textContent=r.t;b.last=r.t}
  if(r.d!==undefined)b.el.disabled=!!r.d;if(r.w!==undefined)b.el.style.width=clamp(r.w,0,100)+'%';
  if(r.c)for(const k in r.c)b.el.classList.toggle(k,!!r.c[k]);if(r.x!==undefined)b.el.hidden=!!r.x}}

function toast(html,cls='',ic){if(QUIET)return;const t=document.createElement('div');t.className='toast '+cls;t.innerHTML=(ic?img(ic):'')+`<div>${html}</div>`;const box=$('#toasts');box.appendChild(t);while(box.children.length>5)box.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},3800)}

function buildTabs(){$('#tabs').innerHTML=TABS.map(([id,n,ic])=>`<button class="tab" role="tab" data-act="tab" data-id="${id}" id="tab-${id}">${img(ic)}<span>${n}</span><i class="dot" hidden></i></button>`).join('')}

  const dots={mis:S.mis.active.concat(S.mis.daily?S.mis.daily.list:[]).some(m=>!m.claimed&&misProg(m)>=1),

  can.forEach(id=>{const el=$('#tab-'+id);if(!el)return;el.classList.toggle('on',S.set.tab===id);el.querySelector('.dot').hidden=!dots[id];el.classList.toggle('lock',id==='fac'&&S.maxReg<1)})}

   <div class="row wrap" style="margin:6px 0"><button class="btn ok sm" id="sSave">Save now</button><button class="btn sm" id="sExp">Export</button><button class="btn sm" id="sImp">Import</button><button class="btn bad sm" id="sReset">Reset game</button></div>
   <textarea id="sTxt" placeholder="Export puts your save code here. Paste a save code and press Import to load it." aria-label="Save code"></textarea><div class="ds" id="sMsg"></div>`,[{l:'Close',c:'gold'}]);
  const bindR=(id,k)=>{const el=$('#'+id);el.oninput=()=>{S.set[k]=+el.value;$('#'+id+'v').textContent=Math.round(el.value*100);AU.init();AU.vol()}};
  bindR('sVol','vol');bindR('sSfx','sfx');bindR('sAmb','amb');

  $('#sNumA').onclick=()=>{S.set.sci=false;openSettings();dirty()};$('#sNumB').onclick=()=>{S.set.sci=true;openSettings();dirty()};
  Object.keys(COS).forEach(k=>{const b=$('#sCos-'+k);if(b)b.onclick=()=>{if(S.cosUnl[k]){S.cos=k;openSettings()}}});
  $('#sSave').onclick=()=>{save(true);$('#sLast').textContent=new Date().toLocaleTimeString()};
  $('#sExp').onclick=()=>{save();const t=$('#sTxt');t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));t.select();try{navigator.clipboard.writeText(t.value).then(()=>$('#sMsg').textContent='Save code copied to clipboard.',()=>$('#sMsg').textContent='Save code selected. Copy it to keep a backup.')}catch(e){$('#sMsg').textContent='Save code selected. Copy it to keep a backup.'}};
  $('#sImp').onclick=()=>{const v=$('#sTxt').value.trim();if(!v){$('#sMsg').textContent='Paste a save code into the box first.';return}
    try{let o;try{o=JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){o=JSON.parse(v)}if(!o||typeof o!=='object'||!('money' in o))throw 0;S=merge(fresh(),migrate(o));sanitize();respawnAll();ensureMissions();save();closeModal();dirty(true);stripSig='';toast('Save imported.','good','check')}

  const m0=S.money,o0={...S.ores},p0={...S.prods},e0=S.stats.earned;simulate(t,true);S.stats.offline+=t;
  const oreG=MIN.filter(m=>(S.ores[m.id]||0)-(o0[m.id]||0)>.5).map(m=>`<span class="req">${img('i:'+m.id)}+${fmt((S.ores[m.id]||0)-(o0[m.id]||0))}</span>`).join('');
  const prG=PROD.filter(p=>(S.prods[p.id]||0)-(p0[p.id]||0)>=1).map(p=>`<span class="req">${img('i:'+p.id)}+${fmt((S.prods[p.id]||0)-(p0[p.id]||0))}</span>`).join('');

   ${S.money>m0?`<div class="card hl"><div class="lbl">Auto-sold</div><div class="big">+$${fmt(S.money-m0)}</div></div>`:''}

   <p class="ds">Raise the cap and efficiency with the Offline Production upgrade.</p>`,[{l:'Collect',c:'gold',f:()=>AU.coin()}]);
}

    for(let i=0;i<10;i++){const x=(i*37+t*.01)%VW,y=60+((i*53+Math.sin(t*.001+i)*10)%70);bx.globalAlpha=.4;P(x,y,1,1,'#fff2b0');bx.globalAlpha=1}}
  if(k===1){fx.lan.forEach(([x,y],i)=>{const f=.18+.06*Math.sin(t*.013+i*2)+.04*Math.sin(t*.031+i);bx.globalAlpha=f;bx.fillStyle='#ffb040';bx.beginPath();bx.arc(x,y+3,20,0,6.283);bx.fill();bx.globalAlpha=f*.8;bx.beginPath();bx.arc(x,y+3,9,0,6.283);bx.fill();bx.globalAlpha=1})}
  if(k===2){fx.drip.forEach((x,i)=>{const p=((t*.0006+i*.37)%1);P(x,99+p*(FLOOR-99),1,2,'#7ae0c0')})}
  if(k===3){const x=((t*.02)%(VW+60))-30;P(x,FLOOR-17,22,9,'#5a4036');P(x,FLOOR-17,22,2,'#8a6a56');P(x+3,FLOOR-20,16,3,'#a07a62');P(x+3,FLOOR-8,4,4,'#2a2a30');P(x+15,FLOOR-8,4,4,'#2a2a30');P(x+5,FLOOR-21,3,1,'#cbb09a')}
  if(k===4){fx.cry.forEach(([x,y,c],i)=>{bx.globalAlpha=.12+.1*Math.sin(t*.002+i*1.7);bx.fillStyle=c;bx.beginPath();bx.arc(x,y,14,0,6.283);bx.fill()});bx.globalAlpha=1}
  if(k===5){for(let y=0;y<FLOOR-14;y+=3){const o=Math.floor((y+t*.04)%6);P(248,y+o%3,8,1,o<3?'#ffd070':'#ff9a2a')}for(let x=206;x<302;x+=2){P(x,FLOOR-14+Math.round(Math.sin(x*.3+t*.004)),2,1,'#fff2a0')}
    for(let i=0;i<14;i++){const p=((t*.00025*(1+i%3*.3)+i*.071)%1);const x=(i*53+Math.sin(t*.002+i)*6)%VW;P(x,FLOOR-p*FLOOR,1,1,p<.5?'#ffd070':'#ff6a1a')}
    bx.globalAlpha=.08+.03*Math.sin(t*.003);P(0,0,VW,VH,'#ff4010');bx.globalAlpha=1}
  if(k===6){fx.gly.forEach(([x,y],i)=>{const a=.5+.5*Math.sin(t*.0015+i*.9);if(a>.6){bx.globalAlpha=a-.4;P(x,y,6,1,'#ffe070');P(x,y+2,1,4,'#ffe070');P(x+5,y+2,1,4,'#ffe070');P(x+2,y+4,2,1,'#ffe070');bx.globalAlpha=1}})}
  if(k===7){fx.stars.forEach(([x,y,p],i)=>{const a=.5+.5*Math.sin(t*.003*(.5+p)+i);if(a>.3)P(x,y,1,1,a>.85?'#ffffff':'#b080ff')});
    fx.isl.forEach(([x,y,w],i)=>{const yy=y+Math.sin(t*.0012+i)*3;P(x,yy,w,3,'#30224a');P(x+1,yy+3,w-2,2,'#1e1430');P(x+2,yy+5,w-4,2,'#140c28');P(x,yy,w,1,'#6e54a0');P(x+w/2,yy-2,1,2,'#b060ff')})}
}
let lastWrapReg=-1;
function render(t){
  const k=S.reg,bg=buildBg(k);if(lastWrapReg!==k){lastWrapReg=k;$('#sceneWrap').style.background=REG[k].wall[0]}bx.drawImage(bg.cv,0,0);drawOverlay(k,t,bg.fx);
  // crew row
  const owned=CREW.filter(c=>(S.crew[c.id]||0)>0);
  owned.forEach((c,i)=>{const f=Math.floor(t/(c.t==='w'?260:180)+i)%2;const sp=spriteCv(crewKey(c,f));if(!sp)return;const n=owned.length,x=Math.round(14+i*(292/Math.max(n,1))+ (292/Math.max(n,1))/2-sp.width/2),y=FLOOR-sp.height-26;bx.drawImage(sp,x,y);
    if(c.t==='w'&&f===1&&Math.floor(t/260+i)%4===1){bx.fillStyle='#ffd070';bx.fillRect(x+15,y+11,1,1)}});
  // deposits
  const now=performance.now();
  deps.forEach((d,i)=>{if(!d)return;const sl=SLOTS[i];
    if(d.dead){if(now>=d.resp)spawn(i);return}
    const sp=rockSprite(S.reg,d.m,d.v,d.rare);const age=(now-d.born)/250;const sc=age<1?(.4+.6*Math.min(1,age)):1;
    d.shake=Math.max(0,d.shake-.12);const sx=d.shake?Math.round((rnd()-.5)*3*d.shake):0;
    const w=Math.round(sp.width*2*sc),h=Math.round(sp.height*2*sc);const x=Math.round(sl.x-w/2+sx),y=Math.round(sl.y-h);
    bx.fillStyle='#00000055';bx.fillRect(sl.x-22,sl.y-2,44,3);
    bx.drawImage(sp,x,y,w,h);
    // cracks
    const dmg=1-d.hp/d.max;if(dmg>.05){bx.strokeStyle='#0a0606';bx.lineWidth=1;const nc=Math.ceil(dmg*d.cracks.length);bx.beginPath();for(let j=0;j<nc;j++){const s2=d.cracks[j];bx.moveTo(x+s2[0][0]*2*sc,y+s2[0][1]*2*sc);s2.slice(1).forEach(p=>bx.lineTo(x+p[0]*2*sc,y+p[1]*2*sc))}bx.stroke()}
    if(d.flash>0){bx.globalAlpha=d.flash*.55;bx.globalCompositeOperation='lighter';bx.drawImage(sp,x,y,w,h);bx.globalCompositeOperation='source-over';bx.globalAlpha=1;d.flash=Math.max(0,d.flash-.15)}
    if(d.rare){for(let j=0;j<3;j++){const a=(t*.004+j*2.1),px=sl.x+Math.cos(a)*18,py=sl.y-20+Math.sin(a*1.3)*12;const on=Math.sin(t*.01+j*3)>0;bx.fillStyle=on?'#ffffff':'#ffd977';bx.fillRect(Math.round(px),Math.round(py),1,1);if(on){bx.fillRect(Math.round(px)-1,Math.round(py),3,1);bx.fillRect(Math.round(px),Math.round(py)-1,1,3)}}}
    if(MB[d.m].glow){bx.globalAlpha=.15+.08*Math.sin(t*.004+i);bx.fillStyle=MB[d.m].glow;bx.beginPath();bx.arc(sl.x,sl.y-18,22,0,6.283);bx.fill();bx.globalAlpha=1}
    // hp bar
    if(d.hp<d.max||i===hover){const bw=32,bxp=sl.x-16,byp=y-6;bx.fillStyle='#000';bx.fillRect(bxp-1,byp-1,bw+2,4);bx.fillStyle='#3a1010';bx.fillRect(bxp,byp,bw,2);bx.fillStyle=d.rare?'#ffd977':'#7ad66e';bx.fillRect(bxp,byp,Math.max(1,Math.round(bw*d.hp/d.max)),2)}
    if(i===hover){bx.strokeStyle='#ffffff55';bx.strokeRect(x-1.5,y-1.5,w+3,h+3)}
  });
  // swing
  if(FX.swing){const a=(now-FX.swing.t)/130;if(a<1){const sp=spriteCv('p:'+S.pick);bx.save();bx.translate(FX.swing.x+10,FX.swing.y-8);bx.rotate(-1.1+a*1.5);bx.drawImage(sp,-3,-14,16*1.3,16*1.3);bx.restore()}else FX.swing=null}
  // particles
  for(const p of FX.parts){bx.globalAlpha=Math.min(1,p.l*2);bx.fillStyle=p.c;bx.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s)}bx.globalAlpha=1;
  // blit
  const sh=FX.shake>0?Math.round((rnd()-.5)*FX.shake*scale):0;
  dctx.setTransform(1,0,0,1,0,0);dctx.imageSmoothingEnabled=false;dctx.drawImage(buf,sh,sh*.5,cvs.width,cvs.height);
  // floating text (hi-res)
  const fs=Math.max(14,Math.round(9*scale));dctx.textAlign='center';dctx.lineJoin='round';
  for(const f of FX.floats){const sz=f.big?fs*1.25:fs;dctx.font=`600 ${Math.round(sz)}px ${fontFam}`;dctx.globalAlpha=Math.min(1,f.l*2);dctx.lineWidth=Math.max(2,scale*1.2);dctx.strokeStyle='#000';const X=f.x*scale,Y=f.y*scale;dctx.strokeText(f.t,X,Y);dctx.fillStyle=f.c;dctx.fillText(f.t,X,Y)}dctx.globalAlpha=1;
}
const fontFam="'VT323',ui-monospace,monospace";

/* =========================================================================
   INPUT
   ========================================================================= */
let holding=-1,holdPtr=null;
function slotAt(e){const r=cvs.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*VH;let best=-1,bd=1e9;SLOTS.forEach((s,i)=>{const dx=x-s.x,dy=y-(s.y-20);if(Math.abs(dx)<28&&dy>-30&&dy<26){const d=dx*dx+dy*dy;if(d<bd){bd=d;best=i}}});return best}
cvs.addEventListener('pointerdown',e=>{AU.init();const i=slotAt(e);if(i<0)return;e.preventDefault();holding=i;holdPtr=e.pointerId;try{cvs.setPointerCapture(e.pointerId)}catch(_){}tryHit()});
cvs.addEventListener('pointermove',e=>{const i=slotAt(e);hover=i;if(holding>=0&&i>=0)holding=i});
const stopHold=()=>{holding=-1};cvs.addEventListener('pointerup',stopHold);cvs.addEventListener('pointercancel',stopHold);cvs.addEventListener('pointerleave',()=>{hover=-1;stopHold()});
function tryHit(){const now=performance.now()/1000;if(now<nextHitT)return;const d=deps[holding];if(!d||d.dead)return;if(hitSlot(holding,true))nextHitT=now+C.cd}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,textarea,button')&&$('#modal').hidden){e.preventDefault();AU.init();const i=deps.findIndex(d=>d&&!d.dead);if(i>=0){const now=performance.now()/1000;if(now>=nextHitT&&hitSlot(i,true))nextHitT=now+C.cd}}if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;AU.init();const f=ACT[a.dataset.act];if(f)f(a.dataset,a)});
$('#btnSet').onclick=()=>{AU.init();AU.ui();openSettings()};
$('#btnMute').onclick=()=>{AU.init();S.set.mute=!S.set.mute;AU.vol();refreshMuteIcon()};
$('#autoBtn').onclick=()=>ACT.autoMine();
// tooltips
const tip=$('#tip');let tipEl=null;
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const el=e.target.closest('[data-tip]');if(!el||!el.dataset.tip){tip.hidden=true;tipEl=null;return}tipEl=el;tip.innerHTML=el.dataset.tip;tip.hidden=false});
document.addEventListener('pointermove',e=>{if(tip.hidden)return;const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+16;if(x+w>innerWidth-8)x=e.clientX-w-10;if(y+h>innerHeight-8)y=e.clientY-h-10;tip.style.left=x+'px';tip.style.top=y+'px'});
document.addEventListener('pointerout',e=>{if(tipEl&&!tipEl.contains(e.relatedTarget)){tip.hidden=true;tipEl=null}});

/* =========================================================================
   LOOPS & BOOT
   ========================================================================= */
let lastFrame=performance.now(),lastLogic=performance.now(),uiT=0,achT=0,saveT=0,autoFT=0;
function frame(t){
  const dt=Math.min(.1,(t-lastFrame)/1000);lastFrame=t;
  if(holding>=0)tryHit();
  FX.upd(dt);
  autoFT+=dt;if(autoFT>1.4&&C.ops>0){autoFT=0;const owned=CREW.filter(c=>(S.crew[c.id]||0)>0).length;if(owned)FX.float(20+rnd()*280,FLOOR-50,'+'+fmt(C.ops*1.4)+' ore','#9fd8ff',false)}
  try{render(t)}catch(e){console.error(e)}
  requestAnimationFrame(frame);
}
function tickLogic(){
  const now=performance.now();let dt=(now-lastLogic)/1000;lastLogic=now;if(dt<=0)return;
  if(dt>600){offlineGain(dt)}else if(dt>2){simulate(dt,false)}else{calc();logic(dt,false)}
  uiT+=dt;achT+=dt;saveT+=dt;
  if(achT>=1){achT=0;checkAch();ensureMissions()}
  if(saveT>=15){saveT=0;save()}
}
function uiLoop(){if(needBuild)build();runBinds(binds);runBinds(gbinds);buildStrip();tabDots()}
function boot(){
  const had=load();calc();respawnAll();ensureMissions();updDepth();
  document.querySelectorAll('[data-ico]').forEach(el=>el.src=url(el.dataset.ico));$('#brandIco').src=url('p:0');
  buildTabs();initGlobalBinds();resize();window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe($('#sceneWrap'));
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty()});
  build();uiLoop();
  if(had){const away=(Date.now()-S.last)/1000;if(away>30)offlineGain(away)}
  if(!S.set.intro&&$('#modal').hidden)showIntro();
  if(loadMsg)toast(loadMsg,'bad','lock');
  setInterval(tickLogic,100);setInterval(uiLoop,200);requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  window.addEventListener('pagehide',()=>save());window.addEventListener('beforeunload',()=>save());
}
window.ME={spawn,logic,quiet(v){QUIET=v},get S(){return S},C,FX,ACT,simulate,calc,save,load,fmt,deps:()=>deps,hitSlot,checkAch,genMission,prestige:doPrestige,presGain,REG,PICK,CREW,UPG};
boot();
})();
</script>
