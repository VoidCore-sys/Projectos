<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1020">
<title>Penalty Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Teko:wght@500;600;700&display=swap">
<style>
/* PENALTY LEGENDS — broadcast-style UI. Layout: full-screen stage (pixel canvas) with HUD inside the stage box and menu screens layered on top. */
:root {
  color-scheme: dark;
  --night: #0a1020;
  --panel: #111a2e;
  --panel-2: #18243d;
  --line: #2a3a5c;
  --ink: #eef3ff;
  --muted: #95a3c2;
  --gold: #ffc93c;
  --gold-deep: #c98a00;
  --red: #ff4d5a;
  --grass: #3ddc84;
  --sky: #47b4ff;
  --violet: #b07cff;
  --shadow: rgba(3, 6, 14, 0.6);
  --f-display: 'Teko', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
  --f-ui: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--night); color: var(--ink); overflow: hidden; }
body { font-family: var(--f-ui); font-size: 16px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; color: inherit; }
#app { position: fixed; inset: 0; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); background: radial-gradient(ellipse at 50% 120%, #14304a 0%, var(--night) 60%); }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; box-shadow: 0 0 0 1px #000, 0 20px 60px #000a; }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
.menu-open #stage { filter: saturate(0.85) brightness(0.55); }
.menu-open #game { cursor: default; }

/* ---------- generic UI ---------- */
#screens { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; overflow-x: hidden; animation: scrIn .28s ease-out; }
@keyframes scrIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.topbar h2 { font-family: var(--f-display); font-size: 2.6rem; line-height: .8; margin: 0; letter-spacing: .02em; text-transform: uppercase; padding-top: 6px; }
.topbar .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: .85rem; white-space: nowrap; }
.chip b { color: var(--gold); font-variant-numeric: tabular-nums; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6c4, var(--gold) 45%, var(--gold-deep)); box-shadow: inset 0 0 0 2px #a86f00; display: inline-block; }
.btn { appearance: none; border: 0; cursor: pointer; background: var(--panel-2); color: var(--ink); font-family: var(--f-ui); font-weight: 800; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; padding: 10px 18px; border-radius: 3px; box-shadow: inset 0 -3px 0 #0006, 0 0 0 1px var(--line); transition: transform .08s, background .15s, box-shadow .15s; }
.btn:hover, .btn:focus-visible { background: #22325a; outline: none; box-shadow: inset 0 -3px 0 #0006, 0 0 0 2px var(--gold); }
.btn:active { transform: translateY(2px); }
.btn.primary { background: linear-gradient(180deg, #ffd864, var(--gold) 55%, #e8a800); color: #1a1200; box-shadow: inset 0 -3px 0 #a86f00, 0 0 0 1px #6b4700; }
.btn.primary:hover { box-shadow: inset 0 -3px 0 #a86f00, 0 0 0 2px #fff; }
.btn.red { background: linear-gradient(180deg, #ff7a84, var(--red)); color: #200008; box-shadow: inset 0 -3px 0 #a3202c; }
.btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; font-size: .85rem; }
.back { min-width: 44px; }
.panel { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 4px; padding: 14px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.muted { color: var(--muted); }
.lbl { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.big { font-family: var(--f-display); font-size: 2.2rem; line-height: .9; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 2px; font-weight: 800; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: #0b1020; }
.sel { box-shadow: 0 0 0 2px var(--gold), 0 0 24px #ffc93c44 !important; }
.lock { filter: grayscale(.9) brightness(.7); }
.bar { height: 8px; background: #0a1222; border-radius: 2px; overflow: hidden; box-shadow: inset 0 0 0 1px #000; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--sky), var(--grass)); }
.stat { display: grid; grid-template-columns: 82px 1fr 30px; gap: 8px; align-items: center; font-weight: 700; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
.stat span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); }
.pix { image-rendering: pixelated; }
input[type=range] { width: 100%; accent-color: var(--gold); }
input[type=text], select, textarea { background: #0a1222; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font-family: var(--f-ui); font-size: 1rem; font-weight: 600; width: 100%; }
textarea { min-height: 70px; font-size: .8rem; user-select: text; -webkit-user-select: text; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs .btn { padding: 7px 12px; font-size: .9rem; }
.tabs .btn.on { background: var(--gold); color: #1a1200; }

/* ---------- title & main menu ---------- */
.logo { font-family: var(--f-display); font-weight: 700; line-height: .78; text-transform: uppercase; letter-spacing: .01em; font-style: italic; transform: skewX(-6deg); }
.logo .l1 { display: block; font-size: clamp(3.2rem, 10vw, 7.5rem); color: #fff; text-shadow: 4px 4px 0 #0b1020, 0 0 30px #47b4ff55; }
.logo .l2 { display: block; font-size: clamp(3.8rem, 13vw, 10rem); background: linear-gradient(180deg, #fff3b8 0%, var(--gold) 45%, #d48a00 55%, #ffd864 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(5px 5px 0 #0b1020); }
.title-screen { align-items: center; justify-content: center; text-align: center; gap: 22px; background: radial-gradient(ellipse at center, #0a102000 30%, #0a1020cc 100%); }
.press { font-weight: 800; letter-spacing: .3em; text-transform: uppercase; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.menu-main { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 24px; align-items: start; }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.mbtn { display: flex; align-items: center; gap: 14px; text-align: left; padding: 10px 18px 10px 14px; background: linear-gradient(90deg, #18243dee, #111a2ecc); border: 0; border-left: 5px solid var(--line); color: var(--ink); cursor: pointer; transform: skewX(-8deg); transition: transform .12s, border-color .12s, background .12s; }
.mbtn > * { transform: skewX(8deg); }
.mbtn .n { font-family: var(--f-display); font-size: 2rem; line-height: .8; text-transform: uppercase; padding-top: 4px; }
.mbtn .d { font-size: .82rem; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
.mbtn:hover, .mbtn:focus-visible { border-left-color: var(--gold); background: linear-gradient(90deg, #22325aee, #18243dcc); transform: skewX(-8deg) translateX(6px); outline: none; }
.mbtn.hero { border-left-color: var(--gold); background: linear-gradient(90deg, #3a2c00ee, #18243dcc); }
.mbtn .ico { width: 34px; height: 34px; flex: none; display: grid; place-items: center; }
.subrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 6px; }
.subrow .btn { padding: 9px 4px; font-size: .9rem; }
.feature { display: flex; flex-direction: column; gap: 12px; }
.lvl { display: flex; align-items: center; gap: 10px; }
.lvl .num { font-family: var(--f-display); font-size: 2.4rem; line-height: .8; color: var(--gold); padding-top: 4px; }

/* ---------- cards ---------- */
.card { position: relative; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 4px; padding: 12px; cursor: pointer; transition: transform .1s, box-shadow .15s; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--gold); }
.card .por { width: 100%; aspect-ratio: 1; background: radial-gradient(circle at 50% 30%, #2b416b, #121a2e 70%); border-radius: 3px; image-rendering: pixelated; max-width: 100%; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 1.7rem; line-height: .85; text-transform: uppercase; padding-top: 4px; }
.card .price { position: absolute; top: 8px; right: 8px; }
.thumb { width: 100%; aspect-ratio: 16/9; border-radius: 3px; image-rendering: pixelated; background: #0a1222; object-fit: cover; max-width: 100%; }
.charrow { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.charrow .card { padding: 8px; }
.charrow .card h3 { font-size: 1.3rem; }
.tierchips { display: flex; gap: 6px; flex-wrap: wrap; }
.tierchips .btn { min-width: 120px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--f-ui); }
#hud .pe { pointer-events: auto; }
.sb { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; filter: drop-shadow(0 4px 10px #0009); }
.sb .tm { display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, #1c2a48, #101a30); padding: 4px 12px; min-width: 110px; }
.sb .tm.b { flex-direction: row-reverse; }
.sb .crest { width: 22px; height: 26px; clip-path: polygon(0 0, 100% 0, 100% 62%, 50% 100%, 0 62%); flex: none; }
.sb .nm { font-family: var(--f-display); font-size: 1.7rem; line-height: .8; padding-top: 4px; letter-spacing: .03em; }
.sb .sc { background: var(--gold); color: #1a1200; font-family: var(--f-display); font-size: 2.2rem; line-height: .8; padding: 6px 12px 0; min-width: 84px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kmk { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; }
.kmk .side { display: flex; gap: 3px; background: #0b1222cc; padding: 3px 5px; border-radius: 2px; }
.kmk i { width: 10px; height: 10px; border-radius: 50%; background: #2a3a5c; box-shadow: inset 0 0 0 1px #000; }
.kmk i.g { background: var(--grass); }
.kmk i.m { background: var(--red); }
.kmk i.now { box-shadow: 0 0 0 2px var(--gold); }
.round { position: absolute; top: 66px; left: 50%; transform: translateX(-50%); font-weight: 800; letter-spacing: .14em; font-size: .8rem; text-transform: uppercase; background: #0b1222cc; padding: 2px 10px; white-space: nowrap; }
.ncard { position: absolute; bottom: 10px; display: flex; align-items: center; gap: 8px; background: linear-gradient(90deg, #101a30ee, #101a3088); padding: 6px 12px 6px 6px; border-left: 4px solid var(--gold); max-width: 46%; }
.ncard.l { left: 10px; }
.ncard.r { right: 10px; flex-direction: row-reverse; text-align: right; border-left: 0; border-right: 4px solid var(--sky); background: linear-gradient(270deg, #101a30ee, #101a3088); }
.ncard img { width: 40px; height: 40px; image-rendering: pixelated; background: #1c2a48; border-radius: 2px; }
.ncard .t1 { font-family: var(--f-display); font-size: 1.35rem; line-height: .8; padding-top: 3px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ncard .t2 { font-size: .72rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.hint { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); background: #0b1222dd; padding: 5px 14px; border-radius: 2px; font-weight: 700; font-size: .92rem; letter-spacing: .03em; white-space: nowrap; max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.hint kbd { background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px; padding: 0 5px; border-radius: 2px; font-family: inherit; font-size: .82rem; color: var(--gold); }
.power { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 46%; background: #0b1222dd; border: 2px solid #000; box-shadow: 0 0 0 1px var(--line); }
.power .z { position: absolute; left: 0; right: 0; }
.power .fill { position: absolute; left: 2px; right: 2px; bottom: 2px; background: linear-gradient(0deg, var(--grass), var(--gold) 70%, var(--red)); }
.power .lab { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: .7rem; letter-spacing: .1em; }
.tech { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; }
.tech .btn { padding: 5px 8px; font-size: .78rem; text-align: left; min-width: 104px; display: flex; gap: 6px; align-items: center; }
.tech .btn .k { color: var(--gold); font-size: .7rem; }
.tech .btn.on { background: var(--gold); color: #1a1200; }
.tech .btn.on .k { color: #5a3e00; }
.curl { background: #0b1222dd; padding: 5px 8px; border: 1px solid var(--line); border-radius: 3px; }
.curl .lbl { font-size: .62rem; }
.popup { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: clamp(2rem, 7vw, 4.6rem); line-height: .85; text-transform: uppercase; white-space: nowrap; color: #fff; text-shadow: 3px 3px 0 #0b1020, 0 0 24px #000; animation: pop 1.3s ease-out forwards; font-style: italic; }
.popup.goal { color: var(--gold); font-size: clamp(2.6rem, 10vw, 6.4rem); }
.popup.save { color: var(--sky); }
.popup.miss, .popup.post { color: var(--red); }
.popup.speed { top: 48%; font-size: clamp(1.4rem, 4vw, 2.4rem); color: #fff; animation-delay: .15s; opacity: 0; }
.popup.timing-perfect { color: var(--grass); top: 56%; font-size: clamp(1.4rem, 4.5vw, 2.8rem); }
.popup[class*=timing-] { top: 56%; font-size: clamp(1.2rem, 4vw, 2.4rem); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
.wind { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; background: #0b1222cc; padding: 4px 8px; font-weight: 800; font-size: .8rem; }
.wind .arr { width: 18px; height: 18px; display: inline-block; }
.press-bt { position: absolute; top: 8px; right: 8px; }
.heart { position: absolute; top: 40px; left: 10px; color: var(--red); font-weight: 800; font-size: .8rem; letter-spacing: .1em; animation: beat .8s infinite; background: #0b1222cc; padding: 2px 8px; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } }
.banner { position: absolute; left: 0; right: 0; top: 40%; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; pointer-events: none; }
.banner .b1 { font-family: var(--f-display); font-size: clamp(2.4rem, 8vw, 5rem); line-height: .8; text-transform: uppercase; background: var(--gold); color: #1a1200; padding: 10px 40px 0; transform: skewX(-10deg); box-shadow: 0 8px 0 #0b1020; }
.banner .b2 { font-weight: 800; letter-spacing: .2em; text-transform: uppercase; background: #0b1222ee; padding: 3px 14px; }
.wipe { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(115deg, var(--gold) 0 40px, #0b1020 40px 80px); animation: wipe .7s ease-in-out forwards; }
@keyframes wipe { 0% { clip-path: polygon(0 0, 0 0, -20% 100%, -20% 100%); } 45% { clip-path: polygon(0 0, 120% 0, 100% 100%, -20% 100%); } 100% { clip-path: polygon(120% 0, 120% 0, 100% 100%, 100% 100%); } }
.intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8%; gap: 8px; background: linear-gradient(0deg, #0a1020dd, #0a102000 55%); }
.intro .vs { display: flex; align-items: center; gap: 18px; font-family: var(--f-display); font-size: clamp(1.8rem, 6vw, 3.4rem); line-height: .8; text-transform: uppercase; }
.intro .vs .x { color: var(--gold); font-size: .7em; }
.intro .st { font-weight: 800; letter-spacing: .2em; text-transform: uppercase; font-size: .85rem; color: var(--muted); text-align: center; }
.privacy { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); background: var(--red); color: #1a0006; padding: 6px 16px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; animation: blink 1s steps(2) infinite; white-space: nowrap; }
.trainhud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.trainhud .chip { font-size: 1rem; }
.kbtn { position: absolute; right: 18px; bottom: 76px; width: 92px; height: 92px; border-radius: 50%; border: 0; background: radial-gradient(circle at 40% 35%, #ffe58a, var(--gold) 50%, #c98a00); color: #1a1200; font-family: var(--f-display); font-size: 1.6rem; line-height: .8; padding-top: 6px; box-shadow: 0 6px 0 #6b4700, 0 0 0 3px #0b1020; touch-action: none; }
.kbtn:active, .kbtn.down { transform: translateY(4px); box-shadow: 0 2px 0 #6b4700, 0 0 0 3px #0b1020; }

/* ---------- modal & toast ---------- */
.modal-bg { position: absolute; inset: 0; background: #050a16cc; display: grid; place-items: center; pointer-events: auto; padding: 16px; z-index: 30; animation: scrIn .2s; }
.modal { width: min(560px, 100%); max-height: 100%; overflow: auto; }
.modal h2 { font-family: var(--f-display); font-size: 2.6rem; line-height: .85; margin: 4px 0 10px; text-transform: uppercase; }
#toast { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 40; pointer-events: none; }
#toast div { background: var(--gold); color: #1a1200; font-weight: 800; padding: 7px 16px; letter-spacing: .04em; animation: scrIn .25s; box-shadow: 0 6px 18px #0008; text-transform: uppercase; font-size: .9rem; }
.res-score { font-family: var(--f-display); font-size: clamp(3rem, 10vw, 6rem); line-height: .8; display: flex; align-items: center; gap: 20px; justify-content: center; }
.res-title { font-family: var(--f-display); font-size: clamp(2.6rem, 9vw, 5rem); line-height: .8; text-transform: uppercase; text-align: center; font-style: italic; }
.win { color: var(--gold); }
.lose { color: var(--red); }
.bracket { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.bracket .rd { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; min-width: 180px; }
.match { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font-weight: 700; font-size: .9rem; }
.match div { display: flex; justify-content: space-between; padding: 4px 8px; gap: 8px; }
.match div + div { border-top: 1px solid var(--line); }
.match .w { color: var(--gold); }
.match.me { box-shadow: 0 0 0 2px var(--gold); }
.zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 100%; max-width: 260px; aspect-ratio: 7.32 / 2.44; border: 3px solid #fff; border-bottom: 0; padding: 3px; }
.zones div { display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
table.lb { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.lb td { padding: 5px 6px; border-bottom: 1px solid var(--line); font-weight: 700; }
table.lb tr.me td { color: var(--gold); }
.trophy { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; text-align: center; font-size: .72rem; font-weight: 800; text-transform: uppercase; }
.swatch { width: 30px; height: 30px; border-radius: 3px; border: 2px solid #0008; cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 2px var(--gold); }
.fps { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: .7rem; color: #9fe8ff; z-index: 50; pointer-events: none; }
@media (max-width: 760px) {
  .menu-main { grid-template-columns: 1fr; }
  .mbtn .n { font-size: 1.6rem; }
  .topbar h2 { font-size: 2rem; }
  .sb .tm { min-width: 70px; padding: 3px 6px; }
  .sb .nm { font-size: 1.2rem; }
  .sb .sc { font-size: 1.6rem; min-width: 60px; }
  .ncard { display: none; }
  .tech .btn { min-width: 0; padding: 4px 6px; }
  .tech .btn .full { display: none; }
  .tech .btn .short[hidden] { display: inline !important; }
  .tech .curl { width: 92px; }
  .tech { left: 6px; }
}
@media (max-height: 460px) { .tech .btn { padding: 3px 6px; font-size: .7rem; } .tech .curl { padding: 2px 6px; } .kbtn { width: 76px; height: 76px; bottom: 60px; } }

      const s = this.F / Z;

        z: this.r.z * X + this.u.z * Y + this.f.z,

        const m = Math.hypot(n.o.x, n.o.y, n.o.z);
        if (m > 0.7) { n.o.x *= 0.7 / m; n.o.y *= 0.7 / m; n.o.z *= 0.7 / m; }
      }
    }
    draw(buf, cam, col, alpha) {
      const pr = this.nodes.map((n) => cam.project({ x: n.r.x + n.o.x, y: Math.max(0, n.r.y + n.o.y), z: n.r.z + n.o.z }));
      for (const [a, b] of this.lines) {
        const A = pr[a], B = pr[b];
        if (A.z <= 0 || B.z <= 0) continue;
        buf.line(A.x, A.y, B.x, B.y, col, alpha);
      }
    }
  }

  class Scene {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas ? canvas.getContext('2d') : null;
      this.cam = new PL.Camera(480, 270);
      this.time = 0;
      this.particles = [];
      this.sparks = [];
      this.fireworks = [];
      this.rain = [];
      this.crowd = { mood: 'idle', t: 0, side: null };
      this.net = new NetMesh();
      this.ball = new PL.Ball();
      this.shooter = null; this.keeper = null; this.extras = [];
      this.overlay = { aim: null, ring: null, guide: null, keeperMark: null, tell: null };
      this.shake = 0; this.flash = 0; this.lightning = 0;
      this.screenInfo = null; this.boardMsg = null;
      this.teamColors = ['#1e5bd8', '#d8262e'];
      this.camPreset = 'penalty';
      this.crowdTimer = 0;
      this.ballSkin = PL.Data.BALLS[0];
      this.effect = PL.Data.EFFECTS[0];
      this.referee = { P: Pose.make({ x: 5.0, z: 6.8, yaw: -2.2 }), app: { skin: PL.Data.SKIN[2], hair: 'bald', hairC: '#1b1410', beard: false, kit: { p: '#1c1c22', s: '#e8ff4d', pattern: 'solid', shorts: '#1c1c22', socks: '#1c1c22' }, boots: { color: '#111', accent: '#fff' }, height: 1.0 } };
      this.assistant = { P: Pose.make({ x: -6.6, z: 11.2, yaw: Math.PI / 2 + 0.5, spR: 0.5, saR: 0.4, eR: 0.3 }), app: { skin: PL.Data.SKIN[0], hair: 'short', hairC: '#6b4423', kit: { p: '#1c1c22', s: '#e8ff4d', pattern: 'solid', shorts: '#1c1c22', socks: '#1c1c22' }, boots: { color: '#111', accent: '#fff' }, height: 0.98 } };
      this.whistleT = -10;
      this.resize(480, 270);
    }
    resize(W0, H0) {
      this.W = W0; this.H = H0;
      if (this.canvas) { this.canvas.width = W0; this.canvas.height = H0; }
      this.frame = new PL.PixBuf(W0, H0);
      this.scratch = new PL.PixBuf(W0, H0);
      this.crowdLayer = new Uint32Array(W0 * H0);
      this.crowdTimer = 0;
      this.imageData = this.ctx ? new ImageData(new Uint8ClampedArray(this.frame.data.buffer), W0, H0) : null;
      this.setCamera(this.camPreset);
      this.rain = [];
    }
    setStadium(def) {
      if (!this.stadium || this.stadium.st.id !== def.id) this.stadium = new PL.Stadium(def);
      this.crowdTimer = 0; this.rain = [];
    }
    setTeams(a, b) { this.teamColors = [a, b]; this.crowdTimer = 0; }
    setCamera(name) {
      this.camPreset = name;
      const c = PL.CAM[name] || PL.CAM.penalty;
      this.cam.set(this.W, this.H, c.pos, c.pitch, c.zoom, c.yaw || 0);
      this.crowdTimer = 0;
    }
    crowdReact(mood, side) { this.crowd = { mood, t: 0, side }; this.crowdTimer = 0; }
    whistle() { this.whistleT = this.time; }
    addShake(a) { if (PL.Save.data.settings.shake) this.shake = Math.max(this.shake, a); }

    /* ---------------- particles ---------------- */
    burst(type, p, n, opts = {}) {
      for (let i = 0; i < n; i++) {
        const sp = opts.speed || 3;
        const v = { x: U.rand(-1, 1) * sp + (opts.dir ? opts.dir.x : 0), y: U.rand(0.3, 1.2) * sp + (opts.dir ? opts.dir.y : 0), z: U.rand(-1, 1) * sp + (opts.dir ? opts.dir.z : 0) };
        let col;
        if (type === 'grass') col = C.hex(U.choice(['#3f8f34', '#5aa944', '#7a5a32', '#2f6f2a']));
        else if (type === 'spark') col = C.hex(U.choice(opts.colors || ['#ffffff', '#fff27a', '#ffd23a']));
        else if (type === 'confetti') col = C.hex(U.choice(opts.colors || ['#ff3b3b', '#ffe14d', '#3fa7ff', '#36e07a', '#ffffff', '#ff5fa2']));
        else if (type === 'splash') col = C.hex('#cfe0ee');
        else col = C.hex('#e8e8e0');
        this.particles.push({ type, p: { x: p.x, y: p.y, z: p.z }, v, life: opts.life || U.rand(0.4, 0.9), age: 0, col, size: opts.size || 1, ph: Math.random() * 6 });
      }
    }
    confetti(n = 160) {
      for (let i = 0; i < n; i++) this.burst('confetti', { x: U.rand(-8, 8), y: U.rand(5, 9), z: U.rand(2, 14) }, 1, { speed: 0.6, life: U.rand(3, 5), colors: [this.teamColors[0], '#ffffff', '#ffe14d', this.teamColors[0]] });
    }
    firework() {
      const x = U.rand(this.W * 0.1, this.W * 0.9), y = U.rand(8, this.H * 0.3);
      const cols = U.choice([['#ffe14d', '#ffffff'], ['#ff5fa2', '#ffd6f0'], ['#3fa7ff', '#c9f0ff'], ['#36e07a', '#e8ffe8'], ['#ff7a1a', '#fff0c0']]);
      for (let i = 0; i < 46; i++) {
        const a = (i / 46) * Math.PI * 2, s = U.rand(18, 34);
        this.fireworks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: U.rand(0.9, 1.5), age: 0, col: C.hex(U.choice(cols)) });
      }
      if (PL.Audio) PL.Audio.sfx('firework');
    }

    update(dt) {
      this.time += dt;
      this.crowd.t += dt;
      this.net.update(dt, this.ball);
      for (const p of this.particles) {
        p.age += dt;
        if (p.type === 'confetti') { p.v.y = -1.2; p.p.x += Math.sin(this.time * 3 + p.ph) * dt * 0.8; }
        else p.v.y -= 9.8 * dt;
        p.p.x += p.v.x * dt; p.p.y += p.v.y * dt; p.p.z += p.v.z * dt;
        if (p.p.y < 0) { p.p.y = 0; p.v.y *= -0.3; p.v.x *= 0.5; p.v.z *= 0.5; }
      }
      this.particles = this.particles.filter((p) => p.age < p.life);
      for (const f of this.fireworks) { f.age += dt; f.vy += 20 * dt; f.vx *= 0.97; f.vy *= 0.97; f.x += f.vx * dt; f.y += f.vy * dt; }
      this.fireworks = this.fireworks.filter((f) => f.age < f.life);
      this.shake = Math.max(0, this.shake - dt * 2.5);
      this.flash = Math.max(0, this.flash - dt * 3);
      if (this.stadium && this.stadium.storm) {
        if (this.lightning > 0) this.lightning -= dt;
        else if (Math.random() < dt * 0.05) { this.lightning = 0.25; if (PL.Audio) setTimeout(() => PL.Audio.sfx('thunder'), 600 + Math.random() * 900); }
      }
      // referee whistle pose
      const wt = this.time - this.whistleT;
      const rp = this.referee.P;
      if (wt < 0.9) { rp.spR = 2.3; rp.saR = 0.35; rp.eR = 2.4; rp.spL = 2.9 * (wt < 0.9 ? 1 : 0); rp.saL = 0.3; rp.eL = 0.1; }
      else { rp.spR = 0.1; rp.saR = 0.15; rp.eR = 0.3; rp.spL = 0.1; rp.saL = 0.15; rp.eL = 0.3; }
    }

    /* ---------------- drawing helpers ---------------- */
    drawCharacter(P, app) {
      const s = this.scratch;
      s.clearBox();
      const J = PL.renderChar(s, this.cam, P, app);
      s.outline();
      this.frame.compositeFrom(s);
      return J;
    }
    shadowAt(x, z, size, strength = 0.6) {
      const p = this.cam.project({ x, y: 0, z });
      if (p.z <= 0) return;
      this.frame.ellipseShade(p.x, p.y, size * p.s, size * p.s * 0.28, strength);
    }
    drawGoalFrame() {
      const cam = this.cam, f = this.frame;
      const white = PL.pal('#f4f4f0');
      const PX = PL.Physics.PX, BAR = PL.Physics.BAR_Y, Z = W.GOAL_Z;
      const seg = (a, b, r) => {
        const A = cam.project(a), B = cam.project(b);
        if (A.z <= 0 || B.z <= 0) return;
        const rr = Math.max(0.7, r * A.s);
        f.capsule(A.x, A.y, B.x, B.y, rr + 0.9, { base: C.hex('#2a2a30'), hi: C.hex('#2a2a30'), sh: C.hex('#2a2a30') });
        f.capsule(A.x, A.y, B.x, B.y, rr, white);
      };
      // back stanchions
      const gr = C.hex('#9aa0a8');
      for (const s of [-1, 1]) {
        const a = cam.project({ x: s * PX, y: BAR, z: Z }), b = cam.project({ x: s * PX, y: W.NET_BACK_H, z: PL.Physics.NET_Z }), c = cam.project({ x: s * PX, y: 0, z: PL.Physics.NET_Z });
        f.line(a.x, a.y, b.x, b.y, gr); f.line(b.x, b.y, c.x, c.y, gr);
      }
      seg({ x: -PX, y: 0, z: Z }, { x: -PX, y: BAR, z: Z }, W.POST_R);
      seg({ x: PX, y: 0, z: Z }, { x: PX, y: BAR, z: Z }, W.POST_R);
      seg({ x: -PX, y: BAR, z: Z }, { x: PX, y: BAR, z: Z }, W.POST_R);
    }
    drawBall(ball) {
      const cam = this.cam, f = this.frame;
      const p = cam.project(ball.p);
      if (p.z <= 0) return;
      const r = Math.max(1.2, W.BALL_R * p.s);
      const base = PL.pal(this.ballSkin.base), patch = PL.pal(this.ballSkin.patch);
      const O = ball.ori, cr = cam.r, cu = cam.u, cf = cam.f;
      const L = { x: -0.4, y: 0.8, z: -0.45 };
      if (r >= 2) f.disc(p.x, p.y, r + 1, C.OUT);
      for (let y = Math.floor(p.y - r); y <= Math.ceil(p.y + r); y++) for (let x = Math.floor(p.x - r); x <= Math.ceil(p.x + r); x++) {
        const nx = (x + 0.5 - p.x) / r, ny = (y + 0.5 - p.y) / r, d2 = nx * nx + ny * ny;
        if (d2 > 1) continue;
        const nz = Math.sqrt(1 - d2);
        const N = { x: cr.x * nx - cu.x * ny - cf.x * nz, y: cr.y * nx - cu.y * ny - cf.y * nz, z: cr.z * nx - cu.z * ny - cf.z * nz };
        const lx = V.dot(N, O[0]), ly = V.dot(N, O[1]), lz = V.dot(N, O[2]);
        let mx = -1;
        for (const v of ICO) { const dd = lx * v.x + ly * v.y + lz * v.z; if (dd > mx) mx = dd; }
        const pp = mx > 0.9 ? patch : base;
        const l = V.dot(N, L);
        f.px(x, y, l > 0.55 ? pp.hi : l < -0.1 ? pp.sh : pp.base);
      }
    }
    drawTrail(ball) {
      const fx = this.effect;
      if (!fx || !fx.colors.length || !ball.inPlay || ball.speed() < 7 || ball.held) return;
      const tr = ball.trail, n = tr.length;
      for (let i = 0; i < n - 1; i++) {
        const a = this.cam.project(tr[i]), b = this.cam.project(tr[i + 1]);
        if (a.z <= 0) continue;
        const k = i / n;
        const ci = Math.min(fx.colors.length - 1, Math.floor((1 - k) * fx.colors.length));
        let col = C.hex(fx.colors[fx.cycle ? (i + Math.floor(this.time * 20)) % fx.colors.length : ci]);
        const rr = Math.max(0.6, W.BALL_R * a.s * (0.25 + k * 0.75));
        if (fx.jitter) { const jx = U.rand(-2, 2), jy = U.rand(-2, 2); this.frame.line(a.x + jx, a.y + jy, b.x, b.y, col); }
        else this.frame.capsule(a.x, a.y, b.x, b.y, rr, { base: col, hi: col, sh: col });
        if (fx.sparkle && Math.random() < 0.4) this.frame.px(a.x + U.rand(-4, 4), a.y + U.rand(-4, 4), C.WHITE);
      }
    }
    drawOverlays() {
      const f = this.frame, cam = this.cam, o = this.overlay;
      if (o.guide && o.guide.length) {
        for (let i = 0; i < o.guide.length; i += 1) {
          const p = cam.project(o.guide[i]);
          if (p.z > 0 && i % 2 === 0) f.blend(p.x, p.y, C.hex('#ffffff'), 0.55 - i / o.guide.length * 0.4);
        }
      }
      if (o.aim) {
        const p = cam.project({ x: o.aim.x, y: o.aim.y, z: W.GOAL_Z });
        const c = C.hex(o.aim.color || '#ffe14d'), k = C.OUT;
        const R = Math.max(4, 0.32 * p.s);
        for (let a = 0; a < 24; a++) { const ang = (a / 24) * Math.PI * 2 + this.time; if (a % 3 === 2) continue; f.px(p.x + Math.cos(ang) * R, p.y + Math.sin(ang) * R, c); }
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) for (let i = 2; i < 5; i++) { f.px(p.x + dx * (R + i - 2), p.y + dy * (R + i - 2), c); f.px(p.x + dx * (R + i - 2) + dy, p.y + dy * (R + i - 2) + dx, k); }
        f.px(p.x, p.y, c);
      }
      if (o.keeperMark) {
        const p = cam.project({ x: o.keeperMark.x, y: o.keeperMark.y, z: W.GOAL_Z - 0.2 });
        const c = C.hex('#36e07a');
        for (let i = -3; i <= 3; i++) { f.px(p.x + i, p.y - 3, c); f.px(p.x + i, p.y + 3, c); f.px(p.x - 3, p.y + i, c); f.px(p.x + 3, p.y + i, c); }
      }
      if (o.ring) {
        const p = cam.project(this.ball.p);
        const R = W.BALL_R * p.s * (1 + o.ring.k * 5);
        const col = C.hex(o.ring.k < 0.12 ? '#36e07a' : o.ring.k < 0.3 ? '#ffe14d' : '#ffffff');
        const tgt = W.BALL_R * p.s * 1.6;
        for (let a = 0; a < 48; a++) { const ang = (a / 48) * Math.PI * 2; f.px(p.x + Math.cos(ang) * R, p.y + Math.sin(ang) * R * 0.55, col); }
        for (let a = 0; a < 32; a++) { const ang = (a / 32) * Math.PI * 2; if (a % 2) f.blend(p.x + Math.cos(ang) * tgt, p.y + Math.sin(ang) * tgt * 0.55, C.hex('#36e07a'), 0.8); }
      }
      if (o.tell !== null && o.tell !== undefined && this.keeper) {
        const k = cam.project({ x: this.keeper.x + o.tell * 0.9, y: 2.25, z: W.GOAL_Z - 0.3 });
        const c = C.hex('#ffe14d');
        for (let i = 0; i < 5; i++) { f.px(k.x + o.tell * i, k.y, c); if (i < 3) { f.px(k.x + o.tell * (4 - i), k.y - i, c); f.px(k.x + o.tell * (4 - i), k.y + i, c); } }
      }
    }
    drawParticles() {
      const f = this.frame;
      for (const p of this.particles) {
        const q = this.cam.project(p.p);
        if (q.z <= 0) continue;
        const sz = Math.max(1, Math.round(0.04 * q.s * p.size));
        if (p.type === 'confetti') { const fl = Math.sin(this.time * 10 + p.ph) > 0; f.rect(q.x, q.y, fl ? 2 : 1, fl ? 1 : 2, p.col); }
        else f.rect(q.x, q.y, sz, sz, p.col);
      }
      for (const fw of this.fireworks) { const a = 1 - fw.age / fw.life; f.blend(fw.x, fw.y, fw.col, a); f.blend(fw.x + 1, fw.y, fw.col, a * 0.5); }
    }
    drawWeather(dt) {
      const st = this.stadium;
      if (!st || !st.st.rain) return;
      const f = this.frame;
      if (this.rain.length < 260) for (let i = this.rain.length; i < 260; i++) this.rain.push({ x: Math.random() * this.W, y: Math.random() * this.H, l: U.rand(3, 8), s: U.rand(260, 420), a: U.rand(0.25, 0.55) });
      const c = C.hex('#c8d4e2');
      for (const r of this.rain) {
        r.y += r.s * dt; r.x -= r.s * 0.18 * dt;
        if (r.y > this.H) { r.y = -10; r.x = Math.random() * (this.W + 60); if (Math.random() < 0.5) this.splashes = (this.splashes || 0) + 1; }
        f.line(r.x, r.y, r.x - r.l * 0.18, r.y + r.l, c, r.a);
      }
      for (let i = 0; i < 6; i++) {
        const x = Math.random() * this.W, y = this.H * U.rand(0.62, 1);
        f.blend(x, y, c, 0.7); f.blend(x - 1, y - 1, c, 0.4); f.blend(x + 1, y - 1, c, 0.4);
      }
      if (this.lightning > 0) {
        const a = this.lightning > 0.15 ? 0.55 : 0.2;
        for (let i = 0; i < f.data.length; i++) { const d = f.data[i]; f.data[i] = C.mix(d, 0xffffffff, a); }
      }
    }

    render(dt = 0) {
      if (!this.stadium) return;
      const f = this.frame, cam = this.cam, st = this.stadium;
      const layer = st.layer(cam);
      // crowd animated at ~15 fps
      this.crowdTimer -= dt;
      if (this.crowdTimer <= 0) {
        this.crowdTimer = 1 / 15;
        f.data.set(layer.bg);
        st.drawCrowd(f, layer, this.crowd, this.time, this.teamColors);
        this.crowdLayer.set(f.data);
      } else f.data.set(this.crowdLayer);
      st.drawLightsGlow(f, layer, this.time);
      st.drawScreen(f, layer, this.screenInfo, this.time);
      st.drawBoards(f, layer, this.time, this.boardMsg);
      // corner flags (visible in wide shots)
      for (const s of [-1, 1]) {
        const a = cam.project({ x: s * 34, y: 0, z: 11 }), b = cam.project({ x: s * 34, y: 1.5, z: 11 });
        if (a.z > 0 && a.x > -5 && a.x < this.W + 5) {
          f.line(a.x, a.y, b.x, b.y, C.hex('#f2f2f2'));
          const fl = Math.max(2, 0.35 * b.s);
          for (let y = 0; y < fl; y++) for (let x = 0; x < fl * 1.4; x++) f.px(b.x + x + 1 + Math.sin(this.time * 8 + x) * 0.6, b.y + y, (x + y) % 2 ? C.hex('#ff3b3b') : C.hex('#ffe14d'));
        }
      }
      // shadows
      const ball = this.ball;
      if (this.keeper) this.shadowAt(this.keeper.x, PL.Keeper.KZ, 0.55, 0.65);
      if (this.shooter) this.shadowAt(this.shooter.pos.x, this.shooter.pos.z, 0.5, 0.65);
      this.shadowAt(this.referee.P.x, this.referee.P.z, 0.45, 0.7);
      this.shadowAt(this.assistant.P.x, this.assistant.P.z, 0.45, 0.7);
      for (const e of this.extras) if (e.shadow) this.shadowAt(e.P.x, e.P.z, 0.45, 0.7);
      if (ball.inPlay || ball.visible !== false) this.shadowAt(ball.p.x, ball.p.z, W.BALL_R * 1.3 * U.clamp(1 - ball.p.y / 6, 0.4, 1), U.clamp(0.5 + ball.p.y * 0.1, 0.5, 0.85));
      // goal: back net, ball inside, frame
      const inNet = ball.p.z > W.GOAL_Z;
      const netCol = C.hex('#f0f2f4');
      if (inNet) { this.drawTrail(ball); this.drawBall(ball); }
      this.net.draw(f, cam, netCol, this.stadium.night ? 0.75 : 0.6);
      this.drawGoalFrame();
      // extras (targets etc. drawn in goal plane)
      for (const e of this.extras) if (e.drawFlat) e.drawFlat(f, cam, this.time);
      // characters sorted by depth (far first)
      const items = [];
      if (this.keeper) items.push({ z: PL.Keeper.KZ, fn: () => this.drawCharacter(this.keeper.P, this.keeper.app) });
      items.push({ z: this.assistant.P.z, fn: () => { const J = this.drawCharacter(this.assistant.P, this.assistant.app); this.drawFlagAt(J.handR); } });
      items.push({ z: this.referee.P.z, fn: () => this.drawCharacter(this.referee.P, this.referee.app) });
      for (const e of this.extras) if (e.P) items.push({ z: e.P.z, fn: () => this.drawCharacter(e.P, e.app) });
      if (this.shooter) items.push({ z: this.shooter.pos.z, fn: () => this.drawCharacter(this.shooter.P, this.shooter.app) });
      if (!inNet) items.push({ z: ball.p.z + 0.05, fn: () => { this.drawTrail(ball); this.drawBall(ball); } });
      items.sort((a, b) => b.z - a.z);
      for (const it of items) it.fn();
      this.drawParticles();
      this.drawOverlays();
      this.drawWeather(dt);
      st.applyGrade(f);
      if (this.flash > 0) { const a = this.flash * 0.5; for (let i = 0; i < f.data.length; i += 1) f.data[i] = C.mix(f.data[i], 0xffffffff, a); }
      this.present();
    }
    drawFlagAt(hand) {
      const p = this.cam.project(hand);
      if (p.z <= 0) return;

  function careerCreate() {

    return header('Nueva carrera') + `<div class="menu-main" style="grid-template-columns:minmax(0,260px) minmax(0,1fr)">
      <div class="panel col" style="align-items:center"><img class="pix" id="cprev" src="${Art.portrait(prof, D.KITS[0], 160)}" width="160" height="160" alt="Vista previa" style="background:#1c2a48;border-radius:3px">

        <div class="lbl">Piel</div><div class="row">${D.SKIN.map((c) => `<button class="swatch ${q.skin === c ? 'on' : ''}" aria-label="Tono de piel" data-act="cset" data-k="skin" data-v="${c}" style="background:${c}"></button>`).join('')}</div>
        <div class="lbl">Peinado</div><div class="row">${D.HAIR_STYLES.map((h) => `<button class="btn sm ${q.hair === h ? 'sel' : ''}" data-act="cset" data-k="hair" data-v="${h}">${D.HAIR_NAMES[h]}</button>`).join('')}</div>
        <div class="lbl">Color de pelo</div><div class="row">${D.HAIR_COLORS.map((c) => `<button class="swatch ${q.hairC === c ? 'on' : ''}" aria-label="Color de pelo" data-act="cset" data-k="hairC" data-v="${c}" style="background:${c}"></button>`).join('')}
          <button class="btn sm ${q.beard ? 'sel' : ''}" data-act="cset" data-k="beard" data-v="${q.beard ? '' : '1'}">Barba</button></div>
        <div class="row"><span class="lbl">Pie hábil</span><button class="btn sm ${q.foot === 'R' ? 'sel' : ''}" data-act="cset" data-k="foot" data-v="R">Derecho</button><button class="btn sm ${q.foot === 'L' ? 'sel' : ''}" data-act="cset" data-k="foot" data-v="L">Zurdo</button>
          <span class="lbl">Dorsal</span>${[7, 9, 10, 11, 14, 19, 23].map((n) => `<button class="btn sm ${+q.num === n ? 'sel' : ''}" data-act="cset" data-k="num" data-v="${n}">${n}</button>`).join('')}</div>
        <div class="row"><span class="lbl">Festejo</span>${[['jump', 'Salto'], ['airplane', 'Avioncito'], ['slide', 'Rodillas'], ['point', 'Al cielo']].map(([k, n]) => `<button class="btn sm ${q.celeb === k ? 'sel' : ''}" data-act="cset" data-k="celeb" data-v="${k}">${n}</button>`).join('')}</div>
        <button class="btn primary" data-act="ccreate" style="align-self:flex-end;font-size:1.2rem">Firmar primer contrato</button>

  function careerEventCard(ev) {
    const c = S().career;
    const rec = c.events[ev.id];
    const won = rec && rec.won;
    const t = S().tournament;
    const activeHere = t && t.career === ev.id;
    if (ev.kind === 'match') {
      const tm = D.teamById(ev.team);
      return `<div class="card" style="border-top:4px solid ${won ? 'var(--grass)' : 'var(--line)'}"><div class="row" style="justify-content:space-between"><span class="lbl">Partido</span>${tierTag(ev.tier)}</div>
        <h3>vs ${esc(tm.name)}</h3><div class="muted" style="font-weight:700;font-size:.85rem">${esc(D.stadiumById(ev.stadium).name)}</div>
        ${won ? '<span class="tag" style="background:var(--grass)">Ganado</span>' : rec ? `<span class="tag" style="background:var(--red)">Intentos: ${rec.tries}</span>` : ''}

      <button class="btn ${won ? '' : 'primary'} sm" data-act="cplay" data-id="${ev.id}" ${t && !activeHere ? 'disabled' : ''}>${activeHere ? 'Continuar copa' : won ? 'Jugar de nuevo' : 'Jugar copa'}</button>
      ${t && !activeHere ? '<span class="muted" style="font-size:.75rem">Terminá el torneo en curso.</span>' : ''}</div>`;
  }
  const lvlCost = (lv) => 300 * lv;
  function shopItems(tab) {
    const s = S();
    const kit = PL.Game.playerEquip().kit;
    const buyBtn = (cat, id, price, req) => {
      const owned = (s.unlocked[cat] || []).includes(id);
      if (owned) return '<span class="tag" style="background:var(--grass)">Tuyo</span>';
      if (req && s.level < req) return `<span class="tag" style="background:var(--red)">Nivel ${req}</span>`;
      return `<button class="btn primary sm" data-act="buy" data-cat="${cat}" data-id="${id}" ${s.coins < price ? 'disabled' : ''}><i class="coin"></i> ${U.fmt(price)}</button>`;
    };
    if (tab === 'chars') return D.SHOOTERS.map((c) => `<div class="card"><img class="por pix" src="${Art.portrait(c, kit, 128)}" alt="${esc(c.name)}"><h3>${esc(c.name)}</h3>
      <div class="muted" style="font-weight:700;font-size:.8rem">"${esc(c.nick)}" · ${esc(c.nat)} · Pie ${c.foot === 'R' ? 'derecho' : 'izquierdo'}</div>
      <div style="font-weight:800;font-size:.9rem;color:var(--gold)">${D.ABILITIES[c.ability].name}</div><div class="muted" style="font-size:.8rem">${D.ABILITIES[c.ability].desc}</div>
      ${statRows(c.stats)}${buyBtn('chars', c.id, c.price, c.reqLevel)}</div>`).join('');
    if (tab === 'stadiums') return D.STADIUMS.map((st) => `<div class="card"><img class="thumb" src="${Art.stadiumThumb(st.id)}" alt="${esc(st.name)}"><h3>${esc(st.name)}</h3><div class="muted" style="font-size:.85rem;font-weight:600">${esc(st.desc)}</div>${buyBtn('stadiums', st.id, st.price, st.reqLevel)}</div>`).join('');
    const list = D.CATALOG[tab];
    return list.map((it) => {
      let img;
      if (tab === 'kits') img = `<img class="por pix" src="${Art.portrait(PL.Game.currentHero().prof, it, 128)}" alt="">`;
      else img = `<img class="por pix" src="${Art.icon(tab, it)}" alt="" style="padding:14%">`;
      const bonus = it.bonus ? Object.keys(it.bonus).map((k) => `+${it.bonus[k]} ${{ pre: 'Precisión', pow: 'Potencia', con: 'Control', cur: 'Efecto', com: 'Sangre fría', han: 'Blocaje', reach: 'Alcance', ref: 'Reflejos', agi: 'Agilidad' }[k]}`).join(' · ') : '';
      return `<div class="card">${img}<h3>${esc(it.name)}</h3>${bonus ? `<div class="muted" style="font-size:.8rem;font-weight:700">${bonus}</div>` : ''}${buyBtn(tab, it.id, it.price)}</div>`;
    }).join('');
  }
  function controlsHelp() {
    return `<div class="lbl" style="margin-bottom:6px">Controles</div><table class="lb" style="font-size:.88rem">
      <tr><td>Apuntar</td><td>Flechas / WASD · mover el mouse · arrastrar el dedo</td></tr>
      <tr><td>Técnica</td><td>1 Colocado · 2 Potente · 3 Rosca · 4 Picada</td></tr>

      <tr><td>Potencia</td><td>Mantener ESPACIO, clic o botón CHUTAR; soltar para correr</td></tr>
      <tr><td>Golpeo</td><td>Pulsar de nuevo cuando el anillo se cierra (verde = perfecto)</td></tr>
      <tr><td>Paradinha</td><td>R: carrera con pausa que engaña al arquero</td></tr>
      <tr><td>Atajar</td><td>Flechas (+arriba/abajo) · clic o toque en el arco · ESPACIO: quedarse</td></tr>
      <tr><td>Pausa</td><td>ESC / P · botón II</td></tr></table>`;

  function rewardsBlock(r) {
    if (!r) return '';
    return `<div class="panel col"><div class="row" style="justify-content:center;gap:16px">${r.xp ? `<span class="chip">XP <b>+${r.xp}</b></span>` : ''}${r.coins ? `<span class="chip"><i class="coin"></i><b>+${U.fmt(r.coins)}</b></span>` : ''}${r.rep ? `<span class="chip">Reputación <b>+${r.rep}</b></span>` : ''}</div>
      ${(r.levels || []).map((l) => `<div class="win" style="text-align:center;font-weight:800;letter-spacing:.1em">¡SUBISTE A NIVEL ${l}! +150 monedas${S().career.created ? ' · +3 puntos de atributo' : ''}</div>`).join('')}
      ${(r.unlocks || []).map((u) => `<div style="text-align:center;font-weight:800;color:var(--grass)">DESBLOQUEADO · ${esc(u)}</div>`).join('')}
      ${(r.notes || []).map((u) => `<div style="text-align:center;font-weight:800;color:var(--gold)">${esc(u)}</div>`).join('')}</div>`;

  function resultsScreen(p) {
    if (p.training) {
      const tr = p.training;
      const unit = tr.drill === 'power' ? ' km/h' : '';
      return `<div class="col" style="align-items:center;justify-content:center;flex:1;gap:14px;text-align:center">
        <div class="lbl">Entrenamiento terminado</div><div class="res-title">${{ targets: 'Dianas', power: 'Potencia', curl: 'Efecto', free: 'Práctica libre' }[tr.drill]}</div>
        <div class="res-score win">${tr.score}${unit}</div>${tr.record ? '<div class="tag" style="background:var(--gold)">¡Nuevo récord!</div>' : ''}
        <div class="muted" style="font-weight:700">${tr.shots} tiros</div>${rewardsBlock(p.rewards)}
        <div class="row" style="justify-content:center">${p.retry ? `<button class="btn" data-act="retry">Repetir</button>` : ''}<button class="btn primary" data-act="cont" data-to="${p.next || 'training'}">Continuar</button></div></div>`;
    }
    const sum = p.sum, cfg = sum.cfg;
    const mk = (arr, kicks) => arr.map((r) => `<i class="${r === 'goal' ? 'g' : 'm'}"></i>`).join('') + Array(Math.max(0, kicks - arr.length)).fill('<i></i>').join('');
    const K = cfg.suddenOnly ? 0 : cfg.kicks || 5;
    const title = p.mp ? (sum.winner === 'A' ? 'Gana el Jugador 1' : 'Gana el Jugador 2') : sum.won ? '¡Victoria!' : 'Derrota';
    const hs = sum.stats[sum.human];
    return `<div class="col" style="align-items:center;gap:12px;flex:1;justify-content:center">
      <div class="lbl">${esc(p.label || 'Resultado')}</div>
      <div class="res-title ${p.mp || sum.won ? 'win' : 'lose'}">${title}</div>
      <div class="res-score"><span style="font-size:.45em;text-align:right">${esc(cfg.teamA.name)}</span><span>${sum.scoreA}</span><span class="muted">-</span><span>${sum.scoreB}</span><span style="font-size:.45em">${esc(cfg.teamB.name)}</span></div>
      <div class="kmk" style="position:static;transform:none"><div class="side">${mk(sum.resA, K)}</div><div class="side">${mk(sum.resB, K)}</div></div>
      ${sum.sudden ? '<span class="tag" style="background:var(--red)">Definido en muerte súbita</span>' : ''}
      <div class="panel row" style="justify-content:space-around;text-align:center;width:min(640px,100%)">
        <div><div class="big">${hs.goals}/${hs.kicks}</div><div class="lbl">Goles</div></div>
        <div><div class="big">${hs.perfect}</div><div class="lbl">Perfectos</div></div>
        <div><div class="big">${hs.maxSpeed}</div><div class="lbl">km/h máx</div></div>
        <div><div class="big">${hs.saves}</div><div class="lbl">Atajadas</div></div></div>
      <div style="width:min(640px,100%)">${rewardsBlock(p.rewards)}</div>
      <div class="row" style="justify-content:center">${p.retry ? '<button class="btn" data-act="retry">Revancha</button>' : ''}<button class="btn primary" data-act="cont" data-to="${p.next || 'main'}">Continuar</button></div></div>`;
  }

  /* ======================= actions ======================= */
  const ACT = {
    start() { A().init(); A().playMusic('menu'); UI.show('main'); },
    go(d) { UI.show(d.to, {}); },
    cont(d) { PL.Game.toMenu(d.to); },
    retry() { PL.Game.retry(); },
    pick(d) {
      const q = UI.params;
      const map = { qchar: 'char', qstad: 'stadium', mpc1: 'c1', mpc2: 'c2', mpstad: 'stadium' };
      if (d.key === 'lchar') { S().equipped.char = d.id; PL.Save.save(); UI.refresh(); return; }
      q[map[d.key]] = d.id; UI.refresh();
    },
    qtier(d) { UI.params.tier = +d.t; UI.refresh(); },
    qkicks(d) { UI.params.kicks = +d.k; UI.refresh(); },
    qstart() { const q = UI.params; PL.Game.startQuick({ char: q.char, tier: q.tier, stadium: q.stadium, kicks: q.kicks }); },
    ttier(d) { UI.params.tier = +d.t; UI.refresh(); },
    train(d, el, e) { e.stopPropagation(); PL.Game.startTraining(d.drill, UI.params.tier || 0); },
    chal(d, el, e) { e.stopPropagation(); if (!PL.Challenges.done(d.id) || el.classList.contains('btn')) PL.Game.startChallenge(d.id); },
    tnew(d) { const def = D.tournamentById(d.id); PL.Tournament.create(def); UI.show('bracket'); },
    tplay() { PL.Game.playTournamentMatch(); },
    tabandon() { UI.modal(`<h2>¿Abandonar el torneo?</h2><p class="muted">Perdés el progreso de este cuadro.</p><div class="row"><button class="btn red" data-act="tabandonyes">Abandonar</button><button class="btn" data-act="closemodal">Cancelar</button></div>`); },
    tabandonyes() { S().tournament = null; PL.Save.save(); UI.closeModal(); UI.refresh(); },
    tclose() { PL.Game.closeTournament(); },
    closemodal() { UI.closeModal(); },
    cset(d) { const q = UI.params; q[d.k] = d.k === 'beard' ? !!d.v : d.k === 'num' ? +d.v : d.v; q.name = ($('#cname') || {}).value || q.name; UI.refresh(); },
    ccreate() {
      const q = UI.params; const name = (($('#cname') || {}).value || '').trim();
      if (name.length < 2) { UI.toast('Escribí un nombre para tu jugador'); A().sfx('error'); return; }
      PL.Career.create(Object.assign({}, q, { name }));
      A().sfx('unlock'); UI.show('career');
    },
    upgrade(d, el, e) { e.stopPropagation(); if (PL.Career.upgrade(d.stat)) { A().sfx('coin'); UI.refresh(); } },
    chooseab() {
      const opts = ['rayo', 'colocador', 'comba', 'picadita', 'hielo', 'engano', 'maestro'];
      UI.modal(`<h2>Habilidad especial</h2><div class="col">${opts.map((k) => `<button class="btn" data-act="abset" data-id="${k}" style="text-align:left"><b style="color:var(--gold)">${D.ABILITIES[k].name}</b><br><span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">${D.ABILITIES[k].desc}</span></button>`).join('')}<button class="btn ghost" data-act="closemodal">Cancelar</button></div>`);
    },
    abset(d) { PL.Career.chooseAbility(d.id); UI.closeModal(); A().sfx('unlock'); UI.refresh(); },
    cplay(d) { PL.Game.playCareerEvent(d.id); },
    careerreset() { UI.modal(`<h2>¿Nueva carrera?</h2><p class="muted">Tu jugador actual y su reputación se pierden (monedas, nivel y objetos se conservan).</p><div class="row"><button class="btn red" data-act="careerresetyes">Empezar de cero</button><button class="btn" data-act="closemodal">Cancelar</button></div>`); },
    careerresetyes() { const c = S().career; c.created = false; c.hero = null; if (S().equipped.char === 'custom') S().equipped.char = 'ferreyra'; if (S().tournament && S().tournament.career) S().tournament = null; PL.Save.save(); UI.closeModal(); UI.show('career'); },
    mpk(d) { UI.params['k' + d.n] = d.id; UI.refresh(); },
    mpgk(d) { UI.params.gk = d.v; UI.refresh(); },
    mpkicks(d) { UI.params.kicks = +d.k; UI.refresh(); },
    mpstart() { PL.Game.startMP(Object.assign({}, UI.params)); },
    tab(d) { UI.params.tab = d.tab; UI.refresh(); },
    buy(d) {
      const s = S();
      let price = 0;
      if (d.cat === 'chars') price = D.shooterById(d.id).price;
      else if (d.cat === 'stadiums') price = D.stadiumById(d.id).price;
      else price = D.itemById(d.cat, d.id).price;
      if (s.coins < price) { A().sfx('error'); return; }
      s.coins -= price;
      PL.Progress.unlock(d.cat, d.id);
      A().sfx('unlock'); UI.toast('Comprado: ' + PL.Progress.unlockName(d.cat, d.id));
      UI.refresh();
    },
    equip(d) { const key = { kits: 'kit', boots: 'boots', gloves: 'gloves', effects: 'effect', balls: 'ball' }[d.cat]; S().equipped[key] = d.id; PL.Save.save(); UI.refresh(); },
    charlvl(d) {
      const lv = PL.Game.charLevel(d.id), cost = lvlCost(lv);
      if (S().coins < cost) { A().sfx('error'); UI.toast('Monedas insuficientes'); return; }
      S().coins -= cost; S().charLevels[d.id] = lv + 1; PL.Save.save(); A().sfx('levelup'); UI.refresh();
    },
    toggle(d) { const s = S().settings; s[d.k] = !s[d.k]; PL.Save.save(); UI.refresh(); },

        <label class="col" style="gap:2px"><span class="lbl">Música</span><input type="range" min="0" max="1" step="0.05" value="${s.music}" data-inp="vol" data-k="music"></label>
        <div class="panel" style="font-size:.9rem">${PL.UI && document.querySelector('#screens') ? '' : ''}<div class="lbl">Recordá</div><div class="muted" style="font-weight:600">Pulsá cuando el anillo se cierre: un golpeo perfecto quita casi todo el error. Los arqueros analistas recuerdan hacia dónde pateás.</div></div>
        <button class="btn red" data-act="quitask">Abandonar</button></div>`);
    },
    resume() { this.paused = false; PL.UI.closeModal(); PL.Input.reset(); },

    // ----- modes -----
    startQuick(q) {
      const hero = this.heroById(q.char);
      const A_ = PL.Progress.playerTeam(hero);
      const B_ = this.opponent(q.tier, A_.kit.p);
      const st = D.stadiumById(q.stadium);
      this.beginMatch({ teamA: A_, teamB: B_, stadium: st, kicks: q.kicks, control: { A: 'p1', B: 'ai' }, keeperHuman: { A: true, B: false }, title: 'Partido rápido' },
        { mode: 'quick', modeName: 'Partido rápido', tier: q.tier, opp: B_.name, retry: () => this.startQuick(q), next: 'quick' });
    },
    startMP(q) {
      const mk = (n, cid, kid) => {
        const hero = this.heroById(cid);
        const kit = D.itemById('kits', kid) || D.KITS[n - 1];
        const gk = PL.Progress.playerKeeper();
        gk.name = 'Arquero J' + n; gk.look = Object.assign({}, gk.look, { skin: D.SKIN[n === 1 ? 1 : 4], hair: n === 1 ? 'short' : 'buzz' });
        gk.kit = n === 1 ? { p: '#2fbf71', s: '#0f3d26' } : { p: '#ff7a1a', s: '#2a1100' };
        if (q.gk === 'ai') Object.assign(gk, D.keeperById(n === 1 ? 'kovac' : 'berg'), { kit: gk.kit });
        return { id: 'p' + n, name: 'Jugador ' + n, short: 'J' + n, kit: { p: kit.p, s: kit.s, pattern: kit.pattern, shorts: kit.shorts, socks: kit.socks }, hero: hero.prof, heroLevel: hero.level, keeper: gk, equip: { kit, boots: D.BOOTS[0], gloves: D.GLOVES[0], effect: D.EFFECTS[0] }, shooters: [] };
      };
      const tA = mk(1, q.c1, q.k1), tB = mk(2, q.c2, q.k2);
      const hk = q.gk === 'human';
      this.beginMatch({ teamA: tA, teamB: tB, stadium: D.stadiumById(q.stadium), kicks: q.kicks, control: { A: 'p1', B: 'p2' }, keeperHuman: { A: hk, B: hk }, title: 'Duelo local' },
        { mode: 'mp', modeName: '2 Jugadores', tier: 2, opp: 'Jugador 2', retry: () => this.startMP(q), next: 'mp' });
    },
    playTournamentMatch() {
      const t = S().tournament;
      if (!t || t.champion) return;
      const pm = PL.Tournament.playerMatch(t);
      const oppId = pm.a === 'player' ? pm.b : pm.a;
      const B_ = PL.Tournament.team(t, oppId, t.round);
      const A_ = PL.Progress.playerTeam();
      const st = D.stadiumById(t.def.stadiums[Math.min(t.round, t.def.stadiums.length - 1)]);
      const isFinal = t.round === t.bracket.length - 1;
      const tier = t.def.tiers[Math.min(t.round, t.def.tiers.length - 1)];
      const rname = PL.Tournament.roundName(t, t.round);
      this.beginMatch({ teamA: A_, teamB: B_, stadium: st, kicks: t.def.kicks, suddenOnly: t.def.suddenOnly, control: { A: 'p1', B: 'ai' }, keeperHuman: { A: true, B: false }, title: t.name + ' · ' + rname, isFinal },
        {
          mode: 'tournament', modeName: t.name + ' · ' + rname, tier, opp: B_.name, next: 'bracket',
          onEnd: (sum, rewards) => {
            PL.Tournament.recordPlayer(t, sum);
            if (t.champion || t.eliminated) {
              const fr = PL.Tournament.finishRewards(t);
              rewards.xp += fr.xp; rewards.coins += fr.coins; rewards.unlocks = (rewards.unlocks || []).concat(fr.unlocks || []);
              rewards.levels = (rewards.levels || []).concat(fr.levels || []);
              rewards.notes.push(t.champion === 'player' ? '¡CAMPEÓN DE ' + t.name.toUpperCase() + '!' : 'Eliminado en ' + rname.toLowerCase());
              if (t.career) {
                const ev = this.findCareerEvent(t.career);
                if (ev) { const cr = PL.Career.complete(ev, t.champion === 'player'); this.mergeCareer(rewards, cr); }
              }
            } else rewards.notes.push('Avanzás a ' + PL.Tournament.roundName(t, t.round).toLowerCase());
          },
          onAbandon: () => { PL.Tournament.recordPlayer(t, { won: false, scoreA: 0, scoreB: 1 }); },
        });
    },
    closeTournament() {
      const t = S().tournament;
      const to = t && t.career ? 'career' : 'tournaments';
      S().tournament = null; PL.Save.save();
      PL.UI.show(to);
    },
    findCareerEvent(id) { for (const t of D.CAREER) for (const e of t.events) if (e.id === id) return e; return null; },
    mergeCareer(rewards, cr) {
      rewards.rep = (rewards.rep || 0) + cr.rep;
      rewards.unlocks = (rewards.unlocks || []).concat(cr.unlocks || []);
      if (cr.coins) rewards.coins += cr.coins;
      if (cr.tierUp) rewards.notes.push('¡ASCENSO! Nueva etapa: ' + D.CAREER[S().career.tier].name);
      if (cr.legend) rewards.notes.push('¡TE CONVERTISTE EN LEYENDA DEL PENAL!');
    },
    playCareerEvent(id) {
      const ev = this.findCareerEvent(id);
      if (!ev) return;
      if (ev.kind === 'cup') {
        const t = S().tournament;
        if (!t || t.career !== ev.id) PL.Tournament.create({ id: ev.id, name: ev.name, size: ev.size, tiers: ev.tiers, stadiums: ev.stadiums, pool: ev.pool, type: 'Copa de carrera', color: '#ffc93c', reward: { coins: 300 + ev.size * 80, xp: 300 + ev.size * 60 } }, ev.id);
        PL.UI.show('bracket');
        return;
      }
      const A_ = PL.Progress.playerTeam();
      const B_ = D.buildTeam(D.teamById(ev.team), ev.tier);
      this.beginMatch({ teamA: A_, teamB: B_, stadium: D.stadiumById(ev.stadium), kicks: 5, control: { A: 'p1', B: 'ai' }, keeperHuman: { A: true, B: false }, title: 'Carrera · ' + PL.Career.tierDef().name },
        { mode: 'career', modeName: 'Carrera', tier: ev.tier, opp: B_.name, next: 'career', onEnd: (sum, rewards) => { const cr = PL.Career.complete(ev, sum.won); this.mergeCareer(rewards, cr); } });
    },
    startChallenge(id) {
      const ch = D.CHALLENGES.find((c) => c.id === id);
      if (!ch) return;
      if (ch.type === 'training') { this.startTraining(ch.drill, 0, { challenge: ch }); return; }
      const A_ = PL.Progress.playerTeam();
      const B_ = this.opponent(ch.tier, A_.kit.p);
      this.beginMatch({ teamA: A_, teamB: B_, stadium: D.stadiumById(ch.stadium), kicks: 5, suddenOnly: !!ch.suddenOnly, preset: ch.preset, control: { A: 'p1', B: 'ai' }, keeperHuman: { A: true, B: false }, title: 'Desafío · ' + ch.name },
        {
          mode: 'challenge', modeName: 'Desafío: ' + ch.name, tier: ch.tier, opp: B_.name, next: 'challenges', retry: () => this.startChallenge(id),
          onEnd: (sum, rewards) => {
            const hs = sum.stats.A;
            const s = { won: sum.won, goals: hs.goals, misses: hs.misses, saves: hs.saves, topCorners: hs.topCorners, panenkas: hs.panenkas, perfect: hs.perfect };
            if (ch.check(s)) {
              const was = PL.Challenges.done(ch.id);
              const out = PL.Challenges.complete(ch);
              rewards.notes.push(was ? 'Desafío superado otra vez' : '¡DESAFÍO COMPLETADO! +' + ch.reward + ' monedas');
              rewards.unlocks = (rewards.unlocks || []).concat(out.unlocks || []);
              if (!was) A().sfx('unlock');
            } else rewards.notes.push('Desafío no superado: ' + ch.desc);
          },
        });
    },
    startTraining(drill, tier, opts = {}) {
      this.abortActivity();
      PL.UI.hide(); PL.Input.reset();
      this.mode = 'training';
      const ch = opts.challenge;
      const next = ch ? 'challenges' : 'training';
      this.lastCtx = { mode: 'training', next, retry: () => this.startTraining(drill, tier, opts) };
      this.activity = new PL.Training(this.scene, {
        drill, tier, stadium: D.stadiumById('escuela'),
        onEnd: (res) => {
          const rewards = { xp: Math.min(150, res.shots * 6 + (drill === 'power' ? 0 : res.score * 12)), coins: Math.min(120, res.score * (drill === 'power' ? 0.5 : 8)) | 0, notes: [], unlocks: [] };
          PL.Progress.give(rewards);
          if (ch) {
            if (res.score >= ch.goal) {
              const was = PL.Challenges.done(ch.id);
              const out = PL.Challenges.complete(ch);
              rewards.notes.push(was ? 'Objetivo cumplido otra vez' : '¡DESAFÍO COMPLETADO! +' + ch.reward + ' monedas');
              rewards.unlocks = rewards.unlocks.concat(out.unlocks || []);
            } else rewards.notes.push('Objetivo: ' + ch.goal + (drill === 'power' ? ' km/h' : '') + '. ¡Otra vez!');
          }
          PL.Save.saveNow();
          PL.UI.show('results', { training: res, rewards, retry: true, next });
        },
      });
    },
  });

  G.addEventListener('DOMContentLoaded', () => {
    try { Game.init(); } catch (e) { console.error(e); const d = document.getElementById('screens'); if (d) d.innerHTML = '<div class="screen"><h2>Error al iniciar</h2><pre>' + U.esc(e.stack || e) + '</pre></div>'; }
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
